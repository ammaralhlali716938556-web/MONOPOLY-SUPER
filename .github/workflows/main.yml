name: Build MONOPOLY PRO APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    name: 🎲 بناء تطبيق مونوبولي برو (MONOPOLY PRO APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات لعبة MONOPOLY PRO تلقائياً
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonopolyPro"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.monopoly.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.monopoly.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity:1.8.2'
          }
          """

          # 5. AndroidManifest.xml
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_monopoly"
                  android:roundIcon="@drawable/ic_monopoly"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.MonopolyPro">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MONOPOLY PRO</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0E14</color>
              <color name="gold">#F59E0B</color>
              <color name="gold_dark">#D97706</color>
              <color name="lime">#CDDC39</color>
          </resources>
          """

          # 8. Themes
          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MonopolyPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/gold</item>
                  <item name="colorPrimaryVariant">@color/gold_dark</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
                  <item name="android:windowBackground">@color/bg_main</item>
              </style>
          </resources>
          """

          # 9. App Icon (Vector 3D Gold Crown, Dice & Tower)
          files["app/src/main/res/drawable/ic_monopoly.xml"] = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#0B0E14" android:pathData="M50,3 C76,3 97,24 97,50 C97,76 76,97 50,97 C24,97 3,76 3,50 C3,24 24,3 50,3 Z" />
              <path android:fillColor="#F59E0B" android:pathData="M50,6 C74.3,6 94,25.7 94,50 C94,74.3 74.3,94 50,94 C25.7,94 6,74.3 6,50 C6,25.7 25.7,6 50,6 Z" />
              <path android:fillColor="#111723" android:pathData="M50,9 C72.6,9 91,27.4 91,50 C91,72.6 72.6,91 50,91 C27.4,91 9,72.6 9,50 C9,27.4 27.4,9 50,9 Z" />
              <path android:fillColor="#FBBF24" android:pathData="M50,15 L62,35 L76,28 L70,55 L30,55 L24,28 L38,35 Z" />
              <path android:fillColor="#D97706" android:pathData="M50,22 L59,38 L50,50 L41,38 Z" />
              <path android:fillColor="#E2E8F0" android:pathData="M32,60 L50,52 L68,60 L50,68 Z" />
              <path android:fillColor="#CBD5E1" android:pathData="M32,60 L50,68 L50,86 L32,78 Z" />
              <path android:fillColor="#94A3B8" android:pathData="M50,68 L68,60 L68,78 L50,86 Z" />
              <path android:fillColor="#EF4444" android:pathData="M50,58 C51.5,58 52.5,59 52.5,60 C52.5,61.5 51.5,62 50,62 C48.5,62 47.5,61.5 47.5,60 C47.5,59 48.5,58 50,58 Z" />
              <path android:fillColor="#B91C1C" android:pathData="M41,71 C42,71 43,72 43,73 C43,74 42,75 41,75 C40,75 39,74 39,73 C39,72 40,71 41,71 Z" />
              <path android:fillColor="#B91C1C" android:pathData="M59,71 C60,71 61,72 61,73 C61,74 60,75 59,75 C58,75 57,74 57,73 C57,72 58,71 59,71 Z" />
          </vector>
          """

          # 10. Layout
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg_main" />
          </FrameLayout>
          """

          # 11. MainActivity.java
          files["app/src/main/java/com/monopoly/pro/MainActivity.java"] = """package com.monopoly.pro;

          import android.annotation.SuppressLint;
          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              public class WebAppInterface {
                  @JavascriptInterface
                  public void exitApp() {
                      runOnUiThread(() -> finish());
                  }

                  @JavascriptInterface
                  public void setOrientation(String mode) {
                      runOnUiThread(() -> {
                          if ("landscape".equalsIgnoreCase(mode)) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                          } else if ("portrait".equalsIgnoreCase(mode)) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                          } else {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                          }
                      });
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.addJavascriptInterface(new WebAppInterface(), "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          if (view != null) {
                              view.destroy();
                          }
                          recreate();
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView != null) {
                              webView.evaluateJavascript("if (window.handleAndroidBack) { window.handleAndroidBack(); }", null);
                          }
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          """

          # 12. app/src/main/assets/index.html
          files["app/src/main/assets/index.html"] = r'''<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>MONOPOLY PRO</title>
          <style>
          :root {
            --bg-main: #0B0E14;
            --bg-board: #111723;
            --bg-tile: #1B2232;
            --gold: #F59E0B;
            --gold-lt: #FDE68A;
            --gold-dark: #D97706;
            --lime: #CDDC39;
            --lime-bright: #AEEA00;
            --text: #F8FAFC;
            --dim: #94A3B8;
            --p0: #EF4444;
            --p1: #38BDF8;
            --green: #10B981;
            --card-bg: #161D2B;
            --card-modal-bg: linear-gradient(145deg, #1E293B, #0F172A);
            --header-bg: linear-gradient(135deg, #1E293B, #0F172A);
          }
          body.theme-light {
            --bg-main: #ECEFF1;
            --bg-board: #F1F5F9;
            --bg-tile: #FFFFFF;
            --gold: #D97706;
            --gold-lt: #B45309;
            --gold-dark: #92400E;
            --text: #0F172A;
            --dim: #64748B;
            --card-bg: #FFFFFF;
            --card-modal-bg: linear-gradient(145deg, #FFFFFF, #F8FAFC);
            --header-bg: linear-gradient(135deg, #FFFFFF, #E2E8F0);
          }
          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          }
          html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg-main);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
          }
          .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 3px;
            box-sizing: border-box;
            overflow: hidden;
            transition: all 0.3s ease;
          }
          .app-container.landscape-mode {
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 8px;
            padding: 6px;
          }
          .side-panel {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 480px;
            flex-shrink: 0;
            gap: 4px;
          }
          .landscape-mode .side-panel {
            width: 280px;
            max-width: 32vw;
            height: 100%;
            overflow-y: auto;
          }
          .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--header-bg);
            border-radius: 12px;
            border: 1px solid rgba(245, 158, 11, 0.4);
          }
          .header-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
          }
          .header-controls {
            display: flex;
            gap: 4px;
            align-items: center;
          }
          .btn-hdr {
            background: #2D3748;
            border: 1px solid #4B5563;
            color: #E2E8F0;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
          }
          .btn-hdr:active {
            transform: scale(0.96);
          }
          .scoreboard {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
          }
          .p-card {
            background: var(--card-bg);
            border: 2px solid #2B3548;
            border-radius: 10px;
            padding: 4px 7px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
          }
          .p-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
          }
          .p-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            background: #000;
            border: 2px solid #fff;
            flex-shrink: 0;
          }
          .p-details {
            flex: 1;
            margin: 0 5px;
          }
          .p-name {
            font-size: 0.78rem;
            font-weight: 900;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .p-cash {
            font-size: 0.88rem;
            font-weight: 900;
            color: var(--gold-lt);
            line-height: 1.1;
          }
          .p-stats {
            font-size: 0.62rem;
            color: var(--dim);
          }
          .p-badge {
            position: absolute;
            top: -5px;
            left: 6px;
            background: var(--gold);
            color: #000;
            font-size: 0.55rem;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 10px;
          }
          [dir="ltr"] .p-badge {
            left: auto;
            right: 6px;
          }

          /* 3D Board Container */
          .board-container {
            width: 100%;
            max-width: 480px;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1100px;
            perspective-origin: center 60%;
            margin: 0 auto;
          }
          .landscape-mode .board-container {
            max-width: calc(100vh - 16px);
            height: 100%;
          }
          .board-wrapper {
            direction: ltr !important;
            width: 100%;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            background: var(--bg-board);
            border-radius: 14px;
            border: 3px solid var(--gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.85), 0 0 0 4px #5B270A, 0 0 0 7px #D97706;
            display: grid;
            grid-template-columns: 1.28fr repeat(9, 1fr) 1.28fr;
            grid-template-rows: 1.28fr repeat(9, 1fr) 1.28fr;
            gap: 1.5px;
            padding: 2.5px;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
          }
          .board-wrapper.view-3d {
            transform: rotateX(23deg) scale(0.96) translateZ(8px);
            box-shadow: 0 28px 55px rgba(0,0,0,0.95), 0 0 0 5px #5B270A, 0 0 0 8px #D97706;
          }

          /* Tiles Styling */
          .tile {
            direction: rtl;
            background: var(--bg-tile);
            border-radius: 4px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5px 1px;
            overflow: visible;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
          }
          [dir="ltr"] .tile {
            direction: ltr;
          }
          .tile:active {
            filter: brightness(1.2);
          }
          .tile-bar {
            width: 100%;
            height: 5.5px;
            border-radius: 2px;
            flex-shrink: 0;
          }
          .tile-cnt {
            width: 100%;
            height: calc(100% - 7px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1px 0;
          }
          .tile-name {
            font-size: clamp(0.44rem, 1.8vw, 0.58rem);
            font-weight: 800;
            text-align: center;
            line-height: 1.1;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 1px;
            max-width: 95%;
          }
          .tile-price {
            font-size: clamp(0.40rem, 1.6vw, 0.52rem);
            font-weight: 900;
            color: var(--gold-lt);
            margin-top: auto;
          }
          .tile-icon {
            font-size: 0.95rem;
            line-height: 1;
            margin: auto 0;
          }
          .corner-tile {
            background: radial-gradient(circle at center, #1E293B, #101726);
            justify-content: center;
          }
          .corner-tile .tile-icon {
            font-size: 1.3rem;
          }
          .corner-tile .tile-name {
            font-size: 0.56rem;
            color: var(--gold);
          }

          /* 3D Floors & Eiffel Tower */
          .building-zone {
            width: 100%;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1px 0;
            pointer-events: none;
          }
          .floors-3d-stack {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1.5px;
          }
          .floor-3d-block {
            width: 6.5px;
            height: 10px;
            background: linear-gradient(135deg, #CDDC39, #9E9D24);
            border: 1px solid #F4FF81;
            border-radius: 1.5px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.7), inset 0 1px 1px #FFF;
            position: relative;
            transform: translateZ(2px);
          }
          .eiffel-tower-3d {
            font-size: 1.05rem;
            line-height: 1;
            filter: drop-shadow(0 0 5px #F59E0B);
            animation: pulseGold 2s infinite ease-in-out;
          }
          @keyframes pulseGold {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #F59E0B); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 8px #FBBF24); }
          }

          /* Pawns */
          .pawn {
            width: clamp(19px, 4.8vw, 24px);
            height: clamp(19px, 4.8vw, 24px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.72rem, 2.8vw, 0.90rem);
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.9);
            border: 2px solid #fff;
            background: #000;
            flex-shrink: 0;
            pointer-events: none;
            transition: transform 0.12s ease-out !important;
          }
          .pawn.moving-step {
            transform: scale(1.25);
            box-shadow: 0 0 10px var(--gold);
          }
          .pawn-p0 {
            background: radial-gradient(circle, #EF4444, #991B1B);
          }
          .pawn-p1 {
            background: radial-gradient(circle, #38BDF8, #075985);
          }
          .tile-pawns {
            position: absolute;
            display: flex !important;
            align-items: center;
            justify-content: center;
            gap: 2px;
            z-index: 50;
            pointer-events: none;
          }
          .side-bottom .tile-pawns {
            top: -12px;
            bottom: auto;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: row;
            width: max-content;
          }
          .side-top .tile-pawns {
            bottom: -12px;
            top: auto;
            left: 50%;
            transform: translateX(-50%);
            flex-direction: row;
            width: max-content;
          }
          .side-left .tile-pawns {
            right: -12px;
            left: auto;
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column;
            height: max-content;
            width: auto;
          }
          .side-right .tile-pawns {
            left: -12px;
            right: auto;
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column;
            height: max-content;
            width: auto;
          }
          .corner-0 .tile-pawns { top: -6px; left: -6px; }
          .corner-10 .tile-pawns { top: -6px; right: -6px; }
          .corner-20 .tile-pawns { bottom: -6px; right: -6px; }
          .corner-30 .tile-pawns { bottom: -6px; left: -6px; }

          .tile.owned-glow { box-shadow: inset 0 0 8px currentColor; }
          .tile.owned-tint { filter: brightness(1.25); }
          .tile.owned-border { border-width: 2.5px !important; border-color: currentColor !important; }
          .tile-owner-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            font-size: 0.6rem;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--gold);
            z-index: 5;
          }
          [dir="ltr"] .tile-owner-badge { right: auto; left: 1px; }
          .tile-mortgaged-badge {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-20deg);
            background: #DC2626;
            color: #FFF;
            font-size: 0.48rem;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #FFF;
            z-index: 8;
          }

          /* Center Board */
          .board-center {
            direction: rtl;
            grid-column: 2 / span 9;
            grid-row: 2 / span 9;
            background: radial-gradient(circle at center, #182235, #0B101A);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px;
            position: relative;
            border: 1px solid rgba(245, 158, 11, 0.25);
            overflow: hidden;
          }
          [dir="ltr"] .board-center { direction: ltr; }
          .center-brand {
            font-size: clamp(0.85rem, 3.4vw, 1.15rem);
            font-weight: 900;
            color: var(--gold);
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
          }
          .center-turn-announcer {
            font-size: clamp(0.70rem, 2.7vw, 0.86rem);
            font-weight: bold;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
          }
          .dice-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: auto 0;
            perspective: 800px;
          }
          .cube-die {
            width: 44px;
            height: 44px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
          }
          .cube-die.rolling {
            animation: rollTumble 0.4s infinite linear;
          }
          @keyframes rollTumble {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
          }
          .cube-face {
            position: absolute;
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #FFF, #E2E8F0);
            border: 2px solid #CBD5E1;
            border-radius: 8px;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.6);
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 4px;
            box-sizing: border-box;
          }
          .dot {
            width: 8px;
            height: 8px;
            background: #B91C1C;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
          }
          .face-1 { transform: rotateY(0deg) translateZ(22px); }
          .face-6 { transform: rotateY(180deg) translateZ(22px); }
          .face-2 { transform: rotateY(-90deg) translateZ(22px); }
          .face-5 { transform: rotateY(90deg) translateZ(22px); }
          .face-3 { transform: rotateX(90deg) translateZ(22px); }
          .face-4 { transform: rotateX(-90deg) translateZ(22px); }

          .center-btn-roll {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #000;
            border: none;
            border-radius: 24px;
            padding: 7px 22px;
            font-size: clamp(0.82rem, 3vw, 1.0rem);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
          }
          .center-btn-roll:active { transform: scale(0.96); }
          .center-btn-roll:disabled { opacity: 0.4; cursor: not-allowed; }
          .log-area {
            width: 95%;
            height: 20px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 0.62rem;
            color: var(--gold-lt);
          }

          /* Modals - Transparent Background so Board is Fully Visible */
          .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(1.5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 12px;
          }
