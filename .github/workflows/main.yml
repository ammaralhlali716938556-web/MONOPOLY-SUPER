            {ar:"استرداد ضريبي غير متوقع! استلم 100$",en:"Tax refund! Collect $100",amt:100},
            {ar:"تكاليف علاج بالمستشفى. ادفع 100$",en:"Hospital expenses. Pay $100",amt:-100},
            {ar:"هدية عيد ميلاد من الأصدقاء! استلم 50$",en:"Birthday gift! Collect $50",amt:50},
            {ar:"أقساط تأمين مستحقة. ادفع 50$",en:"Insurance premium. Pay $50",amt:-50},
            {ar:"مبروك! فزت بالمركز الثاني، استلم 100$",en:"Won 2nd place, collect $100",amt:100}
          ];
          const AudioFX = {
            ctx:null,enabled:true,
            init(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}},
            play(t){
              if(!this.enabled)return;
              try{
                this.init();if(!this.ctx)return;
                if(this.ctx.state==='suspended')this.ctx.resume();
                const n=this.ctx.currentTime,osc=this.ctx.createOscillator(),g=this.ctx.createGain();
                osc.connect(g);g.connect(this.ctx.destination);
                if(t==='roll'){osc.type='triangle';osc.frequency.setValueAtTime(160,n);osc.frequency.exponentialRampToValueAtTime(40,n+0.2);g.gain.setValueAtTime(0.3,n);g.gain.linearRampToValueAtTime(0.01,n+0.2);osc.start(n);osc.stop(n+0.2);}
                else if(t==='step'){osc.type='sine';osc.frequency.setValueAtTime(450,n);g.gain.setValueAtTime(0.15,n);g.gain.linearRampToValueAtTime(0.01,n+0.05);osc.start(n);osc.stop(n+0.05);}
                else if(t==='cash'){osc.type='sine';osc.frequency.setValueAtTime(587,n);osc.frequency.setValueAtTime(880,n+0.08);g.gain.setValueAtTime(0.25,n);g.gain.linearRampToValueAtTime(0.01,n+0.25);osc.start(n);osc.stop(n+0.25);}
                else if(t==='jail'){osc.type='sawtooth';osc.frequency.setValueAtTime(120,n);osc.frequency.linearRampToValueAtTime(60,n+0.3);g.gain.setValueAtTime(0.3,n);g.gain.linearRampToValueAtTime(0.01,n+0.3);osc.start(n);osc.stop(n+0.3);}
                else if(t==='win'){osc.type='triangle';osc.frequency.setValueAtTime(440,n);osc.frequency.setValueAtTime(659,n+0.2);g.gain.setValueAtTime(0.3,n);g.gain.linearRampToValueAtTime(0.01,n+0.5);osc.start(n);osc.stop(n+0.5);}
              }catch(e){}
            }
          };
          const Game = {
            mode:'ai',lang:'ar',turn:0,isBusy:false,doublesInRow:0,pendingTile:null,pendingCard:null,
            players:[
              {id:0,name_ar:"أبو أسد",name_en:"Lion King",avatar:"🦁",money:1500,pos:0,inJail:false,jailTurns:0,props:[]},
              {id:1,name_ar:"الصقر (الذكاء)",name_en:"The Falcon (AI)",avatar:"🦅",money:1500,pos:0,inJail:false,jailTurns:0,props:[]}
            ],
            settings:{diceSpeed:'normal',moveSpeed:'normal',ownedStyle:'glow'},
            auction:{active:false,tile:null,currentBid:0,highestBidder:null,bidTurn:0,passed:[false,false]},
            negotiate:{tile:null,offer:100,buyerId:0}
          };
          function tr(k){return T[k]?T[k][Game.lang==='en'?1:0]:k;}
          function tName(t){return Game.lang==='en'?t.name_en:t.name_ar;}
          function pName(p){return Game.lang==='en'?p.name_en:p.name_ar;}
          function openModal(id){document.getElementById(id).classList.add("show");}
          function closeModal(id){document.getElementById(id).classList.remove("show");updateUI();}

          function getGridCoords(i){
            if(i===0)return{r:11,c:11};if(i>=1&&i<=9)return{r:11,c:11-i};if(i===10)return{r:11,c:1};
            if(i>=11&&i<=19)return{r:11-(i-10),c:1};if(i===20)return{r:1,c:1};if(i>=21&&i<=29)return{r:1,c:1+(i-20)};
            if(i===30)return{r:1,c:11};return{r:1+(i-30),c:11};
          }
          function getPawnClass(i){
            if(i===0)return"pw-c0";if(i>=1&&i<=9)return"pw-b";if(i===10)return"pw-c10";
            if(i>=11&&i<=19)return"pw-l";if(i===20)return"pw-c20";if(i>=21&&i<=29)return"pw-t";
            if(i===30)return"pw-c30";return"pw-r";
          }
          function renderBoard(){
            const b=document.getElementById("board");
            document.querySelectorAll(".tile").forEach(e=>e.remove());
            BOARD_TILES.forEach((tile,idx)=>{
              const c=getGridCoords(idx),d=document.createElement("div");
              d.id="tile-"+idx;d.className="tile"+([0,10,20,30].includes(idx)?" corner-tile":"");
              d.style.gridRow=c.r;d.style.gridColumn=c.c;
              d.onclick=()=>handleTileClick(tile);
              let h="";const n=tName(tile);
              if(tile.type==="property"){
                h+=`<div class="tile-bar" style="background:${tile.color}"></div>`;
                h+=`<div class="tile-cnt"><div class="tile-name">${n}</div><div class="tile-price">${tile.price}$</div></div>`;
              }else if(tile.type==="railroad"||tile.type==="utility"){
                h+=`<div class="tile-cnt"><div style="font-size:0.95rem;">${tile.icon}</div><div class="tile-name">${n}</div><div class="tile-price">${tile.price}$</div></div>`;
              }else{
                h+=`<div class="tile-cnt"><div style="font-size:0.95rem;">${tile.icon||"🏛️"}</div><div class="tile-name">${n}</div></div>`;
              }
              h+=`<div class="tile-pawns ${getPawnClass(idx)}" id="pawns-${idx}"></div>`;
              d.innerHTML=h;b.appendChild(d);
            });
            updateTileStyles();updatePawns();
          }
          function updatePawns(){
            document.querySelectorAll(".tile-pawns").forEach(e=>e.innerHTML="");
            Game.players.forEach(p=>{
              const box=document.getElementById("pawns-"+p.pos);
              if(box){
                const el=document.createElement("div");
                el.className=`pawn pawn-${p.id}`;el.innerText=p.avatar;
                box.appendChild(el);
              }
            });
          }
          function updateTileStyles(){
            BOARD_TILES.forEach(tile=>{
              const el=document.getElementById("tile-"+tile.id);if(!el)return;
              el.classList.remove("own-border-0","own-border-1","own-glow-0","own-glow-1","own-tint-0","own-tint-1","mortgaged");
              const oldB=el.querySelector(".own-badge"),oldM=el.querySelector(".mort-tag");
              if(oldB)oldB.remove();if(oldM)oldM.remove();
              if(tile.owner!==undefined){
                const pid=tile.owner,st=Game.settings.ownedStyle;
                if(st==='glow')el.classList.add(`own-glow-${pid}`);
                else if(st==='tint')el.classList.add(`own-tint-${pid}`);
                else if(st==='border')el.classList.add(`own-border-${pid}`);
                else if(st==='badge'){
                  const b=document.createElement("div");b.className="own-badge";
                  b.innerText=Game.players[pid].avatar;el.appendChild(b);
                }
                if(tile.isMortgaged){
                  el.classList.add("mortgaged");
                  const mb=document.createElement("div");mb.className="mort-tag";
                  mb.innerText=tr("mort_tag");el.appendChild(mb);
                }
              }
            });
          }
          function updateUI(){
            document.getElementById("pC0").innerText=Game.players[0].money+"$";
            document.getElementById("pC1").innerText=Game.players[1].money+"$";
            document.getElementById("pP0").innerText=`${tr("props_c")}: ${Game.players[0].props.length}`;
            document.getElementById("pP1").innerText=`${tr("props_c")}: ${Game.players[1].props.length}`;
            document.getElementById("pAv0").innerText=Game.players[0].avatar;
            document.getElementById("pAv1").innerText=Game.players[1].avatar;
            document.getElementById("pN0").innerText=pName(Game.players[0]);
            document.getElementById("pN1").innerText=pName(Game.players[1]);
            const p0=Game.turn===0;
            document.getElementById("pCard0").className="p-card"+(p0?" active":"");
            document.getElementById("pCard1").className="p-card"+(!p0?" active":"");
            document.getElementById("tBadge0").style.display=p0?"block":"none";
            document.getElementById("tBadge1").style.display=!p0?"block":"none";
            const cur=Game.players[Game.turn];
            document.getElementById("turnAnn").innerText=`${tr("turn_f")}: ${cur.avatar} ${pName(cur)}`;
            updatePawns();updateTileStyles();
          }
          function logEvent(m){
            const el=document.getElementById("eventLog"),d=document.createElement("div");
            d.style.marginBottom="2px";d.innerText=m;el.prepend(d);
          }
          function setDiceFace(el,v){
            const rots={1:"rotateY(0deg) rotateX(0deg)",2:"rotateY(180deg) rotateX(0deg)",3:"rotateY(90deg) rotateX(0deg)",4:"rotateY(-90deg) rotateX(0deg)",5:"rotateX(-90deg) rotateY(0deg)",6:"rotateX(90deg) rotateY(0deg)"};
            el.style.transform=rots[v]||rots[1];
          }
          function getDiceAnimTime(){return Game.settings.diceSpeed==='slow'?900:(Game.settings.diceSpeed==='fast'?300:600);}
          function getStepTime(){return Game.settings.moveSpeed==='slow'?240:(Game.settings.moveSpeed==='fast'?55:130);}

          function handleRollClick(){
            if(Game.isBusy)return;if(Game.mode==="ai"&&Game.turn===1)return;
            const cur=Game.players[Game.turn];
            if(cur.inJail){openJailModal();return;}
            if(ownsAllRailroads(cur)){openFastTravelModal(cur);return;}
            playTurn();
          }
          function ownsAllRailroads(p){return [5,15,25,35].every(id=>BOARD_TILES[id].owner===p.id);}

          function playTurn(){
            Game.isBusy=true;document.getElementById("btnRoll").disabled=true;
            const cur=Game.players[Game.turn];AudioFX.play('roll');
            const d1El=document.getElementById("dice1"),d2El=document.getElementById("dice2");
            d1El.classList.add("rolling");d2El.classList.add("rolling");

            setTimeout(()=>{
              d1El.classList.remove("rolling");d2El.classList.remove("rolling");
              const d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
              setDiceFace(d1El,d1);setDiceFace(d2El,d2);
              const sum=d1+d2,isDoubles=d1===d2;
              const sumEl=document.getElementById("diceSumBdg");
              sumEl.innerText=`${tr("dice_tot")}: ${sum} (${d1} + ${d2})${isDoubles?" "+tr("doubles"):""}`;
              sumEl.style.display="inline-block";
              logEvent(`🎲 ${pName(cur)}: (${d1} + ${d2} = ${sum})${isDoubles?" ["+tr("doubles")+"]":""}`);

              if(isDoubles){
                Game.doublesInRow++;
                if(Game.doublesInRow===3){
                  logEvent(`🚔 3 ${tr("doubles")}! -> ${pName(cur)}`);
                  sendToJail(cur);autoEndTurn(false);return;
                }
              }else Game.doublesInRow=0;

              movePlayerSteps(cur,sum,isDoubles);
            },getDiceAnimTime());
          }

          function movePlayerSteps(player,steps,isDoubles){
            let rem=steps;
            const inv=setInterval(()=>{
              player.pos=(player.pos+1)%40;AudioFX.play('step');updatePawns();
              if(player.pos===0){player.money+=200;AudioFX.play('cash');logEvent(`💰 +200$ (${pName(player)}) [GO]`);updateUI();}
              rem--;
              if(rem<=0){
                clearInterval(inv);
                setTimeout(()=>handleTileLanding(player,isDoubles),220);
              }
            },getStepTime());
          }

          function handleTileLanding(player,isDoubles){
            const tile=BOARD_TILES[player.pos];updateUI();
            if(tile.type==="property"||tile.type==="railroad"||tile.type==="utility"){
              if(tile.owner===undefined){
                if(player.id===1&&Game.mode==="ai"){
                  if(player.money>=tile.price+100){buyProperty(player,tile);autoEndTurn(isDoubles);}
                  else{logEvent(`🤖 ${pName(player)} يطلب بدء مزاد على (${tName(tile)})!`);startAuction(tile,isDoubles);}
                }else openDeedModal(tile,isDoubles);
                return;
              }else if(tile.owner!==player.id){
                const owner=Game.players[tile.owner];
                if(tile.isMortgaged){logEvent(`🛡️ (${tName(tile)}) ${tr("mort_tag")}.`);autoEndTurn(isDoubles);return;}
                let rent=tile.rent||10;
                if(tile.type==="property"&&checkMonopoly(tile.owner,tile.group))rent*=2;
                player.money-=rent;owner.money+=rent;AudioFX.play('cash');
                logEvent(`💸 دفع ${pName(player)} إيجاراً ${rent}$ إلى ${pName(owner)} في (${tName(tile)}).`);
                checkBankruptcyOrMortgage(player,()=>autoEndTurn(isDoubles));return;
              }else{
                logEvent(`🏠 ${pName(player)} في عقاره (${tName(tile)}).`);autoEndTurn(isDoubles);return;
              }
            }
            if(tile.type==="tax"){
              player.money-=tile.price;AudioFX.play('jail');
              logEvent(`🚨 دفع ${pName(player)} ${tile.price}$ (${tName(tile)}).`);
              checkBankruptcyOrMortgage(player,()=>autoEndTurn(isDoubles));return;
            }
            if(tile.type==="gotojail"){
              logEvent(`🚨 سقط ${pName(player)} في اذهب إلى السجن!`);
              sendToJail(player);autoEndTurn(false);return;
            }
            if(tile.type==="chance"||tile.type==="chest"){
              const deck=tile.type==="chance"?CHANCE_CARDS:CHEST_CARDS;
              const card=deck[Math.floor(Math.random()*deck.length)];
              if(player.id===1&&Game.mode==="ai")applyCardEffect(player,card,()=>autoEndTurn(isDoubles));
              else openCardModal(tile.type==="chance"?"❓ فرصة":"📦 صندوق الجماعة",card,isDoubles);
              return;
            }
            logEvent(`🛡️ ${pName(player)} (${tName(tile)}).`);autoEndTurn(isDoubles);
          }

          function checkMonopoly(pid,group){return group&&BOARD_TILES.filter(t=>t.group===group).every(t=>t.owner===pid);}
          function sendToJail(p){p.pos=10;p.inJail=true;p.jailTurns=3;AudioFX.play('jail');updatePawns();updateUI();}
          function buyProperty(player,tile,customP=null){
            const cost=customP!==null?customP:tile.price;
            if(player.money>=cost){
              player.money-=cost;tile.owner=player.id;tile.isMortgaged=false;
              if(!player.props.includes(tile.id))player.props.push(tile.id);
              AudioFX.play('cash');logEvent(`🎉 اشترى ${pName(player)} (${tName(tile)}) بـ ${cost}$!`);
              updateTileStyles();updateUI();
            }
          }

          /* Deed & Auction */
          function openDeedModal(tile,isDoubles){
            Game.pendingTile={tile,isDoubles};
            document.getElementById("deedH").innerText=tName(tile);
            document.getElementById("deedH").style.background=tile.color||"#475569";
            document.getElementById("deedP").innerText=tile.price+"$";
            document.getElementById("deedR").innerText=(tile.rent||10)+"$";
            document.getElementById("deedDR").innerText=((tile.rent||10)*2)+"$";
            document.getElementById("btnBuyP").disabled=Game.players[Game.turn].money<tile.price;
            openModal("deedModal");
          }
          function confirmBuyProp(){
            if(Game.pendingTile){
              buyProperty(Game.players[Game.turn],Game.pendingTile.tile);
              const d=Game.pendingTile.isDoubles;closeModal("deedModal");autoEndTurn(d);
            }
          }
          function startAuctionFromDeed(){
            if(Game.pendingTile){
              const {tile,isDoubles}=Game.pendingTile;
              closeModal("deedModal");startAuction(tile,isDoubles);
            }
          }
          function startAuction(tile,isDoubles){
            Game.auction={active:true,tile,currentBid:Math.max(10,Math.floor(tile.price*0.4)),highestBidder:null,bidTurn:0,passed:[false,false],isDoubles};
            document.getElementById("aucPropN").innerText=`${tName(tile)} (${tile.price}$)`;
            updateAuctionUI();openModal("auctionModal");
            if(Game.mode==="ai"&&Game.auction.bidTurn===1)setTimeout(handleAiAuctionBid,800);
          }
          function updateAuctionUI(){
            const a=Game.auction;document.getElementById("aucCurBid").innerText=a.currentBid+"$";
            const bTxt=a.highestBidder!==null?`${pName(Game.players[a.highestBidder])} (${Game.players[a.highestBidder].avatar})`:"لا يوجد";
            document.getElementById("aucTopBidder").innerText=`أعلى مزايدة: ${bTxt}`;
            const curP=Game.players[a.bidTurn];
            document.getElementById("aucTurnPrompt").innerText=`دور: ${curP.avatar} ${pName(curP)}`;
            const isH=!(Game.mode==="ai"&&a.bidTurn===1);
            document.getElementById("aucBtns").style.display=isH?"flex":"none";
            document.getElementById("btnPassAuc").style.display=isH?"block":"none";
          }
          function placeBid(inc){
            const a=Game.auction,p=Game.players[a.bidTurn],nb=a.currentBid+inc;
            if(p.money<nb){alert("السيولة غير كافية!");return;}
            a.currentBid=nb;a.highestBidder=p.id;AudioFX.play('cash');
            logEvent(`🔨 زاد ${pName(p)} المزاد إلى ${nb}$!`);nextAuctionTurn();
          }
          function passBid(){
            const a=Game.auction;a.passed[a.bidTurn]=true;
            logEvent(`❌ انسحب ${pName(Game.players[a.bidTurn])} من المزاد.`);nextAuctionTurn();
          }
          function nextAuctionTurn(){
            const a=Game.auction;
            if(a.passed[0]&&a.passed[1]){finishAuction(null);return;}
            if(a.passed[0]&&a.highestBidder!==null){finishAuction(a.highestBidder);return;}
            if(a.passed[1]&&a.highestBidder!==null){finishAuction(a.highestBidder);return;}
            a.bidTurn=1-a.bidTurn;
            if(a.passed[a.bidTurn]){finishAuction(a.highestBidder);return;}
            updateAuctionUI();
            if(Game.mode==="ai"&&a.bidTurn===1)setTimeout(handleAiAuctionBid,800);
          }
          function handleAiAuctionBid(){
            const a=Game.auction;if(!a.active||a.bidTurn!==1)return;
            const ai=Game.players[1],t=a.tile;let imp=1.0;
            if(t.group){
              if(ai.props.filter(pid=>BOARD_TILES[pid].group===t.group).length>=2)imp=1.85;
              else if(ai.props.filter(pid=>BOARD_TILES[pid].group===t.group).length===1)imp=1.35;
              if(Game.players[0].props.filter(pid=>BOARD_TILES[pid].group===t.group).length>=2)imp=Math.max(imp,1.55);
            }
            const maxB=Math.min(ai.money-40,Math.floor(t.price*imp));
            if(a.currentBid+10<=maxB&&ai.money>=a.currentBid+10)placeBid(10);else passBid();
          }
          function finishAuction(wId){
            const a=Game.auction;a.active=false;closeModal("auctionModal");
            if(wId!==null){
              const w=Game.players[wId];buyProperty(w,a.tile,a.currentBid);
              logEvent(`🏆 فاز ${pName(w)} بالمزاد على (${tName(a.tile)}) بـ ${a.currentBid}$!`);
            }else logEvent(`🏷️ لم يُبع (${tName(a.tile)}) بالمزاد.`);
            autoEndTurn(a.isDoubles);
          }

          /* Jail */
          function openJailModal(){
            document.getElementById("jailRemTurns").innerText=`المحاولات المتبقية: ${Game.players[Game.turn].jailTurns}`;
            openModal("jailModal");
          }
          function jailPayBail(){
            closeModal("jailModal");const cur=Game.players[Game.turn];
            cur.money-=50;cur.inJail=false;cur.jailTurns=0;AudioFX.play('cash');
            logEvent(`💸 دفع ${pName(cur)} 50$ كفالة وخرج!`);updateUI();
            checkBankruptcyOrMortgage(cur,()=>document.getElementById("btnRoll").disabled=false);
          }
          function jailTryDoubles(){
            closeModal("jailModal");const cur=Game.players[Game.turn];
            Game.isBusy=true;document.getElementById("btnRoll").disabled=true;
            const d1El=document.getElementById("dice1"),d2El=document.getElementById("dice2");
            d1El.classList.add("rolling");d2El.classList.add("rolling");
            setTimeout(()=>{
              d1El.classList.remove("rolling");d2El.classList.remove("rolling");
              const d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
              setDiceFace(d1El,d1);setDiceFace(d2El,d2);const sum=d1+d2,isDoubles=d1===d2;
              document.getElementById("diceSumBdg").innerText=`${tr("dice_tot")}: ${sum} (${d1} + ${d2})`;
              document.getElementById("diceSumBdg").style.display="inline-block";
              if(isDoubles){
                cur.inJail=false;cur.jailTurns=0;logEvent(`🔓 خرج ${pName(cur)} بنرد متطابق (${d1}+${d2})!`);
                movePlayerSteps(cur,sum,false);
              }else{
                cur.jailTurns--;
                if(cur.jailTurns<=0){
                  cur.money-=50;cur.inJail=false;logEvent(`💸 دفع ${pName(cur)} 50$ إجبارياً وخرج!`);
                  checkBankruptcyOrMortgage(cur,()=>movePlayerSteps(cur,sum,false));
                }else{logEvent(`🔒 محاولة فاشلة! ما زال في السجن (المتبقي: ${cur.jailTurns}).`);autoEndTurn(false);}
              }
            },getDiceAnimTime());
          }

          /* Fast Travel */
          function openFastTravelModal(p){
            const box=document.getElementById("railList");box.innerHTML="";
            [5,15,25,35].forEach(id=>{
              if(id!==p.pos){
                const b=document.createElement("button");b.className="btn-p";b.style.margin="2px 0";
                b.innerText=`🚄 ${tName(BOARD_TILES[id])}`;b.onclick=()=>selectFastTravel(p,id);box.appendChild(b);
              }
            });
            openModal("fastTravelModal");
          }
          function closeFastTravel(did){closeModal("fastTravelModal");if(!did)playTurn();}
          function selectFastTravel(p,target){
            closeModal("fastTravelModal");const old=p.pos;
            if(target>old){p.money+=200;AudioFX.play('cash');logEvent(`🎉 سافر ${pName(p)} بالقطار قبل خط البداية ونال 200$!`);}
            else logEvent(`🚄 سافر ${pName(p)} بالقطار وتجاوز خط البداية (بدون 200$).`);
            p.pos=target;updatePawns();updateUI();setTimeout(playTurn,500);
          }

          /* Negotiation */
          function handleTileClick(tile){
            if(tile.owner!==undefined){
              const cur=Game.players[Game.turn];
              if(tile.owner===cur.id)openMortgageModal();
              else openNegModal(tile,cur,Game.players[tile.owner]);
            }
          }
          function openNegModal(tile,buyer,owner){
            Game.negotiate={tile,buyerId:buyer.id,offer:Math.floor(tile.price*1.25)};
            document.getElementById("negPropN").innerText=`${tName(tile)} (${tile.price}$)`;
            document.getElementById("negOwnN").innerText=`${pName(owner)} (${owner.avatar})`;
            document.getElementById("negBaseP").innerText=tile.price+"$";
            document.getElementById("negOffVal").innerText=Game.negotiate.offer+"$";
            openModal("negModal");
          }
          function adjOffer(d){
            Game.negotiate.offer=Math.max(10,Game.negotiate.offer+d);
            document.getElementById("negOffVal").innerText=Game.negotiate.offer+"$";
          }
          function setOfferMult(m){
            Game.negotiate.offer=Math.floor(Game.negotiate.tile.price*m);
            document.getElementById("negOffVal").innerText=Game.negotiate.offer+"$";
          }
          function submitOffer(){
            const b=Game.players[Game.negotiate.buyerId],t=Game.negotiate.tile,o=Game.players[t.owner],off=Game.negotiate.offer;
            if(b.money<off){alert("السيولة غير كافية!");return;}
            closeModal("negModal");
            if(Game.mode==="ai"&&o.id===1){
              let m=1.3;
              if(t.group){
                if(o.props.filter(p=>BOARD_TILES[p].group===t.group).length>=2)m=2.4;
                if(b.props.filter(p=>BOARD_TILES[p].group===t.group).length>=2)m=Math.max(m,1.9);
              }
              if(o.money<150)m*=0.85;
              const minP=Math.floor(t.price*m);
              if(off>=minP){
                b.money-=off;o.money+=off;t.owner=b.id;
                o.props = o.props.filter(p=>p!==t.id);b.props.push(t.id);
                AudioFX.play('cash');logEvent(`🤝 وافق الصقر على بيع (${tName(t)}) بـ ${off}$!`);
                alert(`🤖 وافق الصقر على العرض بمبلغ ${off}$!`);updateTileStyles();updateUI();
              }else{
                logEvent(`❌ رفض الصقر عرض شراء (${tName(t)}) بـ ${off}$.`);
                alert(`🤖 رفض الصقر العرض ("القيمة الاستراتيجية أعلى من المعروض").`);
              }
            }else{
              window.pendingTrade={b,o,t,off};
              document.getElementById("tradePromptT").innerText=`عرض تفاوض من ${pName(b)} (${b.avatar}): شراء (${tName(t)}) بـ ${off}$؟`;
              openModal("tradePromptModal");
            }
          }
          function acceptTrade(){
            if(window.pendingTrade){
              const {b,o,t,off}=window.pendingTrade;
              b.money-=off;o.money+=off;t.owner=b.id;
              o.props = o.props.filter(p=>p!==t.id);b.props.push(t.id);
              AudioFX.play('cash');logEvent(`🤝 تمت الصفقة بنجاح! بيع (${tName(t)}) بـ ${off}$!`);
              updateTileStyles();updateUI();
            }
            closeModal("tradePromptModal");
          }
          function rejectTrade(){closeModal("tradePromptModal");}

          /* Mortgage */
          function openMortgageModal(){
            const box=document.getElementById("mortList");box.innerHTML="";
            const cur=Game.players[Game.turn];
            if(!cur.props.length){box.innerHTML=`<div style="color:#94A3B8;font-size:0.75rem;padding:8px;">لا تمتلك عقارات حالياً.</div>`;}
            else{
              cur.props.forEach(pid=>{
                const t=BOARD_TILES[pid],row=document.createElement("div"),v=Math.floor(t.price*0.5);
                row.className="m-item";
                row.innerHTML=`<div><span style="font-weight:bold;color:${t.color||'#FFF'}">${tName(t)}</span> <span style="color:#94A3B8;font-size:0.65rem;">(${v}$)</span></div>`;
                const btn=document.createElement("button");btn.style.padding="3px 8px";btn.style.borderRadius="4px";btn.style.border="none";btn.style.fontWeight="bold";btn.style.fontSize="0.68rem";btn.style.cursor="pointer";
                if(!t.isMortgaged){btn.style.background="#DC2626";btn.style.color="#FFF";btn.innerText=`${tr("mort_act")} (+${v}$)`;btn.onclick=()=>doMortgage(t);}
                else{btn.style.background="#10B981";btn.style.color="#FFF";btn.innerText=`${tr("unmort_act")} (-${v}$)`;btn.onclick=()=>undoMortgage(t);}
                row.appendChild(btn);box.appendChild(row);
              });
            }
            openModal("mortgageModal");
          }
          function doMortgage(t){
            const p=Game.players[t.owner],v=Math.floor(t.price*0.5);
            t.isMortgaged=true;p.money+=v;AudioFX.play('cash');
            logEvent(`📜 قام ${pName(p)} برهن (${tName(t)}) وحصل على ${v}$!`);
            openMortgageModal();updateTileStyles();updateUI();
          }
          function undoMortgage(t){
            const p=Game.players[t.owner],v=Math.floor(t.price*0.5);
            if(p.money>=v){
              t.isMortgaged=false;p.money-=v;AudioFX.play('cash');
              logEvent(`🔓 قام ${pName(p)} بفك رهن (${tName(t)}) بـ ${v}$!`);
              openMortgageModal();updateTileStyles();updateUI();
            }else alert("السيولة غير كافية لفك الرهن!");
          }
          function checkBankruptcyOrMortgage(player,onDone){
            if(player.money>=0){if(onDone)onDone();return;}
            const unmort=player.props.map(id=>BOARD_TILES[id]).filter(t=>!t.isMortgaged);
            const totalPower=unmort.reduce((s,t)=>s+Math.floor(t.price*0.5),0);
            if(player.money+totalPower<0){
              const winner=Game.players[1-player.id];AudioFX.play('win');
              document.getElementById("winH").innerText=`${tr("win_h")} (${pName(winner)})`;
              document.getElementById("winSub").innerText=`${tr("win_s")} [${pName(player)}]`;
              openModal("winnerModal");
            }else{
              if(player.id===1&&Game.mode==="ai"){
                unmort.sort((a,b)=>a.price-b.price);
                for(let t of unmort){if(player.money>=0)break;doMortgage(t);}
                if(onDone)onDone();
              }else{
                alert("⚠️ عجز مالي! يجب رهن بعض عقاراتك لتغطية الديون وتجنب الإفلاس.");
                openMortgageModal();if(onDone)onDone();
              }
            }
          }

          /* Cards */
          function openCardModal(title,card,isDoubles){
            document.getElementById("cardH").innerText=title;
            document.getElementById("cardMsg").innerText=Game.lang==='en'?card.en:card.ar;
            openModal("cardModal");
            Game.pendingCard={card,isDoubles};
          }
          function closeCardModal(){
            closeModal("cardModal");
            if(Game.pendingCard){
              const cur=Game.players[Game.turn],{card,isDoubles}=Game.pendingCard;
              Game.pendingCard=null;applyCardEffect(cur,card,()=>autoEndTurn(isDoubles));
            }
          }
          function applyCardEffect(p,card,onDone){
            if(card.amt){
              p.money+=card.amt;AudioFX.play(card.amt>0?'cash':'jail');
              logEvent(`📜 ${Game.lang==='en'?card.en:card.ar}`);
              checkBankruptcyOrMortgage(p,onDone);
            }else if(card.act==="go"){
              p.pos=0;p.money+=200;AudioFX.play('cash');updatePawns();if(onDone)onDone();
            }else if(card.act==="jail"){
              sendToJail(p);if(onDone)onDone();
            }
            updateUI();
          }

          /* Auto Turn Transition */
          function autoEndTurn(isDoubles){
            updateUI();Game.isBusy=false;
            if(isDoubles){
              logEvent(`✨ ${tr("doubles")}`);
              if(Game.mode==="ai"&&Game.turn===1)setTimeout(playTurn,900);
              else document.getElementById("btnRoll").disabled=false;
            }else{
              setTimeout(()=>{
                Game.doublesInRow=0;Game.turn=1-Game.turn;updateUI();
                if(Game.mode==="ai"&&Game.turn===1){
                  document.getElementById("btnRoll").disabled=true;
                  const ai=Game.players[1];
                  if(ai.inJail){
                    setTimeout(()=>{
                      if(ai.money>=200){ai.money-=50;ai.inJail=false;ai.jailTurns=0;logEvent(`🤖 دفع الصقر 50$ كفالة وخرج!`);updateUI();playTurn();}
                      else jailTryDoubles();
                    },800);return;
                  }
                  if(ownsAllRailroads(ai)){
                    const rr=[5,15,25,35].filter(p=>p!==ai.pos);
                    selectFastTravel(ai,rr[Math.floor(Math.random()*rr.length)]);return;
                  }
                  setTimeout(playTurn,800);
                }else document.getElementById("btnRoll").disabled=false;
              },700);
            }
          }

          /* Settings */
          function setDiceSpd(s){Game.settings.diceSpeed=s;['slow','normal','fast'].forEach(k=>document.getElementById('btnD_'+k).classList.toggle('sel',k===s));}
          function setMoveSpd(s){Game.settings.moveSpeed=s;['slow','normal','fast'].forEach(k=>document.getElementById('btnM_'+k).classList.toggle('sel',k===s));}
          function setAudio(en){AudioFX.enabled=en;document.getElementById('btnSndOn').classList.toggle('sel',en);document.getElementById('btnSndOff').classList.toggle('sel',!en);}
          function setStyle(st){Game.settings.ownedStyle=st;['Glow','Badge','Tint','Border'].forEach(k=>document.getElementById('optStyle'+k).classList.toggle('sel',k.toLowerCase()===st));updateTileStyles();}
          function setLang(l){
            Game.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='en'?'ltr':'rtl';
            document.getElementById("btnLangAr").classList.toggle('sel',l==='ar');
            document.getElementById("btnLangEn").classList.toggle('sel',l==='en');
            document.getElementById("appT").innerText=tr("app_t");
            document.getElementById("btnRollT").innerText=tr("roll_b");
            document.getElementById("btnMortT").innerText=tr("btn_mort");
            document.getElementById("btnMode").innerText=Game.mode==='ai'?tr("vs_ai"):tr("pvp");
            document.getElementById("lblSetT").innerText=tr("set_t");
            document.getElementById("lblDiceSpd").innerText=tr("dice_s");
            document.getElementById("lblMoveSpd").innerText=tr("move_s");
            document.getElementById("lblSnd").innerText=tr("snd_lbl");
            document.getElementById("btnSndOn").innerText=tr("snd_on");
            document.getElementById("btnSndOff").innerText=tr("snd_off");
            document.getElementById("lblAv1").innerText=tr("av1_lbl");
            document.getElementById("lblAv2").innerText=tr("av2_lbl");
            document.getElementById("lblStyle").innerText=tr("style_lbl");
            document.getElementById("optStyleGlow").innerText=tr("st_g");
            document.getElementById("optStyleBadge").innerText=tr("st_b");
            document.getElementById("optStyleTint").innerText=tr("st_t");
            document.getElementById("optStyleBorder").innerText=tr("st_bd");
            document.getElementById("lblLng").innerText=tr("lng_lbl");
            document.getElementById("lblAbt").innerText=tr("abt_b");
            document.getElementById("btnBuyP").innerText=tr("buy_p");
            document.getElementById("lblDP").innerText=tr("lbl_dp");
            document.getElementById("lblDR").innerText=tr("lbl_dr");
            document.getElementById("lblDDR").innerText=tr("lbl_ddr");
            renderBoard();updateUI();
          }
          function renderAvPickers(){
            const g1=document.getElementById("avGrid1"),g2=document.getElementById("avGrid2");
            g1.innerHTML="";g2.innerHTML="";
            AVATARS.forEach(av=>{
              const b1=document.createElement("button");b1.className="av-btn"+(Game.players[0].avatar===av?" sel":"");
              b1.innerText=av;b1.onclick=()=>{Game.players[0].avatar=av;renderAvPickers();updateUI();};
              g1.appendChild(b1);
              const b2=document.createElement("button");b2.className="av-btn"+(Game.players[1].avatar===av?" sel":"");
              b2.innerText=av;b2.onclick=()=>{Game.players[1].avatar=av;renderAvPickers();updateUI();};
              g2.appendChild(b2);
            });
          }
          function toggleMode(){
            Game.mode=Game.mode==='ai'?'pvp':'ai';
            const btn=document.getElementById("btnMode");
            btn.innerText=Game.mode==='ai'?tr("vs_ai"):tr("pvp");
            updateUI();logEvent(`🎮 ${btn.innerText}`);
          }

          window.addEventListener("DOMContentLoaded",()=>{
            renderBoard();renderAvPickers();updateUI();
          });
          </script>
          </body>
          </html>
          """

          for path, content in files.items():
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          print("All Monopoly Arabia files generated successfully!")
          PYEOF

      - name: ⚙️ تجهيز وإعداد Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 🔨 بناء ملف APK الرسمي
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 استخراج ملف APK
        run: |
          mkdir -p apk_output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "تم العثور على التطبيق: $APK_FILE"
          cp "$APK_FILE" "apk_output/Monopoly_Arabia.apk"

      - name: 🚀 رفع ملف الـ APK للتحميل المباشر (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Monopoly_Arabia_APK
          path: apk_output/Monopoly_Arabia.apk
          retention-days: 30

      - name: 🌟 إنشاء Release رسمي في جيت هوب
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.0"
          name: "🎲 مونوبولي العرب - الإصدار الملكي المطور 2.0"
          body: "تم بناء وتطوير لعبة مونوبولي العرب (بنك الحظ الملكي) بنجاح بصيغة APK جاهز للتحميل والتثبيت المباشر بعد تطبيق كافة التعديلات والتطويرات الملكية المطلوبة."
          files: apk_output/Monopoly_Arabia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
