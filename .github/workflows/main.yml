          ];

          const CHEST_CARDS = [
              { textAr: "استرداد ضريبي غير متوقع! استلم 100$", textEn: "Tax refund! Collect $100", amount: 100 },
              { textAr: "تكاليف علاج بالمستشفى. ادفع 100$", textEn: "Hospital bills. Pay $100", amount: -100 },
              { textAr: "هدية عيد ميلاد من الأصدقاء! استلم 50$", textEn: "Birthday gift! Collect $50", amount: 50 },
              { textAr: "أقساط تأمين مستحقة. ادفع 50$", textEn: "Insurance fee. Pay $50", amount: -50 },
              { textAr: "مبروك! فزت بالمركز الثاني في مسابقة تجارية، استلم 100$", textEn: "Contest prize! Collect $100", amount: 100 }
          ];

          const AVATARS = ["🦁","🦅","👑","🏎️","🐪","🚀","⛵","💎"];

          const Game = {
              lang:'ar', mode:'ai', turn:0, isBusy:false, doublesInRow:0, diceSpeed:'normal', moveSpeed:'normal', propStyle:'glow',
              pendingTile:null, pendingCard:null, tradeData:null, auction:null,
              players: [
                  { id:0, nameAr:"اللاعب 1", nameEn:"Player 1", avatar:"🦁", money:1500, pos:0, inJail:false, jailTurns:0, props:[] },
                  { id:1, nameAr:"الصقر (الذكاء)", nameEn:"Falcon (AI)", avatar:"🦅", money:1500, pos:0, inJail:false, jailTurns:0, props:[] }
              ]
          };

          function getGridCoords(i) {
              if (i === 0) return { r: 11, c: 11 };
              if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
              if (i === 10) return { r: 11, c: 1 };
              if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
              if (i === 20) return { r: 1, c: 1 };
              if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
              if (i === 30) return { r: 1, c: 11 };
              if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
              return { r: 11, c: 11 };
          }

          function renderBoard() {
              const boardEl = document.getElementById("board");
              BOARD_TILES.forEach((tile, index) => {
                  const coords = getGridCoords(index);
                  const tileDiv = document.createElement("div");
                  tileDiv.id = "tile-" + index;

                  let side = "side-bottom";
                  if (index >= 11 && index <= 19) side = "side-left";
                  else if (index >= 20 && index <= 30) side = "side-top";
                  else if (index >= 31 && index <= 39) side = "side-right";
                  tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile" : "");

                  tileDiv.style.gridRow = coords.r;
                  tileDiv.style.gridColumn = coords.c;
                  tileDiv.onclick = () => onTileClicked(index);

                  let h = "";
                  if (tile.type === "property") {
                      h += `<div class="tile-bar" style="background:${tile.color}"></div><div class="tile-cnt"><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else if (tile.type === "railroad" || tile.type === "utility") {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon||"🏛️"}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div></div>`;
                  }
                  h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
                  tileDiv.innerHTML = h;
                  boardEl.appendChild(tileDiv);
              });
              updatePawns();
          }

          function updatePawns() {
              document.querySelectorAll(".tile-pawns").forEach(el => el.innerHTML = "");
              Game.players.forEach(p => {
                  const c = document.getElementById("pawns-" + p.pos);
                  if (c) {
                      const el = document.createElement("div");
                      el.className = `pawn pawn-p${p.id}`;
                      el.innerText = p.avatar;
                      c.appendChild(el);
                  }
              });
          }

          function updateUI() {
              const p0 = Game.players[0], p1 = Game.players[1];
              document.getElementById("cashP0").innerText = p0.money + "$";
              document.getElementById("cashP1").innerText = p1.money + "$";
              const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
              const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;
              document.getElementById("propsP0").innerText = `${I18N[Game.lang].p} ${p0.props.length}`;
              document.getElementById("propsP1").innerText = `${I18N[Game.lang].p} ${p1.props.length}`;
              document.getElementById("mortP0").innerText = m0 > 0 ? `(${I18N[Game.lang].m} ${m0})` : "";
              document.getElementById("mortP1").innerText = m1 > 0 ? `(${I18N[Game.lang].m} ${m1})` : "";

              document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
              document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
              document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
              document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";
              document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
              document.getElementById("turnBadge1").innerText = I18N[Game.lang].opp;

              const cur = Game.players[Game.turn];
              document.getElementById("turnAnnouncer").innerText = `${I18N[Game.lang].turn}: ${cur.avatar} ${Game.lang==='ar'?cur.nameAr:cur.nameEn}`;
              document.getElementById("avP0").innerText = p0.avatar;
              document.getElementById("avP1").innerText = p1.avatar;
              document.getElementById("nameP0").innerText = Game.lang==='ar'?p0.nameAr:p0.nameEn;
              document.getElementById("nameP1").innerText = Game.lang==='ar'?p1.nameAr:p1.nameEn;

              updateBoardVisual();
              updatePawns();
          }

          function updateBoardVisual() {
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tile-" + t.id);
                  if (!el) return;
                  el.classList.remove("owned-glow","owned-tint","owned-border");
                  const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
                  const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();

                  if (t.owner !== undefined) {
                      const owner = Game.players[t.owner];
                      el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                      if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                      else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                      else if (Game.propStyle === 'border') el.classList.add("owned-border");
                      else if (Game.propStyle === 'badge') {
                          const bg = document.createElement("div"); bg.className = "tile-owner-badge"; bg.innerText = owner.avatar; el.appendChild(bg);
                      }
                      if (t.mortgaged) {
                          const mg = document.createElement("div"); mg.className = "tile-mortgaged-badge"; mg.innerText = Game.lang==='ar'?"مَرْهُون":"MORTGAGED"; el.appendChild(mg);
                      }
                  } else { el.style.color = ""; }
              });
          }

          function logEvent(msg) {
              const el = document.getElementById("eventLog");
              const e = document.createElement("div"); e.className = "log-entry"; e.innerText = msg;
              el.prepend(e);
          }

          const ROT = { 1:{x:0,y:0}, 2:{x:0,y:90}, 3:{x:-90,y:0}, 4:{x:0,y:-90}, 5:{x:90,y:0}, 6:{x:0,y:180} };

          function setCube(c, n) { c.style.transform = `rotateX(${ROT[n].x}deg) rotateY(${ROT[n].y}deg)`; }

          function startPlayerTurn() {
              if (Game.isBusy) return;
              const cur = Game.players[Game.turn];
              if (Game.mode === 'ai' && Game.turn === 1) {
                  document.getElementById("btnRoll").disabled = true;
                  setTimeout(handleAITurn, 800);
                  return;
              }
              document.getElementById("btnRoll").disabled = false;
              if (cur.inJail) { openJailModal(cur); return; }
              if (checkAllRailroads(cur.id)) { openFastTravelModal(cur); }
          }

          function handleRollClick() {
              if (Game.isBusy) return;
              if (Game.mode === 'ai' && Game.turn === 1) return;
              executeRoll();
          }

          function executeRoll() {
              Game.isBusy = true;
              document.getElementById("btnRoll").disabled = true;
              const cur = Game.players[Game.turn];
              AudioFX.play('roll');
              const c1 = document.getElementById("die1"), c2 = document.getElementById("die2");
              c1.classList.add("rolling"); c2.classList.add("rolling");
              const dur = Game.diceSpeed === 'fast' ? 250 : (Game.diceSpeed === 'slow' ? 750 : 450);

              setTimeout(() => {
                  c1.classList.remove("rolling"); c2.classList.remove("rolling");
                  const d1 = Math.floor(Math.random() * 6) + 1, d2 = Math.floor(Math.random() * 6) + 1;
                  setCube(c1, d1); setCube(c2, d2);
                  const sum = d1 + d2, isDbl = (d1 === d2);
                  const b = document.getElementById("diceSumBadge");
                  b.innerText = `${I18N[Game.lang].tot} ${sum}`;
                  b.style.transform = "scale(1.2)"; setTimeout(() => b.style.transform = "scale(1)", 180);

                  logEvent(`🎲 ${Game.lang==='ar'?cur.nameAr:cur.nameEn} (${d1} + ${d2} = ${sum})${isDbl?" [متطابقان!]":""}`);

                  if (cur.inJail) {
                      if (isDbl) {
                          cur.inJail = false; cur.jailTurns = 0; logEvent("🔓 متطابقان! خرج من السجن.");
                          moveSteps(cur, sum, false);
                      } else {
                          cur.jailTurns--;
                          if (cur.jailTurns <= 0) {
                              cur.money -= 50; cur.inJail = false; logEvent("💸 دفع 50$ كفالة وخرج من السجن.");
                              moveSteps(cur, sum, false);
                          } else {
                              logEvent("🔒 لم تتطابق الأرقام. تبقى في السجن."); finishTurn(false);
                          }
                      }
                      return;
                  }

                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow === 3) {
                          logEvent("🚔 3 رميات متطابقة! أُرسل إلى السجن.");
                          sendToJail(cur); finishTurn(false); return;
                      }
                  } else { Game.doublesInRow = 0; }

                  moveSteps(cur, sum, isDbl);
              }, dur);
          }

          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === 'fast' ? 50 : (Game.moveSpeed === 'slow' ? 180 : 110);
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns();
                  if (player.pos === 0) {
                      player.money += 200; AudioFX.play('cash'); logEvent(I18N[Game.lang].passGo); updateUI();
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 180);
                  }
              }, iv);
          }

          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();

              if (tile.type === "property" || tile.type === "railroad" || tile.type === "utility") {
                  if (tile.owner === undefined) {
                      if (player.id === 1 && Game.mode === 'ai') {
                          if (player.money >= tile.price + 100 || (checkMonopolyPot(1, tile.group) && player.money >= tile.price)) {
                              buyProp(player, tile, tile.price); finishTurn(isDbl);
                          } else {
                              Game.pendingTile = { tile, isDbl }; startPropertyAuction();
                          }
                      } else {
                          openDeedModal(tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      const owner = Game.players[tile.owner];
                      if (!tile.mortgaged) {
                          let r = tile.rent || 10;
                          if (tile.type === "property" && checkMonopoly(tile.owner, tile.group)) r *= 2;
                          else if (tile.type === "railroad") { const c = countRailroads(tile.owner); r = 25 * Math.pow(2, c - 1); }
                          player.money -= r; owner.money += r; AudioFX.play('cash');
                          logEvent(`💸 دفع ${Game.lang==='ar'?player.nameAr:player.nameEn} ${r}$ إيجاراً إلى ${Game.lang==='ar'?owner.nameAr:owner.nameEn} في (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
                          checkDeficit(player);
                      } else {
                          logEvent(`🏠 عقار (${Game.lang==='ar'?tile.nameAr:tile.nameEn}) مَرْهُون.`);
                      }
                      finishTurn(isDbl); return;
                  } else {
                      logEvent(`🏠 ${Game.lang==='ar'?player.nameAr:player.nameEn} في ملكيته الخاصة.`);
                      finishTurn(isDbl); return;
                  }
              }

              if (tile.type === "tax") {
                  player.money -= tile.price; AudioFX.play('jail');
                  logEvent(`🚨 دفع ${player.price}$ (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
                  checkDeficit(player); finishTurn(isDbl); return;
              }
              if (tile.type === "gotojail") {
                  logEvent("🚨 إلى السجن فوراً!"); sendToJail(player); finishTurn(false); return;
              }
              if (tile.type === "chance" || tile.type === "chest") {
                  const d = tile.type === "chance" ? CHANCE_CARDS : CHEST_CARDS;
                  const c = d[Math.floor(Math.random() * d.length)];
                  if (player.id === 1 && Game.mode === 'ai') { applyCard(player, c); finishTurn(isDbl); }
                  else { openCardModal(tile.type === "chance" ? "❓ فرصة" : "📦 صندوق الجماعة", c, isDbl); }
                  return;
              }
              finishTurn(isDbl);
          }

          function openJailModal(player) {
              document.getElementById("jailRemainingTurns").innerText = player.jailTurns;
              document.getElementById("jailModal").classList.add("show");
          }
          function jailPayBail() {
              document.getElementById("jailModal").classList.remove("show");
              const cur = Game.players[Game.turn];
              cur.money -= 50; cur.inJail = false; cur.jailTurns = 0;
              logEvent("💸 دفع 50$ كفالة وخرج من السجن."); updateUI(); executeRoll();
          }
          function jailTryDoubles() {
              document.getElementById("jailModal").classList.remove("show"); executeRoll();
          }
          function sendToJail(p) {
              p.pos = 10; p.inJail = true; p.jailTurns = 3; AudioFX.play('jail'); updatePawns(); updateUI();
          }

          function checkAllRailroads(pid) { return [5,15,25,35].every(id => BOARD_TILES[id].owner === pid); }
          function countRailroads(pid) { return [5,15,25,35].filter(id => BOARD_TILES[id].owner === pid).length; }

          function openFastTravelModal(player) {
              const orig = player.pos, targets = [5,15,25,35].filter(id => id !== orig);
              const box = document.getElementById("fastTravelOptions"); box.innerHTML = "";
              targets.forEach(tId => {
                  const btn = document.createElement("button"); btn.className = "btn-m btn-blue";
                  btn.innerText = `🚆 ${Game.lang==='ar'?BOARD_TILES[tId].nameAr:BOARD_TILES[tId].nameEn}`;
                  btn.onclick = () => {
                      document.getElementById("fastTravelModal").classList.remove("show");
                      player.pos = tId; AudioFX.play('step'); updatePawns();
                      if (tId > orig) { player.money += 200; AudioFX.play('cash'); logEvent(I18N[Game.lang].trainGo); }
                      else { logEvent(I18N[Game.lang].trainNoGo); }
                      updateUI(); setTimeout(executeRoll, 350);
                  };
                  box.appendChild(btn);
              });
              document.getElementById("fastTravelModal").classList.add("show");
          }
          function fastTravelSkip() {
              document.getElementById("fastTravelModal").classList.remove("show"); executeRoll();
          }

          function openDeedModal(t, isDbl) {
              Game.pendingTile = { tile:t, isDbl };
              document.getElementById("deedHeader").innerText = Game.lang==='ar'?t.nameAr:t.nameEn;
              document.getElementById("deedHeader").style.background = t.color||"#475569";
              document.getElementById("deedPrice").innerText = t.price + "$";
              document.getElementById("deedRent").innerText = (t.rent||10) + "$";
              document.getElementById("deedDoubleRent").innerText = ((t.rent||10)*2) + "$";
              document.getElementById("deedModal").classList.add("show");
          }
          function confirmBuyProperty() {
              if (!Game.pendingTile) return;
              const cur = Game.players[Game.turn], t = Game.pendingTile.tile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  const isDbl = Game.pendingTile.isDbl;
                  document.getElementById("deedModal").classList.remove("show");
                  finishTurn(isDbl);
              } else alert(Game.lang==='ar'?"السيولة غير كافية!":"Insufficient funds!");
          }
          function startPropertyAuction() {
              document.getElementById("deedModal").classList.remove("show");
              const t = Game.pendingTile ? Game.pendingTile.tile : BOARD_TILES[Game.players[Game.turn].pos];
              const isDbl = Game.pendingTile ? Game.pendingTile.isDbl : false;
              Game.pendingTile = null;
              Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
              logEvent(`🔨 بدأ مزاد علني على (${Game.lang==='ar'?t.nameAr:t.nameEn})`);
              openAuctionModal();
          }
          function openAuctionModal() {
              const a = Game.auction;
              document.getElementById("aucPropName").innerText = Game.lang==='ar'?a.tile.nameAr:a.tile.nameEn;
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? Game.players[a.highestBidder].avatar : "-";
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${Game.lang==='ar'?cur.nameAr:cur.nameEn}`;
              document.getElementById("auctionModal").classList.add("show");
              if (a.bidTurn === 1 && Game.mode === 'ai') {
                  document.getElementById("aucActions").style.pointerEvents = "none";
                  setTimeout(handleAIAuction, 850);
              } else { document.getElementById("aucActions").style.pointerEvents = "auto"; }
          }
          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              const p = Game.players[a.bidTurn];
              if (p.money < a.currentBid + inc) { alert("أموالك لا تكفي!"); return; }
              a.currentBid += inc; a.highestBidder = p.id; AudioFX.play('cash');
              logEvent(`🔨 ${p.avatar} زاد إلى ${a.currentBid}$`);
              a.bidTurn = 1 - a.bidTurn; openAuctionModal();
          }
          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              const p = Game.players[a.bidTurn];
              logEvent(`❌ ${p.avatar} انسحب من المزاد.`);
              a.active = a.active.filter(id => id !== p.id);
              const winId = a.active[0], winner = Game.players[winId];
              document.getElementById("auctionModal").classList.remove("show");
              if (winner.money >= a.currentBid) buyProp(winner, a.tile, a.currentBid);
              const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
          }
          function handleAIAuction() {
              const a = Game.auction; if (!a) return;
              const ai = Game.players[1];
              let val = a.tile.price * 0.9;
              if (checkMonopolyPot(1, a.tile.group)) val = a.tile.price * 1.35;
              if (a.currentBid + 15 <= val && ai.money >= a.currentBid + 40) placeAuctionBid(15);
              else foldAuctionBid();
          }

          function buyProp(p, t, cost) {
              p.money -= cost; t.owner = p.id; t.mortgaged = false;
              if (!p.props.includes(t.id)) p.props.push(t.id);
              AudioFX.play('cash'); logEvent(`🎉 اشترى ${p.avatar} (${Game.lang==='ar'?t.nameAr:t.nameEn}) بـ ${cost}$!`);
              updateUI();
          }
          function checkMonopoly(pid, g) { return g ? BOARD_TILES.filter(t => t.group === g).every(t => t.owner === pid && !t.mortgaged) : false; }
          function checkMonopolyPot(pid, g) {
              if (!g) return false;
              const grp = BOARD_TILES.filter(t => t.group === g);
              return grp.filter(t => t.owner === pid).length >= grp.length - 1;
          }

          function onTileClicked(id) {
              const t = BOARD_TILES[id]; if (!t || t.owner === undefined) return;
              if (t.owner === Game.turn) openMortgageModal();
              else openTradeModal(t);
          }
          function openTradeModal(t) {
              const owner = Game.players[t.owner];
              Game.tradeData = { tile:t, buyerId:Game.turn, sellerId:t.owner, offer:Math.round(t.price * 1.2) };
              document.getElementById("tradePropName").innerText = Game.lang==='ar'?t.nameAr:t.nameEn;
              document.getElementById("tradeOwner").innerText = `${owner.avatar} ${Game.lang==='ar'?owner.nameAr:owner.nameEn}`;
              document.getElementById("tradeOrigPrice").innerText = t.price + "$";
              document.getElementById("tradeOfferAmount").innerText = Game.tradeData.offer + "$";
              document.getElementById("tradeModal").classList.add("show");
          }
          function adjustTradeOffer(d) {
              if (!Game.tradeData) return;
              Game.tradeData.offer = Math.max(10, Game.tradeData.offer + d);
              document.getElementById("tradeOfferAmount").innerText = Game.tradeData.offer + "$";
          }
          function submitTradeOffer() {
              const td = Game.tradeData; document.getElementById("tradeModal").classList.remove("show"); if (!td) return;
              const b = Game.players[td.buyerId];
              if (b.money < td.offer) { alert("ليس لديك سيولة كافية!"); return; }
              if (td.sellerId === 1 && Game.mode === 'ai') {
                  let ok = false;
                  if (!checkMonopoly(1, td.tile.group) && td.offer >= td.tile.price * 1.5) ok = true;
                  if (ok) { execTrade(td); logEvent(`🤝 وافق الصقر على بيع (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) مقابل ${td.offer}$!`); }
                  else { logEvent(`🚫 رفض الصقر بيع (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}).`); }
              } else {
                  document.getElementById("incomingTradeText").innerText = `يعرض ${b.avatar} شراء (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) بمبلغ ${td.offer}$!`;
                  document.getElementById("incomingTradeModal").classList.add("show");
              }
          }
          function acceptIncomingTrade() {
              document.getElementById("incomingTradeModal").classList.remove("show");
              if (Game.tradeData) { execTrade(Game.tradeData); logEvent("🤝 تم إتمام بيع العقار!"); Game.tradeData = null; }
          }
          function rejectIncomingTrade() {
              document.getElementById("incomingTradeModal").classList.remove("show");
              logEvent("🚫 تم رفض عرض شراء العقار."); Game.tradeData = null;
          }
          function execTrade(td) {
              const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
              b.money -= td.offer; s.money += td.offer;
              s.props = s.props.filter(id => id !== t.id); b.props.push(t.id); t.owner = b.id;
              AudioFX.play('cash'); updateUI();
          }
          function closeTradeModal() { document.getElementById("tradeModal").classList.remove("show"); Game.tradeData = null; }

          function openMortgageModal() {
              const p = Game.players[Game.turn], list = document.getElementById("mortgageItemsList"); list.innerHTML = "";
              if (p.props.length === 0) list.innerHTML = `<div style="color:#94A3B8;padding:6px;">لا تمتلك عقارات.</div>`;
              else {
                  p.props.forEach(id => {
                      const t = BOARD_TILES[id], v = Math.round(t.price * 0.5);
                      const d = document.createElement("div"); d.className = "mort-item";
                      d.innerHTML = `<div><div style="font-weight:bold;">${Game.lang==='ar'?t.nameAr:t.nameEn}</div><div style="color:var(--gold-lt);font-size:0.68rem;">${t.mortgaged?"مَرْهُون":`قيمة الرهن: ${v}$`}</div></div><div>${t.mortgaged?`<button class="btn-pill" style="background:#10B981;color:#FFF;" onclick="unmortProp(${t.id})">فك (${v}$)</button>`:`<button class="btn-pill" style="background:#EF4444;color:#FFF;" onclick="mortProp(${t.id})">رهن (+${v}$)</button>`}</div>`;
                      list.appendChild(d);
                  });
              }
              document.getElementById("mortgageModal").classList.add("show");
          }
          function mortProp(id) {
              const t = BOARD_TILES[id]; if (!t || t.mortgaged) return;
              const p = Game.players[t.owner], v = Math.round(t.price * 0.5);
              t.mortgaged = true; p.money += v; AudioFX.play('cash');
              logEvent(`🏦 رهن ${p.avatar} (${Game.lang==='ar'?t.nameAr:t.nameEn}) وحصل على ${v}$.`);
              updateUI(); openMortgageModal();
          }
          function unmortProp(id) {
              const t = BOARD_TILES[id]; if (!t || !t.mortgaged) return;
              const p = Game.players[t.owner], v = Math.round(t.price * 0.5);
              if (p.money >= v) {
                  t.mortgaged = false; p.money -= v; AudioFX.play('cash');
                  logEvent(`🔓 فك ${p.avatar} رهن (${Game.lang==='ar'?t.nameAr:t.nameEn}).`);
                  updateUI(); openMortgageModal();
              } else alert("السيولة غير كافية لفك الرهن!");
          }
          function closeMortgageModal() { document.getElementById("mortgageModal").classList.remove("show"); checkDeficit(Game.players[Game.turn]); }

          function checkDeficit(p) {
              if (p.money < 0) {
                  const unmort = p.props.filter(id => !BOARD_TILES[id].mortgaged);
                  if (unmort.length > 0) {
                      if (p.id === 0 || Game.mode !== 'ai') { logEvent("⚠️ عجز مالي! يجب رهن عقارات."); openMortgageModal(); }
                      else {
                          for (const id of unmort) { mortProp(id); if (p.money >= 0) break; }
                          if (p.money < 0) checkBankrupt(p);
                      }
                  } else checkBankrupt(p);
              }
          }
          function checkBankrupt(p) {
              if (p.money < 0 && p.props.every(id => BOARD_TILES[id].mortgaged)) {
                  const win = Game.players[1 - p.id]; AudioFX.play('win');
                  document.getElementById("winnerText").innerText = `🏆 فاز ${win.avatar} ${Game.lang==='ar'?win.nameAr:win.nameEn}!`;
                  document.getElementById("winnerSubtext").innerText = `أفلس ${Game.lang==='ar'?p.nameAr:p.nameEn} تماماً بعد رهن جميع عقاراته.`;
                  document.getElementById("winnerModal").classList.add("show");
              }
          }

          function finishTurn(canRoll) {
              updateUI(); Game.isBusy = false;
              if (canRoll) {
                  logEvent(I18N[Game.lang].dbl);
                  if (Game.mode === 'ai' && Game.turn === 1) setTimeout(executeRoll, 850);
                  else document.getElementById("btnRoll").disabled = false;
              } else {
                  setTimeout(() => {
                      Game.doublesInRow = 0; Game.turn = 1 - Game.turn; updateUI(); startPlayerTurn();
                  }, 900);
              }
          }

          function handleAITurn() {
              const ai = Game.players[1];
              if (ai.inJail) {
                  if (ai.money >= 250) { ai.money -= 50; ai.inJail = false; ai.jailTurns = 0; logEvent("💸 دفع الصقر 50$ كفالة وخرج."); updateUI(); executeRoll(); }
                  else executeRoll();
                  return;
              }
              // Proactive trade
              if (Math.random() < 0.35 && ai.money >= 350) {
                  const p0Props = Game.players[0].props;
                  for (const id of p0Props) {
                      const t = BOARD_TILES[id];
                      if (t.group && BOARD_TILES.filter(x => x.group === t.group && x.owner === 1).length >= 1) {
                          const off = Math.round(t.price * 1.4);
                          Game.tradeData = { tile:t, buyerId:1, sellerId:0, offer:off };
                          document.getElementById("incomingTradeText").innerText = `🤖 يعرض عليك الصقر شراء عقارك (${Game.lang==='ar'?t.nameAr:t.nameEn}) بمبلغ سخي ${off}$!`;
                          document.getElementById("incomingTradeModal").classList.add("show");
                          return;
                      }
                  }
              }
              executeRoll();
          }

          function openCardModal(t, c, isDbl) {
              document.getElementById("cardType").innerText = t;
              document.getElementById("cardMessage").innerText = Game.lang==='ar'?c.textAr:c.textEn;
              document.getElementById("cardModal").classList.add("show");
              Game.pendingCard = { card:c, isDbl };
          }
          function closeCardModal() {
              document.getElementById("cardModal").classList.remove("show");
              if (Game.pendingCard) {
                  const cur = Game.players[Game.turn];
                  applyCard(cur, Game.pendingCard.card);
                  const isDbl = Game.pendingCard.isDbl; Game.pendingCard = null; finishTurn(isDbl);
              }
          }
          function applyCard(p, c) {
              if (c.amount) {
                  p.money += c.amount; AudioFX.play(c.amount > 0 ? 'cash' : 'jail');
                  logEvent(`📜 تأثير البطاقة: ${c.amount > 0 ? "+" : ""}${c.amount}$`); checkDeficit(p);
              } else if (c.action === "go") { p.pos = 0; p.money += 200; AudioFX.play('cash'); updatePawns(); }
              else if (c.action === "jail") sendToJail(p);
              updateUI();
          }

          function openSettingsModal() { renderAvatarPickers(); document.getElementById("settingsModal").classList.add("show"); }
          function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }
          function setDiceSpeed(s) {
              Game.diceSpeed = s;
              document.getElementById("btnDSpd1").className = "btn-pill" + (s==='slow'?" active":"");
              document.getElementById("btnDSpd2").className = "btn-pill" + (s==='normal'?" active":"");
              document.getElementById("btnDSpd3").className = "btn-pill" + (s==='fast'?" active":"");
          }
          function setMoveSpeed(s) {
              Game.moveSpeed = s;
              document.getElementById("btnMSpd1").className = "btn-pill" + (s==='slow'?" active":"");
              document.getElementById("btnMSpd2").className = "btn-pill" + (s==='normal'?" active":"");
              document.getElementById("btnMSpd3").className = "btn-pill" + (s==='fast'?" active":"");
          }
          function toggleSound() {
              AudioFX.enabled = !AudioFX.enabled;
              const b = document.getElementById("btnSoundToggle");
              b.className = "btn-pill" + (AudioFX.enabled?" active":"");
              b.innerText = AudioFX.enabled ? "مفعل 🔊" : "مكتوم 🔇";
          }
          function renderAvatarPickers() {
              const g0 = document.getElementById("avatarPickerP0"), g1 = document.getElementById("avatarPickerP1");
              g0.innerHTML = ""; g1.innerHTML = "";
              AVATARS.forEach(av => {
                  const d0 = document.createElement("div"); d0.className = "avatar-opt" + (Game.players[0].avatar===av?" active":"");
                  d0.innerText = av; d0.onclick = () => { Game.players[0].avatar = av; renderAvatarPickers(); updateUI(); };
                  g0.appendChild(d0);
                  const d1 = document.createElement("div"); d1.className = "avatar-opt" + (Game.players[1].avatar===av?" active":"");
                  d1.innerText = av; d1.onclick = () => { Game.players[1].avatar = av; renderAvatarPickers(); updateUI(); };
                  g1.appendChild(d1);
              });
          }
          function setPropertyStyle(s) {
              Game.propStyle = s;
              document.getElementById("btnStGlow").className = "btn-pill" + (s==='glow'?" active":"");
              document.getElementById("btnStBadge").className = "btn-pill" + (s==='badge'?" active":"");
              document.getElementById("btnStTint").className = "btn-pill" + (s==='tint'?" active":"");
              document.getElementById("btnStBorder").className = "btn-pill" + (s==='border'?" active":"");
              updateBoardVisual();
          }
          function setLanguage(l) {
              Game.lang = l;
              document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
              document.getElementById("btnLangAr").className = "btn-pill" + (l==='ar'?" active":"");
              document.getElementById("btnLangEn").className = "btn-pill" + (l==='en'?" active":"");
              document.getElementById("txtAppTitle").innerText = I18N[l].app;
              document.getElementById("txtMode").innerText = Game.mode === 'ai' ? I18N[l].ai : I18N[l].pvp;
              document.getElementById("txtBtnRoll").innerText = I18N[l].roll;
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tName-" + t.id);
                  if (el) el.innerText = l === 'ar' ? t.nameAr : t.nameEn;
              });
              updateUI();
          }
          function openAboutModal() { document.getElementById("aboutModal").classList.add("show"); }
          function closeAboutModal() { document.getElementById("aboutModal").classList.remove("show"); }
          function toggleMode() {
              Game.mode = Game.mode === 'ai' ? 'pvp' : 'ai';
              if (Game.mode === 'ai') { Game.players[1].nameAr = "الصقر (الذكاء)"; Game.players[1].nameEn = "Falcon (AI)"; }
              else { Game.players[1].nameAr = "اللاعب 2 (الصقر)"; Game.players[1].nameEn = "Player 2 (Falcon)"; }
              document.getElementById("txtMode").innerText = Game.mode === 'ai' ? I18N[Game.lang].ai : I18N[Game.lang].pvp;
              logEvent(`🎮 نمط اللعب: ${document.getElementById("txtMode").innerText}`); updateUI();
          }
          function restartGame() { location.reload(); }

          window.addEventListener("DOMContentLoaded", () => {
              renderBoard(); updateUI(); startPlayerTurn();
          });
          </script>
          </body>
          </html>
          """

          for path, content in files.items():
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content.strip() + "\n")

          print("All Monopoly Arabia files generated successfully!")
          PYEOF

      - name: ⚙️ تجهيز وإعداد Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: 🔨 بناء ملف APK الرسمي
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 استخراج ملف APK
        run: |
          mkdir -p apk_output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "تم العثور على التطبيق: $APK_FILE"
          cp "$APK_FILE" "apk_output/Monopoly_Arabia.apk"

      - name: 🚀 رفع ملف الـ APK للتحميل المباشر (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Monopoly_Arabia_APK
          path: apk_output/Monopoly_Arabia.apk
          retention-days: 30

      - name: 🌟 إنشاء Release رسمي في جيت هوب
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          name: "🎲 مونوبولي العرب - الإصدار الملكي 1.0"
          body: "تم بناء لعبة مونوبولي العرب (بنك الحظ الملكي) بنجاح بصيغة APK جاهز للتحميل والتثبيت المباشر."
          files: apk_output/Monopoly_Arabia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
