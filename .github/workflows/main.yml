                      propStyle: Game.propStyle,
                      lang: Game.lang,
                      players: JSON.parse(JSON.stringify(Game.players)),
                      tiles: BOARD_TILES.map(t => ({ id: t.id, owner: t.owner, mortgaged: t.mortgaged, floors: t.floors || 0 }))
                  };
                  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                  return true;
              } catch(e) {
                  return false;
              }
          }
          
          function loadSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  if (!data || !data.players) return false;
          
                  Game.turn = data.turn ?? 0;
                  Game.doublesInRow = data.doublesInRow ?? 0;
                  if (data.mode) Game.mode = data.mode;
                  if (data.aiDifficulty) Game.aiDifficulty = data.aiDifficulty;
                  if (data.startingCash) Game.startingCash = data.startingCash;
                  toggleCollectRentInJail(data.collectRentInJail ?? false);
                  if (data.theme) setTheme(data.theme);
                  if (data.diceSpeed) Game.diceSpeed = data.diceSpeed;
                  if (data.moveSpeed) Game.moveSpeed = data.moveSpeed;
                  if (data.propStyle) Game.propStyle = data.propStyle;
                  if (data.lang) Game.lang = data.lang;
          
                  Game.players = data.players;
                  if (data.tiles) {
                      data.tiles.forEach(st => {
                          const t = BOARD_TILES.find(x => x.id === st.id);
                          if (t) {
                              t.owner = st.owner;
                              t.mortgaged = st.mortgaged;
                              t.floors = st.floors || 0;
                          }
                      });
                  }
          
                  setLanguage(Game.lang);
                  setPropStyle(Game.propStyle);
                  setDiceSpeed(Game.diceSpeed);
                  setMoveSpeed(Game.moveSpeed);
                  updateBoardVisual();
                  updatePawns();
                  updateUI();
                  return true;
