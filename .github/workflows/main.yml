                  rulesList.forEach(r => {
                      rulesHtml += `<div class="info-rule-item"><span>•</span><div>${r}</div></div>`;
                  });
          
                  let ownershipExtra = "";
                  if (t.type === "railroad" || t.type === "utility") {
                      const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].nameAr}` : (isAr?"متاح للشراء":"Available for purchase");
                      ownershipExtra = `
                          <div style="background:rgba(128,128,128,0.08); border-radius:6px; padding:6px 10px; margin-top:8px; display:flex; justify-content:space-between; font-size:0.78rem;">
                              <span>${isAr?"المالك الحالي:":"Owner:"} <strong>${ownerTxt}</strong></span>
                              <span>${isAr?"السعر:":"Price:"} <strong style="color:var(--gold);">${t.price}$</strong></span>
                          </div>
                      `;
                  }
          
                  bodyEl.innerHTML = `
                      <div style="text-align:center; margin-bottom:8px;">
                          <span class="info-badge">${isAr ? info.badgeAr : info.badgeEn}</span>
                          <div style="font-size:0.86rem; color:var(--text); margin:4px 0 8px 0; font-weight:600;">
                              ${isAr ? info.descAr : info.descEn}
                          </div>
                      </div>
                      <div class="info-rule-box">
                          <div style="font-size:0.75rem; font-weight:bold; color:var(--gold); margin-bottom:6px;">
                              ${isAr ? "📋 تعليمات وقواعد الخانة:" : "📋 Tile Rules & Info:"}
                          </div>
                          ${rulesHtml}
                      </div>
                      ${ownershipExtra}
                  `;
              }
          
              document.getElementById("tileInfoModal").classList.add("show");
          }
          
          function closeTileInfoModal() {
              document.getElementById("tileInfoModal").classList.remove("show");
          }
          
          window.handleAndroidBack = function() {
              const openModals = Array.from(document.querySelectorAll('.modal-overlay.show'));
              if (openModals.length > 0) {
                  const exitModal = document.getElementById("exitModal");
                  if (exitModal && exitModal.classList.contains("show")) {
                      closeExitModal();
                      return;
                  }
                  const lastModal = openModals[openModals.length - 1];
                  if (lastModal.id === "chanceWheelModal" && isWheelSpinning) {
                      return;
                  }
                  lastModal.classList.remove("show");
                  if (lastModal.id === "deedModal" && Game.pendingTile) {
                      const { tile, isDbl } = Game.pendingTile;
                      Game.pendingTile = null;
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                      } else {
                          finishTurn(isDbl);
                      }
                  }
                  if (lastModal.id === "fastTravelModal" && Game.fastTravelData) {
                      const isDbl = Game.fastTravelData.isDbl;
                      Game.fastTravelData = null;
                      finishTurn(isDbl);
                  }
                  if (lastModal.id === "auctionModal" && Game.auction) {
                      stopAuctionTimer();
                      const { tile, isDbl } = Game.auction;
                      Game.auction = null;
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                      } else {
                          finishTurn(isDbl);
                      }
                  }
                  return;
              }
              openExitModal();
          };
          
          function openExitModal() {
              document.getElementById("exitModal").classList.add("show");
          }
          function closeExitModal() {
              document.getElementById("exitModal").classList.remove("show");
          }
          function confirmExitWithSave() {
              saveCurrentGame();
              confirmExitGame();
          }
          function confirmExitWithoutSave() {
              confirmExitGame();
          }
          function confirmExitGame() {
              if (window.Android && window.Android.exitApp) {
                  window.Android.exitApp();
              } else {
                  window.close();
              }
          }
          
          // تعديل المقايضة في وضع اللاعب مع الروبوت:
          // تظهر دائماً العقارات التي يمتلكها الروبوت فقط، وإذا لم يمتلك أي عقار لا يظهر أي عقار، سواء في دور الروبوت أو دور اللاعب
          function openTradeModal(selectedPropId = null, previousOffer = null, wasRejected = false) {
              let buyerPlayer, targetPlayer;
              if (Game.mode === 'ai') {
                  buyerPlayer = Game.players[0];
                  targetPlayer = Game.players[1];
              } else {
                  buyerPlayer = Game.players[Game.turn];
                  targetPlayer = Game.players[Game.turn === 0 ? 1 : 0];
              }
          
              const sel = document.getElementById("tradeTargetProp");
              sel.innerHTML = "";
          
              const targetProps = BOARD_TILES.filter(t => t.owner === targetPlayer.id && !t.mortgaged);
              const btnSubmit = document.getElementById("btnSubmitTrade");
              const targetLabel = document.getElementById("tradeTargetLabel");
              if (targetLabel) {
                  targetLabel.innerText = Game.lang === 'ar' ? `اختر عقار (${targetPlayer.nameAr}) للشراء:` : `Select ${targetPlayer.nameEn}'s property:`;
              }
          
              if (targetProps.length === 0) {
                  sel.innerHTML = `<option value=''>${Game.lang === 'ar' ? 'لا يملك ' + targetPlayer.nameAr + ' أي عقارات' : 'No properties owned by ' + targetPlayer.nameEn}</option>`;
                  btnSubmit.disabled = true;
              } else {
                  btnSubmit.disabled = false;
                  targetProps.forEach(t => {
                      const opt = document.createElement("option");
                      opt.value = t.id;
                      opt.innerText = `${t.icon||""} ${getTileName(t.id, Game.lang)} (${t.price}$)`;
                      if (selectedPropId !== null && t.id === selectedPropId) {
                          opt.selected = true;
                      }
                      sel.appendChild(opt);
                  });
              }
          
              const notice = document.getElementById("tradeNotice");
              const inputCash = document.getElementById("tradeOfferCash");
          
              if (wasRejected && selectedPropId !== null) {
                  const prop = BOARD_TILES[selectedPropId];
                  const propName = getTileName(prop.id, Game.lang);
                  notice.style.display = "block";
                  notice.style.background = "rgba(239, 68, 68, 0.15)";
                  notice.style.border = "1px solid #EF4444";
                  notice.style.color = "#EF4444";
                  notice.innerHTML = `⚠️ <strong>تم رفض العرض!</strong> رفض ${targetPlayer.nameAr} بيع (${propName}) بمبلغ <strong>${previousOffer}$</strong>.<br>يمكنك رفع السعر وإعادة المحاولة أو الخروج.`;
                  const suggestedOffer = previousOffer ? (previousOffer + 50) : (prop.price + 50);
                  inputCash.value = Math.min(buyerPlayer.money, suggestedOffer);
                  btnSubmit.innerText = Game.lang === 'ar' ? "زيادة العرض وإعادة الإرسال" : "Increase Offer & Resubmit";
              } else {
                  notice.style.display = "none";
                  notice.innerText = "";
                  btnSubmit.innerText = Game.lang === 'ar' ? `إرسال العرض إلى ${targetPlayer.nameAr}` : `Send Offer to ${targetPlayer.nameEn}`;
                  if (targetProps.length > 0) {
                      const curProp = selectedPropId !== null ? BOARD_TILES[selectedPropId] : targetProps[0];
                      if (curProp) inputCash.value = curProp.price;
                  }
              }
          
              document.getElementById("tradeModal").classList.add("show");
          }
          
          function onTradeTargetPropChange() {
              const propId = parseInt(document.getElementById("tradeTargetProp").value);
              const notice = document.getElementById("tradeNotice");
              notice.style.display = "none";
              const targetPlayer = (Game.mode === 'ai') ? Game.players[1] : Game.players[Game.turn === 0 ? 1 : 0];
              document.getElementById("btnSubmitTrade").innerText = Game.lang === 'ar' ? `إرسال العرض إلى ${targetPlayer.nameAr}` : `Send Offer to ${targetPlayer.nameEn}`;
              if (!isNaN(propId)) {
                  const p = BOARD_TILES[propId];
                  if (p) document.getElementById("tradeOfferCash").value = p.price;
              }
          }
          
          function submitTradeOffer() {
              let buyerPlayer, sellerPlayer;
              if (Game.mode === 'ai') {
                  buyerPlayer = Game.players[0];
                  sellerPlayer = Game.players[1];
              } else {
                  buyerPlayer = Game.players[Game.turn];
                  sellerPlayer = Game.players[Game.turn === 0 ? 1 : 0];
              }
          
              const propId = parseInt(document.getElementById("tradeTargetProp").value);
              const offerCash = parseInt(document.getElementById("tradeOfferCash").value);
              const notice = document.getElementById("tradeNotice");
          
              if (isNaN(propId) || isNaN(offerCash) || offerCash <= 0) return;
              if (buyerPlayer.money < offerCash) {
                  notice.style.display = "block";
                  notice.style.background = "rgba(239, 68, 68, 0.15)";
                  notice.style.border = "1px solid #EF4444";
                  notice.style.color = "#EF4444";
                  notice.innerText = Game.lang === 'ar' ? "رصيدك المالي لا يكفي للمبلغ المعروض!" : "Insufficient funds for this offer!";
                  return;
              }
              const targetTile = BOARD_TILES[propId];
              closeTradeModal();
          
              const td = { buyerId:buyerPlayer.id, sellerId:sellerPlayer.id, tile:targetTile, offer:offerCash };
              Game.tradeData = td;
          
              if (Game.mode === 'ai') {
                  evaluateAITrade(td);
              } else {
                  promptPvPTradeDecision(td);
              }
          }
          
          function evaluateAITrade(td) {
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';
              let ok = false;
          
              const myPot = checkMonopolyPot(1, td.tile.group);
              const oppPot = checkMonopolyPot(0, td.tile.group);
          
              let threshold = 1.35;
              if (diff === 'easy') {
                  threshold = myPot ? 1.30 : 1.10;
              } else if (diff === 'medium') {
                  threshold = myPot ? 1.60 : 1.35;
              } else if (diff === 'hard') {
                  threshold = (myPot || oppPot) ? 2.50 : 1.75;
              } else {
                  if (oppPot) threshold = 6.0;
                  else if (myPot) threshold = 4.5;
                  else threshold = 2.8;
              }
          
              if (td.offer >= td.tile.price * threshold) {
                  ok = true;
              }
          
              if (ok) {
                  execTrade(td);
                  logEvent(`🤝 وافق ${ai.nameAr} على بيع (${getTileName(td.tile.id, Game.lang)}) مقابل ${td.offer}$.`);
              } else {
                  logEvent(`❌ رفض ${ai.nameAr} عرض المقايضة لعقار (${getTileName(td.tile.id, Game.lang)}) بمبلغ ${td.offer}$.`);
                  setTimeout(() => {
                      openTradeModal(td.tile.id, td.offer, true);
                  }, 500);
              }
          }
          
          function promptPvPTradeDecision(td) {
              const buyer = Game.players[td.buyerId];
              const seller = Game.players[td.sellerId];
              const descEl = document.getElementById("pvpTradeDesc");
              descEl.innerHTML = `
                  <span style="color:var(--gold); font-size:1.05rem;">${buyer.avatar} ${buyer.nameAr}</span><br>
                  يعرض عليك مبلغ <strong style="color:var(--gold); font-size:1.25rem;">${td.offer}$</strong><br>
                  لشراء عقارك (<strong style="color:var(--text);">${getTileName(td.tile.id, Game.lang)}</strong>).<br><br>
                  هل توافق يا <span style="color:var(--p1); font-size:1.05rem;">${seller.avatar} ${seller.nameAr}</span>؟
              `;
              document.getElementById("pvpTradeConfirmModal").classList.add("show");
          }
          
          function acceptPvPTrade() {
              if (!Game.tradeData) return;
              const td = Game.tradeData;
              document.getElementById("pvpTradeConfirmModal").classList.remove("show");
              execTrade(td);
              const seller = Game.players[td.sellerId];
              logEvent(`🤝 وافق ${seller.nameAr} على الصفقة!`);
              Game.tradeData = null;
          }
          
          function rejectPvPTrade() {
              if (!Game.tradeData) return;
              const td = Game.tradeData;
              document.getElementById("pvpTradeConfirmModal").classList.remove("show");
              const seller = Game.players[td.sellerId];
              logEvent(`❌ رفض ${seller.nameAr} عرض المقايضة.`);
              setTimeout(() => {
                  openTradeModal(td.tile.id, td.offer, true);
              }, 400);
          }
          
          function execTrade(td) {
              const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
              b.money -= td.offer; s.money += td.offer;
              s.props = s.props.filter(id => id !== t.id); b.props.push(t.id); t.owner = b.id;
              AudioFX.play('cash'); updateUI();
          }
          function closeTradeModal() { document.getElementById("tradeModal").classList.remove("show"); Game.tradeData = null; }
          
          function setTheme(t) {
              Game.theme = t;
              if (t === 'light') {
                  document.body.classList.add('theme-light');
                  document.getElementById('btnThemeDark').classList.remove('active');
                  document.getElementById('btnThemeLight').classList.add('active');
              } else {
                  document.body.classList.remove('theme-light');
                  document.getElementById('btnThemeLight').classList.remove('active');
                  document.getElementById('btnThemeDark').classList.add('active');
              }
          }
          
          function setLanguage(l) {
              Game.lang = l;
              document.documentElement.dir = (l === 'ar' || l === 'fa') ? 'rtl' : 'ltr';
          
              const sel = document.getElementById("selGameLang");
              if (sel && sel.value !== l) sel.value = l;
          
              const tr = I18N[l] || I18N['en'];
          
              document.getElementById("txtAppTitle").innerText = tr.app || "MONOPOLY PRO";
              document.getElementById("txtBtnRoll").innerText = tr.roll || "Roll Dice";
              document.getElementById("txtBtnTrade").innerText = tr.trade || "Trade";
              const txtSet = document.getElementById("txtBtnSettings");
              if (txtSet) txtSet.innerText = tr.settings || "Settings";
          
              const txtSettingsTitle = document.getElementById("txtSettingsTitle");
              if (txtSettingsTitle) txtSettingsTitle.innerText = tr.settingsTitle || "⚙️ Settings";
          
              const txtSettingsTheme = document.getElementById("txtSettingsTheme");
              if (txtSettingsTheme) txtSettingsTheme.innerText = tr.themeLbl || "🌓 Theme:";
          
              const btnThemeDark = document.getElementById("btnThemeDark");
              if (btnThemeDark) btnThemeDark.innerText = tr.themeDark || "Dark 🌙";
          
              const btnThemeLight = document.getElementById("btnThemeLight");
              if (btnThemeLight) btnThemeLight.innerText = tr.themeLight || "Light ☀️";
          
              const lblLangSelect = document.getElementById("lblLangSelect");
              if (lblLangSelect) lblLangSelect.innerText = tr.langLbl || "🌐 Language:";
          
              const lblPropStyleSection = document.getElementById("lblPropStyleSection");
              if (lblPropStyleSection) lblPropStyleSection.innerText = tr.propStyleLbl || "🎨 Highlight:";
          
              const btnPropStyleGlow = document.getElementById("btnPropStyleGlow");
              if (btnPropStyleGlow) btnPropStyleGlow.innerText = tr.styleGlow || "Glow";
          
              const btnPropStyleTint = document.getElementById("btnPropStyleTint");
              if (btnPropStyleTint) btnPropStyleTint.innerText = tr.styleTint || "Tint";
          
              const btnPropStyleBorder = document.getElementById("btnPropStyleBorder");
              if (btnPropStyleBorder) btnPropStyleBorder.innerText = tr.styleBorder || "Border";
          
              const btnPropStyleBadge = document.getElementById("btnPropStyleBadge");
              if (btnPropStyleBadge) btnPropStyleBadge.innerText = tr.styleBadge || "Badge";
          
              const lblDiceSpeedSection = document.getElementById("lblDiceSpeedSection");
              if (lblDiceSpeedSection) lblDiceSpeedSection.innerText = tr.diceSpeedLbl || "🎲 Dice Speed:";
          
              const lblMoveSpeedSection = document.getElementById("lblMoveSpeedSection");
              if (lblMoveSpeedSection) lblMoveSpeedSection.innerText = tr.moveSpeedLbl || "🏃 Move Speed:";
          
              const speeds = [
                  { id: "v_slow", k: "speedVSlow" },
                  { id: "slow", k: "speedSlow" },
                  { id: "normal", k: "speedNormal" },
                  { id: "fast", k: "speedFast" },
                  { id: "v_fast", k: "speedVFast" }
              ];
              speeds.forEach(s => {
                  const bD = document.getElementById("btnDiceSpeed_" + s.id);
                  if (bD) bD.innerText = tr[s.k] || s.id;
                  const bM = document.getElementById("btnMoveSpeed_" + s.id);
                  if (bM) bM.innerText = tr[s.k] || s.id;
              });
          
              const lblSoundSection = document.getElementById("lblSoundSection");
              if (lblSoundSection) lblSoundSection.innerText = tr.soundLbl || "🔊 Sound Effects:";
          
              const btnSoundOn = document.getElementById("btnSoundOn");
              if (btnSoundOn) btnSoundOn.innerText = tr.soundOn || "Enabled 🔊";
          
              const btnSoundOff = document.getElementById("btnSoundOff");
              if (btnSoundOff) btnSoundOff.innerText = tr.soundOff || "Muted 🔇";
          
              const lblCurrentGameSection = document.getElementById("lblCurrentGameSection");
              if (lblCurrentGameSection) lblCurrentGameSection.innerText = tr.gameDetailsLbl || "👥 Game Details:";
          
              const btnAboutSettings = document.getElementById("btnAboutSettings");
              if (btnAboutSettings) btnAboutSettings.innerText = tr.aboutBtn || "ℹ️ About Game";
          
              const btnNewGameSettings = document.getElementById("btnNewGameSettings");
              if (btnNewGameSettings) btnNewGameSettings.innerText = tr.newGameBtn || "✨ Start New Game";
          
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tName-" + t.id);
                  if (el) el.innerText = getTileName(t.id, l);
              });
          
              if (wheelDrawn) drawChanceWheel();
          
              updateUI();
          }
          
          function setPropStyle(s) {
              Game.propStyle = s;
              ["glow","tint","border","badge"].forEach(id => {
                  document.getElementById("btnPropStyle" + id.charAt(0).toUpperCase() + id.slice(1)).className = "btn-pill" + (s === id ? " active" : "");
              });
              updateBoardVisual();
          }
          
          function setDiceSpeed(sp) {
              Game.diceSpeed = sp;
              ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
                  const el = document.getElementById("btnDiceSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }
          
          function setMoveSpeed(sp) {
              Game.moveSpeed = sp;
              ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
                  const el = document.getElementById("btnMoveSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }
          
          function setSound(en) {
              AudioFX.enabled = en;
              document.getElementById("btnSoundOn").className = "btn-pill" + (en ? " active" : "");
              document.getElementById("btnSoundOff").className = "btn-pill" + (!en ? " active" : "");
          }
          
          function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
          function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }
          function openAboutModal() { document.getElementById("aboutModal").classList.add("show"); }
          function closeAboutModal() { document.getElementById("aboutModal").classList.remove("show"); }
          
          window.addEventListener("DOMContentLoaded", () => {
              renderBoard();
              updateUI();
              showStartModal();
          });
          </script>
          </body>
          </html>
          '''

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("✅ All project files created successfully with all features!")
          PYEOF

      - name: 🔨 إعطاء صلاحيات التشغيل لـ Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: 🚀 بناء حزمة APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف APK كعنصر قابل للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار تلقائي على GitHub (Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "MONOPOLY PRO - الإصدار 1.0.0"
          body: "🎲 النسخة الرسمية لتطبيق لعبة MONOPOLY PRO بنك الحظ الاحترافي (APK جاهز للتثبيت المباشر على الأندرويد). برمجة وتصميم عمار الهلالي."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
