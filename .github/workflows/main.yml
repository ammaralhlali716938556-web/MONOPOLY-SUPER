          <script>
          const RAW_TILES = [
          [0,"انطلق","GO","go","",0,0,"#10B981","🏁"],[1,"شارع المعز","Al-Muizz St","property","brown",60,6,"#8B4513",""],[2,"صندوق الجماعة","Community","chest","",0,0,"#3B82F6","📦"],[3,"خان الخليلي","Khan El-Khalili","property","brown",60,6,"#8B4513",""],[4,"ضريبة الدخل","Income Tax","tax","",200,0,"#EF4444","💰"],[5,"قطار الحجاز","Hejaz Rail","railroad","",200,25,"#64748B","🚂"],[6,"شارع الحمراء","Hamra St","property","lightblue",100,10,"#38BDF8",""],[7,"فرصة","Chance","chance","",0,0,"#F59E0B","❓"],[8,"الروشة","Raouche","property","lightblue",100,10,"#38BDF8",""],[9,"وسط بيروت","Downtown","property","lightblue",120,12,"#38BDF8",""],[10,"السجن / زيارة","Jail","jail","",0,0,"#6B7280","🚔"],[11,"باب توما","Bab Touma","property","pink",140,14,"#EC4899",""],[12,"شركة الكهرباء","Electric Co","utility","",150,0,"#EAB308","💡"],[13,"الصالحية","Salhiyeh","property","pink",140,14,"#EC4899",""],[14,"سوق الحميدية","Hamidiyah","property","pink",160,16,"#EC4899",""],[15,"قطار الحرمين","Haramain Rail","railroad","",200,25,"#64748B","🚂"],[16,"شارع الرشيد","Al-Rasheed St","property","orange",180,18,"#F97316",""],[17,"صندوق الجماعة","Community","chest","",0,0,"#3B82F6","📦"],[18,"المنصور","Mansour","property","orange",180,18,"#F97316",""],[19,"الكرادة","Karrada","property","orange",200,20,"#F97316",""],[20,"مواقف مجانية","Free Parking","parking","",0,0,"#10B981","🅿️"],[21,"شارع النيل","Nile Street","property","red",220,22,"#EF4444",""],[22,"فرصة","Chance","chance","",0,0,"#F59E0B","❓"],[23,"المقرن","Al-Mogran","property","red",220,22,"#EF4444",""],[24,"حي الرياض","Riyadh Dist","property","red",240,24,"#EF4444",""],[25,"قطار المشرق","Mashreq Rail","railroad","",200,25,"#64748B","🚂"],[26,"شارع العليا","Olaya St","property","yellow",260,26,"#EAB308",""],[27,"طريق الملك فهد","King Fahd Rd","property","yellow",260,26,"#EAB308",""],[28,"شركة المياه","Water Works","utility","",150,0,"#06B6D4","💧"],[29,"حي النخيل","Al-Nakheel","property","yellow",280,28,"#EAB308",""],[30,"إلى السجن!","Go to Jail","gotojail","",0,0,"#DC2626","🚨"],[31,"الكورنيش","Corniche","property","green",300,30,"#22C55E",""],[32,"اللؤلؤة","The Pearl","property","green",300,30,"#22C55E",""],[33,"صندوق الجماعة","Community","chest","",0,0,"#3B82F6","📦"],[34,"لوسيل","Lusail","property","green",320,32,"#22C55E",""],[35,"قطار الخليج","Gulf Rail","railroad","",200,25,"#64748B","🚂"],[36,"فرصة","Chance","chance","",0,0,"#F59E0B","❓"],[37,"شارع الشيخ زايد","Sheikh Zayed","property","darkblue",350,35,"#1E40AF",""],[38,"ضريبة الرفاهية","Luxury Tax","tax","",100,0,"#EF4444","💎"],[39,"برج خليفة","Burj Khalifa","property","darkblue",400,50,"#1E40AF",""]
          ];
          
          const BOARD_TILES = RAW_TILES.map(r => ({ id:r[0], nameAr:r[1], nameEn:r[2], type:r[3], group:r[4], price:r[5], rent:r[6], color:r[7], icon:r[8], owner:undefined, mortgaged:false }));
          
          const I18N = {
              ar: { app:"مونوبولي العرب", turn:"دورك", opp:"دور الخصم", roll:"ارمي النرد", buy:"شراء", auction:"مزاد علني", trade:"مقايضة", myProps:"عقاراتي", passGo:"مررت بنقطة الانطلاق وحصلت على 200$!", jailed:"أنت في السجن!", finePaid:"دفعت 50$ كفالة وخرجت من السجن.", doublesJail:"مبروك! نرد متطابق وخرجت من السجن!", rolled:"حصلت على", rentPaid:"دفعت إيجاراً قدره", to:"إلى", deedFor:"عقار متاح للشراء", p:"عقارات", m:"مرهون", ai:"لاعب ضد الصقر (الذكاء)", pvp:"لاعب ضد لاعب (محلي)" },
              en: { app:"Monopoly Arabia", turn:"Your Turn", opp:"Opponent's Turn", roll:"Roll Dice", buy:"Buy", auction:"Auction", trade:"Trade", myProps:"My Properties", passGo:"Passed GO! Collected 200$!", jailed:"In Jail!", finePaid:"Paid 50$ fine and exited jail.", doublesJail:"Doubles rolled! Exited jail freely!", rolled:"Rolled", rentPaid:"Paid rent of", to:"to", deedFor:"Property available for purchase", p:"Props", m:"Mortgaged", ai:"Player vs Falcon (AI)", pvp:"2 Players (Pass & Play)" }
          };
          
          const AudioFX = {
              ctx: null,
              enabled: true,
              init() { if (!this.ctx) { const AudioContext = window.AudioContext || window.webkitAudioContext; if (AudioContext) this.ctx = new AudioContext(); } },
              play(type) {
                  if (!this.enabled) return;
                  this.init();
                  if (!this.ctx) return;
                  if (this.ctx.state === 'suspended') this.ctx.resume();
                  const t = this.ctx.currentTime;
                  const osc = this.ctx.createOscillator();
                  const g = this.ctx.createGain();
                  osc.connect(g); g.connect(this.ctx.destination);
                  if (type === 'dice') {
                      osc.type = 'triangle';
                      osc.frequency.setValueAtTime(140, t);
                      osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
                      g.gain.setValueAtTime(0.25, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.15);
                      osc.start(t); osc.stop(t + 0.15);
                  } else if (type === 'step') {
                      osc.type = 'sine';
                      osc.frequency.setValueAtTime(480, t);
                      g.gain.setValueAtTime(0.12, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.06);
                      osc.start(t); osc.stop(t + 0.06);
                  } else if (type === 'cash') {
                      osc.type = 'sine';
                      osc.frequency.setValueAtTime(587.33, t);
                      osc.frequency.setValueAtTime(880, t + 0.08);
                      g.gain.setValueAtTime(0.2, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.25);
                      osc.start(t); osc.stop(t + 0.25);
                  } else if (type === 'jail') {
                      osc.type = 'sawtooth';
                      osc.frequency.setValueAtTime(180, t);
                      osc.frequency.linearRampToValueAtTime(80, t + 0.35);
                      g.gain.setValueAtTime(0.25, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.35);
                      osc.start(t); osc.stop(t + 0.35);
                  }
              }
          };
          
          const Game = {
              lang: 'ar',
              propStyle: 'glow',
              diceSpeed: 'normal',
              moveSpeed: 'normal',
              mode: 'ai',
              turn: 0,
              doublesInRow: 0,
              isRolling: false,
              pendingTile: null,
              auction: null,
              tradeData: null,
              players: [
                  { id:0, nameAr:"الملك (أنت)", nameEn:"King (You)", avatar:"👑", color:"#EF4444", money:1500, pos:0, inJail:false, jailTurns:0, props:[] },
                  { id:1, nameAr:"الصقر (الذكاء)", nameEn:"Falcon (AI)", avatar:"🦅", color:"#38BDF8", money:1500, pos:0, inJail:false, jailTurns:0, props:[] }
              ]
          };
          
          function getGridCoords(i) {
              if (i === 0) return { r: 11, c: 11 };
              if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
              if (i === 10) return { r: 11, c: 1 };
              if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
              if (i === 20) return { r: 1, c: 1 };
              if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
              if (i === 30) return { r: 1, c: 11 };
              if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
              return { r: 11, c: 11 };
          }
          
          function renderBoard() {
              const boardEl = document.getElementById("board");
              BOARD_TILES.forEach((tile, index) => {
                  const coords = getGridCoords(index);
                  const tileDiv = document.createElement("div");
                  tileDiv.id = "tile-" + index;
          
                  let side = "side-bottom";
                  if (index >= 11 && index <= 19) side = "side-left";
                  else if (index >= 20 && index <= 30) side = "side-top";
                  else if (index >= 31 && index <= 39) side = "side-right";
                  tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile corner-" + index : "");
          
                  tileDiv.style.gridRow = coords.r;
                  tileDiv.style.gridColumn = coords.c;
                  tileDiv.onclick = () => onTileClicked(index);
          
                  let h = "";
                  if (tile.type === "property") {
                      h += `<div class="tile-bar" style="background:${tile.color}"></div><div class="tile-cnt"><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else if (tile.type === "railroad" || tile.type === "utility") {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
                  } else {
                      h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon||"🏛️"}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div></div>`;
                  }
                  h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
                  tileDiv.innerHTML = h;
                  boardEl.appendChild(tileDiv);
              });
              updatePawns();
          }
          
          let pawnEl0 = null, pawnEl1 = null;
          function getPawnEl(id) {
              if (id === 0) {
                  if (!pawnEl0) { pawnEl0 = document.createElement("div"); pawnEl0.id = "pawn-p0"; pawnEl0.className = "pawn pawn-p0"; }
                  pawnEl0.innerText = Game.players[0].avatar;
                  return pawnEl0;
              } else {
                  if (!pawnEl1) { pawnEl1 = document.createElement("div"); pawnEl1.id = "pawn-p1"; pawnEl1.className = "pawn pawn-p1"; }
                  pawnEl1.innerText = Game.players[1].avatar;
                  return pawnEl1;
              }
          }
          
          function updatePawns(movingId = null) {
              if (movingId !== null) {
                  const p = Game.players[movingId];
                  const el = getPawnEl(movingId);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                      el.classList.add("moving-step");
                      setTimeout(() => el.classList.remove("moving-step"), 110);
                  }
                  return;
              }
              Game.players.forEach(p => {
                  const el = getPawnEl(p.id);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                  }
              });
          }
          
          function updateUI() {
              const p0 = Game.players[0], p1 = Game.players[1];
              document.getElementById("cashP0").innerText = p0.money + "$";
              document.getElementById("cashP1").innerText = p1.money + "$";
              const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
              const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;
              document.getElementById("propsP0").innerText = `${I18N[Game.lang].p} ${p0.props.length}`;
              document.getElementById("propsP1").innerText = `${I18N[Game.lang].p} ${p1.props.length}`;
              document.getElementById("mortP0").innerText = m0 > 0 ? `(${I18N[Game.lang].m} ${m0})` : "";
              document.getElementById("mortP1").innerText = m1 > 0 ? `(${I18N[Game.lang].m} ${m1})` : "";
          
              document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
              document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
              document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
              document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";
              document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
              document.getElementById("turnBadge1").innerText = I18N[Game.lang].opp;
          
              const cur = Game.players[Game.turn];
              document.getElementById("turnAnnouncer").innerText = `${I18N[Game.lang].turn}: ${cur.avatar} ${Game.lang==='ar'?cur.nameAr:cur.nameEn}`;
              document.getElementById("avP0").innerText = p0.avatar;
              document.getElementById("avP1").innerText = p1.avatar;
              document.getElementById("nameP0").innerText = Game.lang==='ar'?p0.nameAr:p0.nameEn;
              document.getElementById("nameP1").innerText = Game.lang==='ar'?p1.nameAr:p1.nameEn;
          
              updateBoardVisual();
          }
          
          function updateBoardVisual() {
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tile-" + t.id);
                  if (!el) return;
                  el.classList.remove("owned-glow","owned-tint","owned-border");
                  const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
                  const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();
          
                  if (t.owner !== undefined) {
                      const owner = Game.players[t.owner];
                      el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                      if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                      else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                      else if (Game.propStyle === 'border') el.classList.add("owned-border");
                      else if (Game.propStyle === 'badge') {
                          const bg = document.createElement("div"); bg.className = "tile-owner-badge"; bg.innerText = owner.avatar; el.appendChild(bg);
                      }
                      if (t.mortgaged) {
                          const mg = document.createElement("div"); mg.className = "tile-mortgaged-badge"; mg.innerText = Game.lang==='ar'?"مَرْهُون":"MORTGAGED"; el.appendChild(mg);
                      }
                  } else { el.style.color = ""; }
              });
          }
          
          function logEvent(msg) {
              const el = document.getElementById("gameLog");
              el.innerText = msg;
          }
          
          function rollDice() {
              if (Game.isRolling) return;
              const cur = Game.players[Game.turn];
              if (cur.inJail) { openJailModal(); return; }
          
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;
          
              const d0 = document.getElementById("die0");
              const d1 = document.getElementById("die1");
              d0.classList.add("rolling");
              d1.classList.add("rolling");
              AudioFX.play('dice');
          
              const dur = Game.diceSpeed === "v_slow" ? 1400 : (Game.diceSpeed === "slow" ? 900 : (Game.diceSpeed === "fast" ? 250 : (Game.diceSpeed === "v_fast" ? 100 : 500)));
              setTimeout(() => {
                  d0.classList.remove("rolling");
                  d1.classList.remove("rolling");
          
                  const val0 = Math.floor(Math.random() * 6) + 1;
                  const val1 = Math.floor(Math.random() * 6) + 1;
                  setDieFace(d0, val0);
                  setDieFace(d1, val1);
          
                  const sum = val0 + val1;
                  const isDbl = (val0 === val1);
                  logEvent(`${cur.avatar} ${I18N[Game.lang].rolled} ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);
          
                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow >= 3) {
                          Game.doublesInRow = 0;
                          logEvent("🚔 3 رميات متطابقة! أُرسل إلى السجن.");
                          sendToJail(cur); finishTurn(false); return;
                      }
                  } else { Game.doublesInRow = 0; }
          
                  moveSteps(cur, sum, isDbl);
              }, dur);
          }
          
          function setDieFace(dieEl, val) {
              const rot = {
                  1: "rotateX(0deg) rotateY(0deg)",
                  6: "rotateY(180deg)",
                  2: "rotateY(90deg)",
                  5: "rotateY(-90deg)",
                  3: "rotateX(-90deg)",
                  4: "rotateX(90deg)"
              };
              dieEl.style.transform = rot[val];
          }
          
          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === "v_slow" ? 350 : (Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : (Game.moveSpeed === "v_fast" ? 20 : 120)));
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns(player.id);
                  if (player.pos === 0) {
                      player.money += 200;
                      AudioFX.play('cash');
                      logEvent(I18N[Game.lang].passGo);
                      document.getElementById("cashP0").innerText = Game.players[0].money + "$";
                      document.getElementById("cashP1").innerText = Game.players[1].money + "$";
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 160);
                  }
              }, iv);
          }
          
          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();
          
              if (tile.type === "gotojail") {
                  sendToJail(player); finishTurn(false); return;
              }
          
              if (tile.type === "tax") {
                  player.money = Math.max(0, player.money - tile.price);
                  AudioFX.play('cash');
                  logEvent(`💸 ${player.avatar} دفع ${tile.price}$ (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
                  updateUI(); finishTurn(isDbl); return;
              }
          
              if (tile.type === "chance" || tile.type === "chest") {
                  handleCard(player, tile.type, isDbl); return;
              }
          
              if (["property", "railroad", "utility"].includes(tile.type)) {
                  if (tile.owner === undefined) {
                      if (player.id === 0) {
                          promptBuyProperty(tile, isDbl);
                      } else {
                          handleAIBuyDecision(player, tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      if (!tile.mortgaged) {
                          const rent = calculateRent(tile);
                          player.money -= rent;
                          Game.players[tile.owner].money += rent;
                          AudioFX.play('cash');
                          logEvent(`🏷️ دفع ${player.avatar} ${rent}$ إيجار إلى ${Game.players[tile.owner].avatar} (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
                          updateUI();
                      } else {
                          logEvent(`العقار (${Game.lang==='ar'?tile.nameAr:tile.nameEn}) مَرْهُون، معفى من الإيجار.`);
                      }
                      finishTurn(isDbl); return;
                  } else {
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl); return;
                      }
                  }
              }
          
              finishTurn(isDbl);
          }
          
          function promptRailroadFastTravel(player, currentTile, isDbl) {
              const otherRails = BOARD_TILES.filter(t => t.type === "railroad" && t.id !== currentTile.id && t.owner === player.id);
              if (otherRails.length === 0 || player.money < 200) { finishTurn(isDbl); return; }
          
              if (player.id === 0) {
                  const dest = otherRails[0];
                  if (confirm(`🚂 هل ترغب بالسفر السريع إلى (${Game.lang==='ar'?dest.nameAr:dest.nameEn}) مقابل 200$؟`)) {
                      player.money -= 200;
                      player.pos = dest.id;
                      AudioFX.play('step');
                      updatePawns(player.id);
                      updateUI();
                      logEvent(`🚂 سافر الملك سريعاً إلى ${Game.lang==='ar'?dest.nameAr:dest.nameEn} مقابل 200$.`);
                  }
              }
              finishTurn(isDbl);
          }
          
          function calculateRent(tile) {
              if (tile.type === "railroad") {
                  const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
                  return 25 * Math.pow(2, cnt - 1);
              }
              if (tile.type === "utility") {
                  const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
                  return cnt === 2 ? 50 : 20;
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);
              return hasMonopoly ? tile.rent * 2 : tile.rent;
          }
          
          function promptBuyProperty(tile, isDbl) {
              Game.pendingTile = { tile, isDbl };
              document.getElementById("deedTitle").innerText = `${tile.icon||""} ${Game.lang==='ar'?tile.nameAr:tile.nameEn}`;
              document.getElementById("deedBody").innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <span style="display:inline-block; width:14px; height:14px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                      <strong style="font-size:1.1rem; color:var(--gold); margin:0 6px;">${tile.price}$</strong>
                  </div>
                  <div style="font-size:0.8rem; color:var(--dim); text-align:center;">إيجار العقار الأساسي: <strong>${tile.rent}$</strong></div>
                  <div style="font-size:0.75rem; color:var(--dim); text-align:center; margin-top:4px;">(عند اكتمال المجموعة يتضاعف الإيجار تلقائياً)</div>
              `;
              const canAfford = Game.players[0].money >= tile.price;
              document.getElementById("btnBuyProp").disabled = !canAfford;
              document.getElementById("deedModal").classList.add("show");
          }
          
          function closeDeedModal() {
              document.getElementById("deedModal").classList.remove("show");
              if (Game.pendingTile) {
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  finishTurn(isDbl);
              }
          }
          
          function confirmBuyProp() {
              if (!Game.pendingTile) return;
              const cur = Game.players[0];
              const t = Game.pendingTile.tile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  const isDbl = Game.pendingTile.isDbl;
                  document.getElementById("deedModal").classList.remove("show");
                  finishTurn(isDbl);
              }
          }
          
          function startAuction() {
              if (!Game.pendingTile) return;
              const t = Game.pendingTile.tile;
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");
          
              Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
              document.getElementById("auctionModal").classList.add("show");
              updateAuctionUI();
              if (Game.turn === 1) handleAIAuction();
          }
          
          function updateAuctionUI() {
              const a = Game.auction;
              if (!a) return;
              document.getElementById("aucPropDetails").innerText = Game.lang==='ar'?a.tile.nameAr:a.tile.nameEn;
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? Game.players[a.highestBidder].avatar : "-";
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${Game.lang==='ar'?cur.nameAr:cur.nameEn}`;
              document.getElementById("aucControls").style.display = (a.bidTurn === 0) ? "flex" : "none";
          }
          
          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              const bidder = a.bidTurn;
              const p = Game.players[bidder];
              const nextBid = a.currentBid + inc;
              if (p.money >= nextBid) {
                  a.currentBid = nextBid;
                  a.highestBidder = bidder;
                  logEvent(`🔨 زاد ${p.avatar} المزاد إلى ${a.currentBid}$!`);
                  nextAuctionTurn();
              }
          }
          
          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} من المزاد.`);
              a.active = a.active.filter(id => id !== a.bidTurn);
              if (a.active.length === 1 && a.highestBidder !== null) {
                  concludeAuction();
              } else if (a.active.length === 0) {
                  document.getElementById("auctionModal").classList.remove("show");
                  const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
              } else {
                  nextAuctionTurn();
              }
          }
          
          function nextAuctionTurn() {
              const a = Game.auction; if (!a) return;
              a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
              updateAuctionUI();
              if (a.bidTurn === 1 && a.active.includes(1)) setTimeout(handleAIAuction, 600);
          }
          
          function concludeAuction() {
              const a = Game.auction; if (!a) return;
              document.getElementById("auctionModal").classList.remove("show");
              const winner = Game.players[a.highestBidder];
              logEvent(`🏆 فاز ${winner.avatar} بمزاد (${Game.lang==='ar'?a.tile.nameAr:a.tile.nameEn}) بمبلغ ${a.currentBid}$!`);
              buyProp(winner, a.tile, a.currentBid);
              const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
          }
          
          function handleAIAuction() {
              const a = Game.auction; if (!a) return;
              const ai = Game.players[1];
              let val = a.tile.price * 0.9;
              if (checkMonopolyPot(1, a.tile.group)) val = a.tile.price * 1.35;
              if (a.currentBid + 15 <= val && ai.money >= a.currentBid + 40) placeAuctionBid(15);
              else foldAuctionBid();
          }
          
          function handleAIBuyDecision(player, tile, isDbl) {
              const hasCash = player.money >= tile.price + 100;
              const pot = checkMonopolyPot(1, tile.group);
              if (hasCash || pot) {
                  buyProp(player, tile, tile.price);
                  finishTurn(isDbl);
              } else {
                  Game.pendingTile = { tile, isDbl };
                  startAuction();
              }
          }
          
          function checkMonopolyPot(playerId, group) {
              if (!group) return false;
              const groupTiles = BOARD_TILES.filter(t => t.group === group);
              const owned = groupTiles.filter(t => t.owner === playerId).length;
              return owned > 0;
          }
          
          function buyProp(player, tile, price) {
              player.money -= price;
              tile.owner = player.id;
              player.props.push(tile.id);
              AudioFX.play('cash');
              logEvent(`🎉 اشترى ${player.avatar} (${Game.lang==='ar'?tile.nameAr:tile.nameEn}) مقابل ${price}$.`);
              updateUI();
          }
          
          function handleCard(player, type, isDbl) {
              const cards = [
                  { textAr:"ربحت في مسابقة الحظ الملكية! استلم 100$", textEn:"Won royal lottery! Collect 100$", action:"cash", val:100 },
                  { textAr:"غرامة مخالفة سرعة! ادفع 50$", textEn:"Speeding fine! Pay 50$", action:"cash", val:-50 },
                  { textAr:"تقدم مباشرة إلى خانة انطلق واربح 200$", textEn:"Advance to GO, collect 200$", action:"go" },
                  { textAr:"أُرسلت مباشرة إلى السجن!", textEn:"Go directly to jail!", action:"jail" }
              ];
              const c = cards[Math.floor(Math.random() * cards.length)];
              logEvent(`📜 ${c.textAr}`);
              if (c.action === "cash") {
                  player.money = Math.max(0, player.money + c.val);
                  AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
              } else if (c.action === "go") {
                  player.pos = 0; player.money += 200;
                  AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
              } else if (c.action === "jail") {
                  sendToJail(player); finishTurn(false);
              }
          }
          
          function sendToJail(p) {
              p.pos = 10; p.inJail = true; p.jailTurns = 3;
              AudioFX.play('jail'); updatePawns(p.id); updateUI();
              logEvent(`🚔 دَخَل ${p.avatar} السجن!`);
          }
          
          function openJailModal() {
              document.getElementById("jailModal").classList.add("show");
          }
          
          function payJailFine() {
              const cur = Game.players[Game.turn];
              if (cur.money >= 50) {
                  cur.money -= 50; cur.inJail = false; cur.jailTurns = 0;
                  document.getElementById("jailModal").classList.remove("show");
                  AudioFX.play('cash'); updateUI(); logEvent(I18N[Game.lang].finePaid);
              }
          }
          
          function rollForJail() {
              document.getElementById("jailModal").classList.remove("show");
              const v0 = Math.floor(Math.random() * 6) + 1;
              const v1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(document.getElementById("die0"), v0);
              setDieFace(document.getElementById("die1"), v1);
              const cur = Game.players[Game.turn];
              if (v0 === v1) {
                  cur.inJail = false; cur.jailTurns = 0;
                  logEvent(I18N[Game.lang].doublesJail);
                  updateUI(); moveSteps(cur, v0 + v1, false);
              } else {
                  cur.jailTurns--;
                  if (cur.jailTurns <= 0) {
                      cur.money = Math.max(0, cur.money - 50);
                      cur.inJail = false; cur.jailTurns = 0;
                      logEvent("انتهت مدة السجن وتم دفع 50$ كفالة إجبارية.");
                      updateUI(); moveSteps(cur, v0 + v1, false);
                  } else {
                      logEvent(`لم يتطابق النرد (${v0}+${v1})! بقي في السجن.`);
                      finishTurn(false);
                  }
              }
          }
          
          function finishTurn(isDbl) {
              Game.isRolling = false;
              if (isDbl && !Game.players[Game.turn].inJail) {
                  logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} على رمية إضافية.`);
                  startPlayerTurn(); return;
              }
              Game.doublesInRow = 0;
              Game.turn = (Game.turn === 0) ? 1 : 0;
              updateUI();
              startPlayerTurn();
          }
          
          function startPlayerTurn() {
              updateUI();
              const cur = Game.players[Game.turn];
              if (Game.turn === 0) {
                  document.getElementById("btnRoll").disabled = false;
              } else {
                  document.getElementById("btnRoll").disabled = true;
                  if (Game.mode === 'ai') {
                      setTimeout(() => {
                          if (cur.inJail) {
                              if (cur.money >= 300) payJailFine();
                              else rollForJail();
                          } else { rollDice(); }
                      }, 750);
                  } else {
                      document.getElementById("btnRoll").disabled = false;
                  }
              }
          }
          
          function openTradeModal() {
              const sel = document.getElementById("tradeTargetProp");
              sel.innerHTML = "";
              const oppProps = BOARD_TILES.filter(t => t.owner === 1 && !t.mortgaged);
              if (oppProps.length === 0) {
                  sel.innerHTML = "<option>لا يملك الخصم عقارات متاحة</option>";
              } else {
                  oppProps.forEach(t => {
                      const opt = document.createElement("option");
                      opt.value = t.id;
                      opt.innerText = `${t.icon||""} ${Game.lang==='ar'?t.nameAr:t.nameEn} (${t.price}$)`;
                      sel.appendChild(opt);
                  });
              }
              document.getElementById("tradeModal").classList.add("show");
          }
          
          function submitTradeOffer() {
              const propId = parseInt(document.getElementById("tradeTargetProp").value);
              const offerCash = parseInt(document.getElementById("tradeOfferCash").value);
              if (isNaN(propId) || isNaN(offerCash) || offerCash <= 0) return;
              if (Game.players[0].money < offerCash) { alert("رصيدك لا يكفي للمبلغ المعروض!"); return; }
              const targetTile = BOARD_TILES[propId];
              closeTradeModal();
          
              const td = { buyerId:0, sellerId:1, tile:targetTile, offer:offerCash };
              Game.tradeData = td;
              evaluateAITrade(td);
          }
          
          function evaluateAITrade(td) {
              const ai = Game.players[1];
              let ok = false;
              if (td.offer >= td.tile.price * 1.35) ok = true;
              if (checkMonopolyPot(1, td.tile.group) && td.offer >= td.tile.price * 1.5) ok = true;
              if (ok) { execTrade(td); logEvent(`🤝 وافق الصقر على بيع (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) مقابل ${td.offer}$.`); }
              else { logEvent(`❌ رفض الصقر عرض المقايضة لعقار (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}).`); }
          }
          
          function promptIncomingTrade(td) {
              const b = Game.players[td.buyerId];
              document.getElementById("incomingTradeText").innerText = `يعرض ${b.avatar} شراء (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) بمبلغ ${td.offer}$! هل توافق؟`;
              document.getElementById("incomingTradeModal").classList.add("show");
          }
          function acceptTrade() { if (Game.tradeData) { execTrade(Game.tradeData); document.getElementById("incomingTradeModal").classList.remove("show"); } }
          function rejectTrade() { Game.tradeData = null; document.getElementById("incomingTradeModal").classList.remove("show"); }
          function execTrade(td) {
              const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
              b.money -= td.offer; s.money += td.offer;
              s.props = s.props.filter(id => id !== t.id); b.props.push(t.id); t.owner = b.id;
              AudioFX.play('cash'); updateUI();
          }
          function closeTradeModal() { document.getElementById("tradeModal").classList.remove("show"); Game.tradeData = null; }
          
          function openPropsModal(pId) {
              const p = Game.players[pId];
              document.getElementById("propsModalTitle").innerText = `${p.avatar} ${Game.lang==='ar'?p.nameAr:p.nameEn} (${p.money}$)`;
              const b = document.getElementById("propsModalBody");
              b.innerHTML = "";
              if (p.props.length === 0) {
                  b.innerHTML = `<div style="text-align:center; color:var(--dim); padding:16px;">لا توجد أي عقارات مملوكة حالياً.</div>`;
              } else {
                  p.props.forEach(propId => {
                      const t = BOARD_TILES[propId];
                      const d = document.createElement("div");
                      d.style = "background:#0F172A; border-radius:8px; padding:8px 12px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; border:1px solid #334155;";
                      const mortVal = Math.floor(t.price * 0.5);
                      const unmortVal = Math.floor(mortVal * 1.1);
                      d.innerHTML = `
                          <div>
                              <strong style="color:${t.color||'var(--gold)'};">${t.icon||""} ${Game.lang==='ar'?t.nameAr:t.nameEn}</strong>
                              <div style="font-size:0.75rem; color:var(--dim);">القيمة: ${t.price}$ | الرهن: ${mortVal}$</div>
                          </div>
                          <div>
                              ${pId === 0 ? (
                                  t.mortgaged ?
                                  `<button class="btn btn-gold" style="font-size:0.72rem; padding:4px 8px;" onclick="unmortgageProp(${t.id})">فك الرهن (${unmortVal}$)</button>` :
                                  `<button class="btn btn-red" style="font-size:0.72rem; padding:4px 8px;" onclick="mortgageProp(${t.id})">رهن (+${mortVal}$)</button>`
                              ) : (t.mortgaged ? `<span style="color:#EF4444; font-size:0.75rem;">مَرْهُون</span>` : '')}
                          </div>
                      `;
                      b.appendChild(d);
                  });
              }
              document.getElementById("propsModal").classList.add("show");
          }
          function closePropsModal() { document.getElementById("propsModal").classList.remove("show"); }
          
          function mortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              if (t.owner === 0 && !t.mortgaged) {
                  t.mortgaged = true; p.money += Math.floor(t.price * 0.5);
                  AudioFX.play('cash'); updateUI(); openPropsModal(0);
                  logEvent(`🏦 رهن الملك (${Game.lang==='ar'?t.nameAr:t.nameEn}) واستلم ${Math.floor(t.price * 0.5)}$.`);
              }
          }
          function unmortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              const cost = Math.floor(t.price * 0.5 * 1.1);
              if (t.owner === 0 && t.mortgaged && p.money >= cost) {
                  t.mortgaged = false; p.money -= cost;
                  AudioFX.play('cash'); updateUI(); openPropsModal(0);
                  logEvent(`🔓 فك الملك رهن (${Game.lang==='ar'?t.nameAr:t.nameEn}) مقابل ${cost}$.`);
              }
          }
          
          function onTileClicked(index) {
              const t = BOARD_TILES[index];
              if (!["property","railroad","utility"].includes(t.type)) return;
              const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.lang==='ar'?Game.players[t.owner].nameAr:Game.players[t.owner].nameEn}` : "متاح للبيع";
              alert(`📍 ${t.icon||""} ${Game.lang==='ar'?t.nameAr:t.nameEn}\nالسعر: ${t.price}$\nالإيجار: ${t.rent}$\nالمالك: ${ownerTxt}\nالحالة: ${t.mortgaged?'مَرْهُون':'نشط'}`);
          }
          
          function setLanguage(l) {
              Game.lang = l;
              document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
              document.getElementById("btnLangAr").className = "btn-pill" + (l==='ar'?" active":"");
              document.getElementById("btnLangEn").className = "btn-pill" + (l==='en'?" active":"");
              document.getElementById("txtAppTitle").innerText = I18N[l].app;
              document.getElementById("txtMode").innerText = Game.mode === 'ai' ? I18N[l].ai : I18N[l].pvp;
              document.getElementById("txtBtnRoll").innerText = I18N[l].roll;
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tName-" + t.id);
                  if (el) el.innerText = l === 'ar' ? t.nameAr : t.nameEn;
              });
              updateUI();
          }
          
          function setPropStyle(s) {
              Game.propStyle = s;
              ["glow","tint","border","badge"].forEach(id => {
                  document.getElementById("btnPropStyle" + id.charAt(0).toUpperCase() + id.slice(1)).className = "btn-pill" + (s === id ? " active" : "");
              });
              updateBoardVisual();
          }
          
          function setDiceSpeed(sp) {
              Game.diceSpeed = sp;
              ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
                  const el = document.getElementById("btnDiceSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }
          
          function setMoveSpeed(sp) {
              Game.moveSpeed = sp;
              ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
                  const el = document.getElementById("btnMoveSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }
          
          function setSound(en) {
              AudioFX.enabled = en;
              document.getElementById("btnSoundOn").className = "btn-pill" + (en ? " active" : "");
              document.getElementById("btnSoundOff").className = "btn-pill" + (!en ? " active" : "");
          }
          
          function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
          function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }
          function openAboutModal() { document.getElementById("aboutModal").classList.add("show"); }
          function closeAboutModal() { document.getElementById("aboutModal").classList.remove("show"); }
          function toggleMode() {
              Game.mode = Game.mode === 'ai' ? 'pvp' : 'ai';
              if (Game.mode === 'ai') { Game.players[1].nameAr = "الصقر (الذكاء)"; Game.players[1].nameEn = "Falcon (AI)"; }
              else { Game.players[1].nameAr = "اللاعب 2 (الصقر)"; Game.players[1].nameEn = "Player 2 (Falcon)"; }
              document.getElementById("txtMode").innerText = Game.mode === 'ai' ? I18N[Game.lang].ai : I18N[Game.lang].pvp;
              logEvent(`🎮 نمط اللعب: ${document.getElementById("txtMode").innerText}`); updateUI();
          }
          function restartGame() { location.reload(); }
          
          window.addEventListener("DOMContentLoaded", () => {
              renderBoard(); updateUI(); startPlayerTurn();
          });
          </script>
          </body>
          </html>
          '''

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("✅ All project files created successfully!")
          PYEOF

      - name: 🔨 إعطاء صلاحيات التشغيل لـ Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: 🚀 بناء حزمة APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف APK كعنصر قابل للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyArabia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار تلقائي على GitHub (Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "مونوبولي العرب - الإصدار 1.0.0"
          body: "🎲 النسخة الرسمية لتطبيق لعبة مونوبولي العرب بنك الحظ الملكي (APK جاهز للتثبيت المباشر على الأندرويد). برمجة وتصميم عمار الهلالي."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
