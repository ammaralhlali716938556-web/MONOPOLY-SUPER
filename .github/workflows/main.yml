          // نظام الصوت المحمي من تسريب الذاكرة والانهيار
          const AudioFX = {
              ctx: null,
              enabled: true,
              init() {
                  try {
                      if (!this.ctx) {
                          const AudioContext = window.AudioContext || window.webkitAudioContext;
                          if (AudioContext) this.ctx = new AudioContext();
                      }
                      if (this.ctx && this.ctx.state === 'suspended') {
                          this.ctx.resume().catch(() => {});
                      }
                  } catch(e) {}
              },
              play(type) {
                  if (!this.enabled) return;
                  try {
                      this.init();
                      if (!this.ctx) return;
                      const t = this.ctx.currentTime;
                      const osc = this.ctx.createOscillator();
                      const g = this.ctx.createGain();
                      osc.connect(g);
                      g.connect(this.ctx.destination);

                      // تنظيف وفصل القنوات الصوتية لمنع تسريب الذاكرة في WebView
                      osc.onended = () => {
                          try {
                              osc.disconnect();
                              g.disconnect();
                          } catch(e) {}
                      };

                      if (type === 'dice') {
                          osc.type = 'triangle';
                          osc.frequency.setValueAtTime(140, t);
                          osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                          g.gain.setValueAtTime(0.2, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.12);
                          osc.start(t);
                          osc.stop(t + 0.12);
                      } else if (type === 'step') {
                          osc.type = 'sine';
                          osc.frequency.setValueAtTime(440, t);
                          g.gain.setValueAtTime(0.1, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.05);
                          osc.start(t);
                          osc.stop(t + 0.05);
                      } else if (type === 'cash') {
                          osc.type = 'sine';
                          osc.frequency.setValueAtTime(587.33, t);
                          osc.frequency.setValueAtTime(880, t + 0.08);
                          g.gain.setValueAtTime(0.18, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.22);
                          osc.start(t);
                          osc.stop(t + 0.22);
                      } else if (type === 'jail') {
                          osc.type = 'sawtooth';
                          osc.frequency.setValueAtTime(180, t);
                          osc.frequency.linearRampToValueAtTime(80, t + 0.3);
                          g.gain.setValueAtTime(0.2, t);
                          g.gain.linearRampToValueAtTime(0.01, t + 0.3);
                          osc.start(t);
                          osc.stop(t + 0.3);
                      }
                  } catch(e) {}
              }
          };

          const Game = {
              lang: 'ar',
              propStyle: 'glow',
              diceSpeed: 'normal',
              moveSpeed: 'normal',
              mode: 'ai',
              turn: 0,
