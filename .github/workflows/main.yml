                  closeBluetoothModal();
                  logEvent("📡 تم تفعيل طور البلوتوث بنجاح!");
              }, 1000);
          }

          function getGridCoords(i) {
              if (i === 0) return { r: 11, c: 11 };
              if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
              if (i === 10) return { r: 11, c: 1 };
              if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
              if (i === 20) return { r: 1, c: 1 };
              if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
              if (i === 30) return { r: 1, c: 11 };
              if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
              return { r: 11, c: 11 };
          }

          function renderBoard() {
              const boardEl = document.getElementById("board");
              BOARD_TILES.forEach((tile, index) => {
                  const coords = getGridCoords(index);
                  const tileDiv = document.createElement("div");
                  tileDiv.id = "tile-" + index;

                  let side = "side-bottom";
                  if (index >= 11 && index <= 19) side = "side-left";
                  else if (index >= 20 && index <= 30) side = "side-top";
                  else if (index >= 31 && index <= 39) side = "side-right";
                  tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile corner-" + index : "");

                  tileDiv.style.gridRow = coords.r;
                  tileDiv.style.gridColumn = coords.c;
                  tileDiv.onclick = () => openTileInfoModal(index);

                  let h = "";
                  if (tile.type === "property") {
                      h += `<div class="tile-bar" style="background:${tile.color}"></div>`;
                      h += `<div class="tile-cnt">`;
                      h += `  <div class="tile-name" id="tName-${index}">${getTileName(tile)}</div>`;
                      h += `  <div class="building-zone" id="bZone-${index}"></div>`;
                      h += `  <div class="tile-price">${tile.price}$</div>`;
                      h += `</div>`;
                  } else if (tile.type === "railroad" || tile.type === "utility") {
                      h += `<div class="tile-cnt">`;
                      h += `  <div class="tile-icon">${tile.icon}</div>`;
                      h += `  <div class="tile-name" id="tName-${index}">${getTileName(tile)}</div>`;
                      h += `  <div class="tile-price">${tile.price}$</div>`;
                      h += `</div>`;
                  } else {
                      h += `<div class="tile-cnt">`;
                      h += `  <div class="tile-icon">${tile.icon || "🏛️"}</div>`;
                      h += `  <div class="tile-name" id="tName-${index}">${getTileName(tile)}</div>`;
                      h += `</div>`;
                  }
                  h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
                  tileDiv.innerHTML = h;
                  boardEl.appendChild(tileDiv);
              });
              updatePawns();
          }

          let pawnEl0 = null, pawnEl1 = null;
          function getPawnEl(id) {
              if (id === 0) {
                  if (!pawnEl0) { pawnEl0 = document.createElement("div"); pawnEl0.id = "pawn-p0"; pawnEl0.className = "pawn pawn-p0"; }
                  pawnEl0.innerText = Game.players[0].avatar;
                  return pawnEl0;
              } else {
                  if (!pawnEl1) { pawnEl1 = document.createElement("div"); pawnEl1.id = "pawn-p1"; pawnEl1.className = "pawn pawn-p1"; }
                  pawnEl1.innerText = Game.players[1].avatar;
                  return pawnEl1;
              }
          }

          function updatePawns(movingId = null) {
              if (movingId !== null) {
                  const p = Game.players[movingId];
                  const el = getPawnEl(movingId);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                      el.classList.add("moving-step");
                      setTimeout(() => el.classList.remove("moving-step"), 110);
                  }
                  return;
              }
              Game.players.forEach(p => {
                  const el = getPawnEl(p.id);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                  }
              });
          }

          function updateUI() {
              const p0 = Game.players[0], p1 = Game.players[1];
              document.getElementById("cashP0").innerText = p0.money + "$";
              document.getElementById("cashP1").innerText = p1.money + "$";
              const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
              const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;

              const f0 = p0.props.reduce((sum, id) => sum + (BOARD_TILES[id].floors || 0), 0);
              const f1 = p1.props.reduce((sum, id) => sum + (BOARD_TILES[id].floors || 0), 0);

              document.getElementById("propsP0").innerText = `${I18N[Game.lang].p} ${p0.props.length}`;
              document.getElementById("propsP1").innerText = `${I18N[Game.lang].p} ${p1.props.length}`;
              document.getElementById("floorsP0").innerText = f0 > 0 ? `| 🏗️ ${f0}` : "";
              document.getElementById("floorsP1").innerText = f1 > 0 ? `| 🏗️ ${f1}` : "";

              document.getElementById("mortP0").innerText = m0 > 0 ? `(${I18N[Game.lang].m} ${m0})` : "";
              document.getElementById("mortP1").innerText = m1 > 0 ? `(${I18N[Game.lang].m} ${m1})` : "";

              document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
              document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
              document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
              document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";
              document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
              document.getElementById("turnBadge1").innerText = I18N[Game.lang].opp;

              const cur = Game.players[Game.turn];
              document.getElementById("turnAnnouncer").innerText = `${I18N[Game.lang].turn}: ${cur.avatar} ${cur.name}`;
              document.getElementById("avP0").innerText = p0.avatar;
              document.getElementById("avP1").innerText = p1.avatar;
              document.getElementById("nameP0").innerText = p0.name;
              document.getElementById("nameP1").innerText = p1.name;

              updateBoardVisual();
          }

          function updateBoardVisual() {
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tile-" + t.id);
                  if (!el) return;
                  el.classList.remove("owned-glow", "owned-tint", "owned-border");
                  const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
                  const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();

                  const nameEl = document.getElementById("tName-" + t.id);
                  if (nameEl) nameEl.innerText = getTileName(t);

                  // Update 3D floors zone
                  const bZone = document.getElementById("bZone-" + t.id);
                  if (bZone) {
                      bZone.innerHTML = "";
                      if (t.floors >= 1 && t.floors <= 4) {
                          let stackHtml = '<div class="floors-3d-stack">';
                          for (let k = 0; k < t.floors; k++) {
                              stackHtml += '<div class="floor-3d-block"></div>';
                          }
                          stackHtml += '</div>';
                          bZone.innerHTML = stackHtml;
                      } else if (t.floors === 5) {
                          bZone.innerHTML = '<span class="eiffel-tower-3d" title="برج إيفل الذهبي">🗼</span>';
                      }
                  }

                  if (t.owner !== undefined) {
                      const owner = Game.players[t.owner];
                      el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                      if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                      else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                      else if (Game.propStyle === 'border') el.classList.add("owned-border");
                      else if (Game.propStyle === 'badge') {
                          const bg = document.createElement("div");
                          bg.className = "tile-owner-badge";
                          bg.innerText = owner.avatar;
                          el.appendChild(bg);
                      }
                      if (t.mortgaged) {
                          const mg = document.createElement("div");
                          mg.className = "tile-mortgaged-badge";
                          mg.innerText = I18N[Game.lang].m;
                          el.appendChild(mg);
                      }
                  } else {
                      el.style.color = "";
                  }
              });
          }

          function logEvent(msg) {
              const el = document.getElementById("gameLog");
              el.innerText = msg;
          }

          function rollDice() {
              if (Game.isRolling || Game.isGameOver) return;
              const cur = Game.players[Game.turn];
              if (cur.inJail) {
                  if (Game.turn === 0 || Game.mode !== 'ai') openJailModal();
                  else {
                      if (cur.money >= 300) payJailFine();
                      else rollForJail();
                  }
                  return;
              }

              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;

              const d0 = document.getElementById("die0");
              const d1 = document.getElementById("die1");
              d0.classList.add("rolling");
              d1.classList.add("rolling");
              AudioFX.play('dice');

              const dur = Game.diceSpeed === "slow" ? 900 : (Game.diceSpeed === "fast" ? 250 : 500);
              setTimeout(() => {
                  d0.classList.remove("rolling");
                  d1.classList.remove("rolling");

                  const val0 = Math.floor(Math.random() * 6) + 1;
                  const val1 = Math.floor(Math.random() * 6) + 1;
                  setDieFace(d0, val0);
                  setDieFace(d1, val1);

                  const sum = val0 + val1;
                  const isDbl = (val0 === val1);
                  logEvent(`${cur.avatar} ${I18N[Game.lang].rolled} ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);

                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow >= 3) {
                          Game.doublesInRow = 0;
                          logEvent("🚔 3 رميات متطابقة! أُرسل إلى السجن.");
                          sendToJail(cur);
                          finishTurn(false);
                          return;
                      }
                  } else {
                      Game.doublesInRow = 0;
                  }

                  moveSteps(cur, sum, isDbl);
              }, dur);
          }

          function setDieFace(dieEl, val) {
              const rot = {
                  1: "rotateX(0deg) rotateY(0deg)",
                  6: "rotateY(180deg)",
                  2: "rotateY(90deg)",
                  5: "rotateY(-90deg)",
                  3: "rotateX(-90deg)",
                  4: "rotateX(90deg)"
              };
              dieEl.style.transform = rot[val];
          }

          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : 120);
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns(player.id);
                  if (player.pos === 0) {
                      player.money += 200;
                      AudioFX.play('cash');
                      logEvent(I18N[Game.lang].passGo);
                      updateUI();
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 160);
                  }
              }, iv);
          }

          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();

              if (tile.type === "gotojail") {
                  sendToJail(player);
                  finishTurn(false);
                  return;
              }

              if (tile.type === "tax") {
                  player.money -= tile.price;
                  AudioFX.play('cash');
                  logEvent(`💸 ${player.avatar} دفع ${tile.price}$ (${getTileName(tile)}).`);
                  if (checkBankruptcy(player)) return;
                  updateUI();
                  finishTurn(isDbl);
                  return;
              }

              if (tile.type === "chance" || tile.type === "chest") {
                  handleCard(player, tile.type, isDbl);
                  return;
              }

              if (["property", "railroad", "utility"].includes(tile.type)) {
                  if (tile.owner === undefined) {
                      if (player.id === 0 || Game.mode !== 'ai') {
                          promptBuyProperty(tile, isDbl);
                      } else {
                          handleAIBuyDecision(player, tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      if (!tile.mortgaged) {
                          const rent = calculateRent(tile);
                          player.money -= rent;
                          Game.players[tile.owner].money += rent;
                          AudioFX.play('cash');
                          logEvent(`🏷️ دفع ${player.avatar} ${rent}$ إيجار إلى ${Game.players[tile.owner].avatar} (${getTileName(tile)}).`);
                          if (checkBankruptcy(player)) return;
                          updateUI();
                      } else {
                          logEvent(`العقار (${getTileName(tile)}) مَرْهُون، معفى من الإيجار.`);
                      }
                      finishTurn(isDbl);
                      return;
                  } else {
                      // Player landed on their own tile
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl);
                          return;
                      }
                  }
              }

              finishTurn(isDbl);
          }

          function checkBankruptcy(player) {
              if (player.money >= 0) return false;
              const unmortgaged = player.props.filter(id => !BOARD_TILES[id].mortgaged);
              for (const propId of unmortgaged) {
                  if (player.money >= 0) break;
                  const t = BOARD_TILES[propId];
                  t.mortgaged = true;
                  const val = Math.floor(t.price * 0.5);
                  player.money += val;
                  logEvent(`🏦 تم رهن (${getTileName(t)}) تلقائياً لتغطية الديون.`);
              }
              updateUI();
              if (player.money < 0) {
                  const winnerId = (player.id === 0) ? 1 : 0;
                  triggerGameOver(winnerId);
                  return true;
              }
              return false;
          }

          function triggerGameOver(winnerId) {
              Game.isGameOver = true;
              localStorage.removeItem(SAVE_KEY);
              const winner = Game.players[winnerId];
              document.getElementById("goTrophy").innerText = winner.avatar;
              document.getElementById("goWinnerText").innerText = Game.lang === 'ar' ? `فاز ${winner.name} باللعبة! 🏆` : `${winner.name} Won the Game! 🏆`;
              document.getElementById("goDetails").innerText = Game.lang === 'ar' ? "أفلس الخصم ولم يعد يملك أموالاً أو عقارات لتغطية التكاليف." : "The opponent went bankrupt with no cash or assets remaining.";
              document.getElementById("gameOverModal").classList.add("show");
          }

          // Railroad condition: Only allow travel if all 4 railroads in the game are purchased!
          // And travel is FREE for station owners!
          function areAllRailroadsPurchased() {
              const railroads = BOARD_TILES.filter(t => t.type === "railroad");
              return railroads.every(t => t.owner !== undefined);
          }

          function promptRailroadFastTravel(player, currentTile, isDbl) {
              const allPurchased = areAllRailroadsPurchased();
              if (!allPurchased) {
                  logEvent("🚂 السفر بمحطات القطار مقفل حتى يتم شراء كافة المحطات الأربع باللعبة.");
                  finishTurn(isDbl);
                  return;
              }

              const otherRails = BOARD_TILES.filter(t => t.type === "railroad" && t.id !== currentTile.id && t.owner === player.id);
              if (otherRails.length === 0) {
                  finishTurn(isDbl);
                  return;
              }

              if (player.id === 0 || Game.mode !== 'ai') {
                  const dest = otherRails[0];
                  Game.fastTravelData = { player, dest, isDbl };
                  document.getElementById("fastTravelDestName").innerText = `${dest.icon} ${getTileName(dest)}`;
                  document.getElementById("fastTravelModal").classList.add("show");
              } else {
                  // AI Free Travel
                  if (Math.random() > 0.4) {
                      const dest = otherRails[0];
                      player.pos = dest.id;
                      AudioFX.play('step');
                      updatePawns(player.id);
                      logEvent(`🚂 سافر ${player.avatar} مجاناً إلى محطة (${getTileName(dest)}).`);
                  }
                  finishTurn(isDbl);
              }
          }

          function confirmFastTravel() {
              if (!Game.fastTravelData) return;
              const { player, dest, isDbl } = Game.fastTravelData;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");

              // Free for station owner (0$)
              player.pos = dest.id;
              AudioFX.play('cash');
              AudioFX.play('step');
              updatePawns(player.id);
              updateUI();
              logEvent(`🚂 سافر ${player.avatar} مجاناً (0$) إلى محطة (${getTileName(dest)})!`);
              finishTurn(isDbl);
          }

          function cancelFastTravel() {
              if (!Game.fastTravelData) return;
              const isDbl = Game.fastTravelData.isDbl;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");
              finishTurn(isDbl);
          }

          // Rent calculation with Floors & Eiffel Tower
          // Rent increases by 50% of the cost of each floor built!
          function calculateRent(tile) {
              if (tile.type === "railroad") {
                  const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
                  return 25 * Math.pow(2, cnt - 1);
              }
              if (tile.type === "utility") {
                  const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
                  return cnt === 2 ? 50 : 20;
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);
              const baseRent = hasMonopoly ? Math.round(tile.price * 0.40) : Math.round(tile.price * 0.20);

              if (tile.floors && tile.floors > 0) {
                  const floorCost = Math.round(tile.price * 0.33);
                  const rentIncreasePerFloor = Math.round(floorCost * 0.50);
                  return baseRent + (tile.floors * rentIncreasePerFloor);
              }
              return baseRent;
          }

          // Building logic:
          // Can only build floor N if all properties in the same color group have floor N-1!
          // Floor 5 is the Eiffel Tower (Limit).
          function canBuildFloor(playerId, tileId) {
              const tile = BOARD_TILES[tileId];
              if (!tile || tile.type !== "property" || tile.owner !== playerId || tile.mortgaged) {
                  return { allowed: false, reason: "لا تملك هذا العقار أو أنه مرهون!" };
              }
              if (tile.floors >= 5) {
                  return { allowed: false, reason: "وصلت للحد النهائي للبناء (برج إيفل الذهبي)!" };
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const ownsAll = groupTiles.every(t => t.owner === playerId && !t.mortgaged);
              if (!ownsAll) {
                  return { allowed: false, reason: "يجب امتلاك كافة عقارات المجموعة وعدم رهن أي منها أولاً!" };
              }

              const targetFloor = tile.floors + 1;
              for (const other of groupTiles) {
                  if (other.id !== tile.id && other.floors < targetFloor - 1) {
                      return {
                          allowed: false,
                          reason: `لا يمكن بناء الطابق ${targetFloor} حتى يتم بناء الطابق ${targetFloor - 1} في كافة عقارات المجموعة أولاً!`
                      };
                  }
              }

              const floorCost = Math.round(tile.price * 0.33);
              const player = Game.players[playerId];
              if (player.money < floorCost) {
                  return { allowed: false, reason: `رصيدك لا يكفي. تكلفة الطابق: ${floorCost}$` };
              }

              return { allowed: true, cost: floorCost, targetFloor };
          }

          function buildFloor(playerId, tileId) {
              const check = canBuildFloor(playerId, tileId);
              if (!check.allowed) {
                  alert(check.reason);
                  return;
              }
              const tile = BOARD_TILES[tileId];
              const player = Game.players[playerId];
              player.money -= check.cost;
              tile.floors++;
              AudioFX.play('cash');

              if (tile.floors === 5) {
                  logEvent(`🗼 شيد ${player.avatar} برج إيفل الذهبي على (${getTileName(tile)})! تم الوصول للحد النهائي.`);
              } else {
                  logEvent(`🏗️ بنى ${player.avatar} الطابق ${tile.floors} (ليموني) على (${getTileName(tile)}) مقابل ${check.cost}$.`);
              }

              updateBoardVisual();
              updateUI();
              if (document.getElementById("propsModal").classList.contains("show")) {
                  openPropsModal(playerId);
              }
          }

          function promptBuyProperty(tile, isDbl) {
              Game.pendingTile = { tile, isDbl };
              const baseRent = Math.round(tile.price * 0.20);
              const monoRent = Math.round(tile.price * 0.40);
              const floorCost = Math.round(tile.price * 0.33);

              document.getElementById("deedTitle").innerText = `${tile.icon || ""} ${getTileName(tile)}`;
              document.getElementById("deedBody").innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <span style="display:inline-block; width:14px; height:14px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                      <strong style="font-size:1.15rem; color:var(--gold); margin:0 6px;">${tile.price}$</strong>
                  </div>
                  <div style="font-size:0.80rem; color:var(--text); text-align:center;">إيجار العقار الأساسي (20%): <strong style="color:var(--gold);">${baseRent}$</strong></div>
                  <div style="font-size:0.75rem; color:var(--dim); text-align:center; margin-top:3px;">إيجار الاحتكار (40%): <strong style="color:var(--gold);">${monoRent}$</strong></div>
                  ${tile.type === "property" ? `<div style="font-size:0.75rem; color:var(--lime); text-align:center; margin-top:3px;">تكلفة بناء كل طابق (33%): <strong>${floorCost}$</strong></div>` : ''}
              `;
              const canAfford = Game.players[Game.turn].money >= tile.price;
              document.getElementById("btnBuyProp").disabled = !canAfford;
              document.getElementById("deedModal").classList.add("show");
          }

          function closeDeedModal() {
              document.getElementById("deedModal").classList.remove("show");
              if (Game.pendingTile) {
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  finishTurn(isDbl);
              }
          }

          function confirmBuyProp() {
              if (!Game.pendingTile) return;
              const cur = Game.players[Game.turn];
              const t = Game.pendingTile.tile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  document.getElementById("deedModal").classList.remove("show");
                  finishTurn(isDbl);
              }
          }

          // Live Auction with 5-second timer
          let aucTimerInterval = null;
          let aucSecondsLeft = 5;

          function startAuctionTimer() {
              stopAuctionTimer();
              aucSecondsLeft = 5;
              const timerEl = document.getElementById("aucTimerNum");
              if (timerEl) timerEl.innerText = aucSecondsLeft;

              aucTimerInterval = setInterval(() => {
                  aucSecondsLeft--;
                  if (timerEl) timerEl.innerText = aucSecondsLeft;
                  if (aucSecondsLeft <= 0) {
                      stopAuctionTimer();
                      handleAuctionTimeout();
                  }
              }, 1000);
          }

          function stopAuctionTimer() {
              if (aucTimerInterval) {
                  clearInterval(aucTimerInterval);
                  aucTimerInterval = null;
              }
          }

          function handleAuctionTimeout() {
              const a = Game.auction;
              if (!a) return;
              logEvent(`⏱️ انتهت المهلة للاعب ${Game.players[a.bidTurn].avatar}!`);
              if (a.highestBidder !== null) {
                  concludeAuction();
              } else {
                  foldAuctionBid();
              }
          }

          function startAuction() {
              if (!Game.pendingTile) return;
              const t = Game.pendingTile.tile;
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");

              Game.auction = { tile: t, isDbl, currentBid: 10, highestBidder: null, bidTurn: Game.turn, active: [0, 1] };
              document.getElementById("auctionModal").classList.add("show");
              updateAuctionUI();
              startAuctionTimer();
              if (Game.turn === 1 && Game.mode === 'ai') setTimeout(handleAIAuction, 900);
          }

          function updateAuctionUI() {
              const a = Game.auction;
              if (!a) return;
              document.getElementById("aucPropDetails").innerText = `${a.tile.icon || "🏙️"} ${getTileName(a.tile)}`;
              document.getElementById("aucBasePriceVal").innerText = a.tile.price + "$";
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? `${Game.players[a.highestBidder].avatar} ${Game.players[a.highestBidder].name}` : "لا يوجد مزايد بعد";
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${cur.name}`;
              document.getElementById("aucControls").style.display = (a.bidTurn === 0 || Game.mode !== 'ai') ? "flex" : "none";
          }

          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              const bidder = a.bidTurn;
              const p = Game.players[bidder];
              const nextBid = a.currentBid + inc;
              if (p.money >= nextBid) {
                  a.currentBid = nextBid;
                  a.highestBidder = bidder;
                  logEvent(`🔨 زاد ${p.avatar} المزاد إلى ${a.currentBid}$!`);
                  nextAuctionTurn();
              } else {
                  startAuctionTimer();
              }
          }

          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} من المزاد.`);
              a.active = a.active.filter(id => id !== a.bidTurn);
              if (a.active.length === 1 && a.highestBidder !== null) {
                  concludeAuction();
              } else if (a.active.length === 0) {
                  document.getElementById("auctionModal").classList.remove("show");
                  const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
              } else {
                  nextAuctionTurn();
              }
          }

          function nextAuctionTurn() {
              const a = Game.auction; if (!a) return;
              a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
              updateAuctionUI();
              startAuctionTimer();
              if (a.bidTurn === 1 && Game.mode === 'ai' && a.active.includes(1)) {
                  setTimeout(handleAIAuction, 900);
              }
          }

          function concludeAuction() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              document.getElementById("auctionModal").classList.remove("show");
              const winner = Game.players[a.highestBidder];
              logEvent(`🏆 فاز ${winner.avatar} بمزاد (${getTileName(a.tile)}) بمبلغ ${a.currentBid}$!`);
              buyProp(winner, a.tile, a.currentBid);
              const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
          }

          function handleAIAuction() {
              const a = Game.auction; if (!a || a.bidTurn !== 1) return;
              const ai = Game.players[1];
              let mult = Game.difficulty === 'easy' ? 0.7 : (Game.difficulty === 'hard' ? 1.4 : 1.0);
              if (checkMonopolyPot(1, a.tile.group)) mult *= 1.4;

              const maxVal = a.tile.price * mult;
              if (a.currentBid + 15 <= maxVal && ai.money >= a.currentBid + 40) {
                  placeAuctionBid(15);
              } else {
                  foldAuctionBid();
              }
          }

          function handleAIBuyDecision(player, tile, isDbl) {
              const surplusNeeded = Game.difficulty === 'easy' ? 400 : (Game.difficulty === 'hard' ? 0 : 100);
              const hasCash = player.money >= tile.price + surplusNeeded;
              const pot = checkMonopolyPot(1, tile.group);

              if (hasCash || pot) {
                  buyProp(player, tile, tile.price);
                  finishTurn(isDbl);
              } else {
                  Game.pendingTile = { tile, isDbl };
                  startAuction();
              }
          }

          function checkMonopolyPot(playerId, group) {
              if (!group) return false;
              const groupTiles = BOARD_TILES.filter(t => t.group === group);
              const owned = groupTiles.filter(t => t.owner === playerId).length;
              return owned > 0;
          }

          function buyProp(player, tile, price) {
              player.money -= price;
              tile.owner = player.id;
              player.props.push(tile.id);
              AudioFX.play('cash');
              logEvent(`🎉 اشترى ${player.avatar} (${getTileName(tile)}) مقابل ${price}$.`);
              updateUI();
          }

          function handleCard(player, type, isDbl) {
              const cards = [
                  { textAr:"ربحت مكافأة مالية استثمارية! استلم 100$", textEn:"Royal investment bonus! Collect 100$", action:"cash", val:100 },
                  { textAr:"غرامة بلدية ورسوم خدمات! ادفع 50$", textEn:"Municipal service fees! Pay 50$", action:"cash", val:-50 },
                  { textAr:"تقدم مباشرة إلى خانة انطلق واربح 200$", textEn:"Advance to GO, collect 200$", action:"go" },
                  { textAr:"أُرسلت مباشرة إلى السجن!", textEn:"Go directly to jail!", action:"jail" }
              ];
              const c = cards[Math.floor(Math.random() * cards.length)];
              logEvent(`📜 ${Game.lang === 'ar' ? c.textAr : c.textEn}`);
              if (c.action === "cash") {
                  player.money += c.val;
                  if (checkBankruptcy(player)) return;
                  AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
              } else if (c.action === "go") {
                  player.pos = 0; player.money += 200;
                  AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
              } else if (c.action === "jail") {
                  sendToJail(player); finishTurn(false);
              }
          }

          function sendToJail(p) {
              p.pos = 10; p.inJail = true; p.jailTurns = 3;
              AudioFX.play('jail'); updatePawns(p.id); updateUI();
              logEvent(`🚔 دَخَل ${p.avatar} السجن!`);
          }

          function openJailModal() {
              document.getElementById("jailModal").classList.add("show");
          }

          function payJailFine() {
              const cur = Game.players[Game.turn];
              if (cur.money >= 50) {
                  cur.money -= 50;
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  document.getElementById("jailModal").classList.remove("show");
                  AudioFX.play('cash');
                  updateUI();
                  logEvent(I18N[Game.lang].finePaid);
                  if (Game.turn === 1 && Game.mode === 'ai') setTimeout(rollDice, 550);
                  else document.getElementById("btnRoll").disabled = false;
              } else {
                  rollForJail();
              }
          }

          function rollForJail() {
              document.getElementById("jailModal").classList.remove("show");
              const v0 = Math.floor(Math.random() * 6) + 1;
              const v1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(document.getElementById("die0"), v0);
              setDieFace(document.getElementById("die1"), v1);
              const cur = Game.players[Game.turn];
              if (v0 === v1) {
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  logEvent(I18N[Game.lang].doublesJail);
                  updateUI();
                  moveSteps(cur, v0 + v1, false);
              } else {
                  cur.jailTurns--;
                  if (cur.jailTurns <= 0) {
                      cur.money = Math.max(0, cur.money - 50);
                      cur.inJail = false;
                      cur.jailTurns = 0;
                      logEvent(Game.lang === 'ar' ? "انتهت مدة السجن وتم دفع 50$ كفالة إجبارية." : "Jail sentence finished; paid 50$ fine.");
                      updateUI();
                      moveSteps(cur, v0 + v1, false);
                  } else {
                      logEvent(Game.lang === 'ar' ? `لم يتطابق النرد (${v0}+${v1})! بقي في السجن.` : `No doubles (${v0}+${v1})! Still in Jail.`);
                      finishTurn(false);
                  }
              }
          }

          function finishTurn(isDbl) {
              Game.isRolling = false;
              if (Game.isGameOver) return;
              if (isDbl && !Game.players[Game.turn].inJail) {
                  logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} على رمية إضافية.`);
                  startPlayerTurn();
                  return;
              }
              Game.doublesInRow = 0;
              Game.turn = (Game.turn === 0) ? 1 : 0;
              updateUI();
              startPlayerTurn();
          }

          function startPlayerTurn() {
              if (Game.isGameOver) return;
              updateUI();
              const cur = Game.players[Game.turn];

              // AI automatic building if monopolized and has cash
              if (Game.turn === 1 && Game.mode === 'ai' && !cur.inJail) {
                  tryAIBuild(cur);
              }

              if (Game.turn === 0 || Game.mode !== 'ai') {
                  document.getElementById("btnRoll").disabled = false;
              } else {
                  document.getElementById("btnRoll").disabled = true;
                  setTimeout(() => {
                      if (Game.isGameOver || Game.turn !== 1) return;
                      if (cur.inJail) {
                          if (cur.money >= 300) payJailFine();
                          else rollForJail();
                      } else {
                          rollDice();
                      }
                  }, 750);
              }
          }

          function tryAIBuild(aiPlayer) {
              const unmortgagedProps = aiPlayer.props.filter(id => !BOARD_TILES[id].mortgaged && BOARD_TILES[id].type === "property");
              for (const propId of unmortgagedProps) {
                  const check = canBuildFloor(1, propId);
                  if (check.allowed) {
                      const surplus = Game.difficulty === 'easy' ? 1200 : (Game.difficulty === 'hard' ? 200 : 500);
                      if (aiPlayer.money >= check.cost + surplus) {
                          buildFloor(1, propId);
                          break;
                      }
                  }
              }
          }

          function openTileInfoModal(index) {
              const t = BOARD_TILES[index];
              const isAr = (Game.lang === 'ar');
              const titleEl = document.getElementById("tileInfoTitle");
              const bodyEl = document.getElementById("tileInfoBody");

              if (t.type === "property") {
                  titleEl.innerText = `${t.icon || "🏙️"} ${getTileName(t)}`;
                  const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].name}` : (isAr ? "متاح للبيع من البنك" : "Available for Sale");
                  const statusTxt = t.mortgaged ? (isAr ? "مَرْهُون ⚠️" : "MORTGAGED ⚠️") : (isAr ? "نشط وفعال ✓" : "Active ✓");
                  const mortVal = Math.floor(t.price * 0.5);
                  const unmortVal = Math.floor(mortVal * 1.1);
                  const baseRent = Math.round(t.price * 0.20);
                  const monoRent = Math.round(t.price * 0.40);
                  const floorCost = Math.round(t.price * 0.33);
                  const curRent = calculateRent(t);

                  let floorStatus = isAr ? "لا توجد مباني" : "No buildings";
                  if (t.floors >= 1 && t.floors <= 4) floorStatus = `${isAr ? "طوابق مبنية (ليموني):" : "Floors built:"} ${t.floors} / 4`;
                  else if (t.floors === 5) floorStatus = isAr ? "برج إيفل الذهبي (مكتمل) 🗼" : "Golden Eiffel Tower 🗼";

                  bodyEl.innerHTML = `
                      <div style="text-align:center; margin-bottom:8px;">
                          <span class="info-badge" style="background:${t.color}33; border-color:${t.color}; color:#FFF;">${isAr ? "عقار استثماري" : "Real Estate Property"}</span>
                          <div style="font-size:1.15rem; font-weight:900; color:var(--gold);">${t.price}$</div>
                      </div>
                      <div class="info-rule-box">
                          <div class="info-rule-item"><strong>${isAr ? "الإيجار الحالي:" : "Current Rent:"}</strong> <span style="color:var(--gold); font-weight:bold;">${curRent}$</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "الإيجار الأساسي (20%):" : "Base Rent (20%):"}</strong> <span>${baseRent}$</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "إيجار الاحتكار (40% للمجموعة):" : "Monopoly Rent (40%):"}</strong> <span>${monoRent}$</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "تكلفة بناء كل طابق (33%):" : "Floor Cost (33%):"}</strong> <span style="color:var(--lime);">${floorCost}$</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "حالة المباني:" : "Building Status:"}</strong> <span>${floorStatus}</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "قيمة الرهن:" : "Mortgage Value:"}</strong> <span>${mortVal}$</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "المالك الحالي:" : "Owner:"}</strong> <span>${ownerTxt}</span></div>
                          <div class="info-rule-item"><strong>${isAr ? "الحالة:" : "Status:"}</strong> <span>${statusTxt}</span></div>
                      </div>
                  `;
              } else {
                  const info = SERVICE_INFO[t.type] || SERVICE_INFO['go'];
                  titleEl.innerText = `${t.icon || "ℹ️"} ${getTileName(t)}`;

                  let rulesHtml = "";
                  const rulesList = isAr ? info.rulesAr : info.rulesEn;
                  rulesList.forEach(r => {
                      rulesHtml += `<div class="info-rule-item"><span>•</span><div>${r}</div></div>`;
                  });

                  let ownershipExtra = "";
                  if (t.type === "railroad" || t.type === "utility") {
                      const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].name}` : (isAr ? "متاح للشراء" : "Available for purchase");
                      ownershipExtra = `
                          <div style="background:rgba(255,255,255,0.05); border-radius:6px; padding:6px 10px; margin-top:8px; display:flex; justify-content:space-between; font-size:0.76rem;">
                              <span>${isAr ? "المالك:" : "Owner:"} <strong>${ownerTxt}</strong></span>
                              <span>${isAr ? "السعر:" : "Price:"} <strong style="color:var(--gold);">${t.price}$</strong></span>
                          </div>
                      `;
                  }

                  bodyEl.innerHTML = `
                      <div style="text-align:center; margin-bottom:8px;">
                          <span class="info-badge">${isAr ? info.badgeAr : info.badgeEn}</span>
                          <div style="font-size:0.84rem; color:var(--text); margin:4px 0 8px 0; font-weight:600;">
                              ${isAr ? info.descAr : info.descEn}
                          </div>
                      </div>
                      <div class="info-rule-box">
                          <div style="font-size:0.75rem; font-weight:bold; color:var(--gold); margin-bottom:5px;">
                              ${isAr ? "📋 تعليمات وقواعد الخانة:" : "📋 Tile Rules & Info:"}
                          </div>
                          ${rulesHtml}
                      </div>
                      ${ownershipExtra}
                  `;
              }

              document.getElementById("tileInfoModal").classList.add("show");
          }

          function closeTileInfoModal() {
              document.getElementById("tileInfoModal").classList.remove("show");
          }

          window.handleAndroidBack = function() {
              const openModals = Array.from(document.querySelectorAll('.modal-overlay.show'));
              if (openModals.length > 0) {
                  const exitModal = document.getElementById("exitModal");
                  if (exitModal && exitModal.classList.contains("show")) {
                      closeExitModal();
                      return;
                  }
                  const lastModal = openModals[openModals.length - 1];
                  lastModal.classList.remove("show");
                  if (lastModal.id === "deedModal" && Game.pendingTile) {
                      const isDbl = Game.pendingTile.isDbl;
                      Game.pendingTile = null;
                      finishTurn(isDbl);
                  }
                  if (lastModal.id === "fastTravelModal" && Game.fastTravelData) {
                      const isDbl = Game.fastTravelData.isDbl;
                      Game.fastTravelData = null;
                      finishTurn(isDbl);
                  }
                  if (lastModal.id === "auctionModal" && Game.auction) {
                      stopAuctionTimer();
                      const isDbl = Game.auction.isDbl;
                      Game.auction = null;
                      finishTurn(isDbl);
                  }
                  return;
              }
              openExitModal();
          };

          function openExitModal() { document.getElementById("exitModal").classList.add("show"); }
          function closeExitModal() { document.getElementById("exitModal").classList.remove("show"); }
          function confirmExitWithSave() { saveCurrentGame(); confirmExitGame(); }
          function confirmExitWithoutSave() { confirmExitGame(); }
          function confirmExitGame() {
              if (window.Android && window.Android.exitApp) window.Android.exitApp();
              else window.close();
          }

          // Trade Modal with Rejection Loop
          function openTradeModal(targetPropId = null, previousOffer = null, isRejection = false) {
              const sel = document.getElementById("tradeTargetProp");
              sel.innerHTML = "";
              const oppProps = BOARD_TILES.filter(t => t.owner === 1 && !t.mortgaged);
              if (oppProps.length === 0) {
                  sel.innerHTML = "<option>لا يملك الخصم عقارات متاحة</option>";
              } else {
                  oppProps.forEach(t => {
                      const opt = document.createElement("option");
                      opt.value = t.id;
                      opt.innerText = `${t.icon || ""} ${getTileName(t)} (${t.price}$)`;
                      if (targetPropId !== null && t.id === targetPropId) opt.selected = true;
                      sel.appendChild(opt);
                  });
              }

              const cashInput = document.getElementById("tradeOfferCash");
              if (previousOffer !== null) {
                  cashInput.value = previousOffer + 50;
              } else {
                  cashInput.value = "100";
              }

              const rejectNotice = document.getElementById("tradeNoticeReject");
              if (isRejection) {
                  rejectNotice.style.display = "block";
              } else {
                  rejectNotice.style.display = "none";
              }

              document.getElementById("tradeNotice").style.display = "none";
              document.getElementById("tradeModal").classList.add("show");
          }

          function submitTradeOffer() {
              const propId = parseInt(document.getElementById("tradeTargetProp").value);
              const offerCash = parseInt(document.getElementById("tradeOfferCash").value);
              const notice = document.getElementById("tradeNotice");
              if (isNaN(propId) || isNaN(offerCash) || offerCash <= 0) return;

              if (Game.players[0].money < offerCash) {
                  notice.innerText = Game.lang === 'ar' ? "رصيدك المالي لا يكفي للمبلغ المعروض!" : "Insufficient funds for this offer!";
                  notice.style.display = "block";
                  return;
              }
              const targetTile = BOARD_TILES[propId];
              closeTradeModal();

              const td = { buyerId: 0, sellerId: 1, tile: targetTile, offer: offerCash };
              Game.tradeData = td;
              evaluateTradeOffer(td);
          }

          function evaluateTradeOffer(td) {
              let ok = false;
              let factor = Game.difficulty === 'easy' ? 1.10 : (Game.difficulty === 'hard' ? 1.80 : 1.35);
              if (checkMonopolyPot(1, td.tile.group)) factor *= 1.4;

              if (td.offer >= td.tile.price * factor) ok = true;

              if (ok) {
                  execTrade(td);
                  logEvent(`🤝 وافق ${Game.players[1].avatar} على بيع (${getTileName(td.tile)}) مقابل ${td.offer}$!`);
              } else {
                  logEvent(`❌ رفض ${Game.players[1].avatar} عرض المقايضة لعقار (${getTileName(td.tile)}) بمبلغ ${td.offer}$!`);
                  // Re-open trade modal for the exact same property with price increase option
                  setTimeout(() => {
                      openTradeModal(td.tile.id, td.offer, true);
                  }, 400);
              }
          }

          function execTrade(td) {
              const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
              b.money -= td.offer; s.money += td.offer;
              s.props = s.props.filter(id => id !== t.id);
              b.props.push(t.id);
              t.owner = b.id;
              AudioFX.play('cash');
              updateUI();
          }

          function closeTradeModal() {
              document.getElementById("tradeModal").classList.remove("show");
              Game.tradeData = null;
          }

          // My Properties Modal with Floor Building
          function openPropsModal(pId) {
              const p = Game.players[pId];
              document.getElementById("propsModalTitle").innerText = `${p.avatar} ${p.name} (${p.money}$)`;
              const b = document.getElementById("propsModalBody");
              b.innerHTML = "";

              if (p.props.length === 0) {
                  b.innerHTML = `<div style="text-align:center; color:var(--dim); padding:16px;">لا توجد أي عقارات مملوكة حالياً.</div>`;
              } else {
                  p.props.forEach(propId => {
                      const t = BOARD_TILES[propId];
                      const d = document.createElement("div");
                      d.style = "background:#0F172A; border-radius:8px; padding:8px 10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border:1px solid #334155; gap:6px;";
                      const mortVal = Math.floor(t.price * 0.5);
                      const unmortVal = Math.floor(mortVal * 1.1);
                      const curRent = calculateRent(t);
                      const floorCost = Math.round(t.price * 0.33);

                      let floorsLabel = "بدون مباني";
                      if (t.floors >= 1 && t.floors <= 4) floorsLabel = `طابق ${t.floors}/4 (ليموني)`;
                      else if (t.floors === 5) floorsLabel = `برج إيفل الذهبي 🗼`;

                      let buildBtnHtml = "";
                      if (t.type === "property" && pId === 0) {
                          const check = canBuildFloor(0, t.id);
                          if (t.floors < 5) {
                              buildBtnHtml = `<button class="btn btn-lime" style="font-size:0.70rem; padding:4px 7px;" onclick="buildFloor(0, ${t.id})" ${!check.allowed ? 'disabled style="opacity:0.4; cursor:not-allowed;" title="' + check.reason + '"' : ''}>🏗️ بناء طابق (${floorCost}$)</button>`;
                          } else {
                              buildBtnHtml = `<span style="color:var(--gold); font-size:0.70rem; font-weight:bold;">🗼 مكتمل</span>`;
                          }
                      }

                      d.innerHTML = `
                          <div style="flex:1;">
                              <div style="display:flex; align-items:center; gap:4px;">
                                  <span style="display:inline-block; width:10px; height:10px; background:${t.color || 'var(--gold)'}; border-radius:50%;"></span>
                                  <strong style="color:${t.color || 'var(--gold)'}; font-size:0.85rem;">${t.icon || ""} ${getTileName(t)}</strong>
                              </div>
                              <div style="font-size:0.72rem; color:var(--dim); margin-top:2px;">
                                  القيمة: ${t.price}$ | الإيجار: <span style="color:var(--gold); font-weight:bold;">${curRent}$</span>
                              </div>
                              <div style="font-size:0.70rem; color:var(--lime); margin-top:1px;">
                                  ${floorsLabel}
                              </div>
                          </div>
                          <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
                              ${buildBtnHtml}
                              ${pId === 0 ? (
                                  t.mortgaged ?
                                  `<button class="btn btn-gold" style="font-size:0.70rem; padding:3px 7px;" onclick="unmortgageProp(${t.id})">فك الرهن (${unmortVal}$)</button>` :
                                  `<button class="btn btn-red" style="font-size:0.70rem; padding:3px 7px;" onclick="mortgageProp(${t.id})">رهن (+${mortVal}$)</button>`
                              ) : (t.mortgaged ? `<span style="color:#EF4444; font-size:0.70rem;">مَرْهُون</span>` : '')}
                          </div>
                      `;
                      b.appendChild(d);
                  });
              }
              document.getElementById("propsModal").classList.add("show");
          }

          function closePropsModal() {
              document.getElementById("propsModal").classList.remove("show");
          }

          function mortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              if (t.owner === 0 && !t.mortgaged) {
                  if (t.floors > 0) {
                      alert("لا يمكن رهن العقار حتى يتم هدم المباني المقامة عليه أولاً!");
                      return;
                  }
                  t.mortgaged = true;
                  p.money += Math.floor(t.price * 0.5);
                  AudioFX.play('cash');
                  updateUI();
                  openPropsModal(0);
                  logEvent(`🏦 رهن ${p.avatar} (${getTileName(t)}) واستلم ${Math.floor(t.price * 0.5)}$.`);
              }
          }

          function unmortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              const cost = Math.floor(t.price * 0.5 * 1.1);
              if (t.owner === 0 && t.mortgaged && p.money >= cost) {
                  t.mortgaged = false;
                  p.money -= cost;
                  AudioFX.play('cash');
                  updateUI();
                  openPropsModal(0);
                  logEvent(`🔓 فك ${p.avatar} رهن (${getTileName(t)}) مقابل ${cost}$.`);
              }
          }

          // Language switcher with 14 languages & dynamic cities
          function setLanguage(l) {
              Game.lang = l;
              document.documentElement.dir = (l === 'ar' || l === 'fa') ? 'rtl' : 'ltr';
              const sel = document.getElementById("langSelect");
              if (sel && sel.value !== l) sel.value = l;

              const dict = I18N[l] || I18N['en'];
              document.getElementById("txtAppTitle").innerText = dict.app;
              document.getElementById("txtBtnRoll").innerText = dict.roll;
              document.getElementById("txtBtnP0Props").innerText = dict.myProps;
              document.getElementById("txtBtnTrade").innerText = dict.trade;

              // Update board tile names
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tName-" + t.id);
                  if (el) el.innerText = getTileName(t);
              });

              updateUI();
          }

          // Theme Switcher (Dark vs Light)
          function setTheme(th) {
              Game.theme = th;
              if (th === 'light') {
                  document.body.classList.add("theme-light");
                  document.getElementById("btnThemeLight").className = "btn-pill active";
                  document.getElementById("btnThemeDark").className = "btn-pill";
              } else {
                  document.body.classList.remove("theme-light");
                  document.getElementById("btnThemeDark").className = "btn-pill active";
                  document.getElementById("btnThemeLight").className = "btn-pill";
              }
          }

          // Orientation Switcher (Landscape / Portrait)
          function toggleOrientation() {
              Game.isLandscape = !Game.isLandscape;
              const container = document.getElementById("appContainer");
              const btn = document.getElementById("btnOrientation");

              if (Game.isLandscape) {
                  container.classList.add("landscape-mode");
                  btn.innerText = "📱";
                  btn.title = "التحويل للوضع الطولي";
                  if (window.Android && window.Android.setOrientation) {
                      window.Android.setOrientation("landscape");
                  }
              } else {
                  container.classList.remove("landscape-mode");
                  btn.innerText = "🔄";
                  btn.title = "التحويل للوضع العرضي";
                  if (window.Android && window.Android.setOrientation) {
                      window.Android.setOrientation("portrait");
                  }
              }
          }

          // 3D Tabletop Toggle
          function toggle3DView() {
              Game.is3D = !Game.is3D;
              const board = document.getElementById("board");
              const btn = document.getElementById("btn3D");
              if (Game.is3D) {
                  board.classList.add("view-3d");
                  btn.innerText = "🎲 3D";
              } else {
                  board.classList.remove("view-3d");
                  btn.innerText = "📐 2D";
              }
          }

          function setPropStyle(s) {
              Game.propStyle = s;
              ["glow", "tint", "border", "badge"].forEach(id => {
                  const el = document.getElementById("btnPropStyle" + id.charAt(0).toUpperCase() + id.slice(1));
                  if (el) el.className = "btn-pill" + (s === id ? " active" : "");
              });
              updateBoardVisual();
          }

          function setDiceSpeed(sp) {
              Game.diceSpeed = sp;
              ["slow", "normal", "fast"].forEach(id => {
                  const el = document.getElementById("btnDiceSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }

          function setMoveSpeed(sp) {
              Game.moveSpeed = sp;
              ["slow", "normal", "fast"].forEach(id => {
                  const el = document.getElementById("btnMoveSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }

          function setSound(en) {
              AudioFX.enabled = en;
              document.getElementById("btnSoundOn").className = "btn-pill" + (en ? " active" : "");
              document.getElementById("btnSoundOff").className = "btn-pill" + (!en ? " active" : "");
          }

          function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
          function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }

          function restartGame() {
              localStorage.removeItem(SAVE_KEY);
              location.reload();
          }

          window.addEventListener("DOMContentLoaded", () => {
              renderBoard();
              updateUI();
              showStartModal();
          });
          </script>
          </body>
          </html>
          '''

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("✅ All MONOPOLY PRO files created successfully!")
          PYEOF

      - name: 🔨 إعطاء صلاحيات التشغيل لـ Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: 🚀 بناء حزمة APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف APK كعنصر قابل للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار تلقائي على GitHub (Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "MONOPOLY PRO - الإصدار 1.0.0"
          body: "🎲 النسخة الرسمية لتطبيق لعبة مونوبولي برو MONOPOLY PRO بنك الحظ الملكي ثلاثي الأبعاد (APK جاهز للتثبيت المباشر على الأندرويد). برمجة وتصميم عمار الهلالي."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
