          .modal-card {
            background: var(--card-modal-bg);
            border: 2px solid var(--gold);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.92);
            overflow: hidden;
            display: flex;
            flex-direction: column;
          }
          .modal-header {
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
          }
          .modal-title {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
          }
          .modal-body {
            padding: 14px;
            font-size: 0.85rem;
            line-height: 1.45;
            max-height: 68vh;
            overflow-y: auto;
          }
          .modal-footer {
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
          }
          .btn {
            padding: 7px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.80rem;
            cursor: pointer;
            border: none;
          }
          .btn-gold { background: var(--gold); color: #000; }
          .btn-blue { background: #2563EB; color: #fff; }
          .btn-lime { background: #CDDC39; color: #000; }
          .btn-red { background: #DC2626; color: #fff; }
          .btn-gray { background: #4B5563; color: #fff; }
          .btn-pill {
            padding: 5px 11px;
            border-radius: 20px;
            border: 1px solid #4B5563;
            background: #1E293B;
            color: #FFF;
            cursor: pointer;
            font-size: 0.74rem;
          }
          .btn-pill.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            font-weight: bold;
          }
          .row-opts {
