              hi: { app:"MONOPOLY PRO", turn:"आपकी बारी", opp:"विरोधी की बारी", roll:"पासा फेंकें", buy:"खरीदें", auction:"नीलामी", trade:"व्यापार", myProps:"मेरी संपत्ति", passGo:"GO पार किया! 200$ प्राप्त!", p:"संपत्ति", m:"बंधक", robot:"रोबोट", build:"मंजिल बनाएं", maxBld:"अधिकतम (एफिल टॉवर)" },
              pt: { app:"MONOPOLY PRO", turn:"Sua Vez", opp:"Vez do Oponente", roll:"Rolar Dados", buy:"Comprar", auction:"Leilão", trade:"Trocar", myProps:"Meus Imóveis", passGo:"Passou pelo Ponto de Partida! +200$!", p:"Imóveis", m:"Hipotecado", robot:"Robô", build:"Construir Andar", maxBld:"Máximo (Torre Eiffel)" },
              ko: { app:"MONOPOLY PRO", turn:"당신의 턴", opp:"상대방 턴", roll:"주사위 굴리기", buy:"구매", auction:"경매", trade:"거래", myProps:"내 부동산", passGo:"출발점 통과! 200$ 획득!", p:"부동산", m:"저당됨", robot:"로봇", build:"층 증축", maxBld:"최대 (에펠탑)" },
              ja: { app:"MONOPOLY PRO", turn:"あなたの番", opp:"相手の番", roll:"サイコロを振る", buy:"購入", auction:"オークション", trade:"交渉", myProps:"所有地", passGo:"GOを通過！200$獲得！", p:"資産", m:"抵当済", robot:"ロボット", build:"フロア建設", maxBld:"完成 (エッフェル塔)" },
              de: { app:"MONOPOLY PRO", turn:"Dein Zug", opp:"Gegnerzug", roll:"Würfeln", buy:"Kaufen", auction:"Auktion", trade:"Handel", myProps:"Mein Besitz", passGo:"LOS überschritten! +200$!", p:"Besitz", m:"Hypothek", robot:"Roboter", build:"Stockwerk bauen", maxBld:"Max (Eiffelturm)" },
              it: { app:"MONOPOLY PRO", turn:"Tuo Turno", opp:"Turno Avversario", roll:"Lancia Dadi", buy:"Acquista", auction:"Asta", trade:"Scambia", myProps:"Proprietà", passGo:"Passato dal VIA! +200$!", p:"Immobili", m:"Ipotecato", robot:"Robot", build:"Costruisci Piano", maxBld:"Max (Torre Eiffel)" },
              tr: { app:"MONOPOLY PRO", turn:"Sıra Sende", opp:"Rakip Sırası", roll:"Zar At", buy:"Satın Al", auction:"Açık Artırma", trade:"Takas", myProps:"Mülklerim", passGo:"BAŞLANGIÇ'tan geçildi! +200$!", p:"Mülk", m:"İpotekli", robot:"Robot", build:"Kat İnşa Et", maxBld:"Maksimum (Eyfel Kulesi)" },
              fa: { app:"MONOPOLY PRO", turn:"نوبت شما", opp:"نوبت حریف", roll:"پرتاب تاس", buy:"خرید", auction:"حراج", trade:"معامله", myProps:"املاک من", passGo:"عبور از شروع! دریافت 200$!", p:"املاک", m:"در رهن", robot:"ربات", build:"ساخت طبقه", maxBld:"نهایی (برج ایفل)" }
          };

          const EURO_LANGS = ["en","fr","ru","es","pt","de","it","tr"];
          const ASIA_LANGS = ["zh","hi","ko","ja","fa"];

          const AudioFX = {
              ctx: null,
              enabled: true,
              init() {
                  try {
                      if (!this.ctx) {
                          const AC = window.AudioContext || window.webkitAudioContext;
                          if (AC) this.ctx = new AC();
                      }
                      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{});
                  } catch(e){}
              },
              play(type) {
                  if (!this.enabled) return;
                  try {
                      this.init();
                      if (!this.ctx) return;
                      const t = this.ctx.currentTime;
                      const osc = this.ctx.createOscillator();
                      const g = this.ctx.createGain();
                      osc.connect(g);
                      g.connect(this.ctx.destination);
                      osc.onended = () => { try{ osc.disconnect(); g.disconnect(); }catch(e){} };

                      if (type === 'dice') {
                          osc.type = 'triangle'; osc.frequency.setValueAtTime(140, t);
                          osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                          g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0.01, t + 0.12);
                          osc.start(t); osc.stop(t + 0.12);
                      } else if (type === 'step') {
                          osc.type = 'sine'; osc.frequency.setValueAtTime(440, t);
                          g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0.01, t + 0.05);
                          osc.start(t); osc.stop(t + 0.05);
                      } else if (type === 'cash') {
                          osc.type = 'sine'; osc.frequency.setValueAtTime(587, t);
                          osc.frequency.setValueAtTime(880, t + 0.08);
                          g.gain.setValueAtTime(0.18, t); g.gain.linearRampToValueAtTime(0.01, t + 0.2);
                          osc.start(t); osc.stop(t + 0.2);
                      } else if (type === 'build') {
                          osc.type = 'square'; osc.frequency.setValueAtTime(320, t);
                          osc.frequency.setValueAtTime(480, t + 0.08);
                          g.gain.setValueAtTime(0.12, t); g.gain.linearRampToValueAtTime(0.01, t + 0.25);
                          osc.start(t); osc.stop(t + 0.25);
                      } else if (type === 'jail') {
                          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, t);
                          osc.frequency.linearRampToValueAtTime(80, t + 0.3);
                          g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0.01, t + 0.3);
                          osc.start(t); osc.stop(t + 0.3);
                      }
                  } catch(e){}
              }
          };

          const SAVE_KEY = "monopoly_pro_save_v2";

          const Game = {
              lang: 'ar',
              theme: 'dark',
              is3D: false,
              isLandscape: false,
              initCash: 3000,
              difficulty: 'medium', // easy, medium, hard
              mode: 'ai', // ai, pvp, bt
              propStyle: 'glow',
              diceSpeed: 'normal',
              moveSpeed: 'normal',
              turn: 0,
              doublesInRow: 0,
              isRolling: false,
              pendingTile: null,
              auction: null,
              tradeData: null,
              fastTravelData: null,
              isGameOver: false,
              players: [
                  { id:0, name:"الملك", avatar:"👑", color:"#EF4444", money:3000, pos:0, inJail:false, jailTurns:0, props:[] },
                  { id:1, name:"روبوت", avatar:"🤖", color:"#38BDF8", money:3000, pos:0, inJail:false, jailTurns:0, props:[] }
              ]
          };

          function hasSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  return !!(data && data.players && data.players.length > 0 && !data.isGameOver);
              } catch(e) { return false; }
          }

          function saveCurrentGame() {
              try {
                  const saveData = {
                      savedAt: Date.now(),
                      isGameOver: Game.isGameOver,
                      turn: Game.turn,
                      mode: Game.mode,
                      difficulty: Game.difficulty,
                      initCash: Game.initCash,
                      theme: Game.theme,
                      is3D: Game.is3D,
                      lang: Game.lang,
                      players: JSON.parse(JSON.stringify(Game.players)),
                      tiles: BOARD_TILES.map(t => ({ id: t.id, owner: t.owner, mortgaged: t.mortgaged, buildings: t.buildings }))
                  };
                  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                  return true;
              } catch(e) { return false; }
          }

          function loadSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  if (!data || !data.players) return false;

                  Game.turn = data.turn ?? 0;
                  if (data.mode) Game.mode = data.mode;
                  if (data.difficulty) Game.difficulty = data.difficulty;
                  if (data.initCash) Game.initCash = data.initCash;
                  if (data.theme) setAppTheme(data.theme);
                  if (data.is3D) toggle3DView(data.is3D);
                  if (data.lang) setLanguage(data.lang);

                  Game.players = data.players;
                  if (data.tiles) {
                      data.tiles.forEach(st => {
                          const t = BOARD_TILES.find(x => x.id === st.id);
                          if (t) {
                              t.owner = st.owner;
                              t.mortgaged = st.mortgaged;
                              t.buildings = st.buildings || 0;
                          }
                      });
                  }
                  updateBoardVisual();
                  updatePawns();
                  updateUI();
                  return true;
              } catch(e) { return false; }
          }

          function showStartModal() {
              const btnCont = document.getElementById("btnContinueGame");
              const statusTxt = document.getElementById("savedGameStatus");
              const canContinue = hasSavedGame();

              if (canContinue) {
                  btnCont.disabled = false;
                  btnCont.style.opacity = "1";
                  btnCont.classList.remove("btn-gray");
                  btnCont.classList.add("btn-blue");
                  try {
                      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
                      const dt = d.savedAt ? new Date(d.savedAt).toLocaleDateString() : "";
                      statusTxt.innerText = `يوجد لعبة سابقة محفوظة (${dt}).`;
                  } catch(e){ statusTxt.innerText = "يوجد لعبة سابقة جاهزة للإكمال."; }
              } else {
                  btnCont.disabled = true;
                  btnCont.style.opacity = "0.45";
                  btnCont.classList.remove("btn-blue");
                  btnCont.classList.add("btn-gray");
                  statusTxt.innerText = "لا توجد لعبة سابقة محفوظة.";
              }
              document.getElementById("startModal").classList.add("show");
          }

          function setInitCash(val) {
              Game.initCash = val;
              [3000, 6000, 9000].forEach(c => {
                  const b = document.getElementById("btnInit" + c);
                  if (b) b.className = "btn-pill" + (c === val ? " active" : "");
              });
          }

          function setPlayMode(m) {
              Game.mode = m;
              ["ai", "pvp", "bt"].forEach(id => {
                  const b = document.getElementById("btnMode" + (id==='ai'?'VsAi':(id==='pvp'?'PassPlay':'Bt')));
                  if (b) b.className = "btn-pill" + (id === m ? " active" : "");
              });

              const p1Input = document.getElementById("inpP1Name");
              const secDiff = document.getElementById("secDifficulty");

              if (m === 'ai') {
                  p1Input.value = (I18N[Game.lang] && I18N[Game.lang].robot) ? I18N[Game.lang].robot : "روبوت";
                  p1Input.readOnly = true;
                  p1Input.style.opacity = "0.85";
                  secDiff.style.display = "block";
              } else {
                  p1Input.readOnly = false;
                  p1Input.style.opacity = "1";
                  p1Input.value = m === 'bt' ? "لاعب بلوتوث" : "اللاعب 2";
                  secDiff.style.display = "none";
              }
          }

          function setDifficulty(d) {
              Game.difficulty = d;
              ["easy", "medium", "hard"].forEach(id => {
                  const b = document.getElementById("btnDiff" + id.charAt(0).toUpperCase() + id.slice(1));
                  if (b) b.className = "btn-pill" + (id === d ? " active" : "");
              });
          }

          function confirmStartNewGame() {
              const p0Name = document.getElementById("inpP0Name").value.trim() || "الملك";
              let p1Name = document.getElementById("inpP1Name").value.trim();

              if (Game.mode === 'ai') {
                  p1Name = (I18N[Game.lang] && I18N[Game.lang].robot) ? I18N[Game.lang].robot : "روبوت";
              } else if (!p1Name) {
                  p1Name = "لاعب 2";
              }

              Game.players[0].name = p0Name;
              Game.players[0].money = Game.initCash;
              Game.players[0].pos = 0;
              Game.players[0].props = [];
              Game.players[0].inJail = false;

              Game.players[1].name = p1Name;
              Game.players[1].avatar = Game.mode === 'ai' ? "🤖" : "🦅";
              Game.players[1].money = Game.initCash;
              Game.players[1].pos = 0;
              Game.players[1].props = [];
              Game.players[1].inJail = false;

              BOARD_TILES.forEach(t => { t.owner = undefined; t.mortgaged = false; t.buildings = 0; });
              Game.turn = 0;
              Game.isGameOver = false;

              document.getElementById("startModal").classList.remove("show");
              updateBoardVisual();
              updatePawns();
              updateUI();
              logEvent(`🎲 بدأت لعبة جديدة بمبلغ ${Game.initCash}$ ضد ${p1Name}!`);
              startPlayerTurn();
          }

          function continueSavedGameFromModal() {
              if (!hasSavedGame()) return;
              if (loadSavedGame()) {
                  document.getElementById("startModal").classList.remove("show");
                  logEvent("📂 تم استئناف اللعبة السابقة بنجاح!");
                  startPlayerTurn();
              }
          }

          function promptNewGameFromSettings() {
              closeSettingsModal();
              showStartModal();
          }

          function getGridCoords(i) {
              if (i === 0) return { r: 11, c: 11 };
              if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
              if (i === 10) return { r: 11, c: 1 };
              if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
              if (i === 20) return { r: 1, c: 1 };
              if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
              if (i === 30) return { r: 1, c: 11 };
              if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
              return { r: 11, c: 11 };
          }

          function getTileDisplayName(t) {
              if (t.type === "property") {
                  const pIdx = PROPERTY_INDICES.indexOf(t.id);
                  if (pIdx !== -1) {
                      if (Game.lang === 'ar') {
                          return CITY_NAMES.ar[pIdx] || t.nameAr;
                      } else if (EURO_LANGS.includes(Game.lang)) {
                          return CITY_NAMES.europe[pIdx] || t.nameEn;
                      } else if (ASIA_LANGS.includes(Game.lang)) {
                          return CITY_NAMES.asia[pIdx] || t.nameEn;
                      }
                  }
              }
              return Game.lang === 'ar' ? t.nameAr : t.nameEn;
          }

          function renderBoard() {
              const boardEl = document.getElementById("board");
              BOARD_TILES.forEach((tile, index) => {
                  const coords = getGridCoords(index);
                  const tileDiv = document.createElement("div");
                  tileDiv.id = "tile-" + index;

                  let side = "side-bottom";
                  if (index >= 11 && index <= 19) side = "side-left";
                  else if (index >= 20 && index <= 30) side = "side-top";
                  else if (index >= 31 && index <= 39) side = "side-right";
                  tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile corner-" + index : "");

                  tileDiv.style.gridRow = coords.r;
                  tileDiv.style.gridColumn = coords.c;
                  tileDiv.onclick = () => openTileInfoModal(index);

                  let h = "";
                  if (tile.type === "property") {
                      h += `<div class="tile-bar" style="background:${tile.color}"></div>
                            <div class="tile-cnt">
                              <div class="bld-zone" id="bldZone-${index}"></div>
                              <div class="tile-name" id="tName-${index}">${getTileDisplayName(tile)}</div>
                              <div class="tile-price">${tile.price}$</div>
                            </div>`;
                  } else if (tile.type === "railroad" || tile.type === "utility") {
                      h += `<div class="tile-cnt">
                              <div class="tile-icon">${tile.icon}</div>
                              <div class="tile-name" id="tName-${index}">${getTileDisplayName(tile)}</div>
                              <div class="tile-price">${tile.price}$</div>
                            </div>`;
                  } else {
                      h += `<div class="tile-cnt">
                              <div class="tile-icon">${tile.icon||"🏛️"}</div>
                              <div class="tile-name" id="tName-${index}">${getTileDisplayName(tile)}</div>
                            </div>`;
                  }
                  h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
                  tileDiv.innerHTML = h;
                  boardEl.appendChild(tileDiv);
              });
              updatePawns();
          }

          let pawnEl0 = null, pawnEl1 = null;
          function getPawnEl(id) {
              if (id === 0) {
                  if (!pawnEl0) { pawnEl0 = document.createElement("div"); pawnEl0.id = "pawn-p0"; pawnEl0.className = "pawn pawn-p0"; }
                  pawnEl0.innerText = Game.players[0].avatar;
                  return pawnEl0;
              } else {
                  if (!pawnEl1) { pawnEl1 = document.createElement("div"); pawnEl1.id = "pawn-p1"; pawnEl1.className = "pawn pawn-p1"; }
                  pawnEl1.innerText = Game.players[1].avatar;
                  return pawnEl1;
              }
          }

          function updatePawns(movingId = null) {
              if (movingId !== null) {
                  const p = Game.players[movingId];
                  const el = getPawnEl(movingId);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                      el.classList.add("moving-step");
                      setTimeout(() => el.classList.remove("moving-step"), 110);
                  }
                  return;
              }
              Game.players.forEach(p => {
                  const el = getPawnEl(p.id);
                  const target = document.getElementById("pawns-" + p.pos);
                  if (target && el.parentElement !== target) {
                      target.appendChild(el);
                  }
              });
          }

          function updateUI() {
              const p0 = Game.players[0], p1 = Game.players[1];
              const dict = I18N[Game.lang] || I18N.ar;

              document.getElementById("cashP0").innerText = p0.money + "$";
              document.getElementById("cashP1").innerText = p1.money + "$";
              const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
              const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;
              document.getElementById("propsP0").innerText = `${dict.p} ${p0.props.length}`;
              document.getElementById("propsP1").innerText = `${dict.p} ${p1.props.length}`;
              document.getElementById("mortP0").innerText = m0 > 0 ? `(${dict.m} ${m0})` : "";
              document.getElementById("mortP1").innerText = m1 > 0 ? `(${dict.m} ${m1})` : "";

              document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
              document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
              document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
              document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";
              document.getElementById("turnBadge0").innerText = dict.turn;
              document.getElementById("turnBadge1").innerText = dict.opp;

              const cur = Game.players[Game.turn];
              document.getElementById("turnAnnouncer").innerText = `${dict.turn}: ${cur.avatar} ${cur.name}`;
              document.getElementById("nameP0").innerText = p0.name;
              document.getElementById("nameP1").innerText = p1.name;
              document.getElementById("avP0").innerText = p0.avatar;
              document.getElementById("avP1").innerText = p1.avatar;

              updateBoardVisual();
          }

          function updateBoardVisual() {
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tile-" + t.id);
                  if (!el) return;
                  el.classList.remove("owned-glow","owned-tint","owned-border");
                  const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
                  const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();

                  // Update building visualization
                  const bldZone = document.getElementById("bldZone-" + t.id);
                  if (bldZone) {
                      bldZone.innerHTML = "";
                      if (t.buildings >= 5) {
                          bldZone.innerHTML = `<span class="eiffel-tower" title="برج إيفل الذهبي">🗼</span>`;
                      } else if (t.buildings > 0) {
                          for (let i = 0; i < t.buildings; i++) {
                              bldZone.innerHTML += `<div class="bld-block" title="طابق ${i+1}"></div>`;
                          }
                      }
                  }

                  if (t.owner !== undefined) {
                      const owner = Game.players[t.owner];
                      el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                      if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                      else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                      else if (Game.propStyle === 'border') el.classList.add("owned-border");
                      else if (Game.propStyle === 'badge') {
                          const bg = document.createElement("div"); bg.className = "tile-owner-badge"; bg.innerText = owner.avatar; el.appendChild(bg);
                      }
                      if (t.mortgaged) {
                          const mg = document.createElement("div"); mg.className = "tile-mortgaged-badge"; mg.innerText = I18N[Game.lang]?.m || "مَرْهُون"; el.appendChild(mg);
                      }
                  } else { el.style.color = ""; }
              });
          }

          function logEvent(msg) {
              const el = document.getElementById("gameLog");
              el.innerText = msg;
          }

          function toggle3DView(forceState = null) {
              Game.is3D = (forceState !== null) ? forceState : !Game.is3D;
              const bw = document.getElementById("board");
              const btn = document.getElementById("btn3DToggle");
              if (Game.is3D) {
                  bw.classList.add("tabletop-3d");
                  btn.innerText = "📐 2D";
              } else {
                  bw.classList.remove("tabletop-3d");
                  btn.innerText = "🎲 3D";
              }
          }

          function toggleScreenOrientation() {
              Game.isLandscape = !Game.isLandscape;
              const cont = document.getElementById("appContainer");
              if (Game.isLandscape) {
                  cont.classList.add("landscape-mode");
                  if (window.Android && window.Android.setOrientation) {
                      window.Android.setOrientation("landscape");
                  }
              } else {
                  cont.classList.remove("landscape-mode");
                  if (window.Android && window.Android.setOrientation) {
                      window.Android.setOrientation("portrait");
                  }
              }
          }

          function setAppTheme(mode) {
              Game.theme = mode;
              if (mode === 'light') {
                  document.body.classList.add("light-theme");
                  document.getElementById("btnThemeLight").className = "btn-pill active";
                  document.getElementById("btnThemeDark").className = "btn-pill";
              } else {
                  document.body.classList.remove("light-theme");
                  document.getElementById("btnThemeDark").className = "btn-pill active";
                  document.getElementById("btnThemeLight").className = "btn-pill";
              }
          }

          function rollDice() {
              if (Game.isRolling || Game.isGameOver) return;
              const cur = Game.players[Game.turn];
              if (cur.inJail) {
                  if (Game.turn === 0 || Game.mode !== 'ai') openJailModal();
                  else {
                      if (cur.money >= 300) payJailFine();
                      else rollForJail();
                  }
                  return;
              }

              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;

              const d0 = document.getElementById("die0");
              const d1 = document.getElementById("die1");
              d0.classList.add("rolling");
              d1.classList.add("rolling");
              AudioFX.play('dice');

              const dur = Game.diceSpeed === "slow" ? 850 : (Game.diceSpeed === "fast" ? 250 : 500);
              setTimeout(() => {
                  d0.classList.remove("rolling");
                  d1.classList.remove("rolling");

                  const val0 = Math.floor(Math.random() * 6) + 1;
                  const val1 = Math.floor(Math.random() * 6) + 1;
                  setDieFace(d0, val0);
                  setDieFace(d1, val1);

                  const sum = val0 + val1;
                  const isDbl = (val0 === val1);
                  logEvent(`${cur.avatar} رمى النرد: ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);

                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow >= 3) {
                          Game.doublesInRow = 0;
                          logEvent("🚔 3 رميات متطابقة! أُرسلت للسجن.");
                          sendToJail(cur); finishTurn(false); return;
                      }
                  } else { Game.doublesInRow = 0; }

                  moveSteps(cur, sum, isDbl);
              }, dur);
          }

          function setDieFace(dieEl, val) {
              const rot = {
                  1: "rotateX(0deg) rotateY(0deg)",
                  6: "rotateY(180deg)",
                  2: "rotateY(90deg)",
                  5: "rotateY(-90deg)",
                  3: "rotateX(-90deg)",
                  4: "rotateX(90deg)"
              };
              dieEl.style.transform = rot[val];
          }

          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : 120);
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns(player.id);
                  if (player.pos === 0) {
                      player.money += 200;
                      AudioFX.play('cash');
                      logEvent(I18N[Game.lang]?.passGo || "مررت بنقطة الانطلاق وحصلت على 200$!");
                      updateUI();
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 160);
                  }
              }, iv);
          }

          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();

              if (tile.type === "gotojail") {
                  sendToJail(player); finishTurn(false); return;
              }

              if (tile.type === "tax") {
                  player.money -= tile.price;
                  AudioFX.play('cash');
                  logEvent(`💸 ${player.avatar} دفع ضريبة ${tile.price}$ (${getTileDisplayName(tile)}).`);
                  if (checkBankruptcy(player)) return;
                  updateUI(); finishTurn(isDbl); return;
              }

              if (tile.type === "chance" || tile.type === "chest") {
                  handleCard(player, tile.type, isDbl); return;
              }

              if (["property", "railroad", "utility"].includes(tile.type)) {
                  if (tile.owner === undefined) {
                      if (player.id === 0 || Game.mode !== 'ai') {
                          promptBuyProperty(tile, isDbl);
                      } else {
                          handleAIBuyDecision(player, tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      if (!tile.mortgaged) {
                          const rent = calculateRent(tile);
                          player.money -= rent;
                          Game.players[tile.owner].money += rent;
                          AudioFX.play('cash');
                          logEvent(`🏷️ دفع ${player.avatar} ${rent}$ إيجار إلى ${Game.players[tile.owner].name} (${getTileDisplayName(tile)}).`);
                          if (checkBankruptcy(player)) return;
                          updateUI();
                      } else {
                          logEvent(`العقار (${getTileDisplayName(tile)}) مَرْهُون، معفى من الإيجار.`);
                      }
                      finishTurn(isDbl); return;
                  } else {
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl); return;
                      }
                  }
              }

              finishTurn(isDbl);
          }

          // شروط السفر السريع: لا يتم إلا إذا تم شراء كافة المحطات الأربع، ويكون مجانياً (0$) لصاحب المحطات
          function promptRailroadFastTravel(player, currentTile, isDbl) {
              const allRails = BOARD_TILES.filter(t => t.type === "railroad");
              const allPurchased = allRails.every(t => t.owner !== undefined);
              if (!allPurchased) { finishTurn(isDbl); return; }

              const otherRails = allRails.filter(t => t.id !== currentTile.id && t.owner === player.id);
              if (otherRails.length === 0) { finishTurn(isDbl); return; }

              const dest = otherRails[0];
              Game.fastTravelData = { player, dest, isDbl };
              document.getElementById("fastTravelDestName").innerText = `${dest.icon} ${getTileDisplayName(dest)}`;
              document.getElementById("fastTravelModal").classList.add("show");
          }

          function confirmFastTravel() {
              if (!Game.fastTravelData) return;
              const { player, dest, isDbl } = Game.fastTravelData;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");

              player.pos = dest.id;
              AudioFX.play('step');
              updatePawns(player.id);
              updateUI();
              logEvent(`🚄 سافر ${player.avatar} مجاناً إلى (${getTileDisplayName(dest)})!`);
              finishTurn(isDbl);
          }

          function cancelFastTravel() {
              if (!Game.fastTravelData) return;
              const isDbl = Game.fastTravelData.isDbl;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");
              finishTurn(isDbl);
          }

          // حساب الإيجار والبناء: كل طابق يزيد الإيجار بنسبة 50% من تكلفة الطابق
          function calculateRent(tile) {
              if (tile.type === "railroad") {
                  const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
                  return 25 * Math.pow(2, cnt - 1);
              }
              if (tile.type === "utility") {
                  const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
                  return cnt === 2 ? 50 : 20;
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);
              const baseRent = hasMonopoly ? Math.round(tile.price * 0.40) : Math.round(tile.price * 0.20);

              if (tile.buildings > 0) {
                  const floorCost = Math.round(tile.price * 0.33);
                  const floorBonus = Math.round(floorCost * 0.50);
                  return baseRent + (tile.buildings * floorBonus);
              }
              return baseRent;
          }

          function canBuildOnProp(playerId, tile) {
              if (tile.type !== "property" || tile.owner !== playerId || tile.mortgaged) return false;
              if (tile.buildings >= 5) return false; // الحد النهائي برج إيفل
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const ownsAll = groupTiles.every(t => t.owner === playerId && !t.mortgaged);
              if (!ownsAll) return false;

              // قاعدة البناء المتساوي: لا يمكن بناء الطابق التالي إلا بعد بناء الحالي في بقية عقارات المجموعة
              const minBldInGroup = Math.min(...groupTiles.map(t => t.buildings));
              if (tile.buildings > minBldInGroup) return false;

              const floorCost = Math.round(tile.price * 0.33);
              return Game.players[playerId].money >= floorCost;
          }

          function buildFloor(tileId) {
              const t = BOARD_TILES[tileId];
              const p = Game.players[t.owner];
              const floorCost = Math.round(t.price * 0.33);

              if (canBuildOnProp(p.id, t)) {
                  p.money -= floorCost;
                  t.buildings++;
                  AudioFX.play('build');
                  updateUI();
                  if (t.buildings === 5) {
                      logEvent(`🗼 اكتمل بناء برج إيفل الذهبي في (${getTileDisplayName(t)})!`);
                  } else {
                      logEvent(`🧱 بنى ${p.avatar} طابقاً ليمونياً ثلاثي الأبعاد (${t.buildings}) في (${getTileDisplayName(t)}).`);
                  }
                  openPropsModal(p.id);
              }
          }

          function promptBuyProperty(tile, isDbl) {
              Game.pendingTile = { tile, isDbl };
              const baseRent = Math.round(tile.price * 0.20);
              const monoRent = Math.round(tile.price * 0.40);
              const floorCost = Math.round(tile.price * 0.33);

              document.getElementById("deedTitle").innerText = `${tile.icon||""} ${getTileDisplayName(tile)}`;
              document.getElementById("deedBody").innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <span style="display:inline-block; width:14px; height:14px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                      <strong style="font-size:1.15rem; color:var(--gold); margin:0 6px;">${tile.price}$</strong>
                  </div>
                  <div style="font-size:0.82rem; color:var(--text); text-align:center;">إيجار العقار الأساسي (20%): <strong style="color:var(--gold);">${baseRent}$</strong></div>
                  <div style="font-size:0.75rem; color:var(--dim); text-align:center; margin-top:3px;">إيجار الاحتكار (40%): <strong style="color:var(--gold);">${monoRent}$</strong></div>
                  ${tile.type === 'property' ? `<div style="font-size:0.75rem; color:var(--lime); text-align:center; margin-top:3px;">تكلفة الطابق (33%): <strong>${floorCost}$</strong> | الحد النهائي: برج إيفل 🗼</div>` : ''}
              `;
              const canAfford = Game.players[Game.turn].money >= tile.price;
              document.getElementById("btnBuyProp").disabled = !canAfford;
              document.getElementById("deedModal").classList.add("show");
          }

          function closeDeedModal() {
              document.getElementById("deedModal").classList.remove("show");
              if (Game.pendingTile) {
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  finishTurn(isDbl);
              }
          }

          function confirmBuyProp() {
              if (!Game.pendingTile) return;
              const cur = Game.players[Game.turn];
              const t = Game.pendingTile.tile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  document.getElementById("deedModal").classList.remove("show");
                  finishTurn(isDbl);
              }
          }

          let aucTimerInterval = null;
          let aucSecondsLeft = 5;

          function startAuctionTimer() {
              stopAuctionTimer();
              aucSecondsLeft = 5;
              const timerEl = document.getElementById("aucTimerNum");
              if (timerEl) timerEl.innerText = aucSecondsLeft;

              aucTimerInterval = setInterval(() => {
                  aucSecondsLeft--;
                  if (timerEl) timerEl.innerText = aucSecondsLeft;
                  if (aucSecondsLeft <= 0) {
                      stopAuctionTimer();
                      handleAuctionTimeout();
                  }
              }, 1000);
          }

          function stopAuctionTimer() {
              if (aucTimerInterval) {
                  clearInterval(aucTimerInterval);
                  aucTimerInterval = null;
              }
          }

          function handleAuctionTimeout() {
              const a = Game.auction;
              if (!a) return;
              logEvent(`⏱️ انتهت المهلة للاعب ${Game.players[a.bidTurn].avatar}!`);
              if (a.highestBidder !== null) {
                  concludeAuction();
              } else {
                  foldAuctionBid();
              }
          }

          function startAuction() {
              if (!Game.pendingTile) return;
              const t = Game.pendingTile.tile;
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");

              Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
              document.getElementById("auctionModal").classList.add("show");
              updateAuctionUI();
              startAuctionTimer();
              if (Game.turn === 1 && Game.mode === 'ai') setTimeout(handleAIAuction, 900);
          }

          function updateAuctionUI() {
              const a = Game.auction; if (!a) return;
              document.getElementById("aucPropDetails").innerText = `${a.tile.icon || "🏙️"} ${getTileDisplayName(a.tile)}`;
              document.getElementById("aucBasePriceVal").innerText = a.tile.price + "$";
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? `${Game.players[a.highestBidder].avatar} (${Game.players[a.highestBidder].money}$)` : "لا يوجد مزايد";
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور المزايدة: ${cur.avatar} ${cur.name}`;
              document.getElementById("aucControls").style.display = (a.bidTurn === 0 || Game.mode !== 'ai') ? "flex" : "none";
          }

          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              const bidder = a.bidTurn;
              const p = Game.players[bidder];
              const nextBid = a.currentBid + inc;
              if (p.money >= nextBid) {
                  a.currentBid = nextBid;
                  a.highestBidder = bidder;
                  logEvent(`🔨 رفع ${p.avatar} المزاد إلى ${a.currentBid}$!`);
                  nextAuctionTurn();
              } else {
                  startAuctionTimer();
              }
          }

          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} من المزاد.`);
              a.active = a.active.filter(id => id !== a.bidTurn);
              if (a.active.length === 1 && a.highestBidder !== null) {
                  concludeAuction();
              } else if (a.active.length === 0) {
                  document.getElementById("auctionModal").classList.remove("show");
                  const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
              } else {
                  nextAuctionTurn();
              }
          }

          function nextAuctionTurn() {
              const a = Game.auction; if (!a) return;
              a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
              updateAuctionUI();
              startAuctionTimer();
              if (a.bidTurn === 1 && a.active.includes(1) && Game.mode === 'ai') setTimeout(handleAIAuction, 900);
          }

          function concludeAuction() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              document.getElementById("auctionModal").classList.remove("show");
              const winner = Game.players[a.highestBidder];
              logEvent(`🏆 فاز ${winner.avatar} بمزاد (${getTileDisplayName(a.tile)}) بمبلغ ${a.currentBid}$!`);
              buyProp(winner, a.tile, a.currentBid);
              const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
          }

          function handleAIAuction() {
              const a = Game.auction; if (!a || a.bidTurn !== 1) return;
              const ai = Game.players[1];
              let mult = Game.difficulty === 'hard' ? 1.4 : (Game.difficulty === 'easy' ? 0.7 : 1.0);
              let val = a.tile.price * mult;
              if (checkMonopolyPot(1, a.tile.group)) val *= 1.3;

              if (a.currentBid + 15 <= val && ai.money >= a.currentBid + 40) placeAuctionBid(15);
              else foldAuctionBid();
          }

          function handleAIBuyDecision(player, tile, isDbl) {
              const threshold = Game.difficulty === 'hard' ? 50 : (Game.difficulty === 'easy' ? 250 : 120);
              const hasCash = player.money >= tile.price + threshold;
              const pot = checkMonopolyPot(1, tile.group);

              if (hasCash || pot) {
                  buyProp(player, tile, tile.price);
                  finishTurn(isDbl);
              } else {
                  Game.pendingTile = { tile, isDbl };
                  startAuction();
              }
          }

          function checkMonopolyPot(playerId, group) {
              if (!group) return false;
              const groupTiles = BOARD_TILES.filter(t => t.group === group);
              return groupTiles.some(t => t.owner === playerId);
          }

          function buyProp(player, tile, price) {
              player.money -= price;
              tile.owner = player.id;
              player.props.push(tile.id);
              AudioFX.play('cash');
              logEvent(`🎉 اشترى ${player.avatar} (${getTileDisplayName(tile)}) مقابل ${price}$.`);
              updateUI();
          }

          function handleCard(player, type, isDbl) {
              const cards = [
                  { text:"ربحت جائزة حظ استثمارية! استلم 100$", action:"cash", val:100 },
                  { text:"رسوم خدمات بلدية مفاجئة! ادفع 50$", action:"cash", val:-50 },
                  { text:"تقدم فوراً إلى خانة انطلق واربح 200$", action:"go" },
                  { text:"مخالفة مرورية! تم إرسالك إلى السجن.", action:"jail" }
              ];
              const c = cards[Math.floor(Math.random() * cards.length)];
              logEvent(`📜 ${c.text}`);
              if (c.action === "cash") {
                  player.money += c.val;
                  if (checkBankruptcy(player)) return;
                  AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
              } else if (c.action === "go") {
                  player.pos = 0; player.money += 200;
                  AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
              } else if (c.action === "jail") {
                  sendToJail(player); finishTurn(false);
              }
          }

          function sendToJail(p) {
              p.pos = 10; p.inJail = true; p.jailTurns = 3;
              AudioFX.play('jail'); updatePawns(p.id); updateUI();
              logEvent(`🚔 دَخَل ${p.avatar} السجن!`);
          }

          function openJailModal() { document.getElementById("jailModal").classList.add("show"); }

          function payJailFine() {
              const cur = Game.players[Game.turn];
              if (cur.money >= 50) {
                  cur.money -= 50; cur.inJail = false; cur.jailTurns = 0;
                  document.getElementById("jailModal").classList.remove("show");
                  AudioFX.play('cash'); updateUI();
                  logEvent("دُفعت كفالة 50$ وخرجت من السجن.");
                  if (Game.turn === 1 && Game.mode === 'ai') setTimeout(rollDice, 500);
                  else document.getElementById("btnRoll").disabled = false;
              } else {
                  rollForJail();
              }
          }

          function rollForJail() {
              document.getElementById("jailModal").classList.remove("show");
              const v0 = Math.floor(Math.random() * 6) + 1;
              const v1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(document.getElementById("die0"), v0);
              setDieFace(document.getElementById("die1"), v1);
              const cur = Game.players[Game.turn];
              if (v0 === v1) {
                  cur.inJail = false; cur.jailTurns = 0;
                  logEvent("نرد متطابق! خرجت من السجن بحرية.");
                  updateUI(); moveSteps(cur, v0 + v1, false);
              } else {
                  cur.jailTurns--;
                  if (cur.jailTurns <= 0) {
                      cur.money = Math.max(0, cur.money - 50);
                      cur.inJail = false; cur.jailTurns = 0;
                      logEvent("انتهت مدة السجن ودُفعت كفالة إجبارية.");
                      updateUI(); moveSteps(cur, v0 + v1, false);
                  } else {
                      logEvent(`لم يتطابق النرد (${v0}+${v1})! بقي في السجن.`);
                      finishTurn(false);
                  }
              }
          }

          function finishTurn(isDbl) {
              Game.isRolling = false;
              if (Game.isGameOver) return;
              if (isDbl && !Game.players[Game.turn].inJail) {
                  logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} على رمية إضافية.`);
                  startPlayerTurn();
                  return;
              }
              Game.doublesInRow = 0;
              Game.turn = (Game.turn === 0) ? 1 : 0;
              updateUI();
              startPlayerTurn();
          }

          function startPlayerTurn() {
              if (Game.isGameOver) return;
              updateUI();
              const cur = Game.players[Game.turn];

              // AI automatic house construction
              if (Game.turn === 1 && Game.mode === 'ai') {
                  const buildable = cur.props.map(id => BOARD_TILES[id]).filter(t => canBuildOnProp(1, t));
                  if (buildable.length > 0) {
                      buildFloor(buildable[0].id);
                  }
              }

              if (Game.turn === 0 || Game.mode !== 'ai') {
                  document.getElementById("btnRoll").disabled = false;
              } else {
                  document.getElementById("btnRoll").disabled = true;
                  setTimeout(() => {
                      if (Game.isGameOver || Game.turn !== 1) return;
                      if (cur.inJail) {
                          if (cur.money >= 300) payJailFine();
                          else rollForJail();
                      } else {
                          rollDice();
                      }
                  }, 700);
              }
          }

          function checkBankruptcy(player) {
              if (player.money >= 0) return false;
              const unmortgaged = player.props.filter(id => !BOARD_TILES[id].mortgaged);
              for (const propId of unmortgaged) {
                  if (player.money >= 0) break;
                  const t = BOARD_TILES[propId];
                  t.mortgaged = true;
                  player.money += Math.floor(t.price * 0.5);
                  logEvent(`🏦 تم رهن (${getTileDisplayName(t)}) لتغطية المبالغ المطلوبة.`);
              }
              updateUI();
              if (player.money < 0) {
                  const winnerId = (player.id === 0) ? 1 : 0;
                  Game.isGameOver = true;
                  localStorage.removeItem(SAVE_KEY);
                  const winner = Game.players[winnerId];
                  document.getElementById("goTrophy").innerText = winner.avatar;
                  document.getElementById("goWinnerText").innerText = `فاز ${winner.name} باللعبة! 🏆`;
                  document.getElementById("gameOverModal").classList.add("show");
                  return true;
              }
              return false;
          }

          // نظام المقايضة: عند رفض الخصم يُعاد فتح النافذة فوراً لنفس العقار لزيادة السعر أو الخروج
          function openTradeModal(prefillPropId = null, prefillCash = null) {
              const sel = document.getElementById("tradeTargetProp");
              sel.innerHTML = "";
              const targetOwner = Game.turn === 0 ? 1 : 0;
              const oppProps = BOARD_TILES.filter(t => t.owner === targetOwner && !t.mortgaged);

              if (oppProps.length === 0) {
                  sel.innerHTML = "<option>لا يملك الخصم عقارات قابلة للمقايضة</option>";
              } else {
                  oppProps.forEach(t => {
                      const opt = document.createElement("option");
                      opt.value = t.id;
                      opt.innerText = `${t.icon||""} ${getTileDisplayName(t)} (${t.price}$)`;
                      if (prefillPropId !== null && t.id === prefillPropId) opt.selected = true;
                      sel.appendChild(opt);
                  });
              }

              if (prefillCash !== null) {
                  document.getElementById("tradeOfferCash").value = prefillCash;
              }
              document.getElementById("tradeNotice").style.display = "none";
              document.getElementById("tradeModal").classList.add("show");
          }

          function submitTradeOffer() {
              const propId = parseInt(document.getElementById("tradeTargetProp").value);
              const offerCash = parseInt(document.getElementById("tradeOfferCash").value);
              const notice = document.getElementById("tradeNotice");
              if (isNaN(propId) || isNaN(offerCash) || offerCash <= 0) return;

              const buyer = Game.players[Game.turn];
              if (buyer.money < offerCash) {
                  notice.innerText = "رصيدك المالي لا يكفي للمبلغ المعروض!";
                  notice.style.display = "block";
                  return;
              }

              const targetTile = BOARD_TILES[propId];
              const sellerId = targetTile.owner;
              closeTradeModal();

              const td = { buyerId: buyer.id, sellerId, tile: targetTile, offer: offerCash };
              evaluateTrade(td);
          }

          function evaluateTrade(td) {
              const seller = Game.players[td.sellerId];
              let accepted = false;

              if (Game.mode === 'ai' && td.sellerId === 1) {
                  let factor = Game.difficulty === 'hard' ? 1.7 : (Game.difficulty === 'easy' ? 1.15 : 1.35);
                  if (checkMonopolyPot(1, td.tile.group)) factor += 0.3;
                  if (td.offer >= td.tile.price * factor) accepted = true;
              } else {
                  // In 2-player pass & play, standard threshold or confirm
                  accepted = td.offer >= td.tile.price * 1.25;
              }

              if (accepted) {
                  const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
                  b.money -= td.offer; s.money += td.offer;
                  s.props = s.props.filter(id => id !== t.id); b.props.push(t.id); t.owner = b.id;
                  AudioFX.play('cash'); updateUI();
                  logEvent(`🤝 تمت المقايضة! اشترى ${b.avatar} (${getTileDisplayName(t)}) مقابل ${td.offer}$.`);
              } else {
                  logEvent(`❌ رفض ${seller.name} عرض المقايضة لعقار (${getTileDisplayName(td.tile)}).`);
                  // إعادة إظهار نافذة المقايضة لنفس العقار لزيادة السعر أو الخروج
                  setTimeout(() => {
                      openTradeModal(td.tile.id, td.offer + 50);
                      const n = document.getElementById("tradeNotice");
                      n.innerText = `تم رفض العرض السابق (${td.offer}$). يمكنك زيادة السعر أو الخروج.`;
                      n.style.display = "block";
                  }, 400);
              }
          }

          function closeTradeModal() {
              document.getElementById("tradeModal").classList.remove("show");
          }

          function openPropsModal(pId) {
              const p = Game.players[pId];
              const dict = I18N[Game.lang] || I18N.ar;
              document.getElementById("propsModalTitle").innerText = `${p.avatar} ${p.name} (${p.money}$)`;
              const b = document.getElementById("propsModalBody");
              b.innerHTML = "";

              if (p.props.length === 0) {
                  b.innerHTML = `<div style="text-align:center; color:var(--dim); padding:16px;">لا توجد أي عقارات مملوكة حالياً.</div>`;
              } else {
                  p.props.forEach(propId => {
                      const t = BOARD_TILES[propId];
                      const d = document.createElement("div");
                      d.style = "background:#0F172A; border-radius:8px; padding:8px 10px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; border:1px solid #334155;";
                      const mortVal = Math.floor(t.price * 0.5);
                      const unmortVal = Math.floor(mortVal * 1.1);
                      const floorCost = Math.round(t.price * 0.33);
                      const canBuild = canBuildOnProp(pId, t);

                      let bldActionHtml = "";
                      if (t.type === "property" && !t.mortgaged) {
                          if (t.buildings >= 5) {
                              bldActionHtml = `<span style="color:var(--gold); font-size:0.75rem; font-weight:bold;">🗼 مكتمل</span>`;
                          } else if (canBuild) {
                              bldActionHtml = `<button class="btn btn-gold" style="font-size:0.70rem; padding:4px 8px;" onclick="buildFloor(${t.id})">بناء طابق (${floorCost}$)</button>`;
                          }
                      }

                      d.innerHTML = `
                          <div>
                              <strong style="color:${t.color||'var(--gold)'};">${t.icon||""} ${getTileDisplayName(t)}</strong>
                              <div style="font-size:0.72rem; color:var(--dim);">القيمة: ${t.price}$ | طوابق: ${t.buildings===5?'🗼 برج إيفل':t.buildings}</div>
                          </div>
                          <div style="display:flex; gap:4px; align-items:center;">
                              ${bldActionHtml}
                              ${pId === 0 ? (
                                  t.mortgaged ?
                                  `<button class="btn btn-gold" style="font-size:0.70rem; padding:4px 7px;" onclick="unmortgageProp(${t.id})">فك (${unmortVal}$)</button>` :
                                  (t.buildings === 0 ? `<button class="btn btn-red" style="font-size:0.70rem; padding:4px 7px;" onclick="mortgageProp(${t.id})">رهن (+${mortVal}$)</button>` : '')
                              ) : (t.mortgaged ? `<span style="color:#EF4444; font-size:0.70rem;">مَرْهُون</span>` : '')}
                          </div>
                      `;
                      b.appendChild(d);
                  });
              }
              document.getElementById("propsModal").classList.add("show");
          }

          function closePropsModal() { document.getElementById("propsModal").classList.remove("show"); }

          function mortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              if (t.owner === 0 && !t.mortgaged && t.buildings === 0) {
                  t.mortgaged = true; p.money += Math.floor(t.price * 0.5);
                  AudioFX.play('cash'); updateUI(); openPropsModal(0);
                  logEvent(`🏦 رهن (${getTileDisplayName(t)}) واستلم ${Math.floor(t.price * 0.5)}$.`);
              }
          }

          function unmortgageProp(id) {
              const t = BOARD_TILES[id], p = Game.players[0];
              const cost = Math.floor(t.price * 0.5 * 1.1);
              if (t.owner === 0 && t.mortgaged && p.money >= cost) {
                  t.mortgaged = false; p.money -= cost;
                  AudioFX.play('cash'); updateUI(); openPropsModal(0);
                  logEvent(`🔓 فك رهن (${getTileDisplayName(t)}) مقابل ${cost}$.`);
              }
          }

          function openTileInfoModal(index) {
              const t = BOARD_TILES[index];
              const titleEl = document.getElementById("tileInfoTitle");
              const bodyEl = document.getElementById("tileInfoBody");
              titleEl.innerText = `${t.icon||"🏙️"} ${getTileDisplayName(t)}`;

              if (t.type === "property") {
                  const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].name}` : "متاح للبيع";
                  const baseRent = Math.round(t.price * 0.20);
                  const monoRent = Math.round(t.price * 0.40);
                  const floorCost = Math.round(t.price * 0.33);

                  bodyEl.innerHTML = `
                      <div style="text-align:center; margin-bottom:8px;">
                          <span class="info-badge" style="background:${t.color}33; border-color:${t.color}; color:#FFF;">عقار استثماري</span>
                          <div style="font-size:1.1rem; font-weight:900; color:var(--gold);">${t.price}$</div>
                      </div>
                      <div class="info-rule-box">
                          <div class="info-rule-item"><strong>الإيجار الأساسي (20%):</strong> <span>${baseRent}$</span></div>
                          <div class="info-rule-item"><strong>إيجار الاحتكار (40%):</strong> <span>${monoRent}$</span></div>
                          <div class="info-rule-item"><strong>تكلفة بناء الطابق (33%):</strong> <span>${floorCost}$</span></div>
                          <div class="info-rule-item"><strong>عدد الطوابق الحالية:</strong> <span>${t.buildings===5?'🗼 برج إيفل الذهبي':t.buildings}</span></div>
                          <div class="info-rule-item"><strong>المالك:</strong> <span>${ownerTxt}</span></div>
                      </div>
                  `;
              } else {
                  bodyEl.innerHTML = `
                      <div style="text-align:center; margin-bottom:8px;">
                          <span class="info-badge">خانة خاصة</span>
                          <div style="font-size:1.0rem; font-weight:900; color:var(--gold);">${t.price > 0 ? t.price + '$' : ''}</div>
                      </div>
                      <div class="info-rule-box">
                          <div class="info-rule-item"><strong>النوع:</strong> <span>${t.type}</span></div>
                          <div class="info-rule-item"><span>تخضع لشروط وقواعد اللعبة الخاصة بالمحطات والضرائب والسجن.</span></div>
                      </div>
                  `;
              }
              document.getElementById("tileInfoModal").classList.add("show");
          }

          function closeTileInfoModal() { document.getElementById("tileInfoModal").classList.remove("show"); }

          function setLanguage(l) {
              Game.lang = l;
              document.documentElement.dir = (l === 'ar' || l === 'fa') ? 'rtl' : 'ltr';
              const sel = document.getElementById("selGameLanguage");
              if (sel && sel.value !== l) sel.value = l;

              const dict = I18N[l] || I18N.ar;
              document.getElementById("txtAppTitle").innerText = dict.app;
              document.getElementById("txtBtnRoll").innerText = dict.roll;
              document.getElementById("txtBtnP0Props").innerText = dict.myProps;
              document.getElementById("txtBtnTrade").innerText = dict.trade;

              if (Game.mode === 'ai') {
                  Game.players[1].name = dict.robot || "روبوت";
              }

              // Update tile names dynamically according to region / language
              BOARD_TILES.forEach(t => {
                  const el = document.getElementById("tName-" + t.id);
                  if (el) el.innerText = getTileDisplayName(t);
              });
              updateUI();
          }

          function setPropStyle(s) {
              Game.propStyle = s;
              ["glow","tint","border","badge"].forEach(id => {
                  const b = document.getElementById("btnPropStyle" + id.charAt(0).toUpperCase() + id.slice(1));
                  if (b) b.className = "btn-pill" + (s === id ? " active" : "");
              });
              updateBoardVisual();
          }

          function setDiceSpeed(sp) {
              Game.diceSpeed = sp;
              ["slow","normal","fast"].forEach(id => {
                  const el = document.getElementById("btnDiceSpeed_" + id);
                  if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
              });
          }

          function setSound(en) {
              AudioFX.enabled = en;
              document.getElementById("btnSoundOn").className = "btn-pill" + (en ? " active" : "");
              document.getElementById("btnSoundOff").className = "btn-pill" + (!en ? " active" : "");
          }

          function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
          function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }
          function openExitModal() { document.getElementById("exitModal").classList.add("show"); }
          function closeExitModal() { document.getElementById("exitModal").classList.remove("show"); }

          function confirmExitWithSave() {
              saveCurrentGame();
              confirmExitGame();
          }
          function confirmExitWithoutSave() { confirmExitGame(); }
          function confirmExitGame() {
              if (window.Android && window.Android.exitApp) window.Android.exitApp();
              else window.close();
          }

          window.handleAndroidBack = function() {
              const openModals = Array.from(document.querySelectorAll('.modal-overlay.show'));
              if (openModals.length > 0) {
                  const lastModal = openModals[openModals.length - 1];
                  lastModal.classList.remove("show");
                  if (lastModal.id === "deedModal" && Game.pendingTile) {
                      const isDbl = Game.pendingTile.isDbl; Game.pendingTile = null; finishTurn(isDbl);
                  }
                  if (lastModal.id === "fastTravelModal" && Game.fastTravelData) {
                      const isDbl = Game.fastTravelData.isDbl; Game.fastTravelData = null; finishTurn(isDbl);
                  }
                  return;
              }
              openExitModal();
          };

          window.addEventListener("DOMContentLoaded", () => {
              renderBoard();
              updateUI();
              showStartModal();
          });
          </script>
          </body>
          </html>
          '''

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("✅ All MONOPOLY PRO files generated successfully!")
          PYEOF

      - name: 🔨 إعطاء صلاحيات التشغيل لـ Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: 🚀 بناء حزمة APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف APK كعنصر قابل للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار تلقائي على GitHub (Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
