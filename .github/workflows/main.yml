                  "💵 سعر الشراء: 200$ لكل محطة قطار.",
                  "📈 تضاعف الإيجار تصاعدياً مع عدد المحطات المملوكة:",
                  "  • محطة واحدة: 25$ إيجار.",
                  "  • محطتان: 50$ إيجار.",
                  "  • 3 محطات: 100$ إيجار.",
                  "  • جميع المحطات الأربع: 200$ إيجار كامل!",
                  "🚄 ميزة السفر السريع: لا يتم السفر بالقطار لأي لاعب إلا بعد شراء كافة محطات القطار الأربع في اللعبة. ويكون السفر مجانياً تماماً لصاحب المحطات (0$)، بينما تبلغ تكلفته 200$ لغير المالك."
              ],
              rulesEn: [
                  "💵 Purchase Price: 200$ per railroad.",
                  "📈 Tiered Rent: 1 Rail = 25$ | 2 Rails = 50$ | 3 Rails = 100$ | 4 Rails = 200$!",
                  "🚄 Fast Travel: Fast travel between stations is only allowed after ALL four stations are purchased. Travel is 100% FREE for station owners (0$), and costs 200$ for non-owners."
              ]
          }
      };

      const AudioFX = {
          ctx: null,
          enabled: true,
          init() {
              try {
                  if (!this.ctx) {
                      const AudioContext = window.AudioContext || window.webkitAudioContext;
                      if (AudioContext) this.ctx = new AudioContext();
                  }
                  if (this.ctx && this.ctx.state === 'suspended') {
                      this.ctx.resume().catch(() => {});
                  }
              } catch(e) {}
          },
          play(type) {
              if (!this.enabled) return;
              try {
                  this.init();
                  if (!this.ctx) return;
                  const t = this.ctx.currentTime;
                  const osc = this.ctx.createOscillator();
                  const g = this.ctx.createGain();
                  osc.connect(g);
                  g.connect(this.ctx.destination);

                  osc.onended = () => {
                      try {
                          osc.disconnect();
                          g.disconnect();
                      } catch(e) {}
                  };

                  if (type === 'dice') {
                      osc.type = 'triangle';
                      osc.frequency.setValueAtTime(140, t);
                      osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
                      g.gain.setValueAtTime(0.2, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.12);
                      osc.start(t);
                      osc.stop(t + 0.12);
                  } else if (type === 'step') {
                      osc.type = 'sine';
                      osc.frequency.setValueAtTime(440, t);
                      g.gain.setValueAtTime(0.1, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.05);
                      osc.start(t);
                      osc.stop(t + 0.05);
                  } else if (type === 'cash') {
                      osc.type = 'sine';
                      osc.frequency.setValueAtTime(587.33, t);
                      osc.frequency.setValueAtTime(880, t + 0.08);
                      g.gain.setValueAtTime(0.18, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.22);
                      osc.start(t);
                      osc.stop(t + 0.22);
                  } else if (type === 'jail') {
                      osc.type = 'sawtooth';
                      osc.frequency.setValueAtTime(180, t);
                      osc.frequency.linearRampToValueAtTime(80, t + 0.3);
                      g.gain.setValueAtTime(0.2, t);
                      g.gain.linearRampToValueAtTime(0.01, t + 0.3);
                      osc.start(t);
                      osc.stop(t + 0.3);
                  }
              } catch(e) {}
          }
      };

      const SAVE_KEY = "monopoly_pro_save_v1";

      const Game = {
          lang: 'ar',
          theme: 'dark',
          propStyle: 'glow',
          diceSpeed: 'normal',
          moveSpeed: 'normal',
          mode: 'ai',
          aiDifficulty: 'medium',
          startingCash: 3000,
          turn: 0,
          doublesInRow: 0,
          isRolling: false,
          pendingTile: null,
          auction: null,
          tradeData: null,
          fastTravelData: null,
          isGameOver: false,
          players: [
              { id:0, nameAr:"الملك", nameEn:"King", avatar:"👑", color:"#EF4444", money:3000, pos:0, inJail:false, jailTurns:0, props:[] },
              { id:1, nameAr:"روبوت", nameEn:"Robot", avatar:"🤖", color:"#38BDF8", money:3000, pos:0, inJail:false, jailTurns:0, props:[] }
          ]
      };

      let newGameConfig = {
          mode: 'ai',
          difficulty: 'medium',
          cash: 3000
      };

      function hasSavedGame() {
          try {
              const raw = localStorage.getItem(SAVE_KEY);
              if (!raw) return false;
              const data = JSON.parse(raw);
              return !!(data && data.players && data.players.length > 0 && !data.isGameOver);
          } catch(e) {
              return false;
          }
      }

      function saveCurrentGame() {
          try {
              const saveData = {
                  savedAt: Date.now(),
                  isGameOver: Game.isGameOver,
                  turn: Game.turn,
                  doublesInRow: Game.doublesInRow,
                  mode: Game.mode,
                  aiDifficulty: Game.aiDifficulty,
                  startingCash: Game.startingCash,
                  theme: Game.theme,
                  diceSpeed: Game.diceSpeed,
                  moveSpeed: Game.moveSpeed,
                  propStyle: Game.propStyle,
                  lang: Game.lang,
                  players: JSON.parse(JSON.stringify(Game.players)),
                  tiles: BOARD_TILES.map(t => ({ id: t.id, owner: t.owner, mortgaged: t.mortgaged }))
              };
              localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
              return true;
          } catch(e) {
              console.error("Save error:", e);
              return false;
          }
      }

      function loadSavedGame() {
          try {
              const raw = localStorage.getItem(SAVE_KEY);
              if (!raw) return false;
              const data = JSON.parse(raw);
              if (!data || !data.players) return false;

              Game.turn = data.turn ?? 0;
              Game.doublesInRow = data.doublesInRow ?? 0;
              if (data.mode) Game.mode = data.mode;
              if (data.aiDifficulty) Game.aiDifficulty = data.aiDifficulty;
              if (data.startingCash) Game.startingCash = data.startingCash;
              if (data.theme) setTheme(data.theme);
              if (data.diceSpeed) Game.diceSpeed = data.diceSpeed;
              if (data.moveSpeed) Game.moveSpeed = data.moveSpeed;
              if (data.propStyle) Game.propStyle = data.propStyle;
              if (data.lang) Game.lang = data.lang;

              Game.players = data.players;
              if (data.tiles) {
                  data.tiles.forEach(st => {
                      const t = BOARD_TILES.find(x => x.id === st.id);
                      if (t) {
                          t.owner = st.owner;
                          t.mortgaged = st.mortgaged;
                      }
                  });
              }

              setLanguage(Game.lang);
              setPropStyle(Game.propStyle);
              setDiceSpeed(Game.diceSpeed);
              setMoveSpeed(Game.moveSpeed);
              updateBoardVisual();
              updatePawns();
              updateUI();
              return true;
          } catch(e) {
              console.error("Load error:", e);
              return false;
          }
      }

      function showStartModal() {
          const btnCont = document.getElementById("btnContinueGame");
          const statusTxt = document.getElementById("savedGameStatus");
          const canContinue = hasSavedGame();

          if (canContinue) {
              btnCont.disabled = false;
              btnCont.style.opacity = "1";
              btnCont.style.cursor = "pointer";
              btnCont.classList.remove("btn-gray");
              btnCont.classList.add("btn-blue");
              try {
                  const d = JSON.parse(localStorage.getItem(SAVE_KEY));
                  const dt = d.savedAt ? new Date(d.savedAt).toLocaleDateString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : "";
                  statusTxt.innerText = dt ? `يوجد لعبة محفوظة بتاريخ: ${dt}` : "يوجد لعبة سابقة محفوظة جاهزة للإكمال.";
              } catch(e) {
                  statusTxt.innerText = "يوجد لعبة سابقة محفوظة جاهزة للإكمال.";
              }
              document.getElementById("startModal").classList.add("show");
          } else {
              openNewGameSetupModal(false);
          }
      }

      function continueSavedGameFromModal() {
          if (!hasSavedGame()) return;
          const ok = loadSavedGame();
          if (ok) {
              document.getElementById("startModal").classList.remove("show");
              logEvent("📂 تم استئناف اللعبة السابقة بنجاح من حيث توقفت!");
              startPlayerTurn();
          } else {
              openNewGameSetupModal(false);
          }
      }

      function openNewGameSetupModal(canCancel = false) {
          document.getElementById("startModal").classList.remove("show");
          document.getElementById("settingsModal").classList.remove("show");
          document.getElementById("gameOverModal").classList.remove("show");

          const btnClose = document.getElementById("btnCloseSetupModal");
          if (btnClose) {
              btnClose.style.display = canCancel ? "block" : "none";
          }

          newGameConfig.mode = Game.mode || 'ai';
          newGameConfig.difficulty = Game.aiDifficulty || 'medium';
          newGameConfig.cash = Game.startingCash || 3000;

          selectGameMode(newGameConfig.mode);
          selectAIDifficulty(newGameConfig.difficulty);
          selectStartingCash(newGameConfig.cash);

          document.getElementById("inputPlayer1Name").value = Game.players[0].nameAr || (Game.lang==='ar' ? "الملك" : "King");
          if (newGameConfig.mode === 'pvp') {
              document.getElementById("inputPlayer2Name").value = (Game.players[1].nameAr !== "روبوت") ? Game.players[1].nameAr : (Game.lang==='ar' ? "اللاعب 2" : "Player 2");
          } else {
              document.getElementById("inputPlayer2Name").value = (Game.lang==='ar' ? "روبوت" : "Robot");
          }

          document.getElementById("newGameSetupModal").classList.add("show");
      }

      function closeNewGameSetupModal() {
          document.getElementById("newGameSetupModal").classList.remove("show");
          if (hasSavedGame()) {
              showStartModal();
          }
      }

      function selectGameMode(mode) {
          newGameConfig.mode = mode;
          const btnAI = document.getElementById("btnModeAI");
          const btnPvP = document.getElementById("btnModePvP");
          const aiDiffSec = document.getElementById("aiDifficultySection");
          const lblP1 = document.getElementById("lblPlayer1Name");
          const lblP2 = document.getElementById("lblPlayer2Name");
          const inputP2 = document.getElementById("inputPlayer2Name");

          if (mode === 'ai') {
              btnAI.classList.add("active");
              btnPvP.classList.remove("active");
              aiDiffSec.style.display = "block";
              lblP1.innerText = Game.lang === 'ar' ? "اسم اللاعب 1 (أنت 👑):" : "Your Name (Player 1):";
              lblP2.innerText = Game.lang === 'ar' ? "الخصم (الكمبيوتر):" : "Computer (Robot):";
              inputP2.value = Game.lang === 'ar' ? "روبوت" : "Robot";
              inputP2.readOnly = true;
              inputP2.style.background = "rgba(128,128,128,0.15)";
          } else {
              btnPvP.classList.add("active");
              btnAI.classList.remove("active");
              aiDiffSec.style.display = "none";
              lblP1.innerText = Game.lang === 'ar' ? "اسم اللاعب الأول 👑:" : "Player 1 Name:";
              lblP2.innerText = Game.lang === 'ar' ? "اسم اللاعب الثاني 🦅:" : "Player 2 Name:";
              if (inputP2.value === "روبوت" || inputP2.value === "Robot") {
                  inputP2.value = Game.lang === 'ar' ? "اللاعب 2" : "Player 2";
              }
              inputP2.readOnly = false;
              inputP2.style.background = "var(--input-bg)";
          }
      }

      function selectAIDifficulty(diff) {
          newGameConfig.difficulty = diff;
          ['easy', 'medium', 'hard'].forEach(d => {
              const btn = document.getElementById("btnDiff" + d.charAt(0).toUpperCase() + d.slice(1));
              if (btn) {
                  if (d === diff) btn.classList.add("active");
                  else btn.classList.remove("active");
              }
          });

          const descEl = document.getElementById("diffDescription");
          if (descEl) {
              if (diff === 'easy') {
                  descEl.innerText = Game.lang === 'ar' ? "🟢 سهل: قرارات شراء بسيطة، وتفاوض متساهل في المقايضة والمزادات." : "🟢 Easy: Simple AI decisions and generous trades.";
              } else if (diff === 'medium') {
                  descEl.innerText = Game.lang === 'ar' ? "🟡 متوسط: توازن معتدل بين الشراء والمزايدة وإدارة الأموال." : "🟡 Medium: Balanced buying, bidding, and money management.";
              } else {
                  descEl.innerText = Game.lang === 'ar' ? "🔴 صعب: ذكاء شرس! يستحوذ على العقارات باحترافية وينافس بشدة في المزادات." : "🔴 Hard: Aggressive AI! Fights for monopolies and drives hard bargains.";
              }
          }
      }

      function selectStartingCash(cash) {
          newGameConfig.cash = parseInt(cash);
          [3000, 6000, 9000].forEach(c => {
              const btn = document.getElementById("btnCash" + c);
              if (btn) {
                  if (c === cash) btn.classList.add("active");
                  else btn.classList.remove("active");
              }
          });
      }

      function confirmStartNewGame() {
          const p1Input = document.getElementById("inputPlayer1Name").value.trim();
          const p1Name = p1Input || (Game.lang === 'ar' ? "الملك" : "King");

          let p2Name;
          if (newGameConfig.mode === 'ai') {
              p2Name = Game.lang === 'ar' ? "روبوت" : "Robot";
          } else {
              const p2Input = document.getElementById("inputPlayer2Name").value.trim();
              p2Name = p2Input || (Game.lang === 'ar' ? "اللاعب 2" : "Player 2");
          }

          Game.mode = newGameConfig.mode;
          Game.aiDifficulty = newGameConfig.difficulty;
          Game.startingCash = newGameConfig.cash;

          Game.players[0].nameAr = p1Name;
          Game.players[0].nameEn = p1Name;
          Game.players[0].avatar = "👑";
          Game.players[0].money = Game.startingCash;
          Game.players[0].pos = 0;
          Game.players[0].inJail = false;
          Game.players[0].jailTurns = 0;
          Game.players[0].props = [];

          Game.players[1].nameAr = p2Name;
          Game.players[1].nameEn = p2Name;
          Game.players[1].avatar = (Game.mode === 'ai') ? "🤖" : "🦅";
          Game.players[1].money = Game.startingCash;
          Game.players[1].pos = 0;
          Game.players[1].inJail = false;
          Game.players[1].jailTurns = 0;
          Game.players[1].props = [];

          BOARD_TILES.forEach(t => {
              t.owner = undefined;
              t.mortgaged = false;
          });

          Game.turn = 0;
          Game.doublesInRow = 0;
          Game.isRolling = false;
          Game.pendingTile = null;
          Game.auction = null;
          Game.tradeData = null;
          Game.fastTravelData = null;
          Game.isGameOver = false;

          localStorage.removeItem(SAVE_KEY);
          saveCurrentGame();

          document.getElementById("newGameSetupModal").classList.remove("show");
          document.getElementById("startModal").classList.remove("show");
          document.getElementById("gameOverModal").classList.remove("show");
          document.getElementById("settingsModal").classList.remove("show");

          updatePawns();
          updateUI();
          const diffText = Game.mode === 'ai' ? (Game.aiDifficulty === 'easy' ? " (سهل)" : (Game.aiDifficulty === 'hard' ? " (صعب)" : " (متوسط)")) : "";
          logEvent(`🎮 بدأت لعبة جديدة برصيد ${Game.startingCash}$! دور ${Game.players[0].avatar} ${Game.players[0].nameAr}${diffText}.`);
          startPlayerTurn();
      }

      function getGridCoords(i) {
          if (i === 0) return { r: 11, c: 11 };
          if (i >= 1 && i <= 9) return { r: 11, c: 11 - i };
          if (i === 10) return { r: 11, c: 1 };
          if (i >= 11 && i <= 19) return { r: 11 - (i - 10), c: 1 };
          if (i === 20) return { r: 1, c: 1 };
          if (i >= 21 && i <= 29) return { r: 1, c: 1 + (i - 20) };
          if (i === 30) return { r: 1, c: 11 };
          if (i >= 31 && i <= 39) return { r: 1 + (i - 30), c: 11 };
          return { r: 11, c: 11 };
      }

      function renderBoard() {
          const boardEl = document.getElementById("board");
          BOARD_TILES.forEach((tile, index) => {
              const coords = getGridCoords(index);
              const tileDiv = document.createElement("div");
              tileDiv.id = "tile-" + index;

              let side = "side-bottom";
              if (index >= 11 && index <= 19) side = "side-left";
              else if (index >= 20 && index <= 30) side = "side-top";
              else if (index >= 31 && index <= 39) side = "side-right";
              tileDiv.className = "tile " + side + ([0, 10, 20, 30].includes(index) ? " corner-tile corner-" + index : "");

              tileDiv.style.gridRow = coords.r;
              tileDiv.style.gridColumn = coords.c;
              tileDiv.onclick = () => openTileInfoModal(index);

              let h = "";
              if (tile.type === "property") {
                  h += `<div class="tile-bar" style="background:${tile.color}"></div><div class="tile-cnt"><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
              } else if (tile.type === "railroad" || tile.type === "utility") {
                  h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div><div class="tile-price">${tile.price}$</div></div>`;
              } else {
                  h += `<div class="tile-cnt"><div class="tile-icon">${tile.icon||"🏛️"}</div><div class="tile-name" id="tName-${index}">${Game.lang==='ar'?tile.nameAr:tile.nameEn}</div></div>`;
              }
              h += `<div class="tile-pawns" id="pawns-${index}"></div>`;
              tileDiv.innerHTML = h;
              boardEl.appendChild(tileDiv);
          });
          updatePawns();
      }

      let pawnEl0 = null, pawnEl1 = null;
      function getPawnEl(id) {
          if (id === 0) {
              if (!pawnEl0) { pawnEl0 = document.createElement("div"); pawnEl0.id = "pawn-p0"; pawnEl0.className = "pawn pawn-p0"; }
              pawnEl0.innerText = Game.players[0].avatar;
              return pawnEl0;
          } else {
              if (!pawnEl1) { pawnEl1 = document.createElement("div"); pawnEl1.id = "pawn-p1"; pawnEl1.className = "pawn pawn-p1"; }
              pawnEl1.innerText = Game.players[1].avatar;
              return pawnEl1;
          }
      }

      function updatePawns(movingId = null) {
          if (movingId !== null) {
              const p = Game.players[movingId];
              const el = getPawnEl(movingId);
              const target = document.getElementById("pawns-" + p.pos);
              if (target && el.parentElement !== target) {
                  target.appendChild(el);
                  el.classList.add("moving-step");
                  setTimeout(() => el.classList.remove("moving-step"), 110);
              }
              return;
          }
          Game.players.forEach(p => {
              const el = getPawnEl(p.id);
              const target = document.getElementById("pawns-" + p.pos);
              if (target && el.parentElement !== target) {
                  target.appendChild(el);
              }
          });
      }

      function updateUI() {
          const p0 = Game.players[0], p1 = Game.players[1];
          document.getElementById("cashP0").innerText = p0.money + "$";
          document.getElementById("cashP1").innerText = p1.money + "$";
          const m0 = p0.props.filter(id => BOARD_TILES[id].mortgaged).length;
          const m1 = p1.props.filter(id => BOARD_TILES[id].mortgaged).length;
          document.getElementById("propsP0").innerText = `${I18N[Game.lang].p} ${p0.props.length}`;
          document.getElementById("propsP1").innerText = `${I18N[Game.lang].p} ${p1.props.length}`;
          document.getElementById("mortP0").innerText = m0 > 0 ? `(${I18N[Game.lang].m} ${m0})` : "";
          document.getElementById("mortP1").innerText = m1 > 0 ? `(${I18N[Game.lang].m} ${m1})` : "";

          document.getElementById("pCard0").className = "p-card" + (Game.turn === 0 ? " active" : "");
          document.getElementById("pCard1").className = "p-card" + (Game.turn === 1 ? " active" : "");
          document.getElementById("turnBadge0").style.display = Game.turn === 0 ? "block" : "none";
          document.getElementById("turnBadge1").style.display = Game.turn === 1 ? "block" : "none";

          if (Game.mode === 'pvp') {
              document.getElementById("turnBadge0").innerText = Game.lang==='ar' ? "دورك" : "Turn";
              document.getElementById("turnBadge1").innerText = Game.lang==='ar' ? "دورك" : "Turn";
          } else {
              document.getElementById("turnBadge0").innerText = I18N[Game.lang].turn;
              document.getElementById("turnBadge1").innerText = I18N[Game.lang].opp;
          }

          const cur = Game.players[Game.turn];
          document.getElementById("turnAnnouncer").innerText = `${I18N[Game.lang].turn}: ${cur.avatar} ${Game.lang==='ar'?cur.nameAr:cur.nameEn}`;
          document.getElementById("avP0").innerText = p0.avatar;
          document.getElementById("avP1").innerText = p1.avatar;
          document.getElementById("nameP0").innerText = Game.lang==='ar'?p0.nameAr:p0.nameEn;
          document.getElementById("nameP1").innerText = Game.lang==='ar'?p1.nameAr:p1.nameEn;

          const summaryEl = document.getElementById("txtCurrentGameSummary");
          if (summaryEl) {
              const modeTxt = Game.mode === 'ai' ? (Game.lang==='ar'?"ضد روبوت 🤖":"vs Robot 🤖") : (Game.lang==='ar'?"لاعبين اثنين 👥":"2 Players 👥");
              const diffTxt = Game.mode === 'ai' ? (Game.aiDifficulty === 'easy' ? " (سهل)" : (Game.aiDifficulty === 'hard' ? " (صعب)" : " (متوسط)")) : "";
              summaryEl.innerText = `${modeTxt}${diffTxt} | ${Game.lang==='ar'?"البداية":"Cash"}: ${Game.startingCash}$`;
          }

          updateBoardVisual();
      }

      function updateBoardVisual() {
          BOARD_TILES.forEach(t => {
              const el = document.getElementById("tile-" + t.id);
              if (!el) return;
              el.classList.remove("owned-glow","owned-tint","owned-border");
              const b = el.querySelector(".tile-owner-badge"); if (b) b.remove();
              const mb = el.querySelector(".tile-mortgaged-badge"); if (mb) mb.remove();

              if (t.owner !== undefined) {
                  const owner = Game.players[t.owner];
                  el.style.color = t.owner === 0 ? "var(--p0)" : "var(--p1)";
                  if (Game.propStyle === 'glow') el.classList.add("owned-glow");
                  else if (Game.propStyle === 'tint') el.classList.add("owned-tint");
                  else if (Game.propStyle === 'border') el.classList.add("owned-border");
                  else if (Game.propStyle === 'badge') {
                      const bg = document.createElement("div"); bg.className = "tile-owner-badge"; bg.innerText = owner.avatar; el.appendChild(bg);
                  }
                  if (t.mortgaged) {
                      const mg = document.createElement("div"); mg.className = "tile-mortgaged-badge"; mg.innerText = Game.lang==='ar'?"مَرْهُون":"MORTGAGED"; el.appendChild(mg);
                  }
              } else { el.style.color = ""; }
          });
      }

      function logEvent(msg) {
          const el = document.getElementById("gameLog");
          el.innerText = msg;
      }

      function rollDice() {
          if (Game.isRolling || Game.isGameOver) return;
          const cur = Game.players[Game.turn];
          if (cur.inJail) {
              if (Game.turn === 0 || Game.mode === 'pvp') {
                  openJailModal();
              } else {
                  const diff = Game.aiDifficulty || 'medium';
                  const fineThreshold = (diff === 'hard') ? 100 : ((diff === 'easy') ? 600 : 300);
                  if (cur.money >= fineThreshold) payJailFine();
                  else rollForJail();
              }
              return;
          }

          Game.isRolling = true;
          document.getElementById("btnRoll").disabled = true;

          const d0 = document.getElementById("die0");
          const d1 = document.getElementById("die1");
          d0.classList.add("rolling");
          d1.classList.add("rolling");
          AudioFX.play('dice');

          const dur = Game.diceSpeed === "v_slow" ? 1400 : (Game.diceSpeed === "slow" ? 900 : (Game.diceSpeed === "fast" ? 250 : (Game.diceSpeed === "v_fast" ? 100 : 500)));
          setTimeout(() => {
              d0.classList.remove("rolling");
              d1.classList.remove("rolling");

              const val0 = Math.floor(Math.random() * 6) + 1;
              const val1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(d0, val0);
              setDieFace(d1, val1);

              const sum = val0 + val1;
              const isDbl = (val0 === val1);
              logEvent(`${cur.avatar} ${cur.nameAr} ${I18N[Game.lang].rolled} ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);

              if (isDbl) {
                  Game.doublesInRow++;
                  if (Game.doublesInRow >= 3) {
                      Game.doublesInRow = 0;
                      logEvent(`🚔 3 رميات متطابقة! أُرسل ${cur.nameAr} إلى السجن.`);
                      sendToJail(cur); finishTurn(false); return;
                  }
              } else { Game.doublesInRow = 0; }

              moveSteps(cur, sum, isDbl);
          }, dur);
      }

      function setDieFace(dieEl, val) {
          const rot = {
              1: "rotateX(0deg) rotateY(0deg)",
              6: "rotateY(180deg)",
              2: "rotateY(90deg)",
              5: "rotateY(-90deg)",
              3: "rotateX(-90deg)",
              4: "rotateX(90deg)"
          };
          dieEl.style.transform = rot[val];
      }

      function moveSteps(player, steps, isDbl) {
          let rem = steps;
          const iv = Game.moveSpeed === "v_slow" ? 350 : (Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : (Game.moveSpeed === "v_fast" ? 20 : 120)));
          const t = setInterval(() => {
              player.pos = (player.pos + 1) % 40;
              AudioFX.play('step');
              updatePawns(player.id);
              if (player.pos === 0) {
                  player.money += 200;
                  AudioFX.play('cash');
                  logEvent(`🏁 ${player.avatar} ${player.nameAr}: ${I18N[Game.lang].passGo}`);
                  updateUI();
              }
              rem--;
              if (rem <= 0) {
                  clearInterval(t);
                  setTimeout(() => handleLanding(player, isDbl), 160);
              }
          }, iv);
      }

      function handleLanding(player, isDbl) {
          const tile = BOARD_TILES[player.pos];
          updateUI();

          if (tile.type === "gotojail") {
              sendToJail(player); finishTurn(false); return;
          }

          if (tile.type === "tax") {
              player.money -= tile.price;
              AudioFX.play('cash');
              logEvent(`💸 ${player.avatar} ${player.nameAr} دفع ${tile.price}$ (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
              if (checkBankruptcy(player)) return;
              updateUI(); finishTurn(isDbl); return;
          }

          if (tile.type === "chance" || tile.type === "chest") {
              handleCard(player, tile.type, isDbl); return;
          }

          if (["property", "railroad", "utility"].includes(tile.type)) {
              if (tile.owner === undefined) {
                  if (player.id === 0 || Game.mode === 'pvp') {
                      promptBuyProperty(tile, isDbl);
                  } else {
                      handleAIBuyDecision(player, tile, isDbl);
                  }
                  return;
              } else if (tile.owner !== player.id) {
                  if (!tile.mortgaged) {
                      const rent = calculateRent(tile);
                      player.money -= rent;
                      Game.players[tile.owner].money += rent;
                      AudioFX.play('cash');
                      logEvent(`🏷️ دفع ${player.avatar} ${player.nameAr} ${rent}$ إيجار إلى ${Game.players[tile.owner].avatar} ${Game.players[tile.owner].nameAr} (${Game.lang==='ar'?tile.nameAr:tile.nameEn}).`);
                      if (checkBankruptcy(player)) return;
                      updateUI();
                  } else {
                      logEvent(`العقار (${Game.lang==='ar'?tile.nameAr:tile.nameEn}) مَرْهُون، معفى من الإيجار.`);
                  }

                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(player, tile, isDbl);
                      return;
                  }
                  finishTurn(isDbl); return;
              } else {
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(player, tile, isDbl); return;
                  }
              }
          }

          finishTurn(isDbl);
      }

      function checkBankruptcy(player) {
          if (player.money >= 0) return false;
          const unmortgaged = player.props.filter(id => !BOARD_TILES[id].mortgaged);
          for (const propId of unmortgaged) {
              if (player.money >= 0) break;
              const t = BOARD_TILES[propId];
              t.mortgaged = true;
              const val = Math.floor(t.price * 0.5);
              player.money += val;
              logEvent(`🏦 تم رهن (${Game.lang==='ar'?t.nameAr:t.nameEn}) تلقائياً لدفع المستحقات.`);
          }
          updateUI();
          if (player.money < 0) {
              const winnerId = (player.id === 0) ? 1 : 0;
              triggerGameOver(winnerId);
              return true;
          }
          return false;
      }

      function triggerGameOver(winnerId) {
          Game.isGameOver = true;
          localStorage.removeItem(SAVE_KEY);
          const winner = Game.players[winnerId];
          const loser = Game.players[winnerId === 0 ? 1 : 0];
          document.getElementById("goTrophy").innerText = winner.avatar;
          document.getElementById("goWinnerText").innerText = Game.lang === 'ar' ? `فاز ${winner.nameAr} باللعبة! 🏆` : `${winner.nameEn} Won the Game! 🏆`;
          document.getElementById("goDetails").innerText = Game.lang === 'ar' ? `أفلس ${loser.nameAr} ولم يعد يملك أموالاً أو عقارات كافية.` : `${loser.nameEn} went bankrupt with no cash or assets remaining.`;
          document.getElementById("gameOverModal").classList.add("show");
      }

      function promptRailroadFastTravel(player, currentTile, isDbl) {
          const allRails = BOARD_TILES.filter(t => t.type === "railroad");
          const allRailsBought = allRails.every(t => t.owner !== undefined);

          if (!allRailsBought) {
              finishTurn(isDbl);
              return;
          }

          const isOwner = (currentTile.owner === player.id) || allRails.every(t => t.owner === player.id);
          const cost = isOwner ? 0 : 200;

          if (player.money < cost) {
              finishTurn(isDbl);
              return;
          }

          if (player.id === 0 || Game.mode === 'pvp') {
              const otherRails = allRails.filter(t => t.id !== currentTile.id);
              Game.fastTravelData = { player, currentTile, otherRails, cost, isDbl };

              const destSelect = document.getElementById("fastTravelDestSelect");
              destSelect.innerHTML = "";
              otherRails.forEach(r => {
                  const opt = document.createElement("option");
                  opt.value = r.id;
                  opt.innerText = `🚂 ${Game.lang==='ar'?r.nameAr:r.nameEn} (خانة ${r.id})`;
                  destSelect.appendChild(opt);
              });

              const costNotice = document.getElementById("fastTravelCostNotice");
              const btnConfirm = document.getElementById("btnFastTravelConfirm");

              if (cost === 0) {
                  costNotice.innerHTML = `<span style="color:#10B981; font-weight:900;">✨ السفر مجاني بالكامل (0$) لأنك صاحب المحطات!</span>`;
                  btnConfirm.innerText = Game.lang === 'ar' ? "سفر سريع (مجاناً)" : "Fast Travel (Free)";
              } else {
                  costNotice.innerHTML = `<span style="color:var(--gold-lt);">التكلفة: <strong style="color:var(--gold);">${cost}$</strong> تُسحب من رصيدك.</span>`;
                  btnConfirm.innerText = Game.lang === 'ar' ? `سفر سريع (${cost}$)` : `Fast Travel (${cost}$)`;
              }

              document.getElementById("fastTravelModal").classList.add("show");
          } else {
              finishTurn(isDbl);
          }
      }

      function confirmFastTravel() {
          if (!Game.fastTravelData) return;
          const { player, cost, isDbl } = Game.fastTravelData;
          const destSelect = document.getElementById("fastTravelDestSelect");
          const destId = parseInt(destSelect.value);
          const dest = BOARD_TILES.find(t => t.id === destId);
          Game.fastTravelData = null;
          document.getElementById("fastTravelModal").classList.remove("show");

          if (dest && player.money >= cost) {
              player.money -= cost;
              player.pos = dest.id;
              AudioFX.play('cash');
              AudioFX.play('step');
              updatePawns(player.id);
              updateUI();
              if (cost === 0) {
                  logEvent(`🚂 سافر ${player.avatar} ${player.nameAr} مجاناً إلى محطة (${Game.lang==='ar'?dest.nameAr:dest.nameEn}).`);
              } else {
                  logEvent(`🚂 سافر ${player.avatar} ${player.nameAr} سريعاً إلى محطة (${Game.lang==='ar'?dest.nameAr:dest.nameEn}) مقابل ${cost}$.`);
              }
          }
          finishTurn(isDbl);
      }

      function cancelFastTravel() {
          if (!Game.fastTravelData) return;
          const isDbl = Game.fastTravelData.isDbl;
          Game.fastTravelData = null;
          document.getElementById("fastTravelModal").classList.remove("show");
          finishTurn(isDbl);
      }

      function calculateRent(tile) {
          if (tile.type === "railroad") {
              const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
              return 25 * Math.pow(2, cnt - 1);
          }
          if (tile.type === "utility") {
              const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
              return cnt === 2 ? 50 : 20;
          }
          const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
          const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);
          return hasMonopoly ? Math.round(tile.price * 0.40) : Math.round(tile.price * 0.20);
      }

      function promptBuyProperty(tile, isDbl) {
          Game.pendingTile = { tile, isDbl };
          const cur = Game.players[Game.turn];
          const baseRent = Math.round(tile.price * 0.20);
          const monoRent = Math.round(tile.price * 0.40);
          document.getElementById("deedTitle").innerText = `${tile.icon||""} ${Game.lang==='ar'?tile.nameAr:tile.nameEn}`;
          document.getElementById("deedBody").innerHTML = `
              <div style="text-align:center; margin-bottom:8px;">
                  <div style="font-size:0.78rem; color:var(--dim); margin-bottom:3px;">دور الشراء: <strong style="color:var(--text);">${cur.avatar} ${cur.nameAr}</strong> (الرصيد: <strong style="color:var(--gold);">${cur.money}$</strong>)</div>
                  <span style="display:inline-block; width:13px; height:13px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                  <strong style="font-size:1.10rem; color:var(--gold); margin:0 5px;">${tile.price}$</strong>
              </div>
              <div style="font-size:0.80rem; color:var(--text); text-align:center;">إيجار العقار الأساسي (20%): <strong style="color:var(--gold);">${baseRent}$</strong></div>
              <div style="font-size:0.72rem; color:var(--dim); text-align:center; margin-top:3px;">(عند احتكار كامل المجموعة يرتفع الإيجار إلى 40%: <strong style="color:var(--gold);">${monoRent}$</strong>)</div>
          `;
          const canAfford = cur.money >= tile.price;
          document.getElementById("btnBuyProp").disabled = !canAfford;
          document.getElementById("deedModal").classList.add("show");
      }

      function closeDeedModal() {
          document.getElementById("deedModal").classList.remove("show");
          if (Game.pendingTile) {
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              finishTurn(isDbl);
          }
      }

      function confirmBuyProp() {
          if (!Game.pendingTile) return;
          const cur = Game.players[Game.turn];
          const t = Game.pendingTile.tile;
          if (cur.money >= t.price) {
              buyProp(cur, t, t.price);
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");
              finishTurn(isDbl);
          }
      }

      let aucTimerInterval = null;
      let aucSecondsLeft = 5;

      function startAuctionTimer() {
          stopAuctionTimer();
          aucSecondsLeft = 5;
          const timerEl = document.getElementById("aucTimerNum");
          if (timerEl) timerEl.innerText = aucSecondsLeft;

          aucTimerInterval = setInterval(() => {
              aucSecondsLeft--;
              if (timerEl) timerEl.innerText = aucSecondsLeft;

              if (aucSecondsLeft <= 0) {
                  stopAuctionTimer();
                  handleAuctionTimeout();
              }
          }, 1000);
      }

      function stopAuctionTimer() {
          if (aucTimerInterval) {
              clearInterval(aucTimerInterval);
              aucTimerInterval = null;
          }
      }

      function handleAuctionTimeout() {
          const a = Game.auction;
          if (!a) return;
          logEvent(`⏱️ انتهت مهلة الـ 5 ثوانٍ للاعب ${Game.players[a.bidTurn].avatar}!`);
          if (a.highestBidder !== null) {
              concludeAuction();
          } else {
              foldAuctionBid();
          }
      }

      function startAuction() {
          if (!Game.pendingTile) return;
          const t = Game.pendingTile.tile;
          const isDbl = Game.pendingTile.isDbl;
          Game.pendingTile = null;
          document.getElementById("deedModal").classList.remove("show");

          Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
          document.getElementById("auctionModal").classList.add("show");
          updateAuctionUI();
          startAuctionTimer();
          if (Game.mode === 'ai' && Game.turn === 1) setTimeout(handleAIAuction, 1000);
      }

      function updateAuctionUI() {
          const a = Game.auction;
          if (!a) return;
          document.getElementById("aucPropDetails").innerText = `${a.tile.icon || "🏙️"} ${Game.lang==='ar'?a.tile.nameAr:a.tile.nameEn}`;
          document.getElementById("aucBasePriceVal").innerText = a.tile.price + "$";
          document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
          document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? `${Game.players[a.highestBidder].avatar} ${Game.players[a.highestBidder].nameAr} (${Game.players[a.highestBidder].money}$)` : (Game.lang==='ar'?"لا يوجد مزايد بعد":"No bids yet");
          const cur = Game.players[a.bidTurn];
          document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${cur.nameAr} (رصيده: ${cur.money}$)`;

          const isHumanTurn = (Game.mode === 'pvp') || (a.bidTurn === 0);
          document.getElementById("aucControls").style.display = isHumanTurn ? "flex" : "none";
      }

      function placeAuctionBid(inc) {
          const a = Game.auction; if (!a) return;
          stopAuctionTimer();
          const bidder = a.bidTurn;
          const p = Game.players[bidder];
          const nextBid = a.currentBid + inc;
          if (p.money >= nextBid) {
              a.currentBid = nextBid;
              a.highestBidder = bidder;
              logEvent(`🔨 زاد ${p.avatar} ${p.nameAr} المزاد إلى ${a.currentBid}$!`);
              nextAuctionTurn();
          } else {
              startAuctionTimer();
          }
      }

      function foldAuctionBid() {
          const a = Game.auction; if (!a) return;
          stopAuctionTimer();
          logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} ${Game.players[a.bidTurn].nameAr} من المزاد.`);
          a.active = a.active.filter(id => id !== a.bidTurn);
          if (a.active.length === 1 && a.highestBidder !== null) {
              concludeAuction();
          } else if (a.active.length === 0) {
              document.getElementById("auctionModal").classList.remove("show");
              const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
          } else {
              nextAuctionTurn();
          }
      }

      function nextAuctionTurn() {
          const a = Game.auction; if (!a) return;
          a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
          updateAuctionUI();
          startAuctionTimer();
          if (Game.mode === 'ai' && a.bidTurn === 1 && a.active.includes(1)) setTimeout(handleAIAuction, 1000);
      }

      function concludeAuction() {
          const a = Game.auction; if (!a) return;
          stopAuctionTimer();
          document.getElementById("auctionModal").classList.remove("show");
          const winner = Game.players[a.highestBidder];
          logEvent(`🏆 فاز ${winner.avatar} ${winner.nameAr} بمزاد (${Game.lang==='ar'?a.tile.nameAr:a.tile.nameEn}) بمبلغ ${a.currentBid}$!`);
          buyProp(winner, a.tile, a.currentBid);
          const isDbl = a.isDbl; Game.auction = null; finishTurn(isDbl);
      }

      function handleAIAuction() {
          const a = Game.auction; if (!a || a.bidTurn !== 1) return;
          const ai = Game.players[1];
          const diff = Game.aiDifficulty || 'medium';

          let maxValMultiplier = 0.9;
          let minCashBuffer = 40;
          let bidStep = 10;

          const myPot = checkMonopolyPot(1, a.tile.group);
          const oppPot = checkMonopolyPot(0, a.tile.group);

          if (diff === 'easy') {
              maxValMultiplier = 0.70;
              minCashBuffer = 120;
              bidStep = 10;
          } else if (diff === 'medium') {
              maxValMultiplier = myPot ? 1.35 : 1.0;
              minCashBuffer = 40;
              bidStep = 15;
          } else {
              maxValMultiplier = (myPot || oppPot) ? 1.85 : 1.4;
              minCashBuffer = 10;
              bidStep = 25;
          }

          const maxBidAI = Math.floor(a.tile.price * maxValMultiplier);
          if (a.currentBid + bidStep <= maxBidAI && ai.money >= a.currentBid + bidStep + minCashBuffer) {
              placeAuctionBid(bidStep);
          } else {
              foldAuctionBid();
          }
      }

      function handleAIBuyDecision(player, tile, isDbl) {
          const diff = Game.aiDifficulty || 'medium';
          let shouldBuy = false;
          const pot = checkMonopolyPot(1, tile.group);

          if (diff === 'easy') {
              if (player.money >= tile.price + 450 && Math.random() > 0.35) {
                  shouldBuy = true;
              }
          } else if (diff === 'medium') {
              const hasCash = player.money >= tile.price + 100;
              if (hasCash || pot) {
                  shouldBuy = true;
              }
          } else {
              const opponentPot = checkMonopolyPot(0, tile.group);
              if (player.money >= tile.price && (player.money >= tile.price + 50 || pot || opponentPot || tile.type === 'railroad')) {
                  shouldBuy = true;
              }
          }

          if (shouldBuy) {
              buyProp(player, tile, tile.price);
              finishTurn(isDbl);
          } else {
              Game.pendingTile = { tile, isDbl };
              startAuction();
          }
      }

      function checkMonopolyPot(playerId, group) {
          if (!group) return false;
          const groupTiles = BOARD_TILES.filter(t => t.group === group);
          const owned = groupTiles.filter(t => t.owner === playerId).length;
          return owned > 0;
      }

      function buyProp(player, tile, price) {
          player.money -= price;
          tile.owner = player.id;
          player.props.push(tile.id);
          AudioFX.play('cash');
          logEvent(`🎉 اشترى ${player.avatar} ${player.nameAr} (${Game.lang==='ar'?tile.nameAr:tile.nameEn}) مقابل ${price}$.`);
          updateUI();
      }

      function handleCard(player, type, isDbl) {
          const cards = [
              { textAr:"ربحت في مسابقة الحظ الملكية! استلم 100$", textEn:"Won royal lottery! Collect 100$", action:"cash", val:100 },
              { textAr:"غرامة مخالفة سرعة! ادفع 50$", textEn:"Speeding fine! Pay 50$", action:"cash", val:-50 },
              { textAr:"تقدم مباشرة إلى خانة انطلق واربح 200$", textEn:"Advance to GO, collect 200$", action:"go" },
              { textAr:"أُرسلت مباشرة إلى السجن!", textEn:"Go directly to jail!", action:"jail" }
          ];
          const c = cards[Math.floor(Math.random() * cards.length)];
          logEvent(`📜 ${Game.lang==='ar'?c.textAr:c.textEn}`);
          if (c.action === "cash") {
              player.money += c.val;
              if (checkBankruptcy(player)) return;
              AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
          } else if (c.action === "go") {
              player.pos = 0; player.money += 200;
              AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
          } else if (c.action === "jail") {
              sendToJail(player); finishTurn(false);
          }
      }

      function sendToJail(p) {
          p.pos = 10; p.inJail = true; p.jailTurns = 3;
          AudioFX.play('jail'); updatePawns(p.id); updateUI();
          logEvent(`🚔 دَخَل ${p.avatar} ${p.nameAr} السجن!`);
      }

      function openJailModal() {
          document.getElementById("jailModal").classList.add("show");
      }

      function payJailFine() {
          const cur = Game.players[Game.turn];
          if (cur.money >= 50) {
              cur.money -= 50;
              cur.inJail = false;
              cur.jailTurns = 0;
              document.getElementById("jailModal").classList.remove("show");
              AudioFX.play('cash');
              updateUI();
              logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].finePaid}`);
              if (Game.turn === 1 && Game.mode === 'ai') {
                  setTimeout(rollDice, 550);
              } else {
                  document.getElementById("btnRoll").disabled = false;
              }
          } else {
              rollForJail();
          }
      }

      function rollForJail() {
          document.getElementById("jailModal").classList.remove("show");
          const v0 = Math.floor(Math.random() * 6) + 1;
          const v1 = Math.floor(Math.random() * 6) + 1;
          setDieFace(document.getElementById("die0"), v0);
          setDieFace(document.getElementById("die1"), v1);
          const cur = Game.players[Game.turn];
          if (v0 === v1) {
              cur.inJail = false;
              cur.jailTurns = 0;
              logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].doublesJail}`);
              updateUI();
              moveSteps(cur, v0 + v1, false);
          } else {
              cur.jailTurns--;
              if (cur.jailTurns <= 0) {
                  cur.money = Math.max(0, cur.money - 50);
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  logEvent(Game.lang==='ar' ? `انتهت مدة السجن لـ ${cur.nameAr} ودفع 50$ كفالة إجبارية.` : `Jail sentence finished; paid 50$ fine.`);
                  updateUI();
                  moveSteps(cur, v0 + v1, false);
              } else {
                  logEvent(Game.lang==='ar' ? `لم يتطابق النرد (${v0}+${v1})! بقي ${cur.nameAr} في السجن.` : `No doubles (${v0}+${v1})! Still in Jail.`);
                  finishTurn(false);
              }
          }
      }

      function finishTurn(isDbl) {
          Game.isRolling = false;
          if (Game.isGameOver) return;
          if (isDbl && !Game.players[Game.turn].inJail) {
              logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} ${Game.players[Game.turn].nameAr} على رمية إضافية.`);
              startPlayerTurn();
              return;
          }
          Game.doublesInRow = 0;
          Game.turn = (Game.turn === 0) ? 1 : 0;
          updateUI();
          startPlayerTurn();
      }

      function startPlayerTurn() {
          if (Game.isGameOver) return;
          updateUI();
          const cur = Game.players[Game.turn];
          if (Game.turn === 0) {
              document.getElementById("btnRoll").disabled = false;
          } else {
              if (Game.mode === 'ai') {
                  document.getElementById("btnRoll").disabled = true;
                  setTimeout(() => {
                      if (Game.isGameOver || Game.turn !== 1) return;
                      if (cur.inJail) {
                          const diff = Game.aiDifficulty || 'medium';
                          const fineThreshold = (diff === 'hard') ? 100 : ((diff === 'easy') ? 600 : 300);
                          if (cur.money >= fineThreshold) payJailFine();
                          else rollForJail();
                      } else {
                          rollDice();
                      }
                  }, 750);
              } else {
                  document.getElementById("btnRoll").disabled = false;
              }
          }
      }

      function openTileInfoModal(index) {
          const t = BOARD_TILES[index];
          const isAr = (Game.lang === 'ar');
          const titleEl = document.getElementById("tileInfoTitle");
          const bodyEl = document.getElementById("tileInfoBody");

          if (t.type === "property") {
              titleEl.innerText = `${t.icon||"🏙️"} ${isAr?t.nameAr:t.nameEn}`;
              const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].nameAr}` : (isAr?"متاح للبيع من البنك":"Available for Sale");
              const statusTxt = t.mortgaged ? (isAr?"مَرْهُون ⚠️":"MORTGAGED ⚠️") : (isAr?"نشط وفعال ✓":"Active ✓");
              const mortVal = Math.floor(t.price * 0.5);
              const unmortVal = Math.floor(mortVal * 1.1);
              const baseRent = Math.round(t.price * 0.20);
              const monoRent = Math.round(t.price * 0.40);

              bodyEl.innerHTML = `
                  <div style="text-align:center; margin-bottom:10px;">
                      <span class="info-badge" style="background:${t.color}33; border-color:${t.color}; color:${t.color};">${isAr?"عقار استثماري":"Real Estate Property"}</span>
                      <div style="font-size:1.15rem; font-weight:900; color:var(--gold);">${t.price}$</div>
                  </div>
                  <div class="info-rule-box">
                      <div class="info-rule-item"><strong>${isAr?"الإيجار الأساسي (20%):":"Base Rent (20%):"}</strong> <span>${baseRent}$</span></div>
                      <div class="info-rule-item"><strong>${isAr?"إيجار الاحتكار (40% للمجموعة):":"Monopoly Rent (40%):"}</strong> <span style="color:var(--gold); font-weight:bold;">${monoRent}$</span></div>
                      <div class="info-rule-item"><strong>${isAr?"قيمة الرهن:":"Mortgage Value:"}</strong> <span>${mortVal}$</span></div>
                      <div class="info-rule-item"><strong>${isAr?"تكلفة فك الرهن:":"Unmortgage Cost:"}</strong> <span>${unmortVal}$</span></div>
                      <div class="info-rule-item"><strong>${isAr?"المالك الحالي:":"Current Owner:"}</strong> <span>${ownerTxt}</span></div>
                      <div class="info-rule-item"><strong>${isAr?"الحالة:":"Status:"}</strong> <span>${statusTxt}</span></div>
                  </div>
              `;
          } else {
              const info = SERVICE_INFO[t.type] || SERVICE_INFO['go'];
              titleEl.innerText = `${t.icon||"ℹ️"} ${isAr ? t.nameAr : t.nameEn}`;

              let rulesHtml = "";
              const rulesList = isAr ? info.rulesAr : info.rulesEn;
              rulesList.forEach(r => {
                  rulesHtml += `<div class="info-rule-item"><span>•</span><div>${r}</div></div>`;
              });

              let ownershipExtra = "";
              if (t.type === "railroad" || t.type === "utility") {
                  const ownerTxt = t.owner !== undefined ? `${Game.players[t.owner].avatar} ${Game.players[t.owner].nameAr}` : (isAr?"متاح للشراء":"Available for purchase");
                  ownershipExtra = `
                      <div style="background:rgba(128,128,128,0.08); border-radius:6px; padding:6px 10px; margin-top:8px; display:flex; justify-content:space-between; font-size:0.78rem;">
                          <span>${isAr?"المالك الحالي:":"Owner:"} <strong>${ownerTxt}</strong></span>
                          <span>${isAr?"السعر:":"Price:"} <strong style="color:var(--gold);">${t.price}$</strong></span>
                      </div>
                  `;
              }

              bodyEl.innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <span class="info-badge">${isAr ? info.badgeAr : info.badgeEn}</span>
                      <div style="font-size:0.86rem; color:var(--text); margin:4px 0 8px 0; font-weight:600;">
                          ${isAr ? info.descAr : info.descEn}
                      </div>
                  </div>
                  <div class="info-rule-box">
                      <div style="font-size:0.75rem; font-weight:bold; color:var(--gold); margin-bottom:6px;">
                          ${isAr ? "📋 تعليمات وقواعد الخانة:" : "📋 Tile Rules & Info:"}
                      </div>
                      ${rulesHtml}
                  </div>
                  ${ownershipExtra}
              `;
          }

          document.getElementById("tileInfoModal").classList.add("show");
      }

      function closeTileInfoModal() {
          document.getElementById("tileInfoModal").classList.remove("show");
      }

      window.handleAndroidBack = function() {
          const openModals = Array.from(document.querySelectorAll('.modal-overlay.show'));
          if (openModals.length > 0) {
              const exitModal = document.getElementById("exitModal");
              if (exitModal && exitModal.classList.contains("show")) {
                  closeExitModal();
                  return;
              }
              const lastModal = openModals[openModals.length - 1];
              lastModal.classList.remove("show");
              if (lastModal.id === "deedModal" && Game.pendingTile) {
                  const isDbl = Game.pendingTile.isDbl;
                  Game.pendingTile = null;
                  finishTurn(isDbl);
              }
              if (lastModal.id === "fastTravelModal" && Game.fastTravelData) {
                  const isDbl = Game.fastTravelData.isDbl;
                  Game.fastTravelData = null;
                  finishTurn(isDbl);
              }
              if (lastModal.id === "auctionModal" && Game.auction) {
                  stopAuctionTimer();
                  const isDbl = Game.auction.isDbl;
                  Game.auction = null;
                  finishTurn(isDbl);
              }
              return;
          }
          openExitModal();
      };

      function openExitModal() {
          document.getElementById("exitModal").classList.add("show");
      }
      function closeExitModal() {
          document.getElementById("exitModal").classList.remove("show");
      }
      function confirmExitWithSave() {
          saveCurrentGame();
          confirmExitGame();
      }
      function confirmExitWithoutSave() {
          confirmExitGame();
      }
      function confirmExitGame() {
          if (window.Android && window.Android.exitApp) {
              window.Android.exitApp();
          } else {
              window.close();
          }
      }

      function openTradeModal(selectedPropId = null, previousOffer = null, wasRejected = false) {
          const curPlayer = Game.players[Game.turn];
          const oppPlayer = Game.players[Game.turn === 0 ? 1 : 0];
          const sel = document.getElementById("tradeTargetProp");
          sel.innerHTML = "";

          const oppProps = BOARD_TILES.filter(t => t.owner === oppPlayer.id && !t.mortgaged);
          const btnSubmit = document.getElementById("btnSubmitTrade");
          const targetLabel = document.getElementById("tradeTargetLabel");
          if (targetLabel) {
              targetLabel.innerText = Game.lang === 'ar' ? `اختر عقار (${oppPlayer.nameAr}) للشراء:` : `Select ${oppPlayer.nameEn}'s property:`;
          }

          if (oppProps.length === 0) {
              sel.innerHTML = `<option value=''>لا يملك ${oppPlayer.nameAr} عقارات متاحة</option>`;
              btnSubmit.disabled = true;
          } else {
              btnSubmit.disabled = false;
              oppProps.forEach(t => {
                  const opt = document.createElement("option");
                  opt.value = t.id;
                  opt.innerText = `${t.icon||""} ${Game.lang==='ar'?t.nameAr:t.nameEn} (${t.price}$)`;
                  if (selectedPropId !== null && t.id === selectedPropId) {
                      opt.selected = true;
                  }
                  sel.appendChild(opt);
              });
          }

          const notice = document.getElementById("tradeNotice");
          const inputCash = document.getElementById("tradeOfferCash");

          if (wasRejected && selectedPropId !== null) {
              const prop = BOARD_TILES[selectedPropId];
              const propName = Game.lang === 'ar' ? prop.nameAr : prop.nameEn;
              notice.style.display = "block";
              notice.style.background = "rgba(239, 68, 68, 0.15)";
              notice.style.border = "1px solid #EF4444";
              notice.style.color = "#EF4444";
              notice.innerHTML = `⚠️ <strong>تم رفض العرض!</strong> رفض ${oppPlayer.nameAr} بيع (${propName}) بمبلغ <strong>${previousOffer}$</strong>.<br>يمكنك رفع السعر وإعادة المحاولة أو الخروج.`;
              const suggestedOffer = previousOffer ? (previousOffer + 50) : (prop.price + 50);
              inputCash.value = Math.min(curPlayer.money, suggestedOffer);
              btnSubmit.innerText = Game.lang === 'ar' ? "زيادة العرض وإعادة الإرسال" : "Increase Offer & Resubmit";
          } else {
              notice.style.display = "none";
              notice.innerText = "";
              btnSubmit.innerText = Game.lang === 'ar' ? `إرسال العرض إلى ${oppPlayer.nameAr}` : `Send Offer to ${oppPlayer.nameEn}`;
              if (oppProps.length > 0) {
                  const curProp = selectedPropId !== null ? BOARD_TILES[selectedPropId] : oppProps[0];
                  if (curProp) inputCash.value = curProp.price;
              }
          }

          document.getElementById("tradeModal").classList.add("show");
      }

      function onTradeTargetPropChange() {
          const propId = parseInt(document.getElementById("tradeTargetProp").value);
          const notice = document.getElementById("tradeNotice");
          notice.style.display = "none";
          const oppPlayer = Game.players[Game.turn === 0 ? 1 : 0];
          document.getElementById("btnSubmitTrade").innerText = Game.lang === 'ar' ? `إرسال العرض إلى ${oppPlayer.nameAr}` : `Send Offer to ${oppPlayer.nameEn}`;
          if (!isNaN(propId)) {
              const p = BOARD_TILES[propId];
              if (p) document.getElementById("tradeOfferCash").value = p.price;
          }
      }

      function submitTradeOffer() {
          const curPlayer = Game.players[Game.turn];
          const oppPlayer = Game.players[Game.turn === 0 ? 1 : 0];
          const propId = parseInt(document.getElementById("tradeTargetProp").value);
          const offerCash = parseInt(document.getElementById("tradeOfferCash").value);
          const notice = document.getElementById("tradeNotice");

          if (isNaN(propId) || isNaN(offerCash) || offerCash <= 0) return;
          if (curPlayer.money < offerCash) {
              notice.style.display = "block";
              notice.style.background = "rgba(239, 68, 68, 0.15)";
              notice.style.border = "1px solid #EF4444";
              notice.style.color = "#EF4444";
              notice.innerText = Game.lang === 'ar' ? "رصيدك المالي لا يكفي للمبلغ المعروض!" : "Insufficient funds for this offer!";
              return;
          }
          const targetTile = BOARD_TILES[propId];
          closeTradeModal();

          const td = { buyerId:curPlayer.id, sellerId:oppPlayer.id, tile:targetTile, offer:offerCash };
          Game.tradeData = td;

          if (Game.mode === 'ai') {
              evaluateAITrade(td);
          } else {
              promptPvPTradeDecision(td);
          }
      }

      function evaluateAITrade(td) {
          const ai = Game.players[1];
          const diff = Game.aiDifficulty || 'medium';
          let ok = false;

          const myPot = checkMonopolyPot(1, td.tile.group);
          const oppPot = checkMonopolyPot(0, td.tile.group);

          let threshold = 1.35;
          if (diff === 'easy') {
              threshold = myPot ? 1.30 : 1.10;
          } else if (diff === 'medium') {
              threshold = myPot ? 1.60 : 1.35;
          } else {
              threshold = (myPot || oppPot) ? 2.50 : 1.75;
          }

          if (td.offer >= td.tile.price * threshold) {
              ok = true;
          }

          if (ok) {
              execTrade(td);
              logEvent(`🤝 وافق ${ai.nameAr} على بيع (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) مقابل ${td.offer}$.`);
          } else {
              logEvent(`❌ رفض ${ai.nameAr} عرض المقايضة لعقار (${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}) بمبلغ ${td.offer}$.`);
              setTimeout(() => {
                  openTradeModal(td.tile.id, td.offer, true);
              }, 500);
          }
      }

      function promptPvPTradeDecision(td) {
          const buyer = Game.players[td.buyerId];
          const seller = Game.players[td.sellerId];
          const descEl = document.getElementById("pvpTradeDesc");
          descEl.innerHTML = `
              <span style="color:var(--gold); font-size:1.05rem;">${buyer.avatar} ${buyer.nameAr}</span><br>
              يعرض عليك مبلغ <strong style="color:var(--gold); font-size:1.25rem;">${td.offer}$</strong><br>
              لشراء عقارك (<strong style="color:var(--text);">${Game.lang==='ar'?td.tile.nameAr:td.tile.nameEn}</strong>).<br><br>
              هل توافق يا <span style="color:var(--p1); font-size:1.05rem;">${seller.avatar} ${seller.nameAr}</span>؟
          `;
          document.getElementById("pvpTradeConfirmModal").classList.add("show");
      }

      function acceptPvPTrade() {
          if (!Game.tradeData) return;
          const td = Game.tradeData;
          document.getElementById("pvpTradeConfirmModal").classList.remove("show");
          execTrade(td);
          const seller = Game.players[td.sellerId];
          logEvent(`🤝 وافق ${seller.nameAr} على الصفقة!`);
          Game.tradeData = null;
      }

      function rejectPvPTrade() {
          if (!Game.tradeData) return;
          const td = Game.tradeData;
          document.getElementById("pvpTradeConfirmModal").classList.remove("show");
          const seller = Game.players[td.sellerId];
          logEvent(`❌ رفض ${seller.nameAr} عرض المقايضة.`);
          setTimeout(() => {
              openTradeModal(td.tile.id, td.offer, true);
          }, 400);
      }

      function execTrade(td) {
          const b = Game.players[td.buyerId], s = Game.players[td.sellerId], t = td.tile;
          b.money -= td.offer; s.money += td.offer;
          s.props = s.props.filter(id => id !== t.id); b.props.push(t.id); t.owner = b.id;
          AudioFX.play('cash'); updateUI();
      }
      function closeTradeModal() { document.getElementById("tradeModal").classList.remove("show"); Game.tradeData = null; }

      function openPropsModal(pId) {
          const p = Game.players[pId];
          document.getElementById("propsModalTitle").innerText = `${p.avatar} ${Game.lang==='ar'?p.nameAr:p.nameEn} (${p.money}$)`;
          const b = document.getElementById("propsModalBody");
          b.innerHTML = "";
          if (p.props.length === 0) {
              b.innerHTML = `<div style="text-align:center; color:var(--dim); padding:16px;">لا توجد أي عقارات مملوكة حالياً.</div>`;
          } else {
              p.props.forEach(propId => {
                  const t = BOARD_TILES[propId];
                  const d = document.createElement("div");
                  d.style = "background:var(--box-bg); border-radius:8px; padding:7px 10px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--card-border);";
                  const mortVal = Math.floor(t.price * 0.5);
                  const unmortVal = Math.floor(mortVal * 1.1);

                  const canManage = (pId === 0) || (Game.mode === 'pvp');

                  d.innerHTML = `
                      <div>
                          <strong style="color:${t.color||'var(--gold)'};">${t.icon||""} ${Game.lang==='ar'?t.nameAr:t.nameEn}</strong>
                          <div style="font-size:0.74rem; color:var(--dim);">القيمة: ${t.price}$ | الرهن: ${mortVal}$</div>
                      </div>
                      <div>
                          ${canManage ? (
                              t.mortgaged ?
                              `<button class="btn btn-gold" style="font-size:0.70rem; padding:3px 7px;" onclick="unmortgageProp(${t.id}, ${pId})">فك الرهن (${unmortVal}$)</button>` :
                              `<button class="btn btn-red" style="font-size:0.70rem; padding:3px 7px;" onclick="mortgageProp(${t.id}, ${pId})">رهن (+${mortVal}$)</button>`
                          ) : (t.mortgaged ? `<span style="color:#EF4444; font-size:0.72rem;">مَرْهُون</span>` : '')}
                      </div>
                  `;
                  b.appendChild(d);
              });
          }
          document.getElementById("propsModal").classList.add("show");
      }
      function closePropsModal() { document.getElementById("propsModal").classList.remove("show"); }

      function mortgageProp(id, pId) {
          const t = BOARD_TILES[id], p = Game.players[pId];
          if (t.owner === pId && !t.mortgaged) {
              t.mortgaged = true; p.money += Math.floor(t.price * 0.5);
              AudioFX.play('cash'); updateUI(); openPropsModal(pId);
              logEvent(`🏦 رهن ${p.avatar} ${p.nameAr} (${Game.lang==='ar'?t.nameAr:t.nameEn}) واستلم ${Math.floor(t.price * 0.5)}$.`);
          }
      }
      function unmortgageProp(id, pId) {
          const t = BOARD_TILES[id], p = Game.players[pId];
          const cost = Math.floor(t.price * 0.5 * 1.1);
          if (t.owner === pId && t.mortgaged && p.money >= cost) {
              t.mortgaged = false; p.money -= cost;
              AudioFX.play('cash'); updateUI(); openPropsModal(pId);
              logEvent(`🔓 فك ${p.avatar} ${p.nameAr} رهن (${Game.lang==='ar'?t.nameAr:t.nameEn}) مقابل ${cost}$.`);
          }
      }

      function setTheme(t) {
          Game.theme = t;
          if (t === 'light') {
              document.body.classList.add('theme-light');
              document.getElementById('btnThemeDark').classList.remove('active');
              document.getElementById('btnThemeLight').classList.add('active');
          } else {
              document.body.classList.remove('theme-light');
              document.getElementById('btnThemeLight').classList.remove('active');
              document.getElementById('btnThemeDark').classList.add('active');
          }
      }

      function setLanguage(l) {
          Game.lang = l;
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
          document.getElementById("btnLangAr").className = "btn-pill" + (l==='ar'?" active":"");
          document.getElementById("btnLangEn").className = "btn-pill" + (l==='en'?" active":"");
          document.getElementById("txtAppTitle").innerText = I18N[l].app;
          document.getElementById("txtBtnRoll").innerText = I18N[l].roll;
          BOARD_TILES.forEach(t => {
              const el = document.getElementById("tName-" + t.id);
              if (el) el.innerText = l === 'ar' ? t.nameAr : t.nameEn;
          });
          updateUI();
      }

      function setPropStyle(s) {
          Game.propStyle = s;
          ["glow","tint","border","badge"].forEach(id => {
              document.getElementById("btnPropStyle" + id.charAt(0).toUpperCase() + id.slice(1)).className = "btn-pill" + (s === id ? " active" : "");
          });
          updateBoardVisual();
      }

      function setDiceSpeed(sp) {
          Game.diceSpeed = sp;
          ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
              const el = document.getElementById("btnDiceSpeed_" + id);
              if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
          });
      }

      function setMoveSpeed(sp) {
          Game.moveSpeed = sp;
          ["v_slow","slow","normal","fast","v_fast"].forEach(id => {
              const el = document.getElementById("btnMoveSpeed_" + id);
              if (el) el.className = "btn-pill" + (sp === id ? " active" : "");
          });
      }

      function setSound(en) {
          AudioFX.enabled = en;
          document.getElementById("btnSoundOn").className = "btn-pill" + (en ? " active" : "");
          document.getElementById("btnSoundOff").className = "btn-pill" + (!en ? " active" : "");
      }

      function openSettingsModal() { document.getElementById("settingsModal").classList.add("show"); }
      function closeSettingsModal() { document.getElementById("settingsModal").classList.remove("show"); }
      function openAboutModal() { document.getElementById("aboutModal").classList.add("show"); }
      function closeAboutModal() { document.getElementById("aboutModal").classList.remove("show"); }

      window.addEventListener("DOMContentLoaded", () => {
          renderBoard();
          updateUI();
          showStartModal();
      });
      </script>
      </body>
      </html>
      '''

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          print("✅ All project files created successfully with all features!")
          PYEOF

      - name: 🔨 إعطاء صلاحيات التشغيل لـ Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      - name: 🚀 بناء حزمة APK (Debug)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 📤 رفع ملف APK كعنصر قابل للتحميل (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MonopolyPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار تلقائي على GitHub (Release)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v1.0.0
          name: "MONOPOLY PRO - الإصدار 1.0.0"
          body: "🎲 النسخة الرسمية لتطبيق لعبة MONOPOLY PRO بنك الحظ الاحترافي (APK جاهز للتثبيت المباشر على الأندرويد). برمجة وتصميم عمار الهلالي."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
