          }
          .info-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.70rem;
            font-weight: bold;
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
            margin-bottom: 6px;
          }
          .info-rule-box {
