                  const diffMap = { 'easy': ' (سهل)', 'medium': ' (متوسط)', 'hard': ' (صعب)', 'very_hard': ' (صعب جداً 🔥)' };
                  const diffTxt = Game.mode === 'ai' ? (diffMap[Game.aiDifficulty] || "") : "";
                  const jailRentTxt = Game.collectRentInJail ? " | إيجارات السجن: مفعلة" : " | إيجارات السجن: ممنوعة";
                  summaryEl.innerText = `${modeTxt}${diffTxt} | ${Game.lang==='ar'?"البداية":"Cash"}: ${Game.startingCash}$${jailRentTxt}`;
              }
          
              updateBoardVisual();
