name: Build Monopoly Arabia APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🎲 بناء تطبيق مونوبولي العرب (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات لعبة مونوبولي العرب تلقائياً
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonopolyArabia"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.monopoly.arabia'
              compileSdk 34
              defaultConfig {
                  applicationId "com.monopoly.arabia"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """

          # 5. AndroidManifest.xml
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_monopoly"
                  android:roundIcon="@drawable/ic_monopoly"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MonopolyArabia">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">مونوبولي العرب</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0E14</color>
              <color name="gold">#F59E0B</color>
              <color name="gold_dark">#D97706</color>
          </resources>
          """

          # 8. Themes
          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MonopolyArabia" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/gold</item>
                  <item name="colorPrimaryVariant">@color/gold_dark</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
                  <item name="android:windowBackground">@color/bg_main</item>
              </style>
          </resources>
          """

          # 9. App Icon
          files["app/src/main/res/drawable/ic_monopoly.xml"] = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#0B0E14" android:pathData="M50,4 C75.4,4 96,24.6 96,50 C96,75.4 75.4,96 50,96 C24.6,96 4,75.4 4,50 C4,24.6 24.6,4 50,4 Z" />
              <path android:fillColor="#F59E0B" android:pathData="M50,10 L86,30 L86,70 L50,90 L14,70 L14,30 Z" />
              <path android:fillColor="#1E293B" android:pathData="M50,16 L80,33 L80,67 L50,84 L20,67 L20,33 Z" />
              <path android:fillColor="#FBBF24" android:pathData="M32,38 L40,55 L50,42 L60,55 L68,38 L68,64 L32,64 Z" />
              <path android:fillColor="#EF4444" android:pathData="M50,55 C53,55 55,57 55,60 C55,63 53,65 50,65 C47,65 45,63 45,60 C45,57 47,55 50,55 Z" />
          </vector>
          """

          # 10. Layout
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg_main" />
          </FrameLayout>
          """

          # 11. MainActivity.java
          files["app/src/main/java/com/monopoly/arabia/MainActivity.java"] = """package com.monopoly.arabia;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """

          # 12. app/src/main/assets/index.html
          files["app/src/main/assets/index.html"] = r'''
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>مونوبولي العرب • Monopoly Arabia</title>
          <style>
          :root{--bg-main:#0B0E14;--bg-board:#111723;--bg-tile:#1B2232;--gold:#F59E0B;--gold-lt:#FDE68A;--text:#F8FAFC;--dim:#94A3B8;--p0:#EF4444;--p1:#38BDF8;--green:#10B981;}
          *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
          html,body{width:100%;height:100%;margin:0;padding:2px;box-sizing:border-box;overflow:hidden;}
          body{background:var(--bg-main);color:var(--text);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
          .header{width:100%;max-width:480px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:linear-gradient(135deg,#1E293B,#0F172A);border-radius:12px;border:1px solid rgba(245,158,11,0.4);margin-bottom:3px;}
          .header-title{display:flex;align-items:center;gap:6px;font-size:0.92rem;font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(245,158,11,0.4);}
          .header-controls{display:flex;gap:6px;}
          .btn-hdr{background:#2D3748;border:1px solid #4B5563;color:#E2E8F0;padding:4px 9px;border-radius:6px;font-size:0.75rem;font-weight:bold;cursor:pointer;}
          .scoreboard{width:100%;max-width:480px;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:3px;}
          .p-card{background:#161D2B;border:2px solid #2B3548;border-radius:10px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;cursor:pointer;}
          .p-card.active{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,0.45);background:linear-gradient(135deg,#1C2436,#232D42);}
          .p-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;background:#000;border:2px solid #fff;flex-shrink:0;}
          .p-details{flex:1;margin:0 6px;}
          .p-name{font-size:0.80rem;font-weight:900;line-height:1.2;}
          .p-cash{font-size:0.92rem;font-weight:900;color:var(--gold-lt);line-height:1.2;}
          .p-stats{font-size:0.65rem;color:var(--dim);}
          .p-badge{position:absolute;top:-6px;left:6px;background:var(--gold);color:#000;font-size:0.58rem;font-weight:900;padding:1px 6px;border-radius:10px;}
          .board-wrapper{direction:ltr!important;width:100%;max-width:480px;flex:1;min-height:0;margin:0 auto;box-sizing:border-box;position:relative;background:var(--bg-board);border-radius:12px;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,0.7);display:grid;grid-template-columns:1.15fr repeat(9,1fr) 1.15fr;grid-template-rows:1.1fr repeat(9,1fr) 1.1fr;gap:1.5px;padding:2px;}
          .tile{direction:rtl;background:var(--bg-tile);border-radius:4px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 1px;overflow:visible;border:1px solid rgba(255,255,255,0.08);cursor:pointer;}
          .tile-bar{width:100%;height:6px;border-radius:2px;flex-shrink:0;}
          .tile-cnt{width:100%;height:calc(100% - 8px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0;}
          .tile-name{font-size:clamp(0.40rem,1.8vw,0.52rem);font-weight:800;text-align:center;line-height:1.1;color:var(--text);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 1px;}
          .tile-price{font-size:clamp(0.38rem,1.6vw,0.50rem);font-weight:900;color:var(--gold-lt);margin-top:auto;}
          .tile-icon{font-size:0.95rem;line-height:1;margin:auto 0;}
          .corner-tile{background:radial-gradient(circle at center,#1E293B,#101726);justify-content:center;}
          .corner-tile .tile-icon{font-size:1.35rem;}
          .corner-tile .tile-name{font-size:0.55rem;color:var(--gold);}
          .pawn{width:clamp(25px,6vw,29px);height:clamp(25px,6vw,29px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(0.95rem,3.8vw,1.15rem);box-shadow:0 2px 6px rgba(0,0,0,0.9);border:2px solid #fff;background:#000;flex-shrink:0;pointer-events:none;transition:none!important;animation:none!important;}
          .pawn.moving-step{transform:translateY(-4px) scale(1.15);transition:transform 0.1s ease-out!important;}
          .pawn-p0{background:radial-gradient(circle,#EF4444,#991B1B);}
          .pawn-p1{background:radial-gradient(circle,#38BDF8,#075985);}
          .tile-pawns{position:absolute;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;justify-content:center;align-items:center;gap:3px;z-index:25;pointer-events:none;transition:none!important;animation:none!important;}
          .side-bottom .tile-pawns{top:2px;bottom:auto;left:0;right:0;height:auto;justify-content:center;}
          .side-top .tile-pawns{bottom:2px;top:auto;left:0;right:0;height:auto;justify-content:center;}
          .side-left .tile-pawns{right:2px;left:auto;top:50%;transform:translateY(-50%);height:auto;width:auto;justify-content:flex-end;}
          .side-right .tile-pawns{left:2px;right:auto;top:50%;transform:translateY(-50%);height:auto;width:auto;justify-content:flex-start;}
          .corner-0 .tile-pawns{top:3px;left:3px;right:auto;bottom:auto;height:auto;width:auto;justify-content:flex-start;}
          .corner-10 .tile-pawns{top:3px;right:3px;left:auto;bottom:auto;height:auto;width:auto;justify-content:flex-end;}
          .corner-20 .tile-pawns{bottom:3px;right:3px;left:auto;top:auto;height:auto;width:auto;justify-content:flex-end;}
          .corner-30 .tile-pawns{bottom:3px;left:3px;right:auto;top:auto;height:auto;width:auto;justify-content:flex-start;}
          .side-bottom .tile-bar{margin-top:auto;margin-bottom:0;}
          .side-top .tile-bar{margin-top:0;margin-bottom:auto;}
          .tile.owned-glow{box-shadow:inset 0 0 8px currentColor;}
          .tile.owned-tint{filter:brightness(1.25);}
          .tile.owned-border{border-width:2.5px!important;border-color:currentColor!important;}
          .tile-owner-badge{position:absolute;top:1px;right:1px;font-size:0.6rem;background:rgba(0,0,0,0.85);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);z-index:5;}
          [dir="ltr"] .tile-owner-badge{right:auto;left:1px;}
          .tile-mortgaged-badge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);background:#DC2626;color:#FFF;font-size:0.5rem;font-weight:900;padding:1px 4px;border-radius:3px;border:1px solid #FFF;z-index:8;}
          .board-center{direction:rtl;grid-column:2/span 9;grid-row:2/span 9;background:radial-gradient(circle at center,#182235,#0B101A);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px;position:relative;border:1px solid rgba(245,158,11,0.25);overflow:hidden;}
          .center-brand{font-size:clamp(0.85rem,3.5vw,1.1rem);font-weight:900;color:var(--gold);letter-spacing:1px;text-align:center;text-shadow:0 0 10px rgba(245,158,11,0.5);}
          .center-turn-announcer{font-size:clamp(0.72rem,2.8vw,0.88rem);font-weight:bold;color:var(--text);background:rgba(255,255,255,0.06);padding:3px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);}
          .dice-area{display:flex;align-items:center;justify-content:center;gap:18px;margin:auto 0;perspective:800px;}
          .cube-die{width:46px;height:46px;position:relative;transform-style:preserve-3d;transition:transform 0.1s linear;}
          .cube-die.rolling{animation:rollTumble 0.4s infinite linear;}
          @keyframes rollTumble{0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}100%{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg);}}
          .cube-face{position:absolute;width:46px;height:46px;background:linear-gradient(145deg,#FFF,#E2E8F0);border:2px solid #CBD5E1;border-radius:8px;box-shadow:inset 0 0 6px rgba(0,0,0,0.15),0 4px 10px rgba(0,0,0,0.6);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;box-sizing:border-box;}
          .dot{width:8px;height:8px;background:#B91C1C;border-radius:50%;align-self:center;justify-self:center;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);}
          .face-1{transform:rotateY(0deg) translateZ(23px);}
          .face-6{transform:rotateY(180deg) translateZ(23px);}
          .face-2{transform:rotateY(-90deg) translateZ(23px);}
          .face-5{transform:rotateY(90deg) translateZ(23px);}
          .face-3{transform:rotateX(90deg) translateZ(23px);}
          .face-4{transform:rotateX(-90deg) translateZ(23px);}
          .center-btn-roll{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000;border:none;border-radius:24px;padding:8px 24px;font-size:clamp(0.85rem,3.2vw,1.05rem);font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,0.5);display:flex;align-items:center;gap:6px;}
          .center-btn-roll:active{transform:scale(0.96);}
          .center-btn-roll:disabled{opacity:0.4;cursor:not-allowed;}
          .log-area{width:95%;height:22px;background:rgba(0,0,0,0.45);border-radius:6px;border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;padding:0 6px;overflow:hidden;white-space:nowrap;font-size:0.65rem;color:var(--gold-lt);}
          .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:999;padding:12px;}
          .modal-overlay.show{display:flex;}
          .modal-card{background:linear-gradient(145deg,#1E293B,#0F172A);border:2px solid var(--gold);border-radius:16px;width:100%;max-width:360px;box-shadow:0 12px 35px rgba(0,0,0,0.9);overflow:hidden;display:flex;flex-direction:column;}
          .modal-header{padding:10px 14px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;}
          .modal-title{font-size:1rem;font-weight:900;color:var(--gold);}
          .modal-body{padding:14px;font-size:0.85rem;line-height:1.5;max-height:65vh;overflow-y:auto;}
          .modal-footer{padding:10px 14px;background:rgba(0,0,0,0.3);border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:8px;justify-content:flex-end;}
          .btn{padding:8px 16px;border-radius:8px;font-weight:bold;font-size:0.82rem;cursor:pointer;border:none;}
          .btn-gold{background:var(--gold);color:#000;}
          .btn-blue{background:#2563EB;color:#fff;}
          .btn-red{background:#DC2626;color:#fff;}
          .btn-gray{background:#4B5563;color:#fff;}
          .btn-pill{padding:5px 12px;border-radius:20px;border:1px solid #4B5563;background:#1E293B;color:#FFF;cursor:pointer;font-size:0.75rem;}
          .btn-pill.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:bold;}
          .row-opts{display:flex;gap:6px;margin:6px 0 12px 0;flex-wrap:wrap;}
          .settings-section{margin-bottom:12px;}
          .settings-label{font-size:0.78rem;font-weight:bold;color:var(--dim);margin-bottom:4px;}
          </style>
          </head>
          <body>
          
          <div class="header">
              <div class="header-title">
                  <span>👑</span>
                  <span id="txtAppTitle">مونوبولي العرب</span>
              </div>
              <div class="header-controls">
                  <button class="btn-hdr" onclick="openPropsModal(0)">🎒 <span id="txtBtnP0Props">عقاراتي</span></button>
                  <button class="btn-hdr" onclick="openTradeModal()">🤝 <span id="txtBtnTrade">مقايضة</span></button>
                  <button class="btn-hdr" onclick="openSettingsModal()">⚙️</button>
                  <button class="btn-hdr" onclick="openAboutModal()">ℹ️</button>
              </div>
          </div>
          
          <div class="scoreboard">
              <div class="p-card active" id="pCard0" onclick="openPropsModal(0)">
                  <div class="p-avatar" style="border-color:var(--p0);" id="avP0">👑</div>
                  <div class="p-details">
                      <div class="p-name" style="color:var(--p0);" id="nameP0">الملك (أنت)</div>
                      <div class="p-cash" id="cashP0">1500$</div>
                      <div class="p-stats"><span id="propsP0">عقارات 0</span> <span id="mortP0" style="color:#EF4444;"></span></div>
                  </div>
                  <div class="p-badge" id="turnBadge0">دورك</div>
              </div>
              <div class="p-card" id="pCard1" onclick="openPropsModal(1)">
                  <div class="p-avatar" style="border-color:var(--p1);" id="avP1">🦅</div>
                  <div class="p-details">
                      <div class="p-name" style="color:var(--p1);" id="nameP1">الصقر (الذكاء)</div>
                      <div class="p-cash" id="cashP1">1500$</div>
                      <div class="p-stats"><span id="propsP1">عقارات 0</span> <span id="mortP1" style="color:#EF4444;"></span></div>
                  </div>
                  <div class="p-badge" id="turnBadge1" style="display:none;background:var(--p1);">دور الخصم</div>
              </div>
          </div>
          
          <div class="board-wrapper" id="board">
              <div class="board-center">
                  <div class="center-brand">MONOPOLY ARABIA</div>
                  <div class="center-turn-announcer" id="turnAnnouncer">الدور: الملك 👑</div>
          
                  <div class="dice-area">
                      <div class="cube-die" id="die0">
                          <div class="cube-face face-1"><div class="dot" style="grid-area:2/2;"></div></div>
                          <div class="cube-face face-2"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
