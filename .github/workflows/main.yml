name: Build Monopoly Arabia APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🎲 بناء تطبيق مونوبولي العرب (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات لعبة مونوبولي العرب تلقائياً
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonopolyArabia"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.monopoly.arabia'
              compileSdk 34
              defaultConfig {
                  applicationId "com.monopoly.arabia"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """

          # 5. AndroidManifest.xml
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_monopoly"
                  android:roundIcon="@drawable/ic_monopoly"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MonopolyArabia">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">مونوبولي العرب</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0E14</color>
              <color name="gold">#F59E0B</color>
              <color name="gold_dark">#D97706</color>
          </resources>
          """

          # 8. Themes
          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MonopolyArabia" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/gold</item>
                  <item name="colorPrimaryVariant">@color/gold_dark</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
                  <item name="android:windowBackground">@color/bg_main</item>
              </style>
          </resources>
          """

          # 9. App Icon
          files["app/src/main/res/drawable/ic_monopoly.xml"] = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#0B0E14" android:pathData="M50,4 C75.4,4 96,24.6 96,50 C96,75.4 75.4,96 50,96 C24.6,96 4,75.4 4,50 C4,24.6 24.6,4 50,4 Z" />
              <path android:fillColor="#F59E0B" android:pathData="M50,10 L86,30 L86,70 L50,90 L14,70 L14,30 Z" />
              <path android:fillColor="#1E293B" android:pathData="M50,16 L80,33 L80,67 L50,84 L20,67 L20,33 Z" />
              <path android:fillColor="#FBBF24" android:pathData="M32,38 L40,55 L50,42 L60,55 L68,38 L68,64 L32,64 Z" />
              <path android:fillColor="#EF4444" android:pathData="M50,55 C53,55 55,57 55,60 C55,63 53,65 50,65 C47,65 45,63 45,60 C45,57 47,55 50,55 Z" />
          </vector>
          """

          # 10. Layout
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg_main" />
          </FrameLayout>
          """

          # 11. MainActivity.java
          files["app/src/main/java/com/monopoly/arabia/MainActivity.java"] = """package com.monopoly.arabia;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """

          # 12. Full Game HTML / CSS / JS Assets
          files["app/src/main/assets/index.html"] = """<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>مونوبولي العرب • Monopoly Arabia</title>
          <style>
          :root{--bg-main:#0B0E14;--bg-board:#111723;--bg-tile:#1B2232;--gold:#F59E0B;--gold-lt:#FDE68A;--text:#F8FAFC;--dim:#94A3B8;--p0:#EF4444;--p1:#38BDF8;--green:#10B981;}
          *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
          html,body{width:100%;max-width:100vw;margin:0;padding:2px;box-sizing:border-box;overflow-x:hidden;}
          body{background:var(--bg-main);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
          .header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:linear-gradient(135deg,#1E293B,#0F172A);border-radius:12px;border:1px solid rgba(245,158,11,0.4);margin-bottom:4px;}
          .header-title{display:flex;align-items:center;gap:6px;font-size:0.92rem;font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(245,158,11,0.4);}
          .header-controls{display:flex;gap:6px;}
          .btn-hdr{background:#2D3748;border:1px solid #4B5563;color:#E2E8F0;padding:4px 9px;border-radius:6px;font-size:0.75rem;font-weight:bold;cursor:pointer;}
          .scoreboard{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
          .p-card{background:#161D2B;border:2px solid #2B3548;border-radius:10px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;cursor:pointer;}
          .p-card.active{border-color:var(--gold);box-shadow:0 0 12px rgba(245,158,11,0.45);background:linear-gradient(135deg,#1C2436,#232D42);}
          .p-info{display:flex;align-items:center;gap:7px;}
          .p-avatar{font-size:1.5rem;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);box-shadow:0 2px 6px rgba(0,0,0,0.5);flex-shrink:0;}
          .p-meta{display:flex;flex-direction:column;}
          .p-name{font-size:0.75rem;font-weight:bold;color:#E2E8F0;}
          .p-cash{font-size:0.92rem;font-weight:900;color:var(--green);}
          .turn-badge{position:absolute;top:-6px;left:10px;background:var(--gold);color:#000;font-size:0.6rem;font-weight:900;padding:1px 7px;border-radius:10px;}
          [dir="ltr"] .turn-badge{left:auto;right:10px;}
          .board-wrapper{width:100%;max-width:calc(100vw - 4px);aspect-ratio:1/1;margin:0 auto;box-sizing:border-box;position:relative;background:var(--bg-board);border-radius:12px;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,0.7);display:grid;grid-template-columns:1.2fr repeat(9,1fr) 1.2fr;grid-template-rows:1.2fr repeat(9,1fr) 1.2fr;gap:1.5px;padding:2px;}
          .tile{background:var(--bg-tile);border-radius:4px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 1px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);cursor:pointer;}
          .tile-bar{width:100%;height:6px;border-radius:2px;flex-shrink:0;}
          .tile-cnt{width:100%;height:calc(100% - 8px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0;}
          .tile-name{font-size:clamp(0.40rem,1.8vw,0.52rem);font-weight:800;text-align:center;line-height:1.1;color:var(--text);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 1px;}
          .tile-price{font-size:clamp(0.38rem,1.6vw,0.50rem);font-weight:900;color:var(--gold-lt);margin-top:auto;}
          .tile-icon{font-size:0.95rem;line-height:1;margin:auto 0;}
          .corner-tile{background:#202738;border:1px solid rgba(245,158,11,0.4);justify-content:center;}
          .corner-tile .tile-name{font-size:0.55rem;color:var(--gold);}
          .tile-pawns{position:absolute;display:flex;justify-content:center;align-items:center;gap:2px;z-index:12;pointer-events:none;}
          .side-bottom .tile-pawns{top:1px;left:0;right:0;height:14px;}
          .side-top .tile-pawns{bottom:1px;left:0;right:0;height:14px;}
          .side-left .tile-pawns{right:1px;top:0;bottom:0;width:14px;flex-direction:column;}
          .side-right .tile-pawns{left:1px;top:0;bottom:0;width:14px;flex-direction:column;}
          .side-bottom .tile-bar{margin-top:auto;margin-bottom:0;}
          .side-top .tile-bar{margin-top:0;margin-bottom:auto;}
          .pawn{width:clamp(16px,4.2vw,20px);height:clamp(16px,4.2vw,20px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(0.68rem,2.8vw,0.82rem);box-shadow:0 2px 5px rgba(0,0,0,0.9);border:1.5px solid #fff;background:#000;animation:pawnPop 0.3s ease;}
          @keyframes pawnPop{0%{transform:scale(0.3) translateY(-6px);}100%{transform:scale(1) translateY(0);}}
          .pawn-p0{background:radial-gradient(circle,#EF4444,#991B1B);}
          .pawn-p1{background:radial-gradient(circle,#38BDF8,#075985);}
          .tile.owned-glow{box-shadow:inset 0 0 8px currentColor;}
          .tile.owned-tint{filter:brightness(1.25);}
          .tile.owned-border{border-width:2.5px!important;border-color:currentColor!important;}
          .tile-owner-badge{position:absolute;top:1px;right:1px;font-size:0.6rem;background:rgba(0,0,0,0.85);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);z-index:5;}
          [dir="ltr"] .tile-owner-badge{right:auto;left:1px;}
          .tile-mortgaged-badge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);background:#DC2626;color:#FFF;font-size:0.5rem;font-weight:900;padding:1px 4px;border-radius:3px;border:1px solid #FFF;z-index:8;}
          .board-center{grid-column:2/span 9;grid-row:2/span 9;background:radial-gradient(circle at center,#182235,#0B101A);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px;position:relative;border:1px solid rgba(245,158,11,0.25);overflow:hidden;}
          .center-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.8rem;opacity:0.04;font-weight:900;pointer-events:none;}
          .turn-announcer{background:rgba(15,23,42,0.9);border:1px solid var(--gold);padding:3px 12px;border-radius:20px;font-size:0.75rem;font-weight:bold;color:var(--gold);text-align:center;}
          .dice-area{display:flex;flex-direction:column;align-items:center;gap:5px;margin:2px 0;}
          .dice-container{display:flex;gap:14px;perspective:400px;}
          .cube-die{width:38px;height:38px;position:relative;transform-style:preserve-3d;transition:transform 0.4s ease-out;}
          .cube-die.rolling{animation:rollTumble 0.4s infinite linear;}
          @keyframes rollTumble{0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}50%{transform:rotateX(360deg) rotateY(180deg) rotateZ(180deg);}100%{transform:rotateX(720deg) rotateY(720deg) rotateZ(360deg);}}
          .cube-face{position:absolute;width:38px;height:38px;background:#FFF;border:1.5px solid #CBD5E1;border-radius:7px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:2px;box-shadow:inset 0 0 5px rgba(0,0,0,0.15);}
          .pip{width:6px;height:6px;background:#0F172A;border-radius:50%;margin:auto;}
          .face-1{transform:rotateY(0deg) translateZ(19px);}
          .face-6{transform:rotateY(180deg) translateZ(19px);}
          .face-2{transform:rotateY(-90deg) translateZ(19px);}
          .face-4{transform:rotateY(90deg) translateZ(19px);}
          .face-3{transform:rotateX(90deg) translateZ(19px);}
          .face-5{transform:rotateX(-90deg) translateZ(19px);}
          .dice-sum-badge{background:linear-gradient(135deg,var(--gold),#D97706);color:#0F172A;font-size:0.85rem;font-weight:900;padding:2px 12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.4);transition:transform 0.2s;}
          .btn-roll{background:linear-gradient(135deg,var(--gold),#D97706);border:none;color:#0F172A;font-size:0.92rem;font-weight:900;padding:6px 20px;border-radius:24px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 15px rgba(245,158,11,0.4);}
          .btn-roll:disabled{background:#475569;color:#94A3B8;cursor:not-allowed;box-shadow:none;}
          .event-log{width:100%;height:42px;background:rgba(0,0,0,0.45);border-radius:6px;padding:3px 6px;font-size:0.65rem;color:#CBD5E1;overflow-y:auto;text-align:start;border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column-reverse;}
          .log-entry{margin-bottom:2px;}
          .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
          .modal-overlay.show{opacity:1;pointer-events:auto;}
          .modal-card{background:#1E293B;border:2px solid var(--gold);border-radius:14px;width:100%;max-width:320px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;text-align:center;max-height:90vh;overflow-y:auto;}
          .modal-hdr{width:100%;padding:6px;border-radius:8px;color:#FFF;font-size:1rem;font-weight:900;margin-bottom:10px;}
          .modal-body{width:100%;font-size:0.82rem;color:#E2E8F0;margin-bottom:12px;display:flex;flex-direction:column;gap:5px;}
          .modal-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
          .modal-actions{display:flex;gap:6px;width:100%;}
          .btn-m{flex:1;padding:8px;border-radius:8px;font-weight:bold;font-size:0.82rem;cursor:pointer;border:none;}
          .btn-green{background:linear-gradient(135deg,#10B981,#059669);color:#FFF;}
          .btn-blue{background:linear-gradient(135deg,#38BDF8,#0284C7);color:#FFF;}
          .btn-gold{background:linear-gradient(135deg,var(--gold),#D97706);color:#0F172A;font-weight:900;}
          .btn-red{background:linear-gradient(135deg,#EF4444,#B91C1C);color:#FFF;}
          .btn-gray{background:#374151;color:#CBD5E1;}
          .settings-grp{width:100%;background:#162032;border-radius:8px;padding:6px;margin-bottom:6px;text-align:start;border:1px solid rgba(255,255,255,0.05);}
          .settings-t{font-size:0.75rem;font-weight:bold;color:var(--gold);margin-bottom:4px;}
          .pills{display:flex;gap:4px;flex-wrap:wrap;}
          .btn-pill{background:#2D3748;border:1px solid #4B5563;color:#CBD5E1;padding:3px 7px;border-radius:6px;font-size:0.7rem;font-weight:bold;cursor:pointer;}
          .btn-pill.active{background:var(--gold);color:#0F172A;border-color:#D97706;}
          .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;}
          .avatar-opt{background:#243048;border:2px solid transparent;border-radius:6px;font-size:1.3rem;padding:3px;cursor:pointer;text-align:center;}
          .avatar-opt.active{border-color:var(--gold);background:#324263;}
          .mort-item{display:flex;justify-content:space-between;align-items:center;width:100%;background:#162032;padding:5px;border-radius:6px;margin-bottom:4px;font-size:0.73rem;}
          </style>
          </head>
          <body>

          <div class="header">
              <div class="header-title"><span>👑</span><span id="txtAppTitle">مونوبولي العرب</span></div>
              <div class="header-controls">
                  <button id="btnMode" class="btn-hdr" onclick="toggleMode()"><span id="txtMode">🤖 ضد الكمبيوتر</span></button>
                  <button class="btn-hdr" onclick="openSettingsModal()">⚙️</button>
              </div>
          </div>

          <div class="scoreboard">
              <div id="pCard0" class="p-card active" onclick="openMortgageModal()">
                  <div id="turnBadge0" class="turn-badge">دورك الآن</div>
                  <div class="p-info">
                      <div id="avP0" class="p-avatar">🦁</div>
                      <div class="p-meta"><span id="nameP0" class="p-name">اللاعب 1</span><span id="cashP0" class="p-cash">1500$</span></div>
                  </div>
                  <div style="font-size:0.65rem; color:var(--dim); text-align:end;">
                      <div id="propsP0">عقارات: 0</div>
                      <div id="mortP0" style="color:#EF4444; font-size:0.58rem;"></div>
                  </div>
              </div>
              <div id="pCard1" class="p-card" onclick="openMortgageModal()">
                  <div id="turnBadge1" class="turn-badge" style="display:none;">دور الخصم</div>
                  <div class="p-info">
                      <div id="avP1" class="p-avatar">🦅</div>
                      <div class="p-meta"><span id="nameP1" class="p-name">الصقر (الذكاء)</span><span id="cashP1" class="p-cash">1500$</span></div>
                  </div>
                  <div style="font-size:0.65rem; color:var(--dim); text-align:end;">
                      <div id="propsP1">عقارات: 0</div>
                      <div id="mortP1" style="color:#EF4444; font-size:0.58rem;"></div>
                  </div>
              </div>
          </div>

          <div id="board" class="board-wrapper">
              <div class="board-center">
                  <div class="center-watermark">MONOPOLY</div>
                  <div id="turnAnnouncer" class="turn-announcer">دور: 🦁 اللاعب 1</div>
                  <div class="dice-area">
                      <div class="dice-container">
                          <div id="die1" class="cube-die">
                              <div class="cube-face face-1"><div class="pip" style="grid-area:2/2;"></div></div>
