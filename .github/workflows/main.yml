          function getTileName(tile) {
              if (tile.type === "property") {
                  if (Game.lang === 'ar') return ARABIC_CITIES[tile.id] || tile.nameAr;
                  if (EUROPEAN_LANGS.includes(Game.lang)) return EUROPEAN_CITIES[tile.id] || tile.nameEn;
                  if (ASIAN_LANGS.includes(Game.lang)) return ASIAN_CITIES[tile.id] || tile.nameEn;
                  return tile.nameAr;
              }
              return Game.lang === 'ar' ? tile.nameAr : tile.nameEn;
          }

          function hasSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  return !!(data && data.players && data.players.length > 0 && !data.isGameOver);
              } catch(e) {
                  return false;
              }
          }

          function saveCurrentGame() {
              try {
                  const saveData = {
                      savedAt: Date.now(),
                      isGameOver: Game.isGameOver,
                      turn: Game.turn,
                      doublesInRow: Game.doublesInRow,
                      startCash: Game.startCash,
                      difficulty: Game.difficulty,
                      mode: Game.mode,
                      diceSpeed: Game.diceSpeed,
                      moveSpeed: Game.moveSpeed,
                      propStyle: Game.propStyle,
                      theme: Game.theme,
                      lang: Game.lang,
                      is3D: Game.is3D,
                      isLandscape: Game.isLandscape,
                      players: JSON.parse(JSON.stringify(Game.players)),
                      tiles: BOARD_TILES.map(t => ({ id: t.id, owner: t.owner, mortgaged: t.mortgaged, floors: t.floors }))
                  };
                  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                  return true;
              } catch(e) {
                  return false;
              }
          }

          function loadSavedGame() {
              try {
                  const raw = localStorage.getItem(SAVE_KEY);
                  if (!raw) return false;
                  const data = JSON.parse(raw);
                  if (!data || !data.players) return false;

                  Game.turn = data.turn ?? 0;
                  Game.doublesInRow = data.doublesInRow ?? 0;
                  if (data.startCash) Game.startCash = data.startCash;
                  if (data.difficulty) Game.difficulty = data.difficulty;
                  if (data.mode) Game.mode = data.mode;
                  if (data.diceSpeed) Game.diceSpeed = data.diceSpeed;
                  if (data.moveSpeed) Game.moveSpeed = data.moveSpeed;
                  if (data.propStyle) Game.propStyle = data.propStyle;
                  if (data.theme) setTheme(data.theme);
                  if (data.lang) setLanguage(data.lang);
                  if (data.is3D !== undefined) { Game.is3D = !data.is3D; toggle3DView(); }
                  if (data.isLandscape) toggleOrientation();

                  Game.players = data.players;
                  if (data.tiles) {
                      data.tiles.forEach(st => {
                          const t = BOARD_TILES.find(x => x.id === st.id);
                          if (t) {
                              t.owner = st.owner;
                              t.mortgaged = st.mortgaged;
                              t.floors = st.floors || 0;
                          }
                      });
                  }

                  updateBoardVisual();
                  updatePawns();
                  updateUI();
                  return true;
              } catch(e) {
                  return false;
              }
          }

          function showStartModal() {
              const btnCont = document.getElementById("btnContinueGame");
              const statusTxt = document.getElementById("savedGameStatus");
              const canContinue = hasSavedGame();

              if (canContinue) {
                  btnCont.disabled = false;
                  btnCont.style.opacity = "1";
                  btnCont.style.cursor = "pointer";
                  btnCont.classList.remove("btn-gray");
                  btnCont.classList.add("btn-blue");
                  try {
                      const d = JSON.parse(localStorage.getItem(SAVE_KEY));
                      const dt = d.savedAt ? new Date(d.savedAt).toLocaleDateString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : "";
                      statusTxt.innerText = dt ? `يوجد لعبة محفوظة بتاريخ: ${dt}` : "يوجد لعبة سابقة محفوظة جاهزة للإكمال.";
                  } catch(e) {
                      statusTxt.innerText = "يوجد لعبة سابقة محفوظة جاهزة للإكمال.";
                  }
              } else {
                  btnCont.disabled = true;
                  btnCont.style.opacity = "0.45";
                  btnCont.style.cursor = "not-allowed";
                  btnCont.classList.remove("btn-blue");
                  btnCont.classList.add("btn-gray");
                  statusTxt.innerText = "لا توجد لعبة سابقة محفوظة حتى الآن.";
              }
              document.getElementById("startModal").classList.add("show");
          }

