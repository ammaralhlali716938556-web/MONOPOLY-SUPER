          function updateBoardVisual() {
              const jailTile = document.getElementById("tile-10");
              if (jailTile) {
                  const existingBars = jailTile.querySelector(".jail-bars-overlay");
                  const someoneJailed = Game.players.some(p => p.inJail);
                  if (someoneJailed) {
