                          <div class="info-rule-item"><strong>${isAr?"إيجار الاحتكار للمجموعة:":"Monopoly Rent:"}</strong> <span style="color:var(--gold); font-weight:bold;">${monoRent}$</span></div>
                          <div class="info-rule-item"><strong>${isAr?"الإيجار الحالي الفعلي:":"Current Total Rent:"}</strong> <span style="color:#10B981; font-weight:900; font-size:0.90rem;">${curRent}$</span></div>
                          <div class="info-rule-item"><strong>${isAr?"قيمة الرهن:":"Mortgage Value:"}</strong> <span>${mortVal}$</span></div>
