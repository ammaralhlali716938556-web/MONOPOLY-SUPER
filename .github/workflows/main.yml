name: Build Monopoly Arabia APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🎲 بناء تطبيق مونوبولي العرب (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات لعبة مونوبولي العرب تلقائياً
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonopolyArabia"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.monopoly.arabia'
              compileSdk 34
              defaultConfig {
                  applicationId "com.monopoly.arabia"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          """

          # 5. AndroidManifest.xml
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_monopoly"
                  android:roundIcon="@drawable/ic_monopoly"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MonopolyArabia">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">مونوبولي العرب</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0E14</color>
              <color name="gold">#F59E0B</color>
              <color name="gold_dark">#D97706</color>
          </resources>
          """

          # 8. Themes
          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MonopolyArabia" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/gold</item>
                  <item name="colorPrimaryVariant">@color/gold_dark</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
                  <item name="android:windowBackground">@color/bg_main</item>
              </style>
          </resources>
          """

          # 9. App Icon
          files["app/src/main/res/drawable/ic_monopoly.xml"] = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#0B0E14" android:pathData="M50,4 C75.4,4 96,24.6 96,50 C96,75.4 75.4,96 50,96 C24.6,96 4,75.4 4,50 C4,24.6 24.6,4 50,4 Z" />
              <path android:fillColor="#F59E0B" android:pathData="M50,10 L86,30 L86,70 L50,90 L14,70 L14,30 Z" />
              <path android:fillColor="#1E293B" android:pathData="M50,16 L80,33 L80,67 L50,84 L20,67 L20,33 Z" />
              <path android:fillColor="#FBBF24" android:pathData="M32,38 L40,55 L50,42 L60,55 L68,38 L68,64 L32,64 Z" />
              <path android:fillColor="#EF4444" android:pathData="M50,55 C53,55 55,57 55,60 C55,63 53,65 50,65 C47,65 45,63 45,60 C45,57 47,55 50,55 Z" />
          </vector>
          """

          # 10. Layout
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg_main" />
          </FrameLayout>
          """

          # 11. MainActivity.java
          files["app/src/main/java/com/monopoly/arabia/MainActivity.java"] = """package com.monopoly.arabia;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          """

          # 12. Full Game HTML / CSS / JS Assets
          files["app/src/main/assets/index.html"] = """
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
          <title>مونوبولي العرب • بنك الحظ الملكي</title>
          <style>
          :root{--bg-m:#0B0E14;--bg-b:#121722;--bg-t:#1A202E;--gold:#F59E0B;--gold-l:#FDE68A;--gold-d:#D97706;--txt:#F8FAFC;--p1:#EF4444;--p2:#38BDF8;}
          *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
          body{background:var(--bg-m);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:4px;overflow-x:hidden;}
          .header{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:linear-gradient(135deg,#1E293B,#0F172A);border-radius:12px;border:1px solid rgba(245,158,11,0.3);margin-bottom:4px;}
          .header-t{display:flex;align-items:center;gap:6px;font-size:0.92rem;font-weight:900;color:var(--gold);}
          .btn-h{background:#2D3748;border:1px solid #4B5563;color:#E2E8F0;padding:4px 8px;border-radius:8px;font-size:0.75rem;font-weight:bold;cursor:pointer;}
          .btn-h.active{background:var(--gold);color:#0F172A;border-color:var(--gold-d);}
          .scoreboard{width:100%;max-width:500px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px;}
          .p-card{background:#161D2B;border:2px solid #2B3548;border-radius:10px;padding:5px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;}
          .p-card.active{border-color:var(--gold);box-shadow:0 0 14px rgba(245,158,11,0.35);background:linear-gradient(135deg,#1C2436,#232D42);}
          .p-info{display:flex;align-items:center;gap:8px;}
          .p-av{font-size:1.5rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid transparent;}
          .p1-av{border-color:var(--p1);}.p2-av{border-color:var(--p2);}
          .p-name{font-size:0.75rem;font-weight:bold;max-width:95px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
          .p-cash{font-size:0.95rem;font-weight:900;color:#10B981;}
          .turn-badge{position:absolute;top:-6px;left:8px;background:var(--gold);color:#000;font-size:0.56rem;font-weight:900;padding:1px 6px;border-radius:10px;}
          .board-wrapper{width:100%;max-width:500px;aspect-ratio:1/1;position:relative;background:var(--bg-b);border-radius:14px;border:3px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,0.7);display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:2px;padding:2px;margin-bottom:4px;}
          .tile{background:var(--bg-t);border-radius:4px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;overflow:visible!important;}
          .tile-bar{width:100%;height:5px;border-radius:2px;flex-shrink:0;}
          .tile-cnt{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-grow:1;pointer-events:none;}
          .tile-name{font-size:0.52rem;font-weight:800;text-align:center;line-height:1.15;color:var(--txt);word-break:break-word;padding:0 1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
          .tile-price{font-size:0.5rem;font-weight:900;color:var(--gold-l);background:rgba(0,0,0,0.5);padding:1px 3px;border-radius:3px;border:1px solid rgba(245,158,11,0.2);}
          .corner-tile{background:#1B2333;border:1px solid rgba(245,158,11,0.4);justify-content:center;gap:2px;}
          .corner-tile .tile-name{font-size:0.54rem;color:var(--gold);font-weight:900;}
          .mort-tag{position:absolute;top:2px;background:#DC2626;color:#FFF;font-size:0.45rem;font-weight:900;padding:1px 3px;border-radius:3px;z-index:8;}
          .tile.mortgaged{opacity:0.65;filter:grayscale(0.5);}
          .own-badge{position:absolute;top:1px;right:1px;font-size:0.7rem;border-radius:50%;background:rgba(0,0,0,0.8);padding:1px;z-index:7;}
          .own-glow-0{box-shadow:0 0 8px var(--p1),inset 0 0 5px var(--p1)!important;border-color:var(--p1)!important;}
          .own-glow-1{box-shadow:0 0 8px var(--p2),inset 0 0 5px var(--p2)!important;border-color:var(--p2)!important;}
          .own-tint-0{background:linear-gradient(135deg,rgba(239,68,68,0.25),#1A202E)!important;border-color:var(--p1)!important;}
          .own-tint-1{background:linear-gradient(135deg,rgba(56,189,248,0.25),#1A202E)!important;border-color:var(--p2)!important;}
          .own-border-0{border:2px solid var(--p1)!important;}
          .own-border-1{border:2px solid var(--p2)!important;}
          .tile-pawns{position:absolute;display:flex;gap:2px;z-index:25;pointer-events:none;}
          .pw-b{top:-12px;left:50%;transform:translateX(-50%);}
          .pw-t{bottom:-12px;left:50%;transform:translateX(-50%);}
          .pw-l{right:-12px;top:50%;transform:translateY(-50%);}
          .pw-r{left:-12px;top:50%;transform:translateY(-50%);}
          .pw-c0{top:-8px;left:-8px;} .pw-c10{top:-8px;right:-8px;} .pw-c20{bottom:-8px;right:-8px;} .pw-c30{bottom:-8px;left:-8px;}
          .pawn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.85rem;box-shadow:0 4px 10px rgba(0,0,0,0.9);border:2px solid #FFF;}
          .pawn-0{background:radial-gradient(circle,#EF4444,#991B1B);box-shadow:0 0 8px rgba(239,68,68,0.8);}
          .pawn-1{background:radial-gradient(circle,#38BDF8,#0369A1);box-shadow:0 0 8px rgba(56,189,248,0.8);}
          .board-center{grid-column:2/span 9;grid-row:2/span 9;background:radial-gradient(circle at center,#1E2738,#0C121D);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 6px;position:relative;border:1px solid rgba(245,158,11,0.25);overflow:hidden;}
          .watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:3.2rem;opacity:0.04;font-weight:900;pointer-events:none;}
          .turn-announcer{background:rgba(15,23,42,0.85);border:1px solid var(--gold);padding:3px 12px;border-radius:20px;font-size:0.74rem;font-weight:bold;color:var(--gold);}
          .dice-box{display:flex;gap:16px;align-items:center;justify-content:center;margin:6px 0 2px;perspective:500px;}
          .d-cube{width:42px;height:42px;position:relative;transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.2,0.8,0.3,1.2);}
          .d-cube.rolling{animation:dTumble 0.5s infinite linear;}
          @keyframes dTumble{0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}50%{transform:rotateX(270deg) rotateY(270deg) rotateZ(180deg);}100%{transform:rotateX(720deg) rotateY(360deg) rotateZ(360deg);}}
          .d-face{position:absolute;width:42px;height:42px;background:#FFF;border:2px solid #CBD5E1;border-radius:8px;display:grid;padding:4px;box-sizing:border-box;box-shadow:inset 0 0 4px rgba(0,0,0,0.2),0 3px 6px rgba(0,0,0,0.4);}
          .pip{width:7px;height:7px;background:#0F172A;border-radius:50%;display:inline-block;}
          .f-1{transform:rotateY(0deg) translateZ(21px);display:flex;align-items:center;justify-content:center;}.f-1 .pip{background:#EF4444;width:10px;height:10px;}
          .f-2{transform:rotateY(180deg) translateZ(21px);display:flex;justify-content:space-between;}.f-2 .pip:nth-child(2){align-self:flex-end;}
          .f-3{transform:rotateY(-90deg) translateZ(21px);display:flex;justify-content:space-between;}.f-3 .pip:nth-child(2){align-self:center;}.f-3 .pip:nth-child(3){align-self:flex-end;}
          .f-4{transform:rotateY(90deg) translateZ(21px);display:flex;flex-direction:column;justify-content:space-between;}
          .f-5{transform:rotateX(90deg) translateZ(21px);display:flex;flex-direction:column;justify-content:space-between;}
          .f-6{transform:rotateX(-90deg) translateZ(21px);display:flex;flex-direction:column;justify-content:space-between;}
          .prow{display:flex;justify-content:space-between;}
          .dice-sum-badge{background:rgba(15,23,42,0.9);border:1px solid var(--gold);color:var(--gold-l);font-size:0.82rem;font-weight:900;padding:2px 10px;border-radius:12px;box-shadow:0 0 10px rgba(245,158,11,0.3);}
          .btn-roll{background:linear-gradient(135deg,#F59E0B,#D97706);border:none;color:#0F172A;font-size:0.92rem;font-weight:900;padding:8px 26px;border-radius:24px;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,0.4);display:flex;align-items:center;gap:6px;}
          .btn-roll:disabled{background:#475569;color:#94A3B8;box-shadow:none;cursor:not-allowed;}
          .btn-q{background:#1E293B;border:1px solid #334155;color:#CBD5E1;padding:3px 8px;border-radius:6px;font-size:0.65rem;font-weight:bold;cursor:pointer;}
          .event-log{width:100%;height:48px;background:rgba(0,0,0,0.45);border-radius:6px;padding:4px 8px;font-size:0.64rem;color:#CBD5E1;overflow-y:auto;text-align:right;border:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column-reverse;margin-top:4px;}
          .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:14px;opacity:0;pointer-events:none;transition:opacity 0.25s ease;}
          .modal-overlay.show{opacity:1;pointer-events:auto;}
          .modal-card{background:#1E293B;border:2px solid var(--gold);border-radius:16px;width:100%;max-width:330px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;text-align:center;max-height:85vh;overflow-y:auto;}
          .m-title{width:100%;padding:8px;border-radius:8px;color:#FFF;font-size:1.05rem;font-weight:900;margin-bottom:10px;}
          .m-body{width:100%;font-size:0.82rem;color:#E2E8F0;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;}
          .m-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.08);}
          .m-act{display:flex;gap:8px;width:100%;}
          .btn-p{flex:1;background:linear-gradient(135deg,#10B981,#059669);border:none;color:#FFF;padding:9px;border-radius:10px;font-weight:bold;font-size:0.85rem;cursor:pointer;}
          .btn-s{flex:1;background:#374151;border:none;color:#E2E8F0;padding:9px;border-radius:10px;font-weight:bold;font-size:0.85rem;cursor:pointer;}
          .btn-auc{flex:1;background:linear-gradient(135deg,#F59E0B,#D97706);border:none;color:#0F172A;padding:9px;border-radius:10px;font-weight:900;font-size:0.85rem;cursor:pointer;}
          .s-sec{width:100%;text-align:right;margin-bottom:8px;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;}
          .s-lbl{font-size:0.74rem;font-weight:bold;color:var(--gold);margin-bottom:6px;display:block;}
          .s-opts{display:flex;gap:4px;flex-wrap:wrap;}
          .btn-opt{background:#2D3748;border:1px solid #4B5563;color:#CBD5E1;padding:4px 8px;border-radius:6px;font-size:0.68rem;cursor:pointer;flex:1;min-width:60px;text-align:center;}
          .btn-opt.sel{background:var(--gold);color:#0F172A;border-color:var(--gold-d);font-weight:900;}
          .av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;}
          .av-btn{font-size:1.3rem;padding:4px;background:#2D3748;border-radius:8px;border:2px solid transparent;cursor:pointer;}
          .av-btn.sel{border-color:var(--gold);background:#3B4252;}
          .m-list{max-height:200px;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
          .m-item{background:#0F172A;border:1px solid #334155;padding:6px 8px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;}
          .cnt-box{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0;}
          .cnt-val{font-size:1.4rem;font-weight:900;color:var(--gold);min-width:90px;}
          .btn-cnt{background:#334155;border:none;color:#FFF;width:32px;height:32px;border-radius:6px;font-size:1.1rem;font-weight:900;cursor:pointer;}
          html[dir="ltr"] .header-t,html[dir="ltr"] .event-log,html[dir="ltr"] .s-sec{text-align:left;}
          </style>
          </head>
          <body>

          <div class="header">
            <div class="header-t"><span>👑</span><span id="appT">مونوبولي العرب • بنك الحظ</span></div>
            <div style="display:flex;gap:6px;">
              <button id="btnMode" class="btn-h active" onclick="toggleMode()">🤖 ضد الكمبيوتر</button>
              <button class="btn-h" onclick="openModal('settingsModal')">⚙️</button>
            </div>
          </div>

          <div class="scoreboard">
            <div id="pCard0" class="p-card active">
              <div id="tBadge0" class="turn-badge">دورك الآن</div>
              <div class="p-info">
                <div id="pAv0" class="p-av p1-av">🦁</div>
                <div><div id="pN0" class="p-name">أبو أسد</div><div id="pC0" class="p-cash">1500$</div></div>
              </div>
              <div id="pP0" style="font-size:0.65rem;color:#94A3B8;">عقارات: 0</div>
            </div>
            <div id="pCard1" class="p-card">
              <div id="tBadge1" class="turn-badge" style="display:none;">دور الكمبيوتر</div>
              <div class="p-info">
                <div id="pAv1" class="p-av p2-av">🦅</div>
                <div><div id="pN1" class="p-name">الصقر (الذكاء)</div><div id="pC1" class="p-cash">1500$</div></div>
              </div>
              <div id="pP1" style="font-size:0.65rem;color:#94A3B8;">عقارات: 0</div>
            </div>
          </div>

          <div id="board" class="board-wrapper">
