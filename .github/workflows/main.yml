          const PROPERTY_INDICES = BOARD_TILES.filter(t => t.type === "property").map(t => t.id);

          const I18N = {
              ar: { app:"MONOPOLY PRO", turn:"دورك", opp:"دور الخصم", roll:"ارمي النرد", buy:"شراء", auction:"مزاد علني", trade:"مقايضة", myProps:"عقاراتي", passGo:"مررت بنقطة الانطلاق وحصلت على 200$!", p:"عقارات", m:"مرهون", robot:"روبوت", build:"بناء طابق", maxBld:"مكتمل (برج إيفل)" },
              en: { app:"MONOPOLY PRO", turn:"Your Turn", opp:"Opponent Turn", roll:"Roll Dice", buy:"Buy", auction:"Auction", trade:"Trade", myProps:"My Properties", passGo:"Passed GO! Collected 200$!", p:"Props", m:"Mortgaged", robot:"Robot", build:"Build Floor", maxBld:"Max (Eiffel Tower)" },
              zh: { app:"MONOPOLY PRO", turn:"你的回合", opp:"对手回合", roll:"掷骰子", buy:"购买", auction:"拍卖", trade:"交易", myProps:"我的资产", passGo:"通过起点，获得200$!", p:"地产", m:"已抵押", robot:"机器人", build:"加建楼层", maxBld:"终极 (埃菲尔铁塔)" },
              fr: { app:"MONOPOLY PRO", turn:"Votre Tour", opp:"Tour Adverse", roll:"Lancer Dé", buy:"Acheter", auction:"Enchère", trade:"Échanger", myProps:"Propriétés", passGo:"Départ franchi! +200$!", p:"Biens", m:"Hypothéqué", robot:"Robot", build:"Bâtir Étage", maxBld:"Max (Tour Eiffel)" },
