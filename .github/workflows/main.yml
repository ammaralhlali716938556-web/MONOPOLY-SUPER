                  } else { el.style.color = ""; }
              });
          }
          
          function logEvent(msg) {
              const el = document.getElementById("gameLog");
              el.innerText = msg;
          }
          
          function calculateRent(tile) {
              if (tile.type === "railroad") {
                  const cnt = BOARD_TILES.filter(t => t.type === "railroad" && t.owner === tile.owner).length;
                  return 25 * Math.pow(2, cnt - 1);
              }
              if (tile.type === "utility") {
                  const cnt = BOARD_TILES.filter(t => t.type === "utility" && t.owner === tile.owner).length;
                  return cnt === 2 ? 50 : 20;
              }
              const groupTiles = BOARD_TILES.filter(t => t.group === tile.group);
              const hasMonopoly = groupTiles.every(t => t.owner === tile.owner);
          
              const baseRent = Math.round(tile.price * 0.20);
              const floorCost = Math.round(tile.price * 0.33);
              const floorRentBonus = Math.round(floorCost * 0.50);
          
              if (hasMonopoly) {
                  if (tile.floors && tile.floors > 0) {
                      return Math.round(tile.price * 0.40) + (tile.floors * floorRentBonus);
                  }
                  return Math.round(tile.price * 0.40);
              }
              return baseRent;
          }
          
          function canBuildFloor(tileId, playerId) {
              const t = BOARD_TILES[tileId];
              if (!t || t.type !== "property") return { ok: false, reason: "not_property" };
              if (t.owner !== playerId) return { ok: false, reason: "not_owner" };
              const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
              if (!groupTiles.every(x => x.owner === playerId)) return { ok: false, reason: "monopolyRequired" };
              if (groupTiles.some(x => x.mortgaged)) return { ok: false, reason: "groupMortgaged" };
              const curFloors = t.floors || 0;
              if (curFloors >= 5) return { ok: false, reason: "maxFloors" };
              const minFloors = Math.min(...groupTiles.map(x => x.floors || 0));
              if (curFloors > minFloors) return { ok: false, reason: "evenBuildNotice", minFloors };
              const cost = Math.round(t.price * 0.33);
              const player = Game.players[playerId];
              if (player.money < cost) return { ok: false, reason: "notEnoughCash", cost };
              return { ok: true, cost };
          }
          
          function canDemolishFloor(tileId, playerId) {
              const t = BOARD_TILES[tileId];
              if (!t || t.type !== "property") return { ok: false, reason: "not_property" };
              if (t.owner !== playerId) return { ok: false, reason: "not_owner" };
              const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
              const curFloors = t.floors || 0;
              if (curFloors <= 0) return { ok: false, reason: "noFloors" };
              const maxFloors = Math.max(...groupTiles.map(x => x.floors || 0));
              if (curFloors < maxFloors) return { ok: false, reason: "evenDemoNotice", maxFloors };
              const cost = Math.round(t.price * 0.33);
              const refund = Math.round(cost * 0.50);
              return { ok: true, refund };
          }
          
          function buildFloor(tileId, playerId) {
              const pId = (playerId !== undefined) ? playerId : Game.turn;
              const chk = canBuildFloor(tileId, pId);
              if (!chk.ok) {
                  logEvent("⚠️ " + (I18N[Game.lang][chk.reason] || I18N[Game.lang].evenBuildNotice));
                  return;
              }
              const t = BOARD_TILES[tileId];
              const p = Game.players[pId];
              p.money -= chk.cost;
              t.floors = (t.floors || 0) + 1;
              AudioFX.play('cash');
              updateBoardVisual();
              updateUI();
              if (t.floors === 5) {
                  logEvent(`🗼 ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'أكمل بناء برج إيفل الذهبي في':'completed Golden Eiffel Tower in'} (${getTileName(t.id, Game.lang)})!`);
              } else {
                  logEvent(`🏗️ ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'بنى الطابق':'built floor'} ${t.floors} (ليموني) ${Game.lang==='ar'?'في':'in'} (${getTileName(t.id, Game.lang)}) مقابل ${chk.cost}$.`);
              }
              const tm = document.getElementById("tileInfoModal");
              if (tm && tm.classList.contains("show")) openTileInfoModal(tileId);
          }
          
          function demolishFloor(tileId, playerId) {
              const pId = (playerId !== undefined) ? playerId : Game.turn;
              const chk = canDemolishFloor(tileId, pId);
              if (!chk.ok) {
                  logEvent("⚠️ " + (I18N[Game.lang][chk.reason] || I18N[Game.lang].evenDemoNotice));
                  return;
              }
              const t = BOARD_TILES[tileId];
              const p = Game.players[pId];
              p.money += chk.refund;
              t.floors--;
              AudioFX.play('cash');
              updateBoardVisual();
              updateUI();
              logEvent(`🔨 ${p.avatar} ${p.nameAr} ${Game.lang==='ar'?'هدم طابقاً من':'demolished floor from'} (${getTileName(t.id, Game.lang)}) واسترد ${chk.refund}$.`);
              const tm = document.getElementById("tileInfoModal");
              if (tm && tm.classList.contains("show")) openTileInfoModal(tileId);
          }
          
          function checkAIBuilding() {
              if (Game.mode !== 'ai' || Game.turn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';
              const minBuffer = diff === 'very_hard' ? 40 : (diff === 'hard' ? 120 : (diff === 'medium' ? 250 : 500));
          
              const monoGroups = [];
              const groups = ['brown', 'lightblue', 'pink', 'orange', 'red', 'yellow', 'green', 'darkblue'];
              groups.forEach(g => {
                  const gTiles = BOARD_TILES.filter(t => t.group === g);
                  if (gTiles.length > 0 && gTiles.every(t => t.owner === 1)) {
                      monoGroups.push(g);
                  }
              });
          
              for (const group of monoGroups) {
                  const groupTiles = BOARD_TILES.filter(t => t.group === group);
                  if (groupTiles.some(t => t.mortgaged)) continue;
                  const minFloors = Math.min(...groupTiles.map(t => t.floors || 0));
                  if (minFloors >= 5) continue;
          
                  for (const t of groupTiles) {
                      const cost = Math.round(t.price * 0.33);
                      if ((t.floors || 0) === minFloors && ai.money >= cost + minBuffer) {
                          buildFloor(t.id, 1);
                          return;
                      }
                  }
              }
          }
          
          function checkAIStrategicFinance() {
              if (Game.mode !== 'ai' || Game.turn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';
          
              if (diff === 'very_hard') {
                  if (ai.money >= 350) {
                      const mortgagedProps = ai.props.map(id => BOARD_TILES[id]).filter(t => t && t.mortgaged);
                      for (const t of mortgagedProps) {
                          const unmortCost = Math.floor(Math.floor(t.price * 0.5) * 1.1);
                          if (ai.money >= unmortCost + 120) {
                              ai.money -= unmortCost;
                              t.mortgaged = false;
                              AudioFX.play('cash');
                              logEvent(`🏦 فك ${ai.avatar} ${ai.nameAr} رهن عقار (${getTileName(t.id, Game.lang)}) لاستئناف تحصيل الإيجارات.`);
                              updateUI();
                              break;
                          }
                      }
                  }
          
                  if (ai.money < 70) {
                      const singleProps = ai.props.map(id => BOARD_TILES[id]).filter(t => !t.mortgaged && (!t.floors || t.floors === 0));
                      for (const t of singleProps) {
                          const groupTiles = BOARD_TILES.filter(x => x.group === t.group);
                          const hasMono = groupTiles.every(x => x.owner === 1);
                          if (!hasMono) {
                              t.mortgaged = true;
                              const val = Math.floor(t.price * 0.5);
                              ai.money += val;
                              logEvent(`🏦 رهن ${ai.avatar} ${ai.nameAr} (${getTileName(t.id, Game.lang)}) لتأمين سيولة دفاعية.`);
                              updateUI();
                              break;
                          }
                      }
                  }
              }
          }
          
          function rollDice() {
              if (Game.isRolling || Game.isGameOver) return;
              const cur = Game.players[Game.turn];
              if (cur.inJail) {
                  if (Game.turn === 0 || Game.mode === 'pvp') {
                      openJailModal();
                  } else {
                      handleAIJailDecision(cur);
                  }
                  return;
              }
          
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;
          
              const d0 = document.getElementById("die0");
              const d1 = document.getElementById("die1");
              d0.classList.add("rolling");
              d1.classList.add("rolling");
              AudioFX.play('dice');
          
              const dur = Game.diceSpeed === "v_slow" ? 1400 : (Game.diceSpeed === "slow" ? 900 : (Game.diceSpeed === "fast" ? 250 : (Game.diceSpeed === "v_fast" ? 100 : 500)));
              setTimeout(() => {
                  d0.classList.remove("rolling");
                  d1.classList.remove("rolling");
          
                  const val0 = Math.floor(Math.random() * 6) + 1;
                  const val1 = Math.floor(Math.random() * 6) + 1;
                  setDieFace(d0, val0);
                  setDieFace(d1, val1);
          
                  const sum = val0 + val1;
                  const isDbl = (val0 === val1);
                  logEvent(`${cur.avatar} ${cur.nameAr} ${I18N[Game.lang].rolled} ${sum} (${val0}+${val1})${isDbl ? " 🔥 متطابق!" : ""}`);
          
                  if (isDbl) {
                      Game.doublesInRow++;
                      if (Game.doublesInRow >= 3) {
                          Game.doublesInRow = 0;
                          logEvent(`🚔 3 رميات متطابقة! أُرسل ${cur.nameAr} إلى السجن.`);
                          sendToJail(cur, () => finishTurn(false));
                          return;
                      }
                  } else { Game.doublesInRow = 0; }
          
                  moveSteps(cur, sum, isDbl);
              }, dur);
          }
          
          function handleAIJailDecision(cur) {
              const diff = Game.aiDifficulty || 'medium';
              if (diff === 'very_hard') {
                  const humanPlayer = Game.players[0];
                  const humanDanger = humanPlayer.props.some(id => {
                      const t = BOARD_TILES[id];
                      return t && ((t.floors || 0) > 0 || (t.type === 'railroad' && humanPlayer.props.filter(x => BOARD_TILES[x].type === 'railroad').length >= 3));
                  });
          
                  if (humanDanger) {
                      rollForJail();
                      return;
                  }
                  if (cur.money >= 100) {
                      payJailFine();
                  } else {
                      rollForJail();
                  }
              } else if (diff === 'hard') {
                  if (cur.money >= 150) payJailFine();
                  else rollForJail();
              } else if (diff === 'easy') {
                  if (cur.money >= 600) payJailFine();
                  else rollForJail();
              } else {
                  if (cur.money >= 300) payJailFine();
                  else rollForJail();
              }
          }
          
          function setDieFace(dieEl, val) {
              const rot = {
                  1: "rotateX(0deg) rotateY(0deg)",
                  6: "rotateY(180deg)",
                  2: "rotateY(90deg)",
                  5: "rotateY(-90deg)",
                  3: "rotateX(-90deg)",
                  4: "rotateX(90deg)"
              };
              dieEl.style.transform = rot[val];
          }
          
          function moveSteps(player, steps, isDbl) {
              let rem = steps;
              const iv = Game.moveSpeed === "v_slow" ? 350 : (Game.moveSpeed === "slow" ? 200 : (Game.moveSpeed === "fast" ? 60 : (Game.moveSpeed === "v_fast" ? 20 : 120)));
              const t = setInterval(() => {
                  player.pos = (player.pos + 1) % 40;
                  AudioFX.play('step');
                  updatePawns(player.id);
                  if (player.pos === 0) {
                      player.money += 200;
                      AudioFX.play('cash');
                      logEvent(`🏁 ${player.avatar} ${player.nameAr}: ${I18N[Game.lang].passGo}`);
                      updateUI();
                  }
                  rem--;
                  if (rem <= 0) {
                      clearInterval(t);
                      setTimeout(() => handleLanding(player, isDbl), 160);
                  }
              }, iv);
          }
          
          function handleLanding(player, isDbl) {
              const tile = BOARD_TILES[player.pos];
              updateUI();
          
              if (tile.type === "gotojail") {
                  logEvent(`🚨 خانة السجن! يُنقل ${player.avatar} ${player.nameAr} إلى السجن.`);
                  sendToJail(player, () => finishTurn(false));
                  return;
              }
          
              if (tile.type === "tax") {
                  player.money -= tile.price;
                  AudioFX.play('cash');
                  logEvent(`💸 ${player.avatar} ${player.nameAr} دفع ${tile.price}$ (${getTileName(tile.id, Game.lang)}).`);
                  if (checkBankruptcy(player)) return;
                  updateUI(); finishTurn(isDbl); return;
              }
          
              if (tile.type === "chance") {
                  openChanceWheel(player, isDbl);
                  return;
              }
          
              if (tile.type === "chest") {
                  handleCard(player, tile.type, isDbl);
                  return;
              }
          
              if (["property", "railroad", "utility"].includes(tile.type)) {
                  if (tile.owner === undefined) {
                      if (player.id === 0 || Game.mode === 'pvp') {
                          promptBuyProperty(tile, isDbl);
                      } else {
                          handleAIBuyDecision(player, tile, isDbl);
                      }
                      return;
                  } else if (tile.owner !== player.id) {
                      const owner = Game.players[tile.owner];
          
                      if (tile.mortgaged) {
                          logEvent(Game.lang === 'ar' ? `العقار (${getTileName(tile.id, Game.lang)}) مَرْهُون، معفى من الإيجار.` : `Property is mortgaged; rent-free.`);
                      } else if (owner.inJail && !Game.collectRentInJail) {
                          logEvent(Game.lang === 'ar' ? `⛓️ المالك (${owner.nameAr}) في السجن حالياً، لا يستطيع الحصول على الإيجارات أثناء بقاءه في السجن!` : `Owner is in jail; cannot collect rent!`);
                      } else {
                          const rent = calculateRent(tile);
                          player.money -= rent;
                          owner.money += rent;
                          AudioFX.play('cash');
                          if (owner.inJail && Game.collectRentInJail) {
                              logEvent(`🏷️ استلم ${owner.avatar} ${owner.nameAr} إيجاراً ${rent}$ أثناء تواجده بالسجن من ${player.avatar} ${player.nameAr} (${getTileName(tile.id, Game.lang)}).`);
                          } else {
                              logEvent(`🏷️ دفع ${player.avatar} ${player.nameAr} ${rent}$ إيجار إلى ${owner.avatar} ${owner.nameAr} (${getTileName(tile.id, Game.lang)}).`);
                          }
                          if (checkBankruptcy(player)) return;
                          updateUI();
                      }
          
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl);
                          return;
                      }
                      finishTurn(isDbl); return;
                  } else {
                      if (tile.type === "railroad") {
                          promptRailroadFastTravel(player, tile, isDbl); return;
                      }
                  }
              }
          
              finishTurn(isDbl);
          }
          
          function checkBankruptcy(player) {
              if (player.money >= 0) return false;
              while (player.money < 0) {
                  const builtProps = player.props.map(id => BOARD_TILES[id]).filter(t => t && (t.floors || 0) > 0);
                  if (builtProps.length === 0) break;
                  const maxFloors = Math.max(...builtProps.map(t => t.floors || 0));
                  const target = builtProps.find(t => (t.floors || 0) === maxFloors);
                  if (!target) break;
                  const cost = Math.round(target.price * 0.33);
                  const refund = Math.round(cost * 0.50);
                  target.floors--;
                  player.money += refund;
                  logEvent(`🔨 تم هدم طابق في (${getTileName(target.id, Game.lang)}) لدفع المستحقات (+${refund}$).`);
              }
              updateUI();
              if (player.money >= 0) return false;
          
              const unmortgaged = player.props.filter(id => !BOARD_TILES[id].mortgaged);
              for (const propId of unmortgaged) {
                  if (player.money >= 0) break;
                  const t = BOARD_TILES[propId];
                  t.mortgaged = true;
                  const val = Math.floor(t.price * 0.5);
                  player.money += val;
                  logEvent(`🏦 تم رهن (${getTileName(t.id, Game.lang)}) تلقائياً لدفع المستحقات.`);
              }
              updateUI();
              if (player.money < 0) {
                  const winnerId = (player.id === 0) ? 1 : 0;
                  triggerGameOver(winnerId);
                  return true;
              }
              return false;
          }
          
          function triggerGameOver(winnerId) {
              Game.isGameOver = true;
              localStorage.removeItem(SAVE_KEY);
              const winner = Game.players[winnerId];
              const loser = Game.players[winnerId === 0 ? 1 : 0];
          
              const isAr = (Game.lang === 'ar');
              document.getElementById("goCongratsTitle").innerText = isAr ? "🎉 تهانينا لقد ربحت! 🎉" : "🎉 Congratulations! You Won! 🎉";
              document.getElementById("goWinnerText").innerText = `${winner.avatar} ${winner.nameAr}`;
              document.getElementById("goDetails").innerText = isAr ?
                  `أفلس ${loser.nameAr} ولم يعد يملك أموالاً أو عقارات لتغطية التكاليف!` :
                  `${loser.nameEn} went bankrupt with no cash or assets remaining!`;
          
              document.getElementById("txtBtnPlayAgain").innerText = I18N[Game.lang].playAgain || (isAr ? "🔄 اللعب من جديد" : "🔄 Play Again");
              document.getElementById("txtBtnCloseGame").innerText = I18N[Game.lang].closeGame || (isAr ? "🚪 إغلاق" : "🚪 Close");
          
              document.getElementById("gameOverModal").classList.add("show");
          
              startMoneyRain();
              AudioFX.play('firework');
              if (fireworkSoundInterval) clearInterval(fireworkSoundInterval);
              fireworkSoundInterval = setInterval(() => {
                  if (!Game.isGameOver) {
                      clearInterval(fireworkSoundInterval);
                      return;
                  }
                  AudioFX.play('firework');
              }, 1700);
          }
          
          function startMoneyRain() {
              const container = document.getElementById("moneyRainContainer");
              if (!container) return;
              container.innerHTML = "";
              container.style.display = "block";
          
              const symbols = ["💵", "💸", "💰", "🪙", "💎", "👑"];
              for (let i = 0; i < 48; i++) {
                  const bill = document.createElement("div");
                  bill.className = "money-bill";
                  bill.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                  bill.style.left = (Math.random() * 95) + "%";
                  bill.style.fontSize = (18 + Math.random() * 22) + "px";
                  bill.style.animationDuration = (2.0 + Math.random() * 2.5) + "s";
                  bill.style.animationDelay = (Math.random() * 3) + "s";
                  container.appendChild(bill);
              }
          }
          
          function stopMoneyRain() {
              const container = document.getElementById("moneyRainContainer");
              if (container) {
                  container.innerHTML = "";
                  container.style.display = "none";
              }
              if (fireworkSoundInterval) {
                  clearInterval(fireworkSoundInterval);
                  fireworkSoundInterval = null;
              }
          }
          
          function restartFromVictory() {
              stopMoneyRain();
              document.getElementById("gameOverModal").classList.remove("show");
              openNewGameSetupModal(true);
          }
          
          let selectedFastTravelDestId = null;
          
          function promptRailroadFastTravel(player, currentTile, isDbl) {
              const allRails = BOARD_TILES.filter(t => t.type === "railroad");
              const monopolyOwner = Game.players.find(p => allRails.every(r => r.owner === p.id));
              if (!monopolyOwner) {
                  finishTurn(isDbl);
                  return;
              }
          
              if (player.id !== monopolyOwner.id) {
                  finishTurn(isDbl);
                  return;
              }
          
              const otherRails = allRails.filter(t => t.id !== currentTile.id);
          
              if (player.id === 0 || Game.mode === 'pvp') {
                  Game.fastTravelData = { player, currentTile, otherRails, isDbl };
                  selectedFastTravelDestId = otherRails[0].id;
                  renderFastTravelStations(otherRails, selectedFastTravelDestId);
          
                  const notice = document.getElementById("fastTravelSelectedNotice");
                  if (notice) {
                      notice.innerText = `المحطة المختارة: ${getTileName(selectedFastTravelDestId, Game.lang)} (خانة ${selectedFastTravelDestId})`;
                  }
          
                  document.getElementById("fastTravelModal").classList.add("show");
              } else {
                  if (Math.random() > 0.35) {
                      const dest = otherRails[Math.floor(Math.random() * otherRails.length)];
                      executeTrainMovement(player, currentTile, dest, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }
          
          function selectFastTravelStation(destId) {
              selectedFastTravelDestId = destId;
              if (Game.fastTravelData) {
                  renderFastTravelStations(Game.fastTravelData.otherRails, selectedFastTravelDestId);
                  const notice = document.getElementById("fastTravelSelectedNotice");
                  if (notice) {
                      notice.innerText = `المحطة المختارة: ${getTileName(destId, Game.lang)} (خانة ${destId})`;
                  }
              }
          }
          
          function renderFastTravelStations(stations, selectedId) {
              const container = document.getElementById("fastTravelStationsContainer");
              if (!container) return;
              container.innerHTML = "";
          
              stations.forEach(st => {
                  const isSelected = (st.id === selectedId);
                  const card = document.createElement("div");
                  card.style = `
                      background: ${isSelected ? 'rgba(245,158,11,0.25)' : 'var(--box-bg)'};
                      border: 2px solid ${isSelected ? 'var(--gold)' : 'var(--card-border)'};
                      border-radius: 8px;
                      padding: 8px 4px;
                      cursor: pointer;
                      display: flex;
                      flex-direction: column;
                      align-items: center;
                      justify-content: center;
                      gap: 4px;
                      transition: all 0.15s;
                      box-shadow: ${isSelected ? '0 0 10px rgba(245,158,11,0.5)' : 'none'};
                  `;
                  card.onclick = () => selectFastTravelStation(st.id);
          
                  card.innerHTML = `
                      <div style="font-size:1.5rem;">🚂</div>
                      <div style="font-size:0.75rem; font-weight:900; color:var(--text); text-align:center; line-height:1.2;">${getTileName(st.id, Game.lang)}</div>
                      <div style="font-size:0.65rem; color:var(--dim);">خانة ${st.id}</div>
                      <div style="font-size:0.62rem; color:${isSelected ? 'var(--gold)' : '#94A3B8'}; font-weight:bold;">${isSelected ? '✓ محددة' : 'اضغط للتحديد'}</div>
                  `;
                  container.appendChild(card);
              });
          }
          
          function confirmFastTravel() {
              if (!Game.fastTravelData) return;
              const { player, currentTile, isDbl } = Game.fastTravelData;
              const destId = selectedFastTravelDestId;
              const dest = BOARD_TILES.find(t => t.id === destId);
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");
          
              if (dest) {
                  executeTrainMovement(player, currentTile, dest, isDbl);
              } else {
                  finishTurn(isDbl);
              }
          }
          
          function cancelFastTravel() {
              if (!Game.fastTravelData) return;
              const isDbl = Game.fastTravelData.isDbl;
              Game.fastTravelData = null;
              document.getElementById("fastTravelModal").classList.remove("show");
              finishTurn(isDbl);
          }
          
          // تنفيذ حركة القطار السريع: حركة أبطأ بنسبة 300% (280ms بدلاً من 70ms) مع صوت بوق القطار الحقيقي الفخم
          function executeTrainMovement(player, fromTile, destTile, isDbl) {
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;
          
              const path = [];
              let curPos = fromTile.id;
              while (curPos !== destTile.id) {
                  curPos = (curPos + 1) % 40;
                  path.push(curPos);
              }
          
              const trainEl = document.getElementById("expressTrain");
              const badgeEl = document.getElementById("trainPassengerBadge");
              badgeEl.innerText = player.avatar;
          
              const pPawn = getPawnEl(player.id);
              pPawn.style.display = "none";
          
              const startPawns = document.getElementById("pawns-" + fromTile.id);
              if (startPawns) startPawns.appendChild(trainEl);
              trainEl.style.display = "flex";
              trainEl.style.opacity = "1";
              trainEl.style.transform = "scale(1.4)";
          
              // إطلاق بوق القطار الرنان عند التحرك
              AudioFX.play('trainHorn');
          
              let stepIdx = 0;
              // تم إبطاء السرعة بنسبة 300% (من 70ms إلى 280ms) لتكون الحركة واضحة وانسيابية وفخمة
              const trainInterval = setInterval(() => {
                  if (stepIdx < path.length) {
                      const stepTileId = path[stepIdx];
                      const tilePawns = document.getElementById("pawns-" + stepTileId);
                      if (tilePawns) tilePawns.appendChild(trainEl);
                      AudioFX.play('trainChug');
          
                      if (stepIdx === Math.floor(path.length / 2)) {
                          AudioFX.play('trainHorn');
                      }
                      stepIdx++;
                  } else {
                      clearInterval(trainInterval);
                      AudioFX.play('trainHorn');
                      trainEl.style.transform = "scale(0) rotate(15deg)";
                      trainEl.style.opacity = "0";
          
                      setTimeout(() => {
                          trainEl.style.display = "none";
                          trainEl.style.transform = "";
                          trainEl.style.opacity = "1";
          
                          player.pos = destTile.id;
                          pPawn.style.display = "";
                          updatePawns(player.id);
                          updateUI();
                          Game.isRolling = false;
          
                          const crossedGo = (fromTile.id > destTile.id);
                          if (crossedGo) {
                              logEvent(`🚂 سافر ${player.avatar} ${player.nameAr} بالقطار السريع عبر خط الانطلاق إلى (${getTileName(destTile.id, Game.lang)}) بدون مكافأة الدورة.`);
                          } else {
                              logEvent(`🚂 وصل ${player.avatar} ${player.nameAr} عبر القطار السريع إلى محطة (${getTileName(destTile.id, Game.lang)}).`);
                          }
          
                          if (destTile.owner === undefined) {
                              setTimeout(() => promptBuyProperty(destTile, isDbl), 300);
                          } else if (destTile.owner !== player.id && !destTile.mortgaged) {
                              const owner = Game.players[destTile.owner];
                              if (owner.inJail && !Game.collectRentInJail) {
                                  logEvent(`⛓️ المالك (${owner.nameAr}) في السجن، لا يستطيع الحصول على الإيجارات!`);
                              } else {
                                  const rent = calculateRent(destTile);
                                  player.money -= rent;
                                  owner.money += rent;
                                  AudioFX.play('cash');
                                  if (owner.inJail && Game.collectRentInJail) {
                                      logEvent(`🏷️ استلم ${owner.avatar} ${owner.nameAr} إيجاراً ${rent}$ أثناء تواجده بالسجن من ${player.avatar} ${player.nameAr} (${getTileName(destTile.id, Game.lang)}).`);
                                  } else {
                                      logEvent(`🏷️ دفع ${player.avatar} ${player.nameAr} ${rent}$ إيجار إلى ${owner.avatar} ${owner.nameAr} (${getTileName(destTile.id, Game.lang)}).`);
                                  }
                                  if (checkBankruptcy(player)) return;
                                  updateUI();
                              }
                              finishTurn(isDbl);
                          } else {
                              finishTurn(isDbl);
                          }
                      }, 300);
                  }
              }, 280);
          }
          
          function promptBuyProperty(tile, isDbl) {
              Game.pendingTile = { tile, isDbl };
              const cur = Game.players[Game.turn];
              const baseRent = Math.round(tile.price * 0.20);
              const monoRent = Math.round(tile.price * 0.40);
              document.getElementById("deedTitle").innerText = `${tile.icon||""} ${getTileName(tile.id, Game.lang)}`;
              document.getElementById("deedBody").innerHTML = `
                  <div style="text-align:center; margin-bottom:8px;">
                      <div style="font-size:0.78rem; color:var(--dim); margin-bottom:3px;">دور الشراء: <strong style="color:var(--text);">${cur.avatar} ${cur.nameAr}</strong> (الرصيد: <strong style="color:var(--gold);">${cur.money}$</strong>)</div>
                      <span style="display:inline-block; width:13px; height:13px; background:${tile.color}; border-radius:50%; vertical-align:middle;"></span>
                      <strong style="font-size:1.10rem; color:var(--gold); margin:0 5px;">${tile.price}$</strong>
                  </div>
                  <div style="font-size:0.80rem; color:var(--text); text-align:center;">إيجار العقار الأساسي: <strong style="color:var(--gold);">${baseRent}$</strong></div>
                  <div style="font-size:0.72rem; color:var(--dim); text-align:center; margin-top:3px;">(عند احتكار كامل المجموعة يرتفع الإيجار إلى: <strong style="color:var(--gold);">${monoRent}$</strong>)</div>
              `;
              const canAfford = cur.money >= tile.price;
              document.getElementById("btnBuyProp").disabled = !canAfford;
              document.getElementById("deedModal").classList.add("show");
          }
          
          function closeDeedModal() {
              document.getElementById("deedModal").classList.remove("show");
              if (Game.pendingTile) {
                  const { tile, isDbl } = Game.pendingTile;
                  Game.pendingTile = null;
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }
          
          function confirmBuyProp() {
              if (!Game.pendingTile) return;
              const cur = Game.players[Game.turn];
              const { tile: t, isDbl } = Game.pendingTile;
              if (cur.money >= t.price) {
                  buyProp(cur, t, t.price);
                  Game.pendingTile = null;
                  document.getElementById("deedModal").classList.remove("show");
                  if (t.type === "railroad") {
                      promptRailroadFastTravel(cur, t, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              }
          }
          
          let aucTimerInterval = null;
          let aucSecondsLeft = 5;
          
          function startAuctionTimer() {
              stopAuctionTimer();
              aucSecondsLeft = 5;
              const timerEl = document.getElementById("aucTimerNum");
              if (timerEl) timerEl.innerText = aucSecondsLeft;
          
              aucTimerInterval = setInterval(() => {
                  aucSecondsLeft--;
                  if (timerEl) timerEl.innerText = aucSecondsLeft;
          
                  if (aucSecondsLeft <= 0) {
                      stopAuctionTimer();
                      handleAuctionTimeout();
                  }
              }, 1000);
          }
          
          function stopAuctionTimer() {
              if (aucTimerInterval) {
                  clearInterval(aucTimerInterval);
                  aucTimerInterval = null;
              }
          }
          
          function handleAuctionTimeout() {
              const a = Game.auction;
              if (!a) return;
              logEvent(`⏱️ انتهت مهلة الـ 5 ثوانٍ للاعب ${Game.players[a.bidTurn].avatar}!`);
              if (a.highestBidder !== null) {
                  concludeAuction();
              } else {
                  foldAuctionBid();
              }
          }
          
          function startAuction() {
              if (!Game.pendingTile) return;
              const t = Game.pendingTile.tile;
              const isDbl = Game.pendingTile.isDbl;
              Game.pendingTile = null;
              document.getElementById("deedModal").classList.remove("show");
          
              Game.auction = { tile:t, isDbl, currentBid:10, highestBidder:null, bidTurn:Game.turn, active:[0,1] };
              document.getElementById("auctionModal").classList.add("show");
              updateAuctionUI();
              startAuctionTimer();
              if (Game.mode === 'ai' && Game.turn === 1) setTimeout(handleAIAuction, 1000);
          }
          
          function updateAuctionUI() {
              const a = Game.auction;
              if (!a) return;
              document.getElementById("aucPropDetails").innerText = `${a.tile.icon || "🏙️"} ${getTileName(a.tile.id, Game.lang)}`;
              document.getElementById("aucBasePriceVal").innerText = a.tile.price + "$";
              document.getElementById("aucCurrentBid").innerText = a.currentBid + "$";
              document.getElementById("aucHighestBidder").innerText = a.highestBidder !== null ? `${Game.players[a.highestBidder].avatar} ${Game.players[a.highestBidder].nameAr} (${Game.players[a.highestBidder].money}$)` : (Game.lang==='ar'?"لا يوجد مزايد بعد":"No bids yet");
              const cur = Game.players[a.bidTurn];
              document.getElementById("aucTurnPrompt").innerText = `دور: ${cur.avatar} ${cur.nameAr} (رصيده: ${cur.money}$)`;
          
              const isHumanTurn = (Game.mode === 'pvp') || (a.bidTurn === 0);
              document.getElementById("aucControls").style.display = isHumanTurn ? "flex" : "none";
          }
          
          function placeAuctionBid(inc) {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              const bidder = a.bidTurn;
              const p = Game.players[bidder];
              const nextBid = a.currentBid + inc;
              if (p.money >= nextBid) {
                  a.currentBid = nextBid;
                  a.highestBidder = bidder;
                  logEvent(`🔨 زاد ${p.avatar} ${p.nameAr} المزاد إلى ${a.currentBid}$!`);
                  nextAuctionTurn();
              } else {
                  startAuctionTimer();
              }
          }
          
          function foldAuctionBid() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              logEvent(`❌ انسحب ${Game.players[a.bidTurn].avatar} ${Game.players[a.bidTurn].nameAr} من المزاد.`);
              a.active = a.active.filter(id => id !== a.bidTurn);
              if (a.active.length === 1 && a.highestBidder !== null) {
                  concludeAuction();
              } else if (a.active.length === 0) {
                  document.getElementById("auctionModal").classList.remove("show");
                  const { tile, isDbl } = a;
                  Game.auction = null;
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              } else {
                  nextAuctionTurn();
              }
          }
          
          function nextAuctionTurn() {
              const a = Game.auction; if (!a) return;
              a.bidTurn = (a.bidTurn === 0) ? 1 : 0;
              updateAuctionUI();
              startAuctionTimer();
              if (Game.mode === 'ai' && a.bidTurn === 1 && a.active.includes(1)) setTimeout(handleAIAuction, 1000);
          }
          
          function concludeAuction() {
              const a = Game.auction; if (!a) return;
              stopAuctionTimer();
              document.getElementById("auctionModal").classList.remove("show");
              const winner = Game.players[a.highestBidder];
              logEvent(`🏆 فاز ${winner.avatar} ${winner.nameAr} بمزاد (${getTileName(a.tile.id, Game.lang)}) بمبلغ ${a.currentBid}$!`);
              buyProp(winner, a.tile, a.currentBid);
              const { tile, isDbl } = a;
              Game.auction = null;
              if (tile.type === "railroad") {
                  promptRailroadFastTravel(Game.players[Game.turn], tile, isDbl);
              } else {
                  finishTurn(isDbl);
              }
          }
          
          function handleAIAuction() {
              const a = Game.auction; if (!a || a.bidTurn !== 1) return;
              const ai = Game.players[1];
              const diff = Game.aiDifficulty || 'medium';
          
              let maxValMultiplier = 0.9;
              let minCashBuffer = 40;
              let bidStep = 10;
          
              const myPot = checkMonopolyPot(1, a.tile.group);
              const oppPot = checkMonopolyPot(0, a.tile.group);
          
              if (diff === 'easy') {
                  maxValMultiplier = 0.70;
                  minCashBuffer = 120;
                  bidStep = 10;
              } else if (diff === 'medium') {
                  maxValMultiplier = myPot ? 1.35 : 1.0;
                  minCashBuffer = 40;
                  bidStep = 15;
              } else if (diff === 'hard') {
                  maxValMultiplier = (myPot || oppPot) ? 1.85 : 1.4;
                  minCashBuffer = 10;
                  bidStep = 25;
              } else {
                  maxValMultiplier = (myPot || oppPot) ? 3.2 : 2.2;
                  minCashBuffer = 5;
                  bidStep = 30;
              }
          
              const maxBidAI = Math.floor(a.tile.price * maxValMultiplier);
              if (a.currentBid + bidStep <= maxBidAI && ai.money >= a.currentBid + bidStep + minCashBuffer) {
                  placeAuctionBid(bidStep);
              } else {
                  foldAuctionBid();
              }
          }
          
          function handleAIBuyDecision(player, tile, isDbl) {
              const diff = Game.aiDifficulty || 'medium';
              let shouldBuy = false;
              const pot = checkMonopolyPot(1, tile.group);
              const opponentPot = checkMonopolyPot(0, tile.group);
          
              if (diff === 'easy') {
                  if (player.money >= tile.price + 450 && Math.random() > 0.35) {
                      shouldBuy = true;
                  }
              } else if (diff === 'medium') {
                  const hasCash = player.money >= tile.price + 100;
                  if (hasCash || pot) {
                      shouldBuy = true;
                  }
              } else if (diff === 'hard') {
                  if (player.money >= tile.price && (player.money >= tile.price + 50 || pot || opponentPot || tile.type === 'railroad')) {
                      shouldBuy = true;
                  }
              } else {
                  if (player.money >= tile.price) {
                      shouldBuy = true;
                  }
              }
          
              if (shouldBuy) {
                  buyProp(player, tile, tile.price);
                  if (tile.type === "railroad") {
                      promptRailroadFastTravel(player, tile, isDbl);
                  } else {
                      finishTurn(isDbl);
                  }
              } else {
                  Game.pendingTile = { tile, isDbl };
                  startAuction();
              }
          }
          
          function checkMonopolyPot(playerId, group) {
              if (!group) return false;
              const groupTiles = BOARD_TILES.filter(t => t.group === group);
              const owned = groupTiles.filter(t => t.owner === playerId).length;
              return owned > 0;
          }
          
          function buyProp(player, tile, price) {
              player.money -= price;
              tile.owner = player.id;
              player.props.push(tile.id);
              AudioFX.play('cash');
              logEvent(`🎉 اشترى ${player.avatar} ${player.nameAr} (${getTileName(tile.id, Game.lang)}) مقابل ${price}$.`);
              updateUI();
          }
          
          function handleCard(player, type, isDbl) {
              const cards = [
                  { textAr:"ربحت في مسابقة الحظ الملكية! استلم 100$", textEn:"Won royal lottery! Collect 100$", action:"cash", val:100 },
                  { textAr:"غرامة مخالفة سرعة! ادفع 50$", textEn:"Speeding fine! Pay 50$", action:"cash", val:-50 },
                  { textAr:"تقدم مباشرة إلى خانة انطلق واربح 200$", textEn:"Advance to GO, collect 200$", action:"go" },
                  { textAr:"أُرسلت مباشرة إلى السجن!", textEn:"Go directly to jail!", action:"jail" }
              ];
              const c = cards[Math.floor(Math.random() * cards.length)];
              logEvent(`📜 ${Game.lang==='ar'?c.textAr:c.textEn}`);
              if (c.action === "cash") {
                  player.money += c.val;
                  if (checkBankruptcy(player)) return;
                  AudioFX.play('cash'); updateUI(); finishTurn(isDbl);
              } else if (c.action === "go") {
                  player.pos = 0; player.money += 200;
                  AudioFX.play('cash'); updatePawns(player.id); updateUI(); finishTurn(isDbl);
              } else if (c.action === "jail") {
                  sendToJail(player, () => finishTurn(false));
              }
          }
          
          // برمجة الدولاب الدوار لخانة فرصة وغرامة (8 خانات متنوعة)
          let currentWheelRotation = 0;
          let isWheelSpinning = false;
          let chanceWheelData = null;
          let wheelDrawn = false;
          
          function drawChanceWheel() {
              const canvas = document.getElementById("chanceWheelCanvas");
              if (!canvas) return;
              const ctx = canvas.getContext("2d");
              const numSlices = 8;
              const sliceAngle = (2 * Math.PI) / numSlices;
              const cx = 260, cy = 260, radius = 250;
          
              ctx.clearRect(0, 0, 520, 520);
          
              for (let i = 0; i < numSlices; i++) {
                  const slice = CHANCE_WHEEL_SLICES[i];
                  const startAng = i * sliceAngle;
                  const endAng = startAng + sliceAngle;
          
                  ctx.beginPath();
                  ctx.moveTo(cx, cy);
                  ctx.arc(cx, cy, radius, startAng, endAng);
                  ctx.closePath();
          
                  ctx.fillStyle = slice.color;
                  ctx.fill();
          
                  ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                  ctx.lineWidth = 3;
                  ctx.stroke();
          
                  ctx.save();
                  ctx.translate(cx, cy);
                  ctx.rotate(startAng + sliceAngle / 2);
          
                  ctx.fillStyle = "#FFFFFF";
                  ctx.shadowColor = "rgba(0,0,0,0.8)";
                  ctx.shadowBlur = 6;
                  ctx.font = "bold 32px sans-serif";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText(slice.icon, radius * 0.72, 0);
          
                  ctx.font = "900 17px -apple-system, sans-serif";
                  ctx.fillText(Game.lang === 'ar' ? slice.badgeAr : slice.badgeEn, radius * 0.42, 0);
          
                  ctx.restore();
              }
          
              wheelDrawn = true;
          }
          
          function openChanceWheel(player, isDbl) {
              chanceWheelData = { player, isDbl };
              isWheelSpinning = false;
          
              if (!wheelDrawn) drawChanceWheel();
          
              const banner = document.getElementById("wheelResultBanner");
              banner.style.display = "none";
              banner.innerHTML = "";
          
              const announcer = document.getElementById("wheelPlayerAnnouncer");
              announcer.innerText = `الدور: ${player.avatar} ${player.nameAr}`;
          
              const btn = document.getElementById("btnSpinWheel");
              const isHuman = (player.id === 0 || Game.mode === 'pvp');
          
              if (isHuman) {
                  btn.disabled = false;
                  btn.innerText = "🎡 تدوير الدولاب";
                  btn.style.opacity = "1";
              } else {
                  btn.disabled = true;
                  btn.innerText = "🤖 الروبوت يدير الدولاب...";
                  btn.style.opacity = "0.7";
                  setTimeout(() => {
                      if (!isWheelSpinning && chanceWheelData) spinChanceWheel();
                  }, 750);
              }
          
              document.getElementById("chanceWheelModal").classList.add("show");
          }
          
          function spinChanceWheel() {
              if (isWheelSpinning || !chanceWheelData) return;
              isWheelSpinning = true;
          
              const btn = document.getElementById("btnSpinWheel");
              btn.disabled = true;
              btn.innerText = "جاري تدوير الدولاب... 🎡";
              btn.style.opacity = "0.6";
          
              const targetIdx = Math.floor(Math.random() * 8);
              const targetSlice = CHANCE_WHEEL_SLICES[targetIdx];
          
              const sliceAngle = 45;
              const targetCenter = targetIdx * sliceAngle + 22.5;
          
              const currentMod = currentWheelRotation % 360;
              const targetMod = (270 - targetCenter + 360) % 360;
              let forwardDiff = (targetMod - currentMod + 360) % 360;
              if (forwardDiff < 180) forwardDiff += 360;
          
              const totalSpin = 360 * 5 + forwardDiff;
              currentWheelRotation += totalSpin;
          
              const canvas = document.getElementById("chanceWheelCanvas");
              canvas.style.transform = `rotate(${currentWheelRotation}deg)`;
          
              let tickCount = 0;
              const tickInterval = setInterval(() => {
                  AudioFX.play('wheelTick');
                  tickCount++;
                  if (tickCount > 24) clearInterval(tickInterval);
              }, 130);
          
              // بعد استقرار الدولاب: يتم تنفيذه فوراً للاعب
              setTimeout(() => {
                  clearInterval(tickInterval);
                  isWheelSpinning = false;
          
                  const isGood = ['profit', 'reward', 'benefit'].includes(targetSlice.type);
                  if (isGood) AudioFX.play('cash');
                  else if (targetSlice.action === 'jail') AudioFX.play('siren');
                  else AudioFX.play('cash');
          
                  const banner = document.getElementById("wheelResultBanner");
                  banner.style.display = "block";
                  banner.style.background = isGood ? "rgba(16,185,129,0.2)" : "rgba(239,68,68,0.2)";
                  banner.style.border = `1.5px solid ${isGood ? '#10B981' : '#EF4444'}`;
                  banner.style.color = isGood ? "#10B981" : "#EF4444";
                  banner.innerHTML = `
                      <div style="font-size:1.0rem; font-weight:900;">${targetSlice.icon} ${Game.lang === 'ar' ? targetSlice.titleAr : targetSlice.titleEn}</div>
                      <div style="font-size:0.78rem; font-weight:bold; color:var(--text); margin-top:3px;">${Game.lang === 'ar' ? targetSlice.descAr : targetSlice.descEn}</div>
                  `;
          
                  const { player, isDbl } = chanceWheelData;
                  logEvent(`🎡 ${player.avatar} ${player.nameAr}: ${Game.lang === 'ar' ? targetSlice.descAr : targetSlice.descEn}`);
          
                  // تنفيذ الخيار فوراً للاعب
                  if (targetSlice.action === 'cash') {
                      player.money += targetSlice.val;
                      updateUI();
                      const wentBankrupt = checkBankruptcy(player);
                      setTimeout(() => {
                          document.getElementById("chanceWheelModal").classList.remove("show");
                          chanceWheelData = null;
                          if (!wentBankrupt) finishTurn(isDbl);
                      }, 1800);
                  } else if (targetSlice.action === 'go') {
                      player.pos = 0;
                      player.money += 200;
                      AudioFX.play('cash');
                      updatePawns(player.id);
                      updateUI();
                      setTimeout(() => {
                          document.getElementById("chanceWheelModal").classList.remove("show");
                          chanceWheelData = null;
                          finishTurn(isDbl);
                      }, 1800);
                  } else if (targetSlice.action === 'jail') {
                      setTimeout(() => {
                          document.getElementById("chanceWheelModal").classList.remove("show");
                          chanceWheelData = null;
                          sendToJail(player, () => finishTurn(false));
                      }, 1400);
                  }
              }, 3650);
          }
          
          function sendToJail(player, onFinish) {
              Game.isRolling = true;
              document.getElementById("btnRoll").disabled = true;
          
              if (player.pos === 10) {
                  player.inJail = true;
                  player.jailTurns = 3;
                  AudioFX.play('jailDoor');
                  updatePawns(player.id);
                  updateBoardVisual();
                  updateUI();
                  const jailNotice = Game.collectRentInJail ? " (الإيجارات مفعلة بالسجن)" : " ⚠️ لا يستطيع اللاعب الحصول على الإيجارات أثناء السجن";
                  logEvent(`🚔 دَخَل ${player.avatar} ${player.nameAr} السجن!${jailNotice}.`);
                  Game.isRolling = false;
                  if (onFinish) onFinish();
                  return;
              }
          
              const jailInterval = setInterval(() => {
                  if (player.pos !== 10) {
                      player.pos = (player.pos - 1 + 40) % 40;
                      AudioFX.play('siren');
                      updatePawns(player.id);
                  }
          
                  if (player.pos === 10) {
                      clearInterval(jailInterval);
                      player.inJail = true;
                      player.jailTurns = 3;
                      AudioFX.play('jailDoor');
                      updatePawns(player.id);
                      updateBoardVisual();
                      updateUI();
                      const jailNotice = Game.collectRentInJail ? " (الإيجارات مفعلة بالسجن)" : " ⚠️ لا يستطيع اللاعب الحصول على الإيجارات أثناء السجن";
                      logEvent(`🚔 دَخَل ${player.avatar} ${player.nameAr} السجن!${jailNotice}.`);
                      Game.isRolling = false;
                      if (onFinish) onFinish();
                  }
              }, 130);
          }
          
          function openJailModal() {
              document.getElementById("jailModal").classList.add("show");
          }
          
          function payJailFine() {
              const cur = Game.players[Game.turn];
              if (cur.money >= 50) {
                  cur.money -= 50;
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  document.getElementById("jailModal").classList.remove("show");
                  AudioFX.play('cash');
                  updateBoardVisual();
                  updateUI();
                  logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].finePaid}`);
                  if (Game.turn === 1 && Game.mode === 'ai') {
                      setTimeout(rollDice, 550);
                  } else {
                      document.getElementById("btnRoll").disabled = false;
                  }
              } else {
                  rollForJail();
              }
          }
          
          function rollForJail() {
              document.getElementById("jailModal").classList.remove("show");
              const v0 = Math.floor(Math.random() * 6) + 1;
              const v1 = Math.floor(Math.random() * 6) + 1;
              setDieFace(document.getElementById("die0"), v0);
              setDieFace(document.getElementById("die1"), v1);
              const cur = Game.players[Game.turn];
              if (v0 === v1) {
                  cur.inJail = false;
                  cur.jailTurns = 0;
                  logEvent(`${cur.avatar} ${cur.nameAr}: ${I18N[Game.lang].doublesJail}`);
                  updateBoardVisual();
                  updateUI();
                  moveSteps(cur, v0 + v1, false);
              } else {
                  cur.jailTurns--;
                  if (cur.jailTurns <= 0) {
                      cur.money = Math.max(0, cur.money - 50);
                      cur.inJail = false;
                      cur.jailTurns = 0;
                      logEvent(Game.lang==='ar' ? `انتهت مدة السجن لـ ${cur.nameAr} ودفع 50$ كفالة إجبارية.` : `Jail sentence finished; paid 50$ fine.`);
                      updateBoardVisual();
                      updateUI();
                      moveSteps(cur, v0 + v1, false);
                  } else {
                      logEvent(Game.lang==='ar' ? `لم يتطابق النرد (${v0}+${v1})! بقي ${cur.nameAr} في السجن.` : `No doubles (${v0}+${v1})! Still in Jail.`);
                      finishTurn(false);
                  }
              }
          }
          
          function finishTurn(isDbl) {
              Game.isRolling = false;
              if (Game.isGameOver) return;
              if (isDbl && !Game.players[Game.turn].inJail) {
                  logEvent(`🔥 رمية متطابقة! يحصل ${Game.players[Game.turn].avatar} ${Game.players[Game.turn].nameAr} على رمية إضافية.`);
                  startPlayerTurn();
                  return;
              }
              Game.doublesInRow = 0;
              Game.turn = (Game.turn === 0) ? 1 : 0;
              updateUI();
              startPlayerTurn();
          }
          
          function startPlayerTurn() {
              if (Game.isGameOver) return;
              updateUI();
              const cur = Game.players[Game.turn];
              if (Game.turn === 0) {
                  document.getElementById("btnRoll").disabled = false;
              } else {
                  if (Game.mode === 'ai') {
                      document.getElementById("btnRoll").disabled = true;
                      checkAIStrategicFinance();
                      checkAIBuilding();
                      setTimeout(() => {
                          if (Game.isGameOver || Game.turn !== 1) return;
                          if (cur.inJail) {
                              handleAIJailDecision(cur);
                          } else {
                              rollDice();
                          }
                      }, 750);
                  } else {
                      document.getElementById("btnRoll").disabled = false;
                  }
              }
          }
          
          function openTileInfoModal(index) {
