name: Build MONOPOLY PRO APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🎲 بناء تطبيق MONOPOLY PRO (APK)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 تثبيت وإعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ تجهيز وبرمجة كامل ملفات لعبة MONOPOLY PRO تلقائياً
        run: |
          python3 - << 'PYEOF'
          import os

          files = {}

          # 1. settings.gradle
          files["settings.gradle"] = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MonopolyPro"
          include ':app'
          """

          # 2. build.gradle
          files["build.gradle"] = """plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          """

          # 3. gradle.properties
          files["gradle.properties"] = """org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """

          # 4. app/build.gradle
          files["app/build.gradle"] = """plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.monopoly.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.monopoly.pro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  vectorDrawables {
                      useSupportLibrary true
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity:1.8.2'
          }
          """

          # 5. AndroidManifest.xml (ضبط الدوران للشاشة ووضع ملء الشاشة)
          files["app/src/main/AndroidManifest.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_monopoly"
                  android:roundIcon="@drawable/ic_monopoly"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.MonopolyPro">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustPan"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          # 6. Strings
          files["app/src/main/res/values/strings.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">MONOPOLY PRO</string>
          </resources>
          """

          # 7. Colors
          files["app/src/main/res/values/colors.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_main">#0B0E14</color>
              <color name="gold">#F59E0B</color>
              <color name="gold_dark">#D97706</color>
          </resources>
          """

          # 8. Themes (ملء الشاشة مع إخفاء أشرطة النظام الافتراضية)
          files["app/src/main/res/values/themes.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MonopolyPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/gold</item>
                  <item name="colorPrimaryVariant">@color/gold_dark</item>
                  <item name="android:statusBarColor">@color/bg_main</item>
                  <item name="android:navigationBarColor">@color/bg_main</item>
                  <item name="android:windowBackground">@color/bg_main</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          """

          # 9. App Icon
          files["app/src/main/res/drawable/ic_monopoly.xml"] = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp"
              android:height="128dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#0B0E14" android:pathData="M50,4 C75.4,4 96,24.6 96,50 C96,75.4 75.4,96 50,96 C24.6,96 4,75.4 4,50 C4,24.6 24.6,4 50,4 Z" />
              <path android:fillColor="#F59E0B" android:pathData="M50,10 L86,30 L86,70 L50,90 L14,70 L14,30 Z" />
              <path android:fillColor="#1E293B" android:pathData="M50,16 L80,33 L80,67 L50,84 L20,67 L20,33 Z" />
              <path android:fillColor="#FBBF24" android:pathData="M32,38 L40,55 L50,42 L60,55 L68,38 L68,64 L32,64 Z" />
              <path android:fillColor="#EF4444" android:pathData="M50,55 C53,55 55,57 55,60 C55,63 53,65 50,65 C47,65 45,63 45,60 C45,57 47,55 50,55 Z" />
          </vector>
          """

          # 10. Layout (ملء الشاشة وإلغاء شريط التمرير الافتراضي)
          files["app/src/main/res/layout/activity_main.xml"] = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_main">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg_main"
                  android:overScrollMode="never"
                  android:scrollbars="none" />
          </FrameLayout>
          """

          # 11. MainActivity.java (تفعيل Viewport الحقيقي وشاشة العرض الكاملة الغامرة)
          files["app/src/main/java/com/monopoly/pro/MainActivity.java"] = """package com.monopoly.pro;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              public class WebAppInterface {
                  @JavascriptInterface
                  public void exitApp() {
                      runOnUiThread(() -> finish());
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // إعدادات أساسية لضبط حجم العرض وجعل اللعبة بحجم الشاشة بدقة 100%
                  webSettings.setUseWideViewPort(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setSupportZoom(false);
                  webSettings.setBuiltInZoomControls(false);
                  webSettings.setDisplayZoomControls(false);
                  webSettings.setLayoutAlgorithm(WebSettings.LayoutAlgorithm.NORMAL);

                  webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
                  webView.setVerticalScrollBarEnabled(false);
                  webView.setHorizontalScrollBarEnabled(false);

                  webView.addJavascriptInterface(new WebAppInterface(), "Android");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean onRenderProcessGone(WebView view, RenderProcessGoneDetail detail) {
                          if (view != null) {
                              view.destroy();
                          }
                          recreate();
                          return true;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");

                  hideSystemUI();

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView != null) {
                              webView.evaluateJavascript("if (window.handleAndroidBack) { window.handleAndroidBack(); }", null);
                          }
                      }
                  });
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  View decorView = getWindow().getDecorView();
                  decorView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          """

          # 12. app/src/main/assets/index.html (تعديل كامل رقعة اللعب لتملأ الشاشة تماماً بدون خروج أي عنصر)
          files["app/src/main/assets/index.html"] = r'''<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
          <title>MONOPOLY PRO</title>
          <style>
          :root{
              --bg-main:#0B0E14;
              --bg-board:#111723;
              --bg-tile:#1B2232;
              --gold:#F59E0B;
              --gold-lt:#FDE68A;
              --text:#F8FAFC;
              --dim:#94A3B8;
              --p0:#EF4444;
              --p1:#38BDF8;
              --green:#10B981;
              --card-bg:#161D2B;
              --card-border:#2B3548;
              --hdr-bg:linear-gradient(135deg,#1E293B,#0F172A);
              --center-bg:radial-gradient(circle at center,#182235,#0B101A);
              --modal-bg:linear-gradient(145deg,#1E293B,#0F172A);
              --input-bg:#0F172A;
              --box-bg:#0F172A;
              --btn-pill-bg:#1E293B;
              --btn-pill-border:#4B5563;
              --tile-border:rgba(255,255,255,0.08);
          }
          body.theme-light{
              --bg-main:#F1F5F9;
              --bg-board:#CBD5E1;
              --bg-tile:#FFFFFF;
              --gold:#D97706;
              --gold-lt:#B45309;
              --text:#0F172A;
              --dim:#64748B;
              --p0:#DC2626;
              --p1:#0284C7;
              --green:#059669;
              --card-bg:#FFFFFF;
              --card-border:#94A3B8;
              --hdr-bg:linear-gradient(135deg,#FFFFFF,#E2E8F0);
              --center-bg:radial-gradient(circle at center,#FFFFFF,#F8FAFC);
              --modal-bg:linear-gradient(145deg,#FFFFFF,#F1F5F9);
              --input-bg:#F8FAFC;
              --box-bg:#F1F5F9;
              --btn-pill-bg:#E2E8F0;
              --btn-pill-border:#CBD5E1;
              --tile-border:rgba(0,0,0,0.12);
          }
          *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
          html,body{width:100%;height:100%;margin:0;padding:0;box-sizing:border-box;overflow:hidden;position:fixed;inset:0;}
          body{background:var(--bg-main);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px;box-sizing:border-box;transition:background 0.25s, color 0.25s;}

          .header{width:100%;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:3px 6px;background:var(--hdr-bg);border-radius:8px;border:1px solid rgba(245,158,11,0.4);margin-bottom:2px;box-shadow:0 2px 6px rgba(0,0,0,0.25);box-sizing:border-box;}
          .header-title{display:flex;align-items:center;gap:4px;font-size:clamp(0.72rem,2.8vw,0.90rem);font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(245,158,11,0.3);white-space:nowrap;flex-shrink:1;min-width:0;}
          .header-controls{display:flex;gap:3px;align-items:center;flex-shrink:0;}
          .btn-hdr{background:var(--btn-pill-bg);border:1px solid var(--btn-pill-border);color:var(--text);padding:3px 6px;border-radius:5px;font-size:clamp(0.62rem,2vw,0.72rem);font-weight:bold;cursor:pointer;white-space:nowrap;}

          .scoreboard{width:100%;flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:2px;box-sizing:border-box;}
          .p-card{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:8px;padding:3px 6px;display:flex;align-items:center;justify-content:space-between;position:relative;cursor:pointer;transition:border-color 0.2s, box-shadow 0.2s;min-width:0;box-sizing:border-box;}
          .p-card.active{border-color:var(--gold);box-shadow:0 0 10px rgba(245,158,11,0.45);}
          .p-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;background:#000;border:2px solid #fff;flex-shrink:0;}
          .p-details{flex:1;margin:0 4px;min-width:0;overflow:hidden;}
          .p-name{font-size:clamp(0.68rem,2.2vw,0.78rem);font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
          .p-cash{font-size:clamp(0.78rem,2.5vw,0.88rem);font-weight:900;color:var(--gold);line-height:1.1;}
          .p-stats{font-size:0.58rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
          .p-badge{position:absolute;top:-5px;left:4px;background:var(--gold);color:#000;font-size:0.55rem;font-weight:900;padding:1px 5px;border-radius:8px;}

          .board-wrapper{direction:ltr!important;width:100%;flex:1;min-height:0;margin:0 auto;box-sizing:border-box;position:relative;background:var(--bg-board);border-radius:10px;border:2px solid var(--gold);box-shadow:0 4px 20px rgba(0,0,0,0.5);display:grid;grid-template-columns:minmax(0, 1.2fr) repeat(9, minmax(0, 1fr)) minmax(0, 1.2fr);grid-template-rows:minmax(0, 1.15fr) repeat(9, minmax(0, 1fr)) minmax(0, 1.15fr);gap:1px;padding:1px;overflow:visible;}
          .tile{direction:rtl;background:var(--bg-tile);border-radius:3px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1px 0;overflow:visible;border:1px solid var(--tile-border);cursor:pointer;min-width:0;min-height:0;box-sizing:border-box;}
          .tile:active{filter:brightness(1.15);}
          .tile-bar{width:100%;height:5px;border-radius:1px;flex-shrink:0;}
          .tile-cnt{width:100%;min-width:0;height:calc(100% - 6px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0;box-sizing:border-box;overflow:hidden;}
          .tile-name{width:100%;min-width:0;font-size:clamp(0.36rem,1.5vw,0.50rem);font-weight:900;text-align:center;line-height:1.1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1px;box-sizing:border-box;}
          .tile-price{font-size:clamp(0.34rem,1.3vw,0.46rem);font-weight:900;color:var(--gold);margin-top:auto;line-height:1;}
          .tile-icon{font-size:clamp(0.68rem,2.3vw,0.88rem);line-height:1;margin:auto 0;}
          .corner-tile{justify-content:center;}
          .corner-tile .tile-icon{font-size:clamp(0.95rem,3.4vw,1.25rem);}
          .corner-tile .tile-name{font-size:clamp(0.40rem,1.6vw,0.52rem);color:var(--gold);}

          .pawn{width:clamp(16px,4.2vw,22px);height:clamp(16px,4.2vw,22px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(0.65rem,2.4vw,0.85rem);box-shadow:0 2px 5px rgba(0,0,0,0.9);border:1.5px solid #fff;background:#000;flex-shrink:0;pointer-events:none;transition:transform 0.12s ease-out!important;}
          .pawn.moving-step{transform:scale(1.25);box-shadow:0 0 8px var(--gold);}
          .pawn-p0{background:radial-gradient(circle,#EF4444,#991B1B);}
          .pawn-p1{background:radial-gradient(circle,#38BDF8,#075985);}
          .tile-pawns{position:absolute;display:flex!important;align-items:center;justify-content:center;gap:2px;z-index:50;pointer-events:none;}

          .side-bottom .tile-pawns{top:-10px;bottom:auto;left:50%;transform:translateX(-50%);flex-direction:row;width:max-content;}
          .side-top .tile-pawns{bottom:-10px;top:auto;left:50%;transform:translateX(-50%);flex-direction:row;width:max-content;}
          .side-left .tile-pawns{right:-10px;left:auto;top:50%;transform:translateY(-50%);flex-direction:column;height:max-content;width:auto;}
          .side-right .tile-pawns{left:-10px;right:auto;top:50%;transform:translateY(-50%);flex-direction:column;height:max-content;width:auto;}

          .corner-tile .tile-pawns{inset:0;display:flex!important;align-items:center;justify-content:center;flex-direction:row;}

          .side-bottom .tile-bar{margin-top:auto;margin-bottom:0;}
          .side-top .tile-bar{margin-top:0;margin-bottom:auto;}
          .tile.owned-glow{box-shadow:inset 0 0 6px currentColor;}
          .tile.owned-tint{filter:brightness(1.25);}
          .tile.owned-border{border-width:2px!important;border-color:currentColor!important;}
          .tile-owner-badge{position:absolute;top:1px;right:1px;font-size:0.55rem;background:rgba(0,0,0,0.85);color:#FFF;border-radius:50%;width:13px;height:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--gold);z-index:5;}
          [dir="ltr"] .tile-owner-badge{right:auto;left:1px;}
          .tile-mortgaged-badge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-20deg);background:#DC2626;color:#FFF;font-size:0.45rem;font-weight:900;padding:1px 3px;border-radius:3px;border:1px solid #FFF;z-index:8;}

          .board-center{direction:rtl;grid-column:2/span 9;grid-row:2/span 9;background:var(--center-bg);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px;position:relative;border:1px solid rgba(245,158,11,0.25);overflow:hidden;min-width:0;min-height:0;box-sizing:border-box;}
          .center-brand{font-size:clamp(0.72rem,3vw,1.05rem);font-weight:900;color:var(--gold);letter-spacing:1px;text-align:center;text-shadow:0 0 10px rgba(245,158,11,0.3);}
          .center-turn-announcer{font-size:clamp(0.62rem,2.4vw,0.80rem);font-weight:bold;color:var(--text);background:rgba(128,128,128,0.12);padding:2px 8px;border-radius:20px;border:1px solid rgba(128,128,128,0.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;}
          .dice-area{display:flex;align-items:center;justify-content:center;gap:12px;margin:auto 0;perspective:800px;}
          .cube-die{width:40px;height:40px;position:relative;transform-style:preserve-3d;transition:transform 0.1s linear;}
          .cube-die.rolling{animation:rollTumble 0.4s infinite linear;}
          @keyframes rollTumble{0%{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg);}100%{transform:rotateX(360deg) rotateY(720deg) rotateZ(360deg);}}
          .cube-face{position:absolute;width:40px;height:40px;background:linear-gradient(145deg,#FFF,#E2E8F0);border:1.5px solid #CBD5E1;border-radius:6px;box-shadow:inset 0 0 5px rgba(0,0,0,0.15),0 3px 8px rgba(0,0,0,0.6);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;box-sizing:border-box;}
          .dot{width:7px;height:7px;background:#B91C1C;border-radius:50%;align-self:center;justify-self:center;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);}
          .face-1{transform:rotateY(0deg) translateZ(20px);}
          .face-6{transform:rotateY(180deg) translateZ(20px);}
          .face-2{transform:rotateY(-90deg) translateZ(20px);}
          .face-5{transform:rotateY(90deg) translateZ(20px);}
          .face-3{transform:rotateX(90deg) translateZ(20px);}
          .face-4{transform:rotateX(-90deg) translateZ(20px);}
          .center-btn-roll{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000;border:none;border-radius:24px;padding:clamp(5px,1.2vh,7px) clamp(14px,4vw,22px);font-size:clamp(0.76rem,2.8vw,0.95rem);font-weight:900;cursor:pointer;box-shadow:0 3px 12px rgba(245,158,11,0.4);display:flex;align-items:center;gap:5px;white-space:nowrap;}
          .center-btn-roll:active{transform:scale(0.96);}
          .center-btn-roll:disabled{opacity:0.4;cursor:not-allowed;}
          .log-area{width:96%;height:20px;background:rgba(0,0,0,0.15);border-radius:5px;border:1px solid rgba(128,128,128,0.2);display:flex;align-items:center;justify-content:center;padding:0 4px;overflow:hidden;white-space:nowrap;font-size:clamp(0.56rem,1.8vw,0.64rem);color:var(--gold);}

          /* النوافذ المنبثقة */
          .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);backdrop-filter:none;-webkit-backdrop-filter:none;display:none;align-items:center;justify-content:center;z-index:999;padding:8px;}
          .modal-overlay.show{display:flex;}
          .modal-card{background:var(--modal-bg);color:var(--text);border:2px solid var(--gold);border-radius:14px;width:100%;max-width:380px;box-shadow:0 12px 35px rgba(0,0,0,0.65);overflow:hidden;display:flex;flex-direction:column;}
          .modal-header{padding:9px 12px;background:rgba(0,0,0,0.12);border-bottom:1px solid rgba(128,128,128,0.2);display:flex;justify-content:space-between;align-items:center;}
          .modal-title{font-size:0.90rem;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:5px;}
          .modal-body{padding:12px;font-size:0.82rem;line-height:1.45;max-height:68vh;overflow-y:auto;}
          .modal-footer{padding:9px 12px;background:rgba(0,0,0,0.12);border-top:1px solid rgba(128,128,128,0.2);display:flex;gap:6px;justify-content:flex-end;}
          .btn{padding:7px 14px;border-radius:7px;font-weight:bold;font-size:0.80rem;cursor:pointer;border:none;}
          .btn-gold{background:var(--gold);color:#000;}
          .btn-blue{background:#2563EB;color:#fff;}
          .btn-red{background:#DC2626;color:#fff;}
          .btn-gray{background:#4B5563;color:#fff;}
          .btn-pill{padding:4px 10px;border-radius:16px;border:1px solid var(--btn-pill-border);background:var(--btn-pill-bg);color:var(--text);cursor:pointer;font-size:0.72rem;}
          .btn-pill.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:bold;}
          .row-opts{display:flex;gap:5px;margin:5px 0 10px 0;flex-wrap:wrap;}
          .settings-section{margin-bottom:10px;}
          .settings-label{font-size:0.75rem;font-weight:bold;color:var(--dim);margin-bottom:3px;}

          .info-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:0.70rem;font-weight:bold;background:rgba(245,158,11,0.2);color:var(--gold);border:1px solid rgba(245,158,11,0.3);margin-bottom:6px;}
          .info-rule-box{background:var(--box-bg);border:1px solid var(--card-border);border-radius:7px;padding:8px;margin-top:6px;}
          .info-rule-item{font-size:0.76rem;color:var(--text);margin-bottom:5px;display:flex;align-items:flex-start;gap:5px;line-height:1.35;}
          .info-rule-item:last-child{margin-bottom:0;}
          </style>
          </head>
          <body>

          <div class="header">
              <div class="header-title">
                  <span>👑</span>
                  <span id="txtAppTitle">MONOPOLY PRO</span>
              </div>
              <div class="header-controls">
                  <button class="btn-hdr" onclick="openPropsModal(Game.turn)">🎒 <span id="txtBtnP0Props">عقاراتي</span></button>
                  <button class="btn-hdr" onclick="openTradeModal()">🤝 <span id="txtBtnTrade">مقايضة</span></button>
                  <button class="btn-hdr" onclick="openSettingsModal()">⚙️</button>
                  <button class="btn-hdr" onclick="openAboutModal()">ℹ️</button>
                  <button class="btn-hdr" onclick="openExitModal()" title="خروج">🚪</button>
              </div>
          </div>

          <div class="scoreboard">
              <div class="p-card active" id="pCard0" onclick="openPropsModal(0)">
                  <div class="p-avatar" style="border-color:var(--p0);" id="avP0">👑</div>
                  <div class="p-details">
                      <div class="p-name" style="color:var(--p0);" id="nameP0">الملك</div>
                      <div class="p-cash" id="cashP0">3000$</div>
                      <div class="p-stats"><span id="propsP0">عقارات 0</span> <span id="mortP0" style="color:#EF4444;"></span></div>
                  </div>
                  <div class="p-badge" id="turnBadge0">دورك</div>
              </div>
              <div class="p-card" id="pCard1" onclick="openPropsModal(1)">
                  <div class="p-avatar" style="border-color:var(--p1);" id="avP1">🤖</div>
                  <div class="p-details">
                      <div class="p-name" style="color:var(--p1);" id="nameP1">روبوت</div>
                      <div class="p-cash" id="cashP1">3000$</div>
                      <div class="p-stats"><span id="propsP1">عقارات 0</span> <span id="mortP1" style="color:#EF4444;"></span></div>
                  </div>
                  <div class="p-badge" id="turnBadge1" style="display:none;background:var(--p1);">دور الخصم</div>
              </div>
          </div>

          <div class="board-wrapper" id="board">
              <div class="board-center">
                  <div class="center-brand">MONOPOLY PRO</div>
                  <div class="center-turn-announcer" id="turnAnnouncer">الدور: الملك 👑</div>

                  <div class="dice-area">
                      <div class="cube-die" id="die0">
                          <div class="cube-face face-1"><div class="dot" style="grid-area:2/2;"></div></div>
                          <div class="cube-face face-2"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-3"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-4"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-5"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-6"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/1;"></div><div class="dot" style="grid-area:2/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                      </div>
                      <div class="cube-die" id="die1">
                          <div class="cube-face face-1"><div class="dot" style="grid-area:2/2;"></div></div>
                          <div class="cube-face face-2"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-3"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-4"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-5"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/2;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                          <div class="cube-face face-6"><div class="dot" style="grid-area:1/1;"></div><div class="dot" style="grid-area:1/3;"></div><div class="dot" style="grid-area:2/1;"></div><div class="dot" style="grid-area:2/3;"></div><div class="dot" style="grid-area:3/1;"></div><div class="dot" style="grid-area:3/3;"></div></div>
                      </div>
                  </div>

                  <button class="center-btn-roll" id="btnRoll" onclick="rollDice()">
                      <span>🎲</span>
                      <span id="txtBtnRoll">ارمي النرد</span>
                  </button>

                  <div class="log-area" id="gameLog">مرحباً بكم في لعبة MONOPOLY PRO!</div>
              </div>
          </div>

          <!-- 0. نافذة البداية: لعبة جديدة أو إكمال اللعبة السابقة -->
          <div class="modal-overlay" id="startModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title">🎲 مرحباً بك في MONOPOLY PRO</div>
                  </div>
                  <div class="modal-body" style="text-align:center; padding:18px 12px;">
                      <div style="font-size:2.6rem; margin-bottom:8px;">👑🏰</div>
                      <div style="font-size:1.10rem; font-weight:900; color:var(--gold); margin-bottom:6px;">بنك الحظ الاحترافي</div>
                      <p style="font-size:0.82rem; color:var(--dim); margin-bottom:16px;">اختر كيف تود بدء رحلتك في عالم التجارة والعقارات:</p>
                      <div style="display:flex; flex-direction:column; gap:8px;">
                          <button class="btn btn-gold" style="padding:11px; font-size:0.92rem; font-weight:900;" onclick="openNewGameSetupModal(true)">
                              ✨ بدء لعبة جديدة
                          </button>
                          <button class="btn btn-blue" id="btnContinueGame" style="padding:11px; font-size:0.92rem; font-weight:900;" onclick="continueSavedGameFromModal()">
                              📂 إكمال اللعبة السابقة
                          </button>
                      </div>
                      <div id="savedGameStatus" style="font-size:0.72rem; color:var(--dim); margin-top:12px;"></div>
                  </div>
              </div>
          </div>

          <!-- 0.1 نافذة إعدادات وخيارات اللعبة الجديدة -->
          <div class="modal-overlay" id="newGameSetupModal">
              <div class="modal-card" style="max-height:92vh;">
                  <div class="modal-header">
                      <div class="modal-title">🎮 إعدادات لعبة جديدة</div>
                      <div id="btnCloseSetupModal" style="font-size:1.2rem; cursor:pointer; display:none;" onclick="closeNewGameSetupModal()">✕</div>
                  </div>
                  <div class="modal-body" style="padding:12px; max-height:74vh; overflow-y:auto;">
                      <!-- نمط اللعب -->
                      <div class="settings-section">
                          <div class="settings-label">👥 نمط اللعب:</div>
                          <div class="row-opts">
                              <button class="btn-pill active" id="btnModeAI" onclick="selectGameMode('ai')">🤖 ضد الكمبيوتر</button>
                              <button class="btn-pill" id="btnModePvP" onclick="selectGameMode('pvp')">👥 لاعبين اثنين</button>
                          </div>
                      </div>

                      <!-- صعوبة اللعب مع الكمبيوتر -->
                      <div class="settings-section" id="aiDifficultySection">
                          <div class="settings-label">🧠 مستوى صعوبة الكمبيوتر:</div>
                          <div class="row-opts">
                              <button class="btn-pill" id="btnDiffEasy" onclick="selectAIDifficulty('easy')">🟢 سهل</button>
                              <button class="btn-pill active" id="btnDiffMedium" onclick="selectAIDifficulty('medium')">🟡 متوسط</button>
                              <button class="btn-pill" id="btnDiffHard" onclick="selectAIDifficulty('hard')">🔴 صعب</button>
                          </div>
                          <div id="diffDescription" style="font-size:0.70rem; color:var(--dim); margin-top:-4px; margin-bottom:5px;">🟡 متوسط: توازن معتدل بين الشراء والمزايدة وإدارة الأموال.</div>
                      </div>

                      <!-- المبلغ المالي لبداية اللعب -->
                      <div class="settings-section">
                          <div class="settings-label">💰 المبلغ المالي لبداية اللعب:</div>
                          <div class="row-opts">
                              <button class="btn-pill active" id="btnCash3000" onclick="selectStartingCash(3000)">💵 3000$</button>
                              <button class="btn-pill" id="btnCash6000" onclick="selectStartingCash(6000)">💵 6000$</button>
                              <button class="btn-pill" id="btnCash9000" onclick="selectStartingCash(9000)">💵 9000$</button>
                          </div>
                      </div>

                      <!-- كتابة أسماء اللاعبين -->
                      <div class="settings-section">
                          <div class="settings-label">✍️ أسماء اللاعبين:</div>
                          <div style="display:flex; flex-direction:column; gap:7px; margin-top:5px;">
                              <div>
                                  <label style="font-size:0.72rem; color:var(--dim); display:block; margin-bottom:3px;" id="lblPlayer1Name">اسم اللاعب 1 (أنت 👑):</label>
                                  <input type="text" id="inputPlayer1Name" value="الملك" maxlength="16" placeholder="اكتب اسم اللاعب الأول" style="width:100%; padding:7px 9px; background:var(--input-bg); color:var(--text); border:1px solid var(--gold); border-radius:7px; font-size:0.82rem; outline:none;">
                              </div>
                              <div id="player2InputContainer">
                                  <label style="font-size:0.72rem; color:var(--dim); display:block; margin-bottom:3px;" id="lblPlayer2Name">الخصم (الكمبيوتر):</label>
                                  <input type="text" id="inputPlayer2Name" value="روبوت" maxlength="16" placeholder="اكتب اسم اللاعب الثاني" style="width:100%; padding:7px 9px; background:rgba(128,128,128,0.15); color:var(--text); border:1px solid #4B5563; border-radius:7px; font-size:0.82rem; outline:none;" readonly>
                              </div>
                          </div>
                      </div>
                  </div>
                  <div class="modal-footer" style="padding:9px 12px;">
                      <button class="btn btn-gold" style="width:100%; padding:9px; font-size:0.92rem; font-weight:900;" onclick="confirmStartNewGame()">
                          🚀 ابدأ اللعب الآن
                      </button>
                  </div>
              </div>
          </div>

          <!-- 1. نافذة دليل وتعليمات الخانات الخدمية -->
          <div class="modal-overlay" id="tileInfoModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title" id="tileInfoTitle">ℹ️ دليل الخانة والتعليمات</div>
                      <div style="font-size:1.2rem; cursor:pointer;" onclick="closeTileInfoModal()">✕</div>
                  </div>
                  <div class="modal-body" id="tileInfoBody"></div>
                  <div class="modal-footer">
                      <button class="btn btn-gold" onclick="closeTileInfoModal()">فهمت ذلك ✓</button>
                  </div>
              </div>
          </div>

          <!-- 2. نافذة شراء العقارات -->
          <div class="modal-overlay" id="deedModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title" id="deedTitle">عقار للبيع</div>
                      <div style="font-size:1.2rem; cursor:pointer;" onclick="closeDeedModal()">✕</div>
                  </div>
                  <div class="modal-body" id="deedBody"></div>
                  <div class="modal-footer" id="deedFooter">
                      <button class="btn btn-gold" id="btnBuyProp" onclick="confirmBuyProp()">شراء</button>
                      <button class="btn btn-blue" id="btnAuctionProp" onclick="startAuction()">مزاد علني</button>
                      <button class="btn btn-gray" onclick="closeDeedModal()">تجاهل</button>
                  </div>
              </div>
          </div>

          <!-- 3. نافذة المزاد العلني مع السعر الأساسي ومؤقت الـ 5 ثواني -->
          <div class="modal-overlay" id="auctionModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title">🔨 مزاد علني مباشر</div>
                  </div>
                  <div class="modal-body">
                      <div style="text-align:center; margin-bottom:7px; background:rgba(128,128,128,0.1); padding:7px 10px; border-radius:9px; border:1px solid rgba(245,158,11,0.35);">
                          <div id="aucPropDetails" style="font-size:1.0rem; font-weight:900; color:var(--text); margin-bottom:3px;"></div>
                          <div style="font-size:0.82rem; color:var(--gold-lt); font-weight:bold;">
                              🏷️ السعر الأساسي للعقار: <span id="aucBasePriceVal" style="color:var(--gold); font-size:1.10rem; font-weight:900;">0$</span>
                          </div>
                      </div>

                      <div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); border-radius:7px; padding:5px; text-align:center; margin-bottom:8px;">
                          <div style="font-size:0.80rem; font-weight:bold; color:#EF4444;">
                              ⏱️ المهلة المتبقية للمزايدة: <span id="aucTimerNum" style="color:#EF4444; font-size:1.20rem; font-weight:900;">5</span> ثوانٍ
                          </div>
                      </div>

                      <div style="text-align:center; margin:6px 0;">
                          <div style="font-size:0.78rem; color:var(--dim);">أعلى مزايدة حالية:</div>
                          <div style="font-size:1.5rem; font-weight:900; color:var(--gold);" id="aucCurrentBid">10$</div>
                          <div style="font-size:0.80rem;" id="aucHighestBidder">-</div>
                      </div>
                      <div id="aucTurnPrompt" style="text-align:center; font-weight:bold; color:var(--text); margin-top:6px;"></div>
                  </div>
                  <div class="modal-footer" id="aucControls">
                      <button class="btn btn-gold" onclick="placeAuctionBid(10)">+10$</button>
                      <button class="btn btn-gold" onclick="placeAuctionBid(50)">+50$</button>
                      <button class="btn btn-red" onclick="foldAuctionBid()">انسحاب</button>
                  </div>
              </div>
          </div>

          <!-- 4. نافذة السجن -->
          <div class="modal-overlay" id="jailModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title">🚔 أنت في السجن!</div>
                  </div>
                  <div class="modal-body">
                      <p id="jailMsg">أنت مقيد في السجن. كيف ترغب بالخروج؟</p>
                  </div>
                  <div class="modal-footer">
                      <button class="btn btn-gold" onclick="payJailFine()">دفع كفالة (50$)</button>
                      <button class="btn btn-blue" onclick="rollForJail()">رمي النرد للمطابقة</button>
                  </div>
              </div>
          </div>

          <!-- 5. نافذة السفر السريع بمحطات القطار -->
          <div class="modal-overlay" id="fastTravelModal">
              <div class="modal-card">
                  <div class="modal-header">
                      <div class="modal-title">🚂 السفر السريع بمحطات القطار</div>
                  </div>
                  <div class="modal-body" style="text-align:center;">
                      <div style="font-size:1.8rem; margin-bottom:6px;">🚄</div>
                      <p style="font-size:0.86rem; font-weight:bold; margin-bottom:5px;">اختر المحطة التي ترغب بالسفر إليها:</p>
                      <select id="fastTravelDestSelect" style="width:100%; padding:7px; background:var(--input-bg); color:var(--text); border-radius:7px; border:1px solid var(--gold); font-size:0.85rem; margin:6px 0;"></select>
                      <div style="font-size:0.80rem; margin-top:6px;" id="fastTravelCostNotice"></div>
                  </div>
                  <div class="modal-footer">
                      <button class="btn btn-gold" id="btnFastTravelConfirm" onclick="confirmFastTravel()">سفر سريع</button>
                      <button class="btn btn-gray" onclick="cancelFastTravel()">البقاء هنا</button>
                  </div>
              </div>
          </div>

          <!-- 6. نافذة المقايضة وتجارة العقارات -->
          <div class="modal-overlay" id="tradeModal">
              <div class="modal-card">
                  <div class="modal-header">
                  <div class="modal-title">🤝 مقايضة وتجارة العقارات</div>
                  <div style="font-size:1.2rem; cursor:pointer;" onclick="closeTradeModal()">✕</div>
              </div>
              <div class="modal-body" id="tradeBody">
                  <div id="tradeNotice" style="display:none; padding:7px 10px; border-radius:7px; margin-bottom:8px; font-size:0.80rem; font-weight:bold; line-height:1.35;"></div>
                  <div class="settings-section">
                      <div class="settings-label" id="tradeTargetLabel">اختر عقار الخصم للشراء:</div>
                      <select id="tradeTargetProp" onchange="onTradeTargetPropChange()" style="width:100%; padding:7px; background:var(--input-bg); color:var(--text); border-radius:6px; border:1px solid #4B5563; font-size:0.82rem;"></select>
                  </div>
                  <div class="settings-section">
                      <div class="settings-label">المبلغ المعروض ($):</div>
                      <input type="number" id="tradeOfferCash" value="100" min="10" step="10" style="width:100%; padding:7px; background:var(--input-bg); color:var(--text); border-radius:6px; border:1px solid #4B5563; font-size:0.85rem;">
                  </div>
              </div>
              <div class="modal-footer">
                  <button class="btn btn-gold" id="btnSubmitTrade" onclick="submitTradeOffer()">إرسال العرض</button>
                  <button class="btn btn-gray" onclick="closeTradeModal()">خروج</button>
              </div>
          </div>
      </div>

      <!-- 6.1 نافذة موافقة الخصم على المقايضة في نمط لاعبين -->
      <div class="modal-overlay" id="pvpTradeConfirmModal">
          <div class="modal-card">
              <div class="modal-header">
                  <div class="modal-title">🤝 عرض مقايضة وارد!</div>
              </div>
              <div class="modal-body" style="text-align:center; padding:16px 12px;">
                  <div style="font-size:2.0rem; margin-bottom:6px;">🤝</div>
                  <div id="pvpTradeDesc" style="font-size:0.86rem; font-weight:bold; line-height:1.45;"></div>
              </div>
              <div class="modal-footer" style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                  <button class="btn btn-gold" onclick="acceptPvPTrade()">قبول الصفقة ✓</button>
                  <button class="btn btn-red" onclick="rejectPvPTrade()">رفض الصفقة ✕</button>
              </div>
          </div>
      </div>

      <!-- 7. نافذة عقارات اللاعب -->
      <div class="modal-overlay" id="propsModal">
          <div class="modal-card">
              <div class="modal-header">
                  <div class="modal-title" id="propsModalTitle">عقارات اللاعب</div>
                  <div style="font-size:1.2rem; cursor:pointer;" onclick="closePropsModal()">✕</div>
              </div>
              <div class="modal-body" id="propsModalBody"></div>
          </div>
      </div>

      <!-- 8. نافذة الإعدادات -->
      <div class="modal-overlay" id="settingsModal">
          <div class="modal-card">
              <div class="modal-header">
                  <div class="modal-title">⚙️ الإعدادات وخيارات اللعب</div>
                  <div style="font-size:1.2rem; cursor:pointer;" onclick="closeSettingsModal()">✕</div>
              </div>
              <div class="modal-body">
                  <div class="settings-section">
