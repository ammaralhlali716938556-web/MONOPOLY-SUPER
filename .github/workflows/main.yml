          };

          const AudioFX = {
              ctx: null, enabled: true,
              init() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); } },
              play(t) {
                  if (!this.enabled) return; this.init(); if (!this.ctx) return;
                  const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), g = this.ctx.createGain();
                  osc.connect(g); g.connect(this.ctx.destination);
                  if (t === 'roll') { osc.type = 'triangle'; osc.frequency.setValueAtTime(160, now); osc.frequency.exponentialRampToValueAtTime(45, now+0.15); g.gain.setValueAtTime(0.25, now); g.gain.linearRampToValueAtTime(0.01, now+0.15); osc.start(now); osc.stop(now+0.15); }
                  else if (t === 'step') { osc.type = 'sine'; osc.frequency.setValueAtTime(420, now); g.gain.setValueAtTime(0.12, now); g.gain.linearRampToValueAtTime(0.01, now+0.05); osc.start(now); osc.stop(now+0.05); }
                  else if (t === 'cash') { osc.type = 'sine'; osc.frequency.setValueAtTime(587, now); osc.frequency.setValueAtTime(880, now+0.07); g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0.01, now+0.22); osc.start(now); osc.stop(now+0.22); }
                  else if (t === 'jail') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(130, now); osc.frequency.linearRampToValueAtTime(65, now+0.28); g.gain.setValueAtTime(0.25, now); g.gain.linearRampToValueAtTime(0.01, now+0.28); osc.start(now); osc.stop(now+0.28); }
                  else if (t === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(659, now+0.2); g.gain.setValueAtTime(0.28, now); g.gain.linearRampToValueAtTime(0.01, now+0.5); osc.start(now); osc.stop(now+0.5); }
              }
          };

